.toggle{display:inline-flex;border:1px solid #fff5;border-radius:8px;overflow:hidden}

.toggle button.on{background:#fff;color:var(--navy)}
.wrap{display:flex;gap:14px;max-width:1380px;margin:0 auto;padding:14px;align-items:flex-start}
.form{flex:1 1 56%;min-width:0}.side{flex:1 1 42%;position:sticky;top:60px;max-height:calc(100vh-78px);overflow:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:11px;overflow:hidden}
.card>h2{margin:0;padding:10px 14px;font-size:13px;background:#eef2f7;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between}
.card.collapsed>h2 .chev{transform:rotate(-90deg)}.card .body{padding:12px 14px}.card.collapsed .body{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.fld{flex:1 1 200px;min-width:140px}
.fld label{display:block;font-weight:600;font-size:11px;color:var(--grey);margin-bottom:2px}

.fld textarea{min-height:50px;resize:vertical}
.areaH{font-size:12px;font-weight:700;color:var(--teal);margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
.strat{display:flex;align-items:flex-start;gap:6px;padding:3px 4px;border-radius:6px;flex-wrap:wrap}.strat:hover{background:#f2f8f8}
.strat>input[type=checkbox]{width:15px;height:15px;margin-top:2px;flex:none;accent-color:var(--teal)}
.strat .lbl{flex:1 1 230px;min-width:150px}.strat .lbl small{color:var(--grey);font-size:9.5px}
.tg{font-size:9px;color:#fff;background:var(--grey);border-radius:4px;padding:0 5px;margin-left:3px}.tg.acc{background:#2d6a4f}.tg.ret{background:#9b2226}
.opts{display:none;gap:5px;flex:1 1 100%;padding:2px 0 4px 22px}.strat.on .opts{display:flex;flex-wrap:wrap}
.opts select,.opts input{padding:4px 6px;border:1px solid var(--line);border-radius:5px;font-size:11px}
.opts .own{width:115px}.opts .sl{width:115px}.opts .rp{width:120px}
.miniH{font-weight:700;font-size:11px;color:var(--navy);margin:8px 0 3px}
.repeat{border:1px dashed var(--line);border-radius:7px;padding:7px;margin-bottom:6px}
.addbtn{background:#eef2f7;color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer;font-weight:600}
.del{background:#fbeaea;color:#9b2226;border:0;border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;float:right}
.btn{background:var(--teal);color:#fff;border:0;border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer;margin:2px}.btn.alt{background:var(--navy)}
pre{white-space:pre-wrap;word-break:break-word;background:#0f1722;color:#d6e2f0;padding:11px;border-radius:8px;font-size:11px;line-height:1.5;max-height:70vh;overflow:auto;margin:0}

}
function addCflow(){CFLOW.push({src:'',owner:'',amt:'',note:''});renderCflow()}
function renderCflow(){let h='';CFLOW.forEach((c,i)=>{h+=`<div class="repeat"><button class="del" onclick="CFLOW.splice(${i},1);renderCflow()">remove</button><div class="row">`+
  `<div class="fld"><label>Paid from</label><select data-cf="${i}.src">`+['','MCMA','Bank Account','Investment Fund (Joint)','WM'].map(o=>`<option ${c.src==o?'selected':''}>${o}</option>`).join('')+`</select></div>`+
  `<div class="fld"><label>Owner</label><select data-cf="${i}.owner">`+owners().map(o=>`<option ${c.owner==o?'selected':''}>${o}</option>`).join('')+`</select></div>`+
  `<div class="fld"><label>Amount</label><input data-cf="${i}.amt" value="${c.amt||''}" placeholder="$ pw/pm"></div>`+
  `<div class="fld"><label>Breakdown</label><input data-cf="${i}.note" value="${c.note||''}" placeholder="e.g. insurance $X / investments $Y / advice $Z"></div></div></div>`});
 document.getElementById('cflowList').innerHTML=h;
 document.querySelectorAll('[data-cf]').forEach(inp=>inp.addEventListener('input',e=>{const[i,k]=e.target.dataset.cf.split('.');CFLOW[i][k]=e.target.value;render()}));
 render();
}
function scopeIn(){return [...document.querySelectorAll('[data-scope]:checked')].map(c=>c.dataset.scope)}
function gather(){const out=[];document.querySelectorAll('[data-strat]:checked').forEach(c=>{const id=c.dataset.strat;
  const own=document.querySelector(`[data-own="${id}"]`);const free=document.querySelector(`[data-free="${id}"]`);const rp=document.querySelector(`[data-rp="${id}"]`);
  const sl=[...document.querySelectorAll(`[data-slot^="${id}_"]`)].map(x=>x.value).filter(Boolean);
  const area=DATA[+id.split('_')[0]].area;
  out.push({area,name:c.dataset.name,text:c.dataset.custom=='1'&&free&&free.value?free.value:c.dataset.text,owner:own?own.value:'',rp:rp?rp.value:'',amounts:sl});});return out}
function buildObj(){const fees={commitment:F.feecommit,status:F.feestatus,wmFlat:F.wmflat,wmPct:F.wmpct,note:F.feenote,matrix:{}};
  document.querySelectorAll('[data-fee]').forEach(i=>{if(i.value)fees.matrix[i.dataset.fee]=i.value});
  const prods={};Object.keys(PROD).forEach(ai=>{prods[DATA[ai].area]=PROD[ai]});
  const simpleProd={};DATA.forEach((a,ai)=>{if(F['prod_'+ai])simpleProd[a.area]=F['prod_'+ai]});
  const paras={};DATA.forEach((a,ai)=>{if(F['para_'+ai])paras[a.area]=F['para_'+ai]});
  return{soaType:SOA,clients:F.clients,adviser:F.adviser,ctype:F.ctype,status:F.newex,entities:ENT.filter(e=>e.name||e.type),
   narrative:F.narr,currentSituation:F.cursit,referenceSOA:F.refsoa,keyConsiderations:F.keycons,
   notesBudget:F.budnotes,notesGoals:F.goalnotes,
   risk:{c1:{super:F.rp1s,superBump:F.rp1sb,inv:F.rp1i,invBump:F.rp1ib},c2:{super:F.rp2s,superBump:F.rp2sb,inv:F.rp2i,invBump:F.rp2ib},existing:F.rpexist},
   scopeIn:scopeIn(),scopeOut:[...SCOPEOUT],scopeOther:F.scopeoth,
   strategies:gather(),superProducts:prods,products:simpleProd,contributions:CONTRIB.filter(c=>c.type),
   cashflow:CFLOW.filter(c=>c.src||c.amt),cashPos:{before:F.cashbefore,after:F.cashafter,leave:F.leave,note:F.cashnote},
   paraplanning:paras,fees}}
function rpLine(lbl,r){let p=[];if(r.super)p.push(`${r.super} for Super${r.superBump?' ('+r.superBump+')':''}`);if(r.inv)p.push(`${r.inv} for Inv${r.invBump?' ('+r.invBump+')':''}`);return p.length?`  ${lbl}: ${p.join('; ')}`:''}
function asText(o){let L=[];
 L.push(`Advice Request – ${o.clients||'…'}`);L.push(`Adviser: ${o.adviser||'…'}`);
 L.push(`(${o.soaType.toUpperCase()} SOA · ${o.ctype||'?'} · ${o.status||'?'} client)`);
 o.entities.forEach(e=>L.push(`Entity: ${e.type||''} ${e.name||''} ${e.id||''}`.trim()));
 L.push('');if(o.narrative){L.push('Hi Team,');L.push(o.narrative);L.push('')}
 if(o.currentSituation)L.push(`Current situation source: ${o.currentSituation}`);
 if(o.referenceSOA)L.push(`Follow layout of: ${o.referenceSOA}`);
 if(o.notesBudget){L.push('');L.push('Additional Notes for budget');L.push(o.notesBudget)}
 if(o.notesGoals){L.push('');L.push('Additional Notes for goals/objectives');L.push(o.notesGoals)}
 L.push('');L.push('Risk Profile'+(o.risk.existing?' — '+o.risk.existing:''));
 const r1=rpLine(o.ctype=='Couple'?'Client 1':'Client',o.risk.c1);if(r1)L.push(r1);
 const r2=rpLine('Client 2',o.risk.c2);if(r2)L.push(r2);
 L.push('');L.push('Scope of Advice');o.scopeIn.forEach(s=>L.push('  '+s));
 if(o.scopeOut.length||o.scopeOther){L.push('Scope Out');o.scopeOut.forEach(s=>L.push('  '+s));if(o.scopeOther)L.push('  '+o.scopeOther)}
 const byArea={};o.strategies.forEach(s=>{(byArea[s.area]=byArea[s.area]||[]).push(s)});
 DATA.forEach(a=>{const area=a.area;const ss=byArea[area];const cashCat=area.indexOf('Cashflow')>-1;
   const hasP=(o.superProducts[area]&&o.superProducts[area].length)||o.products[area]||o.paraplanning[area]||(area.indexOf('Super Contributions')>-1&&o.contributions.length)||(cashCat&&o.cashflow.length);
   if(!ss&&!hasP)return;
   L.push('');L.push(area+' Advice');
   if(ss){L.push('  Strategy Recommendations');ss.forEach(s=>{const w=s.owner&&s.owner!=='Personal'?s.owner+': ':'';const amt=s.amounts&&s.amounts.length?'  ['+s.amounts.join(', ')+']':'';const rp=s.rp?'  {'+s.rp+'}':'';L.push(`    • ${w}${s.text||s.name}${amt}${rp}`)})}
   if(area.indexOf('Super Contributions')>-1&&o.contributions.length){L.push('  Contributions');o.contributions.forEach(c=>L.push(`    • ${c.who||''} ${c.type}${c.acct?' → '+c.acct:''}${c.fy?' ('+c.fy+')':''}${c.amt?' '+c.amt:''}`))}
   if(cashCat&&o.cashflow.length){L.push('  Costs paid from');o.cashflow.forEach(c=>L.push(`    • ${c.src||''}${c.owner&&c.owner!='Personal'?' ('+c.owner+')':''} - ${c.amt||''}${c.note?' ['+c.note+']':''}`));
     const cp=o.cashPos;const cpl=[];if(cp.before)cpl.push('before $'+cp.before);if(cp.after)cpl.push('after $'+cp.after);if(cp.leave)cpl.push('sick/AL '+cp.leave+' days');
     if(cpl.length)L.push('  Cash position: '+cpl.join(', '));if(cp.note)L.push('  Note: '+cp.note)}
   if(o.superProducts[area]&&o.superProducts[area].length){L.push('  Product Recommendations');o.superProducts[area].forEach(p=>L.push(`    • ${p.owner||''} ${p.acct||''}: ${p.plat||''} ${p.appr||''}${p.rp?' ['+p.rp+']':''}${p.bal?' ('+p.bal+')':''}`))}
   else if(o.products[area]){L.push('  Product Recommendations');L.push('    '+o.products[area])}
   if(o.paraplanning[area]){L.push('  Paraplanning note:');L.push('    '+o.paraplanning[area])}
 });
 if(o.keyConsiderations){L.push('');L.push('Key Considerations & Warnings (include in Outcomes)');L.push('  '+o.keyConsiderations)}
 L.push('');L.push('Advice Fees'+(o.fees.status?' — '+o.fees.status:''));
 L.push(`  Commitment: ${o.fees.commitment||'—'}`);
 Object.keys(o.fees.matrix).forEach(k=>L.push(`  ${k}: ${o.fees.matrix[k]}`));
 if(o.fees.wmFlat||o.fees.wmPct)L.push(`  WM fee: ${o.fees.wmFlat||''} + ${o.fees.wmPct||''}`);
 if(o.fees.note)L.push('  '+o.fees.note);
 return L.join('\n')}
function render(){const o=buildObj();document.getElementById('out').textContent=asText(o);document.getElementById('picks').textContent=o.strategies.length+' strategies';
 DATA.forEach((a,ai)=>{const n=o.strategies.filter(s=>s.area==a.area).length;const e=document.getElementById('cnt_'+ai);if(e)e.textContent=n?'('+n+')':''});
 try{localStorage.setItem('mws_ar4',JSON.stringify(o))}catch(e){}}
function copyOut(){navigator.clipboard.writeText(asText(buildObj()))}
function dl(k){const o=buildObj();const c=k=='json'?JSON.stringify(o,null,2):asText(o);const b=new Blob([c],{type:'text/'+(k=='json'?'json':'plain')});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='advice_request.'+k;a.click();URL.revokeObjectURL(u)}
document.querySelectorAll('#soaType button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#soaType button').forEach(x=>x.classList.remove('on'));b.classList.add('on');SOA=b.dataset.t;document.getElementById('soaHint').textContent=(SOA=='mixed'?'all strategies (couple)':SOA+' + shared');buildStrats()}));
build();
</script></body></html>
