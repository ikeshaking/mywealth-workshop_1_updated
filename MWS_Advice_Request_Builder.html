<!DOCTYPE html><html lang="en" data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MWS Advice Request Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
@import url('https://fonts.cdnfonts.com/css/abc-arizona-flare');
@import url('https://fonts.cdnfonts.com/css/abc-arizona-serif');
:root{
  --bg:#f0f4f8; --surface:#fff; --surface-2:#f6f9fc; --input-bg:#f8fbfd;
  --border:#d0dbe6; --border-soft:#e4ecf4; --border-strong:#c9beb4;
  --navy:#0C2E3F; --navy-deep:#0a1e2e; --blue:#0B6AE1; --blue-bright:#1A7EE6;
  --blue-light:#EAF4FB; --blue-soft:#5EA6FF; --coral:#FF6550; --coral-light:#fff0ee;
  --lime:#D9F09A; --lime-dark:#4a6a10; --lime-light:#f3f9e4;
  --text:#1a1a1a; --text-dim:#3e5a6a; --text-muted:#595959; --text-faint:#9aa6b2;
  --green:#27ae60; --green-light:#e8f5e9; --green-dark:#2e7d32;
  --red:#d63031; --red-light:#fdeaea; --amber:#b8860b; --amber-light:#fef6e0;
  --gold:#b8860b;
  --hf:'ABC Arizona Flare','ABC Arizona Serif','Playfair Display','Georgia',serif;
  --bf:'Nunito Sans','Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  --shadow-sm:0 1px 2px rgba(12,46,63,.04); --shadow:0 2px 6px rgba(12,46,63,.06);
  --shadow-md:0 4px 12px rgba(12,46,63,.08); --shadow-lg:0 8px 24px rgba(12,46,63,.08);
}
[data-theme="night"]{
  --bg:#1C394E; --surface:#224A68; --surface-2:#2A5379; --input-bg:#2F4A45;
  --border:#345a7b; --border-soft:#2c4f6e; --border-strong:#456a88;
  --navy:#15293c; --navy-deep:#0f2030; --blue:#8fbdf0; --blue-bright:#a9d0fb;
  --blue-light:#284f72; --blue-soft:#2f5575; --coral:#ff7a68; --coral-light:#5a2420;
  --lime:#CCE185; --lime-dark:#CCE185; --lime-light:#33401c;
  --text:#e9f1f8; --text-dim:#c4d3df; --text-muted:#cfdce6; --text-faint:#90a8b8;
  --green:#5bb55b; --green-light:#1f3d33; --green-dark:#5bb55b; --red:#f1707a; --red-light:#3f2024; --amber:#e6b34d; --amber-light:#3a3320;
  --gold:#F9D949;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--bf);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--hf);color:var(--navy);font-weight:600;line-height:1.2}
[data-theme="night"] h1,[data-theme="night"] h2,[data-theme="night"] h3,[data-theme="night"] h4{color:#f1f6fb}
button{font-family:var(--bf);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--bf);font-size:13px}

/* ── Branded topbar (matches SOA generator) ── */
header.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:0;box-shadow:var(--shadow-md);border-bottom:none}
[data-theme="night"] header.topbar{box-shadow:0 1px 0 rgba(207,226,122,.18),0 4px 18px rgba(0,0,0,.35)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-mark{display:flex;flex-direction:column;justify-content:center;line-height:1}
.brand-mark .bm-line{font-family:var(--hf);font-size:20px;font-weight:500;color:#cdd9ea;letter-spacing:.2px}
.brand-mark .bm-line .bm-my{color:#8e9fc1}
.brand-mark .bm-sub{font-size:9px;font-weight:600;letter-spacing:4px;color:#8aa0bd;margin-top:3px}
.topbar-tag{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.topbar-spacer{flex:1}
.topbar-btn{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.topbar-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.topbar-btn.primary{background:var(--coral);color:#fff}
.topbar-btn.primary:hover{background:#ff7a68}
.topbar-btn.ghost{border:1px solid rgba(255,255,255,.25)}

/* Segmented Accumulator/Retirement/Mixed toggle */
.toggle{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.toggle button{background:transparent;color:rgba(255,255,255,.75);border:0;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.toggle button:hover{color:#fff}
.toggle button.on{background:var(--blue);color:#fff}
[data-theme="night"] .toggle button.on{background:linear-gradient(180deg,#3171ac 0%,#285b8e 100%)}

.legend{font-size:10.5px;color:rgba(255,255,255,.6)}
.legend b{border-radius:5px;padding:1px 6px;font-weight:700}
.legend b.acc{background:#2d6a4f;color:#fff}.legend b.ret{background:#9b2226;color:#fff}

/* ── Layout ── */
.wrap{display:flex;gap:18px;max-width:1400px;margin:0 auto;padding:20px 24px 80px;align-items:flex-start}
.form{flex:1 1 100%;min-width:0;max-width:900px;margin:0 auto}
.side{flex:1 1 42%;position:sticky;top:72px;max-height:calc(100vh - 92px);overflow:auto}
@media(max-width:960px){.wrap{flex-direction:column}.side{position:static;max-height:none;width:100%}}

/* ── Cards (matches SOA generator) ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden}
[data-theme="night"] .card{background:linear-gradient(180deg,#1f3e5a 0%,#1a374f 100%);border-color:#32567a}
.card>h2{margin:0;padding:14px 18px;font-size:14px;font-weight:800;font-family:var(--hf);background:var(--surface-2);color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-soft)}
[data-theme="night"] .card>h2{background:linear-gradient(180deg,#2A5D8A 0%,#23547F 100%);color:#fff;border-bottom:none;letter-spacing:.3px}
.card>h2 small.hint{color:var(--text-faint);font-weight:600}
[data-theme="night"] .card>h2 small.hint{color:#b9c9d6}
.card>h2 .chev{transition:transform .15s;font-size:12px}
.card.collapsed>h2 .chev{transform:rotate(-90deg)}
.card .body{padding:18px}
.card.collapsed .body{display:none}
.card.care>h2{background:var(--surface-2)}
.card.scopedout{opacity:.45}.card.scopedout .body{display:none}

/* ── Fields ── */
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.fld{flex:1 1 200px;min-width:140px}
.fld label{display:block;font-weight:700;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
[data-theme="night"] .fld label{color:#b9c9d6}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
[data-theme="night"] .fld input:not([type=checkbox]):not([type=radio]),[data-theme="night"] .fld select{color:var(--gold);font-weight:600}
[data-theme="night"] .fld textarea{color:#e9f1f8;font-weight:400}
.fld input::placeholder,.opts input::placeholder{color:var(--text-faint)}
.fld textarea{min-height:62px;resize:vertical;line-height:1.55}

.miniH{font-weight:800;font-size:11px;color:var(--blue);font-family:var(--bf);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
.chklist{display:flex;flex-direction:column;gap:4px;margin-top:3px}.chkitem{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;font-weight:500;cursor:pointer}.chkitem input{margin-top:2px}
[data-theme="night"] .miniH{color:var(--blue-bright)}

/* ── Strategy rows (chip-styled) ── */
.strat{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;flex-wrap:wrap;border:1px solid transparent;transition:.12s}
.strat:hover{background:var(--surface-2);border-color:var(--border-soft)}
.strat.on{background:var(--coral-light);border-color:var(--coral)}
.strat>input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--coral)}
.strat .lbl{flex:1 1 230px;min-width:150px;color:var(--text);font-weight:600;font-size:13px}
.tg{font-size:9px;color:#fff;background:var(--text-faint);border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700}
.tg.acc{background:#2d6a4f}.tg.ret{background:#9b2226}
.opts{display:none;gap:7px;flex:1 1 100%;padding:4px 0 5px 26px}
.strat.on .opts{display:flex;flex-wrap:wrap}
.opts select,.opts input{padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--input-bg);color:var(--text);font-family:inherit}
[data-theme="night"] .opts select,[data-theme="night"] .opts input{color:var(--gold)}
.opts .own{width:140px}.opts .sl{width:140px}.opts .pk{width:115px}.opts .freq{width:110px}
.srcchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--input-bg);color:var(--text-dim);font-weight:600;user-select:none;transition:.12s}
.srcchip:hover{border-color:var(--coral)}
.srcchip input{width:14px;height:14px;accent-color:var(--coral);margin:0}
.srcchip.on{background:var(--coral-light);border-color:var(--coral);color:var(--coral)}

/* ── Repeatable rows ── */
.repeat{border:1px solid var(--border-soft);border-radius:11px;padding:13px;margin-bottom:10px;background:var(--surface-2);position:relative}
[data-theme="night"] .repeat{background:#1a3046;border-color:#2c4f6e}
.riskrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border-soft)}
.riskrow .who{font-weight:800;font-size:12px;color:var(--navy);flex:0 0 110px}
[data-theme="night"] .riskrow .who{color:#f1f6fb}
.riskrow input,.riskrow select{flex:1 1 90px;min-width:80px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--input-bg);color:var(--text)}
[data-theme="night"] .riskrow input,[data-theme="night"] .riskrow select{color:var(--gold)}

/* ── Buttons ── */
.addbtn{background:var(--surface);color:var(--blue);border:1px solid var(--blue);border-radius:9px;padding:7px 13px;font-size:12px;cursor:pointer;font-weight:700;margin:4px 0;font-family:inherit;transition:.15s}
.addbtn:hover{background:var(--blue-light)}
[data-theme="night"] .addbtn{background:transparent;border-color:#3f7cb4;color:#d3e2ee}
[data-theme="night"] .addbtn:hover{border-color:var(--lime);color:var(--lime);background:transparent}
.del{background:var(--red-light);color:var(--red);border:0;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;float:right;font-family:inherit;font-weight:700;transition:.15s}
.del:hover{background:var(--red);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer;margin:2px;font-family:inherit;transition:.15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.alt{background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
.btn.alt:hover{border-color:var(--blue);color:var(--blue)}

/* ── Live preview ── */
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);color:var(--text);padding:15px;border-radius:11px;font-size:11.5px;line-height:1.6;max-height:72vh;overflow:auto;margin:0;border:1px solid var(--border-soft);font-family:ui-monospace,'SF Mono',Menlo,monospace}
[data-theme="night"] pre{background:#101c2e;color:#dbe6f4;border-color:#2c4f6e}

.muted{color:var(--text-faint);font-size:11px;margin:6px 0 0}
.count{font-size:11px;color:var(--text-faint);font-weight:600}
small.hint{color:var(--text-faint);font-size:10px;font-weight:600}

/* ── Chips / scope-out ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--blue-light);color:var(--blue);font-weight:600;transition:.12s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sop{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;background:var(--lime-light);margin-bottom:6px;border:1px solid var(--border-soft)}
.sop input{width:17px;height:17px;flex:none;accent-color:var(--green)}
.sop .lbl{color:var(--lime-dark);font-size:12.5px;font-weight:700}
[data-theme="night"] .sop .lbl{color:var(--lime)}

/* ── Fee table ── */
table.fee{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
table.fee th,table.fee td{border:1px solid var(--border);padding:6px 7px}
table.fee th{background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;text-align:left}
[data-theme="night"] table.fee th{background:#23547F}
table.fee td{background:var(--surface)}
[data-theme="night"] table.fee td{background:#1f3e5a}
table.fee td:first-child{font-weight:700;color:var(--text-dim)}
table.fee input{width:100%;border:0;font-size:11.5px;padding:3px;background:transparent;color:var(--text);font-family:inherit}
[data-theme="night"] table.fee input{color:var(--gold)}
table.fee td.rowtot,table.fee tr.tot td{background:var(--blue-light);font-weight:800;color:var(--blue)}
[data-theme="night"] table.fee td.rowtot,[data-theme="night"] table.fee tr.tot td{background:#284f72;color:var(--blue-bright)}
</style></head><body>

const INSURANCE_BENEFITS=['Favourable pre-assessment','Consolidation simplifies management','Retains valuable existing benefits','Cancels unnecessary / duplicate cover','Greater certainty & security','Ownership aligned to tax & estate','Waiting period balances affordability','Insurer suits occupation & claims','Favourable occupational rating','Secures insurability now'];
const INVSRC=['Cash','In-specie transfer','Term Loan','Sale proceeds'];
function freqSelect(attrs,val){return `<select ${attrs}><option value="">freq…</option>`+FREQ.map(o=>`<option ${val==o?'selected':''}>${o}</option>`).join('')+`</select>`}
const DLISTS={PLATSUPER,PRODSUPER,PLATBOND,PRODBOND,INSURERS,PRODFULL,PRODINV,PRODBONDFULL};
function datalistsHTML(){return Object.keys(DLISTS).map(n=>`<datalist id="${n}">`+DLISTS[n].map(o=>`<option value="${o.replace(/"/g,'&quot;')}">`).join('')+`</datalist>`).join('')}
function fHL(id,l,list){return `<div class="fld"><label>${l} <small class="hint">(pick or free-type)</small></label><input list="${list}" data-f="${id}"></div>`}
const SCOPE_PRESET=['Existing Shares','Existing Investment Property','Cryptocurrency','International Assets','Military Super (Defined Benefit portion)'];
function fH(id,l,t,o,h){let i;if(t=='select')i=`<select data-f="${id}"><option value=""></option>`+o.map(x=>`<option>${x}</option>`).join('')+`</select>`;else if(t=='area')i=`<textarea data-f="${id}" placeholder="${h||''}"></textarea>`;else i=`<input data-f="${id}" placeholder="${h||''}">`;return `<div class="fld"><label>${l}</label>${i}</div>`}
// Multi-select as a checkbox list — several benefits can apply per SOA. Stores an array in F[id].
function fMulti(id,l,opts){const cur=Array.isArray(F[id])?F[id]:[];return `<div class="fld" style="flex:1 1 100%"><label>${l} <small class="hint">(tick all that apply)</small></label><div class="chklist">`+opts.map(x=>`<label class="chkitem"><input type="checkbox" data-fm="${id}" value="${x.replace(/"/g,'&quot;')}"${cur.indexOf(x)>=0?' checked':''}> ${x}</label>`).join('')+`</div></div>`}
function card(t,b,open=true,id='',cls=''){return `<div class="card ${cls} ${open?'':'collapsed'}" ${id?`id="${id}"`:''}><h2 onclick="this.parentNode.classList.toggle('collapsed')">${t}<span class="chev">▾</span></h2><div class="body">${b}</div></div>`}
function parties(){let p=(F.ctype=='Couple')?[F.c1name||'Client 1',F.c2name||'Client 2']:[F.c1name||'Client'];ENT.forEach(e=>{if(e.name)p.push(e.name)});return p}
function clientTitle(){const a=(F.c1name||'').trim();const b=(F.ctype=='Couple')?(F.c2name||'').trim():'';return [a,b].filter(Boolean).join(' & ');}
function owners(){let o=(F.ctype=='Couple')?['Both','Joint',F.c1name||'Client 1',F.c2name||'Client 2']:[F.c1name||'Personal'];ENT.forEach(e=>{if(e.name)o.push(e.name)});return o}
function build(){
 let h='';
 h+=card('1 · Header & Clients',
  '<div class="row">'+fH('adviser','Adviser','text','','')+'</div>'+
  '<div class="row">'+fH('c1name','Client 1 name','text','','first name — builds the title line & labels')+fH('c2name','Client 2 name (couple)','text','','first name — builds the title line')+'</div>'+
  '<div class="row">'+fH('ctype','Client type','select',['Single','Couple'])+fH('newex','New or existing','select',['New','Existing'])+'</div>'+
  '<div class="row">'+fH('narr','“Hi Team,” narrative','area','','free text — read + keyword-scanned')+'</div>'+
  '<div class="row">'+fH('cursit','Existing situation source (existing clients)','text','','e.g. wealth review doc + previous SOA')+'</div>');
 h+=card('2 · Entities (0+)','<div id="entList"></div><button class="addbtn" onclick="addEnt()">+ Add entity</button>');
 h+=card('3 · Notes','<div class="row">'+fH('budnotes','Additional Notes for budget','area','','')+'</div>',false);
 h+=card('4 · Risk Profile <small class="hint">(per client AND entity)</small>','<div id="riskRows"></div><div class="row" style="margin-top:6px">'+fH('rpexist','Existing-client wording','select',['remains appropriate (reviewed)','no change from previous SOA'])+'</div>');
 let scopein=DATA.map((a,ai)=>`<label class="strat" style="padding:2px 4px"><input type="checkbox" data-scope="${ai}" checked> <span class="lbl">${a.area}</span></label>`).join('');
 let preset='<div id="soPreset">'+SCOPE_PRESET.map(s=>`<label class="sop"><input type="checkbox" data-sop="${s}"> <span class="lbl">${s}</span></label>`).join('')+'</div>';
 h+=card('5 · Scope <small class="hint">(untick an area to blank it out below)</small>','<div class="miniH">Scope In (areas)</div>'+scopein+'<div class="miniH">Scope Out (tick all that apply)</div>'+preset+'<div class="row" style="margin-top:6px">'+fH('scopeoth','Other scope-out (free text)','text','','')+'</div>');
 DATA.forEach((a,ai)=>{
  let inner=`<div class="areaH miniH">Strategy Recommendations</div><div id="strat_${ai}"></div>`;
  inner+=`<div id="freeList_${ai}"></div><button class="addbtn" onclick="addFree(${ai})">+ Add free-text recommendation</button>`;
  if(a.hasProd){inner+=`<div class="miniH">Product Recommendation(s) <small class="hint">— the platform / account / insurer & action. (Strategy ticks above drive the SOA wording.)</small></div>`;
    if(a.superMulti)inner+=`<div id="prodList_${ai}"></div><button class="addbtn" onclick="addProd(${ai})">+ Add super product (account)</button>`;
    else if(a.insMulti)inner+=`<div id="insList_${ai}"></div><button class="addbtn" onclick="addInsProd(${ai})">+ Add insurance cover/product</button>`+
      `<div class="miniH">Benefit of insurance <small class="hint">(links the cover back to the client's goals/appropriateness — appears in Summary → Outcomes, the insurance "why" and the replacement implications section)</small></div><div class="row">`+fMulti('insuranceBenefit','Benefit of insurance',INSURANCE_BENEFITS)+`</div>`;
      else if(a.bondMulti)inner+=`<div id="bondList_${ai}"></div><button class="addbtn" onclick="addBondProd(${ai})">+ Add investment bond (e.g. one per child)</button>`;
      else if(a.invMulti)inner+=`<div id="invList_${ai}"></div><button class="addbtn" onclick="addInvProd(${ai})">+ Add investment product</button>`;}
  if(a.isContrib)inner+=`<div class="miniH">Contributions (multi-stage / per person / per year)</div><div id="contribList"></div><button class="addbtn" onclick="addContrib()">+ Add contribution</button>`
    +`<div class="miniH">Lump-sum contribution — Dollar Cost Averaging <small class="hint">(only when a lump-sum contribution is being dollar-cost-averaged into super. Carry-forward / non-concessional top-ups on their own are NOT a lump-sum DCA — leave as "No lump-sum DCA" and the DCA sentence is omitted. MOTM applies when the resulting super balance will exceed $250,000)</small></div><div class="row">`
    +fH('superDcaMethod','DCA method','select',['No lump-sum DCA','DCA (plain — balance ≤ $250k)','DCA with MOTM (balance > $250k)'])+`</div>`;
  if(a.isCash)inner+=`<div class="miniH">Ongoing plan costs to MCMA — breakdown</div><div class="row">`+fH('cIns','Insurance','text','','$')+fH('cInv','Investments','text','','$')+fH('cAdv','Advice fee','text','','$')+fH('cOth','Other','text','','$')+fH('cCostFreq','Frequency (applies to breakdown)','select',FREQ)+`</div><div class="muted" id="cTotal"></div>`+
    `<div class="miniH">Costs paid from <small class="hint">(MCMA if FTW/PTW/WM · Bank acct if FTW no inv plan · Investment fund if existing paying from fund/WM)</small></div><div id="cflowList"></div><button class="addbtn" onclick="addCflow()">+ Add cost line</button>`+
    `<div class="miniH">Cash position</div><div class="row">`+fH('cashbefore','Existing cash (before)','text','','$')+fH('cashafter','Remaining cash (after)','text','','$')+`</div><div class="row">`+fH('leave','Available sick &/or AL (days)','text','','')+fH('cashnote','Cash note (e.g. existing savings for insurance recommendations)','text','','')+`</div>`+
    `<div class="miniH">Benefit of saving <small class="hint">(links the surplus/tax savings back to the client's goals — appears in the SOA as "…which &lt;benefit&gt;")</small></div><div class="row">`+fMulti('savingsBenefit','Benefit of saving',SAVINGS_BENEFITS)+`</div>`;
  inner+=`<div class="miniH">Paraplanning Notes</div><div class="row">`+fH('para_'+ai,'','area','','')+`</div>`;
  h+=card(`${a.area} <span class="count" style="color:var(--grey)" id="cnt_${ai}"></span>`,inner,ai<2,`areacard_${ai}`);
 });
  h+=card('Fees & Remuneration',feeHTML(),false);
 document.getElementById('form').innerHTML=h+datalistsHTML();
 document.querySelectorAll('[data-f]').forEach(i=>i.addEventListener('input',e=>{F[e.target.dataset.f]=e.target.value;if(['ctype','c1name','c2name'].includes(e.target.dataset.f)){renderRisk();renderOwners();buildStrats();renderFee()}render()}));
 document.querySelectorAll('[data-fm]').forEach(c=>c.addEventListener('change',e=>{const id=e.target.dataset.fm;const set=document.querySelectorAll('[data-fm="'+id+'"]');F[id]=[...set].filter(x=>x.checked).map(x=>x.value);render()}));
 document.querySelectorAll('[data-scope]').forEach(i=>i.addEventListener('change',e=>{document.getElementById('areacard_'+e.target.dataset.scope).classList.toggle('scopedout',!e.target.checked);render()}));
 document.querySelectorAll('[data-so]').forEach(c=>c.addEventListener('click',()=>{const v=c.dataset.so;if(SCOPEOUT.has(v)){SCOPEOUT.delete(v);c.classList.remove('on')}else{SCOPEOUT.add(v);c.classList.add('on')}render()}));
 document.querySelectorAll('[data-sop]').forEach(c=>c.addEventListener('change',()=>{const v=c.dataset.sop;if(c.checked)SCOPEOUT.add(v);else SCOPEOUT.delete(v);render()}));
 addEnt();renderRisk();buildStrats();renderFee();
}
function careCard(){return `<div class="card care"><h2 onclick="this.parentNode.classList.toggle('collapsed')">CARE · Investment Philosophy — why it's recommended (auditor justification)<span class="chev">▾</span></h2><div class="body"><p class="muted">Tick the reasons that apply, assign the client/entity and whether it's for Super, Investment or both. These feed Summary-Outcomes, the Super &amp; Investment strategy/product wording, the Alternatives cost comparison and the Replacement Implications — to justify best interests regardless of fee.</p><div id="careList"></div></div></div>`}
function renderCare(){let h='';CARE.forEach((c,i)=>{CAREPICK[i]=CAREPICK[i]||{owner:'',applies:'Both'};
  h+=`<label class="strat"><input type="checkbox" data-care="${i}"> <span class="lbl">${c.name}</span>`+
     `<span class="opts" style="display:flex"><select class="own" data-cown="${i}">`+owners().map(o=>`<option ${CAREPICK[i].owner==o?'selected':''}>${o}</option>`).join('')+`</select>`+
     `<select class="ap" data-cap="${i}">`+['Both','Super','Investment'].map(o=>`<option ${CAREPICK[i].applies==o?'selected':''}>${o}</option>`).join('')+`</select></span></label>`});
 document.getElementById('careList').innerHTML=h;
 document.querySelectorAll('[data-care]').forEach(c=>c.addEventListener('change',e=>{CAREPICK[+e.target.dataset.care].on=e.target.checked;e.target.closest('.strat').classList.toggle('on',e.target.checked);render()}));
 document.querySelectorAll('[data-cown]').forEach(s=>s.addEventListener('input',e=>{CAREPICK[+e.target.dataset.cown].owner=e.target.value;render()}));
 document.querySelectorAll('[data-cap]').forEach(s=>s.addEventListener('input',e=>{CAREPICK[+e.target.dataset.cap].applies=e.target.value;render()}));
 render();
}
function feeRows(){let r=(F.ctype=='Couple')?[F.c1name||'Client 1',F.c2name||'Client 2','Joint']:[F.c1name||'Client'];ENT.forEach(e=>{if(e.name)r.push(e.name)});return r}
function feeVal(k){return F['__fee_'+k]||''}
function feeKey(r){return r.replace(/[^a-z0-9]/gi,'')}
function cellDollar(v,bal){const r=parseFee(v);return r.flat+(r.pct?parseFloat(r.pct)/100*bal:0)}
function feeBalHTML(){let t='<div class="miniH">Balances (for % fees) — Super &amp; Investment, per client/entity</div>';
 feeRows().forEach(r=>{const k=feeKey(r);t+=`<div class="riskrow"><span class="who">${r}</span><input data-fbal="super_${k}" placeholder="Super balance $" value="${(F['__fbal_super_'+k]||'').replace(/"/g,'&quot;')}"><input data-fbal="inv_${k}" placeholder="Investment balance $" value="${(F['__fbal_inv_'+k]||'').replace(/"/g,'&quot;')}"></div>`});return t;}
function feeTableHTML(){let t='<table class="fee" id="feeTbl"><tr><th></th><th>Up·Super</th><th>Up·Cash</th><th>Ong·Super</th><th>Ong·Cash</th><th>Their total p.a.</th></tr>';
 feeRows().forEach(r=>{const k=feeKey(r);t+=`<tr><td>${r}</td>`+['us','uc','os','oc'].map(c=>`<td><input data-fee="${c}_${k}" value="${(F['__fee_'+c+'_'+k]||'').replace(/"/g,'&quot;')}"></td>`).join('')+`<td class="rowtot" id="rt_${k}"></td></tr>`});
 t+='<tr class="tot"><td>Total</td><td id="tt_us"></td><td id="tt_uc"></td><td id="tt_os"></td><td id="tt_oc"></td><td id="tt_grand"></td></tr></table>';return t;}
function rowDollar(k){const sb=parseFee(F['__fbal_super_'+k]||'').flat;const ib=parseFee(F['__fbal_inv_'+k]||'').flat;const col={};let rt=0;['us','uc','os','oc'].forEach(c=>{const bal=(c=='us'||c=='os')?sb:ib;const d=cellDollar(F['__fee_'+c+'_'+k]||'',bal);col[c]=d;rt+=d});return {col,rt};}
function renderFeeBal(){const w=document.getElementById('feeBalWrap');if(w){w.innerHTML=feeBalHTML();w.querySelectorAll('[data-fbal]').forEach(i=>i.addEventListener('input',e=>{F['__fbal_'+e.target.dataset.fbal]=e.target.value;render()}))}}
function renderFee(){const w=document.getElementById('feeTblWrap');if(w){w.innerHTML=feeTableHTML();w.querySelectorAll('[data-fee]').forEach(i=>i.addEventListener('input',e=>{F['__fee_'+e.target.dataset.fee]=e.target.value;render()}))}renderFeeBal();render()}
function feeHTML(){let t='<div class="row">'+fH('feecommit','Commitment fee (paid prior to SOA appt)','text','','$')+fH('feestatus','Ongoing status','select',['New','No changes','Increase from existing','Decrease from existing'])+fH('feecashsrc','Cashflow fees paid from','select',['MCMA','Bank Account','Investment Fund'])+'</div>';
 t+='<div id="feeBalWrap">'+feeBalHTML()+'</div>';
 t+='<p class="muted">Each fee cell: flat <b>$</b>, a <b>%</b>, or <b>$200 pm + 0.33%</b>. A % in a Super column uses the Super balance above; a % in a Cash column uses the Investment balance. Monthly ($ pm) figures are annualised.</p>';
 t+='<div id="feeTblWrap">'+feeTableHTML()+'</div>';return t;}
function renderRisk(){let h='';parties().forEach(p=>{const k=p.replace(/[^a-z0-9]/gi,'');RISK[k]=RISK[k]||{};
  h+=`<div class="riskrow"><span class="who">${p}</span>`+
   `<select data-rk="${k}.super"><option value="">Super…</option>`+RPV.map(o=>`<option ${RISK[k].super==o?'selected':''}>${o}</option>`).join('')+`</select>`+
   `<select data-rk="${k}.superBump"><option value="">no super variation</option>`+RPV.map(o=>`<option ${RISK[k].superBump==o?'selected':''}>bumped to ${o}</option>`).join('')+`</select>`+
   `<select data-rk="${k}.inv"><option value="">Inv…</option>`+RPV.map(o=>`<option ${RISK[k].inv==o?'selected':''}>${o}</option>`).join('')+`</select>`+
   `<select data-rk="${k}.invBump"><option value="">no inv variation</option>`+RPV.map(o=>`<option ${RISK[k].invBump==o?'selected':''}>bumped to ${o}</option>`).join('')+`</select></div>`});
 document.getElementById('riskRows').innerHTML=h;
 document.querySelectorAll('[data-rk]').forEach(inp=>inp.addEventListener('input',e=>{const[k,f]=e.target.dataset.rk.split('.');RISK[k]=RISK[k]||{};RISK[k][f]=e.target.value;render()}));
 render();
}
function addEnt(){ENT.push({type:'',name:'',id:''});renderEnt()}
function renderEnt(){let h='';ENT.forEach((e,i)=>{h+=`<div class="repeat"><button class="del" onclick="ENT.splice(${i},1);renderEnt();renderRisk();renderOwners();buildStrats();renderFee()">remove</button><div class="row">`+
  `<div class="fld"><label>Type</label><select data-ent="${i}.type"><option value=""></option>`+['SMSF (corporate trustee)','SMSF (individual trustees)','Company','Bucket company','Family/discretionary trust'].map(o=>`<option ${e.type==o?'selected':''}>${o}</option>`).join('')+`</select></div>`+
  `<div class="fld"><label>Name</label><input data-ent="${i}.name" value="${e.name||''}"></div>`+
  `<div class="fld"><label>ABN/ACN</label><input data-ent="${i}.id" value="${e.id||''}"></div></div></div>`});
 document.getElementById('entList').innerHTML=h;
 document.querySelectorAll('[data-ent]').forEach(inp=>inp.addEventListener('input',e=>{const[i,k]=e.target.dataset.ent.split('.');ENT[i][k]=e.target.value;if(k=='name'){renderOwners();renderRisk();renderFee()}render()}));
 render();
}
function renderOwners(){document.querySelectorAll('select.own,[data-pd$=".owner"],[data-ip$=".owner"],[data-bp$=".owner"],[data-vp$=".owner"],[data-ct$=".who"],[data-cf$=".owner"],[data-fr$=".owner"],[data-cown]').forEach(sel=>{const v=sel.value;sel.innerHTML=owners().map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')})}
function estInvPanel(id){const e=ESTINV[id]||(ESTINV[id]={product:'',initial:'',initialFreq:'one-off',initialSource:'',ongoing:'',ongoingFreq:'per month',ongoingSource:''});
 const chips=(kind)=>INVSRC.map(s=>{const on=e[kind]===s;return `<label class="srcchip${on?' on':''}"><input type="radio" name="est_${id}_${kind}" data-est="${id}.${kind}" value="${s}" ${on?'checked':''}>${s}</label>`}).join('');
 return `<div class="estpanel" style="flex:1 1 100%;margin-top:6px;padding:9px 11px;border:1px dashed var(--border);border-radius:9px;background:var(--surface-2)">`+
  `<div class="row" style="margin-bottom:8px"><div class="fld"><label>Type / product</label><input list="PRODINV" data-est="${id}.product" value="${(e.product||'').replace(/"/g,'&quot;')}" placeholder="e.g. Hub24 Core CARE Essentials"></div></div>`+
  `<div class="miniH" style="margin:2px 0 4px">Initial investment</div>`+
  `<div class="row"><div class="fld" style="flex:0 0 150px"><label>Initial amount</label><input data-est="${id}.initial" value="${(e.initial||'').replace(/"/g,'&quot;')}" placeholder="initial $"></div>`+
  `<div class="fld" style="flex:0 0 130px"><label>Initial freq</label>`+freqSelect(`data-est="${id}.initialFreq"`,e.initialFreq||'one-off')+`</div></div>`+
  `<div class="row"><div class="fld" style="flex:1 1 100%"><label>Initial funded from <small class="hint">(tick the most appropriate)</small></label><div class="chips" style="margin-top:2px">`+chips('initialSource')+`</div></div></div>`+
  `<div class="miniH" style="margin:6px 0 4px">Ongoing investment</div>`+
  `<div class="row"><div class="fld" style="flex:0 0 150px"><label>Ongoing amount</label><input data-est="${id}.ongoing" value="${(e.ongoing||'').replace(/"/g,'&quot;')}" placeholder="ongoing $"></div>`+
  `<div class="fld" style="flex:0 0 130px"><label>Ongoing freq</label>`+freqSelect(`data-est="${id}.ongoingFreq"`,e.ongoingFreq||'per month')+`</div></div>`+
  `<div class="row"><div class="fld" style="flex:1 1 100%"><label>Ongoing funded from <small class="hint">(tick the most appropriate)</small></label><div class="chips" style="margin-top:2px">`+chips('ongoingSource')+`</div></div></div>`+
 `</div>`;}
function buildStrats(){
 DATA.forEach((a,ai)=>{const list=a.scen.map((s,i)=>({s,i})).filter(x=>SOA=='mixed'||x.s.to=='both'||x.s.to==SOA);let h='';
  list.forEach(({s,i})=>{const id=ai+'_'+i;const tag=s.to=='accumulator'?'<span class="tg acc">ACC</span>':s.to=='retirement'?'<span class="tg ret">RET</span>':'';
    const slotInputs=s.slots.map((sl,k)=>{const isAmt=/\$/.test(sl);const ph=sl.replace(/\s*\bp\.?m\.?\b/i,'').replace(/\s*\bp\.?w\.?\b/i,'').trim();const df=/pm|month/i.test(sl)?'per month':(/pw|week/i.test(sl)?'per week':'');const fsel=isAmt?freqSelect(`class="freq" data-freq="${id}_${k}"`,df):'';return `<input class="sl" data-slot="${id}_${k}" placeholder="${ph}">${fsel}`;}).join('');
    const pickSel=s.pick?`<select class="pk" data-pick="${id}">`+s.pick.map(o=>`<option>${o}</option>`).join('')+`</select>`:'';
    h+=`<label class="strat"><input type="checkbox" data-strat="${id}" data-name="${s.name.replace(/"/g,'&quot;')}" data-text="${(s.strat||'').replace(/"/g,'&quot;')}" data-custom="${s.custom?1:0}" data-estinv="${s.estInv?1:0}">`+
       `<span class="lbl">${s.name}${tag}</span>`+
       `<span class="opts"><select class="own" data-own="${id}">`+owners().map(o=>`<option>${o}</option>`).join('')+`</select>${pickSel}${slotInputs}`+
       (s.custom?`<input class="sl" style="flex:1 1 100%" data-free="${id}" placeholder="free-type wording">`:'')+
       (s.estInv?estInvPanel(id):'')+`</span></label>`;});
  const box=document.getElementById('strat_'+ai);if(box)box.innerHTML=h;});
 document.querySelectorAll('[data-strat]').forEach(c=>c.addEventListener('change',e=>{e.target.closest('.strat').classList.toggle('on',e.target.checked);render()}));
 document.querySelectorAll('[data-own],[data-slot],[data-free],[data-pick],[data-freq]').forEach(i=>i.addEventListener('input',render));
 document.querySelectorAll('.estpanel [data-est]').forEach(inp=>{
   if(inp.type==='radio'){
     inp.addEventListener('change',e=>{const[id,kind]=e.target.dataset.est.split('.');ESTINV[id][kind]=e.target.value;e.target.closest('.chips').querySelectorAll('.srcchip').forEach(c=>c.classList.remove('on'));e.target.closest('.srcchip').classList.add('on');render()});
     inp.addEventListener('click',e=>{const[id,kind]=e.target.dataset.est.split('.');if(ESTINV[id][kind]===e.target.value){ESTINV[id][kind]='';e.target.checked=false;e.target.closest('.srcchip').classList.remove('on');render()}});
   }else{
     inp.addEventListener('input',e=>{const[id,kind]=e.target.dataset.est.split('.');ESTINV[id][kind]=e.target.value;render()});
   }
 });
 render();
}
function addFree(ai){FREE[ai]=FREE[ai]||[];FREE[ai].push({owner:'',text:''});renderFree(ai)}
function renderFree(ai){let h='';(FREE[ai]||[]).forEach((f,i)=>{h+=`<div class="repeat"><button class="del" onclick="FREE[${ai}].splice(${i},1);renderFree(${ai})">remove</button><div class="row">`+
