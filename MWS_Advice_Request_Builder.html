<title>MWS Advice Request Builder</title><style>
:root{--navy:#1f3a5f;--teal:#127a7a;--bg:#f4f6f9;--line:#dce3ec;--grey:#5a6675}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1d2530;font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;margin:0}
.toggle{display:inline-flex;border:1px solid #fff5;border-radius:8px;overflow:hidden}
.toggle button{background:transparent;color:#fff;border:0;padding:7px 16px;font-weight:600;cursor:pointer}
.toggle button.on{background:#fff;color:var(--navy)}
.wrap{display:flex;gap:16px;max-width:1340px;margin:0 auto;padding:16px;align-items:flex-start}
.form{flex:1 1 58%;min-width:0}.side{flex:1 1 40%;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.card>h2{margin:0;padding:11px 15px;font-size:13.5px;background:#eef2f7;color:var(--navy);cursor:pointer;display:flex;justify-content:space-between}
.card.collapsed>h2 .chev{transform:rotate(-90deg)}.card .body{padding:13px 15px}.card.collapsed .body{display:none}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:9px}.fld{flex:1 1 210px;min-width:170px}
.fld label{display:block;font-weight:600;font-size:11.5px;color:var(--grey);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
.fld textarea{min-height:58px;resize:vertical}
.areaH{font-size:12.5px;font-weight:700;color:var(--teal);margin:13px 0 5px;border-bottom:1px solid var(--line);padding-bottom:3px;display:flex;justify-content:space-between}
.strat{display:flex;align-items:flex-start;gap:7px;padding:4px 5px;border-radius:6px}.strat:hover{background:#f2f8f8}
.strat input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--teal)}
.strat .lbl{flex:1}.strat .lbl small{color:var(--grey);font-size:10px}
.tg{font-size:9px;color:#fff;background:var(--grey);border-radius:4px;padding:1px 5px;margin-left:4px}.tg.acc{background:#2d6a4f}.tg.ret{background:#9b2226}
.who{width:95px;flex:none}.fig{width:95px;flex:none}.who select,.fig input{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:7px;padding:8px 13px;font-weight:600;cursor:pointer;margin:2px}.btn.alt{background:var(--navy)}
pre{white-space:pre-wrap;word-break:break-word;background:#0f1722;color:#d6e2f0;padding:12px;border-radius:8px;font-size:11.5px;line-height:1.55;max-height:62vh;overflow:auto;margin:0}
.muted{color:var(--grey);font-size:11px;margin:4px 0 0}.count{font-size:11px;color:#cdd8e6}
small.hint{color:var(--grey);font-size:10px}
</style></head><body>

F)", "scen": [{"name": "Investment company / bucket company", "strat": "We recommend you  your investment (bucket) company to receive trust distributions and invest the retained earnings in line with the company's objectives, capped at the corporate tax rate.", "fig": true, "to": "both"}, {"name": "Family / discretionary trust (as advice entity)", "strat": "We recommend you  your family (discretionary) trust to hold the investment portfolio and distribute income to beneficiaries in a tax-effective manner each year.", "fig": false, "to": "both"}, {"name": "SMSF as advice entity", "strat": "(See Superannuation › Establish / manage an SMSF for in-fund wording.) Capture the SMSF entity: corporate trustee (e.g.", "fig": false, "to": "both"}]}];let SOA='accumulator';const F={};
function fH(id,l,t,o,h){let i;if(t=='select')i=`<select data-f="${id}"><option value=""></option>`+o.map(x=>`<option>${x}</option>`).join('')+`</select>`;else if(t=='area')i=`<textarea data-f="${id}" placeholder="${h||''}"></textarea>`;else i=`<input data-f="${id}" placeholder="${h||''}">`;return `<div class="fld"><label>${l}</label>${i}</div>`}
function card(t,b,open=true){return `<div class="card ${open?'':'collapsed'}"><h2 onclick="this.parentNode.classList.toggle('collapsed')">${t}<span class="chev">▾</span></h2><div class="body">${b}</div></div>`}
function build(){
 let h='';
 h+=card('1 · Header & Clients',
   '<div class="row">'+fH('clients','Client name(s) — title line','text','','e.g. Luis & Ellen Martinez')+fH('adviser','Adviser','text','','')+'</div>'+
   '<div class="row">'+fH('ctype','Client type','select',['Single','Couple','Single + entity','Couple + entity'])+fH('newex','New or existing','select',['New','Existing'])+'</div>'+
   '<div class="row">'+fH('ent','Entity (if any)','select',['—','SMSF (corporate trustee)','SMSF (individual trustees)','Company','Family/discretionary trust','Bucket company'])+fH('entid','Entity name + ABN/ACN','text','','')+'</div>'+
   '<div class="row">'+fH('narr','“Hi Team,” narrative (context, core strategy, nuances)','area','','Free text — this is read + keyword-scanned')+'</div>'+
   '<div class="row">'+fH('refsoa','Follow layout of reference SOA','text','','e.g. Amanda & Scott Rankin SOA')+'</div>');
 h+=card('2 · Notes',
   '<div class="row">'+fH('budnotes','Additional Notes for budget','area','','')+'</div>'+
   '<div class="row">'+fH('goalnotes','Additional Notes for goals/objectives','area','','future / out-of-scope items')+'</div>',false);
 h+=card('3 · Risk Profile',
   '<div class="row">'+fH('rps','Super risk profile','select',['Cash','Defensive','Balanced','Growth','High Growth'])+fH('rpsb','Super bump note','text','','e.g. bumped up from Growth')+'</div>'+
   '<div class="row">'+fH('rpi','Investment risk profile','select',['','Cash','Defensive','Balanced','Growth','High Growth'])+fH('rpib','Investment bump note','text','','')+'</div>');
 let scope=DATA.map(a=>`<label class="strat"><input type="checkbox" data-scope="${a.area}" checked> <span class="lbl">${a.area}</span></label>`).join('');
 h+=card('4 · Scope of Advice  <small class="hint">(unticked = scope out)</small>',scope+'<div class="row" style="margin-top:8px">'+fH('scopeout','Scope Out — items + reasons','area','','')+'</div>');
 h+=card('5 · Strategy Selection  <small class="hint">(tick → assign person → set $)</small>','<div id="stratList"></div>');
 // products + insurance + cashflow
 h+=card('6 · Products, Insurance & Cashflow',
   '<div class="row">'+fH('prodsuper','Super product(s)','text','','e.g. Hub24 Super CARE – as per doc')+fH('prodinv','Investment product(s)','text','','e.g. Hub24 CARE Essentials G; GenLife Vanguard G')+'</div>'+
   '<div class="row">'+fH('inscover','Insurance cover','text','','e.g. Levels of cover as per quotes')+fH('insprod','Insurer / product','text','','e.g. MetLife; Zurich; Aus Super')+'</div>'+
   '<div class="row">'+fH('cashflow','Cashflow Recommendations','area','','e.g. Total costs to MCMA $474 pw; direct surplus to savings $178 pw')+'</div>'+
   '<div class="row">'+fH('paraplan','Paraplanning notes','area','','tables to complete, projections, manual adds, reference SOA')+'</div>');
 h+=card('7 · Advice Fees',
   '<div class="row">'+fH('feecommit','Commitment fee','text','','$ (paid prior to SOA appt)')+fH('feeinit','Initial advice fee','text','','$')+'</div>'+
   '<div class="row">'+fH('feeong','Ongoing fee','text','','$ p.a. + % e.g. $320 p.m. + 0.33%')+fH('feepaid','Fees paid from','select',['Super','Cash Flow','Both (split)','SMSF Cash Account'])+'</div>'+
   '<div class="row">'+fH('feesplit','Per-person / entity fee split','text','','e.g. $2k each super; $2,826 combined cashflow')+'</div>',false);
 document.getElementById('form').innerHTML=h;
 document.querySelectorAll('[data-f]').forEach(i=>i.addEventListener('input',e=>{F[e.target.dataset.f]=e.target.value;render()}));
 document.querySelectorAll('[data-scope]').forEach(i=>i.addEventListener('change',render));
 buildStrats();
}
function whoOpts(){const t=F.ctype||'';let o=['Client 1','Client 2','Both','Entity'];if(t.includes('Single')&&!t.includes('entity'))o=['Client'];return o}
function buildStrats(){
 let h='';
 DATA.forEach((a,ai)=>{const list=a.scen.map((s,i)=>({s,i})).filter(x=>x.s.to=='both'||x.s.to==SOA);if(!list.length)return;
  h+=`<div class="areaH">${a.area} Advice</div>`;
  list.forEach(({s,i})=>{const id='s_'+ai+'_'+i;const tag=s.to=='accumulator'?'<span class="tg acc">ACC</span>':s.to=='retirement'?'<span class="tg ret">RET</span>':'';
   const who=`<span class="who"><select data-who="${id}">`+whoOpts().map(o=>`<option>${o}</option>`).join('')+`</select></span>`;
   const fig=s.fig?`<span class="fig"><input data-fig="${id}" placeholder="$ amt"></span>`:'';
   h+=`<label class="strat"><input type="checkbox" data-strat="${id}" data-name="${s.s_name||s.name.replace(/"/g,'&quot;')}" data-strat-text="${(s.strat||'').replace(/"/g,'&quot;')}" data-area="${a.area}"> <span class="lbl">${s.name}${tag}<br><small>${s.strat}</small></span>${who}${fig}</label>`;});
 });
 document.getElementById('stratList').innerHTML=h;
 document.querySelectorAll('[data-strat],[data-fig],[data-who]').forEach(i=>i.addEventListener('input',render));
 document.querySelectorAll('[data-strat]').forEach(i=>i.addEventListener('change',render));
 render();
}
function scopeIn(){return [...document.querySelectorAll('[data-scope]:checked')].map(c=>c.dataset.scope)}
function gather(){const out=[];document.querySelectorAll('[data-strat]:checked').forEach(c=>{const id=c.dataset.strat;const fig=document.querySelector(`[data-fig="${id}"]`);const who=document.querySelector(`[data-who="${id}"]`);out.push({area:c.dataset.area,name:c.dataset.name,text:c.dataset.stratText,who:who?who.value:'',amount:fig&&fig.value?fig.value:null})});return out}
function buildObj(){return{soaType:SOA,clients:F.clients,adviser:F.adviser,ctype:F.ctype,status:F.newex,entity:F.ent,entityId:F.entid,narrative:F.narr,referenceSOA:F.refsoa,
 notesBudget:F.budnotes,notesGoals:F.goalnotes,risk:{super:F.rps,superBump:F.rpsb,investment:F.rpi,investmentBump:F.rpib},
 scopeIn:scopeIn(),scopeOut:F.scopeout,strategies:gather(),
 products:{super:F.prodsuper,investment:F.prodinv},insurance:{cover:F.inscover,product:F.insprod},cashflow:F.cashflow,paraplanning:F.paraplan,
 fees:{commitment:F.feecommit,initial:F.feeinit,ongoing:F.feeong,paidFrom:F.feepaid,split:F.feesplit}}}
function asText(o){let L=[];
 L.push(`Advice Request – ${o.clients||'…'}`);L.push(`Adviser: ${o.adviser||'…'}`);
 L.push(`(${o.soaType.toUpperCase()} SOA · ${o.ctype||'?'} · ${o.status||'?'} client)`);
 if(o.entity&&o.entity!=='—')L.push(`Entity: ${o.entity} ${o.entityId||''}`);L.push('');
 if(o.narrative){L.push('Hi Team,');L.push(o.narrative);L.push('')}
 if(o.referenceSOA)L.push(`Please follow the layout of: ${o.referenceSOA}`);
 if(o.notesBudget){L.push('');L.push('Additional Notes for budget');L.push(o.notesBudget)}
 if(o.notesGoals){L.push('');L.push('Additional Notes for goals/objectives');L.push(o.notesGoals)}
 L.push('');L.push('Risk Profile');
 if(o.risk.super)L.push(`  ${o.risk.super} for Super${o.risk.superBump?' ('+o.risk.superBump+')':''}`);
 if(o.risk.investment)L.push(`  ${o.risk.investment} for Inv${o.risk.investmentBump?' ('+o.risk.investmentBump+')':''}`);
 L.push('');L.push('Scope of Advice');o.scopeIn.forEach(s=>L.push('  '+s));
 if(o.scopeOut){L.push('Scope Out');L.push('  '+o.scopeOut)}
 // group strategies by area then who
 const byArea={};o.strategies.forEach(s=>{(byArea[s.area]=byArea[s.area]||[]).push(s)});
 Object.keys(byArea).forEach(area=>{L.push('');L.push(area+' Advice');L.push('  Strategy Recommendations');
   byArea[area].forEach(s=>{const w=s.who&&s.who!=='Client'?s.who+': ':'';L.push(`    • ${w}${s.text||s.name}${s.amount?'  ['+s.amount+']':''}`)});});
 if(o.products.super||o.products.investment){L.push('');L.push('  Product Recommendations');if(o.products.super)L.push('    Super: '+o.products.super);if(o.products.investment)L.push('    Investment: '+o.products.investment)}
 if(o.insurance.cover||o.insurance.product){L.push('');L.push('Insurance Recommendations');if(o.insurance.cover)L.push('    '+o.insurance.cover);if(o.insurance.product)L.push('    Product: '+o.insurance.product)}
 if(o.cashflow){L.push('');L.push('Cashflow Recommendations');L.push('  '+o.cashflow)}
 if(o.paraplanning){L.push('');L.push('Paraplanning note:');L.push('  '+o.paraplanning)}
 L.push('');L.push('Advice Fees');
 L.push(`  Commitment: ${o.fees.commitment||'—'} | Initial: ${o.fees.initial||'—'} | Ongoing: ${o.fees.ongoing||'—'}`);
 L.push(`  Paid from: ${o.fees.paidFrom||'—'}${o.fees.split?' | Split: '+o.fees.split:''}`);
 return L.join('\n')}
function render(){const o=buildObj();document.getElementById('out').textContent=asText(o);document.getElementById('picks').textContent=o.strategies.length+' strategies';try{localStorage.setItem('mws_ar2',JSON.stringify(o))}catch(e){}}
function copyOut(){navigator.clipboard.writeText(asText(buildObj()))}
function dl(k){const o=buildObj();const c=k=='json'?JSON.stringify(o,null,2):asText(o);const b=new Blob([c],{type:'text/'+(k=='json'?'json':'plain')});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='advice_request.'+k;a.click();URL.revokeObjectURL(u)}
document.querySelectorAll('#soaType button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#soaType button').forEach(x=>x.classList.remove('on'));b.classList.add('on');SOA=b.dataset.t;document.getElementById('soaHint').textContent=SOA+' + shared';buildStrats()}));
build();
</script></body></html>
