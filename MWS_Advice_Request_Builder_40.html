<!DOCTYPE html><html lang="en" data-theme="night"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MWS Advice Request Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
@import url('https://fonts.cdnfonts.com/css/abc-arizona-flare');
@import url('https://fonts.cdnfonts.com/css/abc-arizona-serif');
:root{
  --bg:#f0f4f8; --surface:#fff; --surface-2:#f6f9fc; --input-bg:#f8fbfd;
  --border:#d0dbe6; --border-soft:#e4ecf4; --border-strong:#c9beb4;
  --navy:#0C2E3F; --navy-deep:#0a1e2e; --blue:#0B6AE1; --blue-bright:#1A7EE6;
  --blue-light:#EAF4FB; --blue-soft:#5EA6FF; --coral:#FF6550; --coral-light:#fff0ee;
  --lime:#D9F09A; --lime-dark:#4a6a10; --lime-light:#f3f9e4;
  --text:#1a1a1a; --text-dim:#3e5a6a; --text-muted:#595959; --text-faint:#9aa6b2;
  --green:#27ae60; --green-light:#e8f5e9; --green-dark:#2e7d32;
  --red:#d63031; --red-light:#fdeaea; --amber:#b8860b; --amber-light:#fef6e0;
  --gold:#b8860b;
  --hf:'ABC Arizona Flare','ABC Arizona Serif','Playfair Display','Georgia',serif;
  --bf:'Nunito Sans','Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  --shadow-sm:0 1px 2px rgba(12,46,63,.04); --shadow:0 2px 6px rgba(12,46,63,.06);
  --shadow-md:0 4px 12px rgba(12,46,63,.08); --shadow-lg:0 8px 24px rgba(12,46,63,.08);
}
[data-theme="night"]{
  --bg:#1C394E; --surface:#224A68; --surface-2:#2A5379; --input-bg:#2F4A45;
  --border:#345a7b; --border-soft:#2c4f6e; --border-strong:#456a88;
  --navy:#15293c; --navy-deep:#0f2030; --blue:#8fbdf0; --blue-bright:#a9d0fb;
  --blue-light:#284f72; --blue-soft:#2f5575; --coral:#ff7a68; --coral-light:#5a2420;
  --lime:#CCE185; --lime-dark:#CCE185; --lime-light:#33401c;
  --text:#e9f1f8; --text-dim:#c4d3df; --text-muted:#cfdce6; --text-faint:#90a8b8;
  --green:#5bb55b; --green-light:#1f3d33; --green-dark:#5bb55b; --red:#f1707a; --red-light:#3f2024; --amber:#e6b34d; --amber-light:#3a3320;
  --gold:#F9D949;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--bf);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--hf);color:var(--navy);font-weight:600;line-height:1.2}
[data-theme="night"] h1,[data-theme="night"] h2,[data-theme="night"] h3,[data-theme="night"] h4{color:#f1f6fb}
button{font-family:var(--bf);cursor:pointer;border:none;background:none}
input,select,textarea{font-family:var(--bf);font-size:13px}

/* ── Branded topbar (matches SOA generator) ── */
header.topbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;padding:0;box-shadow:var(--shadow-md);border-bottom:none}
[data-theme="night"] header.topbar{box-shadow:0 1px 0 rgba(207,226,122,.18),0 4px 18px rgba(0,0,0,.35)}
.topbar-inner{max-width:1400px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand-mark{display:flex;flex-direction:column;justify-content:center;line-height:1}
.brand-mark .bm-line{font-family:var(--hf);font-size:20px;font-weight:500;color:#cdd9ea;letter-spacing:.2px}
.brand-mark .bm-line .bm-my{color:#8e9fc1}
.brand-mark .bm-sub{font-size:9px;font-weight:600;letter-spacing:4px;color:#8aa0bd;margin-top:3px}
.topbar-tag{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.topbar-spacer{flex:1}
.topbar-btn{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;padding:7px 13px;border-radius:8px;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.topbar-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.topbar-btn.primary{background:var(--coral);color:#fff}
.topbar-btn.primary:hover{background:#ff7a68}
.topbar-btn.ghost{border:1px solid rgba(255,255,255,.25)}

/* Segmented Accumulator/Retirement/Mixed toggle */
.toggle{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.toggle button{background:transparent;color:rgba(255,255,255,.75);border:0;padding:7px 14px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.toggle button:hover{color:#fff}
.toggle button.on{background:var(--blue);color:#fff}
[data-theme="night"] .toggle button.on{background:linear-gradient(180deg,#3171ac 0%,#285b8e 100%)}

.legend{font-size:10.5px;color:rgba(255,255,255,.6)}
.legend b{border-radius:5px;padding:1px 6px;font-weight:700}
.legend b.acc{background:#2d6a4f;color:#fff}.legend b.ret{background:#9b2226;color:#fff}

/* ── Layout ── */
.wrap{display:flex;gap:18px;max-width:1400px;margin:0 auto;padding:20px 24px 80px;align-items:flex-start}
.form{flex:1 1 100%;min-width:0;max-width:900px;margin:0 auto}
.side{flex:1 1 42%;position:sticky;top:72px;max-height:calc(100vh - 92px);overflow:auto}
@media(max-width:960px){.wrap{flex-direction:column}.side{position:static;max-height:none;width:100%}}

/* ── Cards (matches SOA generator) ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden}
[data-theme="night"] .card{background:linear-gradient(180deg,#1f3e5a 0%,#1a374f 100%);border-color:#32567a}
.card>h2{margin:0;padding:14px 18px;font-size:14px;font-weight:800;font-family:var(--hf);background:var(--surface-2);color:var(--navy);cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-soft)}
[data-theme="night"] .card>h2{background:linear-gradient(180deg,#2A5D8A 0%,#23547F 100%);color:#fff;border-bottom:none;letter-spacing:.3px}
.card>h2 small.hint{color:var(--text-faint);font-weight:600}
[data-theme="night"] .card>h2 small.hint{color:#b9c9d6}
.card>h2 .chev{transition:transform .15s;font-size:12px}
.card.collapsed>h2 .chev{transform:rotate(-90deg)}
.card .body{padding:18px}
.card.collapsed .body{display:none}
.card.care>h2{background:var(--surface-2)}
.card.scopedout{opacity:.45}.card.scopedout .body{display:none}

/* ── Fields ── */
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.fld{flex:1 1 200px;min-width:140px}
.fld label{display:block;font-weight:700;font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
[data-theme="night"] .fld label{color:#b9c9d6}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;background:var(--input-bg);color:var(--text);transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
[data-theme="night"] .fld input:not([type=checkbox]):not([type=radio]),[data-theme="night"] .fld select{color:var(--gold);font-weight:600}
[data-theme="night"] .fld textarea{color:#e9f1f8;font-weight:400}
.fld input::placeholder,.opts input::placeholder{color:var(--text-faint)}
.fld textarea{min-height:62px;resize:vertical;line-height:1.55}

.miniH{font-weight:800;font-size:11px;color:var(--blue);font-family:var(--bf);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
.chklist{display:flex;flex-direction:column;gap:4px;margin-top:3px}.chkitem{display:flex;align-items:flex-start;gap:6px;font-size:11.5px;font-weight:500;cursor:pointer}.chkitem input{margin-top:2px}
[data-theme="night"] .miniH{color:var(--blue-bright)}

/* ── Strategy rows (chip-styled) ── */
.strat{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;flex-wrap:wrap;border:1px solid transparent;transition:.12s}
.strat:hover{background:var(--surface-2);border-color:var(--border-soft)}
.strat.on{background:var(--coral-light);border-color:var(--coral)}
.strat>input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--coral)}
.strat .lbl{flex:1 1 230px;min-width:150px;color:var(--text);font-weight:600;font-size:13px}
.tg{font-size:9px;color:#fff;background:var(--text-faint);border-radius:5px;padding:1px 6px;margin-left:6px;font-weight:700}
.tg.acc{background:#2d6a4f}.tg.ret{background:#9b2226}
.opts{display:none;gap:7px;flex:1 1 100%;padding:4px 0 5px 26px}
.strat.on .opts{display:flex;flex-wrap:wrap}
.opts select,.opts input{padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--input-bg);color:var(--text);font-family:inherit}
[data-theme="night"] .opts select,[data-theme="night"] .opts input{color:var(--gold)}
.opts .own{width:140px}.opts .sl{width:140px}.opts .pk{width:115px}.opts .freq{width:110px}
.srcchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--input-bg);color:var(--text-dim);font-weight:600;user-select:none;transition:.12s}
.srcchip:hover{border-color:var(--coral)}
.srcchip input{width:14px;height:14px;accent-color:var(--coral);margin:0}
.srcchip.on{background:var(--coral-light);border-color:var(--coral);color:var(--coral)}

/* ── Repeatable rows ── */
.repeat{border:1px solid var(--border-soft);border-radius:11px;padding:13px;margin-bottom:10px;background:var(--surface-2);position:relative}
[data-theme="night"] .repeat{background:#1a3046;border-color:#2c4f6e}
.riskrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border-soft)}
.riskrow .who{font-weight:800;font-size:12px;color:var(--navy);flex:0 0 110px}
[data-theme="night"] .riskrow .who{color:#f1f6fb}
.riskrow input,.riskrow select{flex:1 1 90px;min-width:80px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--input-bg);color:var(--text)}
[data-theme="night"] .riskrow input,[data-theme="night"] .riskrow select{color:var(--gold)}

/* ── Buttons ── */
.addbtn{background:var(--surface);color:var(--blue);border:1px solid var(--blue);border-radius:9px;padding:7px 13px;font-size:12px;cursor:pointer;font-weight:700;margin:4px 0;font-family:inherit;transition:.15s}
.addbtn:hover{background:var(--blue-light)}
[data-theme="night"] .addbtn{background:transparent;border-color:#3f7cb4;color:#d3e2ee}
[data-theme="night"] .addbtn:hover{border-color:var(--lime);color:var(--lime);background:transparent}
.del{background:var(--red-light);color:var(--red);border:0;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:11px;float:right;font-family:inherit;font-weight:700;transition:.15s}
.del:hover{background:var(--red);color:#fff}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer;margin:2px;font-family:inherit;transition:.15s}
.btn:hover{box-shadow:var(--shadow)}
.btn.alt{background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
.btn.alt:hover{border-color:var(--blue);color:var(--blue)}

/* ── Live preview ── */
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface-2);color:var(--text);padding:15px;border-radius:11px;font-size:11.5px;line-height:1.6;max-height:72vh;overflow:auto;margin:0;border:1px solid var(--border-soft);font-family:ui-monospace,'SF Mono',Menlo,monospace}
[data-theme="night"] pre{background:#101c2e;color:#dbe6f4;border-color:#2c4f6e}

.muted{color:var(--text-faint);font-size:11px;margin:6px 0 0}
.count{font-size:11px;color:var(--text-faint);font-weight:600}
small.hint{color:var(--text-faint);font-size:10px;font-weight:600}

/* ── Chips / scope-out ── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;background:var(--blue-light);color:var(--blue);font-weight:600;transition:.12s}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sop{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:9px;background:var(--lime-light);margin-bottom:6px;border:1px solid var(--border-soft)}
.sop input{width:17px;height:17px;flex:none;accent-color:var(--green)}
.sop .lbl{color:var(--lime-dark);font-size:12.5px;font-weight:700}
[data-theme="night"] .sop .lbl{color:var(--lime)}

/* ── Fee table ── */
table.fee{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
table.fee th,table.fee td{border:1px solid var(--border);padding:6px 7px}
table.fee th{background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;text-align:left}
[data-theme="night"] table.fee th{background:#23547F}
table.fee td{background:var(--surface)}
[data-theme="night"] table.fee td{background:#1f3e5a}
table.fee td:first-child{font-weight:700;color:var(--text-dim)}
table.fee input{width:100%;border:0;font-size:11.5px;padding:3px;background:transparent;color:var(--text);font-family:inherit}
[data-theme="night"] table.fee input{color:var(--gold)}
table.fee td.rowtot,table.fee tr.tot td{background:var(--blue-light);font-weight:800;color:var(--blue)}
[data-theme="night"] table.fee td.rowtot,[data-theme="night"] table.fee tr.tot td{background:#284f72;color:var(--blue-bright)}
.splitcols{display:flex;gap:12px;flex-wrap:wrap}
.splitcol{flex:1 1 300px;min-width:260px;border:1px solid var(--border);border-radius:11px;padding:11px;background:var(--surface-2)}
.splitcol>h4{margin:0 0 7px;font-size:12px;font-weight:800;color:var(--blue);border-bottom:1px solid var(--border-soft);padding-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
@media(max-width:760px){.splitcol{flex:1 1 100%}}
.stratgroup{border:1px solid var(--border-soft);border-radius:9px;margin:6px 0}
.stratgroup>summary{cursor:pointer;padding:7px 11px;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--blue);background:var(--surface-2);border-radius:8px;list-style:none}
.stratgroup[open]>summary{border-bottom:1px solid var(--border-soft);border-radius:8px 8px 0 0}
.stratgroup>summary::-webkit-details-marker{display:none}
.stratgroup>summary::before{content:"\25B8  ";color:var(--text-faint)}
.stratgroup[open]>summary::before{content:"\25BE  "}
.stratgroup .gcount{color:var(--text-faint);font-weight:600}
.stratgroup>.strat{margin:2px 5px}
.repeat .fld label{font-size:9.5px;letter-spacing:.3px;margin-bottom:2px}
.repeat .fld input,.repeat .fld select{padding:6px 9px;font-size:12px;border-radius:7px}
.repeat .row{gap:8px;margin-bottom:7px}
.multidrop{border:1px solid var(--border);border-radius:9px;background:var(--input-bg);margin-top:2px}
.multidrop>summary{cursor:pointer;padding:9px 11px;list-style:none;color:var(--text-dim);font-weight:600;font-size:13px}
.multidrop>summary::-webkit-details-marker{display:none}
.multidrop>summary::after{content:"\25BE";float:right;color:var(--text-faint)}
.multidrop[open]>summary::after{content:"\25B4"}
[data-theme="night"] .multidrop>summary{color:var(--gold)}
.multidrop .chklist{padding:2px 11px 9px;max-height:230px;overflow:auto}
.tight .fld label{font-size:9.5px;letter-spacing:.3px;margin-bottom:2px}
.tight .fld input,.tight .fld select{padding:6px 9px;font-size:12px;border-radius:7px}
.tight .row{gap:8px;margin-bottom:7px}
.tight .miniH{margin:8px 0 4px}
.tight table.fee th,.tight table.fee td{padding:4px 5px}
.tight p.muted{margin:4px 0}
.chkitem{display:flex;align-items:center;gap:8px}
.chkitem input[type=checkbox]{width:15px;height:15px;flex:none;margin:0}
.multidrop .chklist{padding:6px 11px 9px}
</style></head><body>
<header class="topbar"><div class="topbar-inner">
 <div class="brand-mark"><span class="bm-line"><span class="bm-my">My</span>Wealth</span><span class="bm-sub">SOLUTIONS</span></div>
 <div class="topbar-tag">Advice Request Builder</div>
 <div class="topbar-spacer"></div>
 <button class="topbar-btn ghost" onclick="toggleTheme()" id="themeBtn">☾ Night</button>
 <button class="topbar-btn ghost" onclick="copyOut()">⧉ Copy</button>
 <button class="topbar-btn ghost" onclick="dl('json')">⬇ .json</button>
 <button class="topbar-btn primary" onclick="dlWord()">⬇ Download Word</button>
</div></header>
<div class="wrap"><div class="form" id="form"></div></div>
<script>
/* ── Day/Night theme (matches SOA generator) ── */

function toggleTheme(){_theme=_theme==='night'?'day':'night';try{localStorage.setItem('mws_ar_theme',_theme)}catch(e){}applyTheme();}
applyTheme();

     s+='<tr><td>'+esc(r.name)+'</td>'+['us','uc','os','oc'].map(c=>'<td>'+esc(r.cells[c]||'')+'</td>').join('')+'<td>'+(r.total?fmt(r.total):'')+'</td></tr>';});
   s+='<tr class="tot"><td>Total</td><td>'+(col.us?fmt(col.us):'')+'</td><td>'+(col.uc?fmt(col.uc):'')+'</td><td>'+(col.os?fmt(col.os):'')+'</td><td>'+(col.oc?fmt(col.oc):'')+'</td><td>'+(fe.grand?fmt(fe.grand):'')+'</td></tr></table>';
   return s;};
 lines.forEach((ln,idx)=>{if(feeDone)return;const t=ln.trim();
   if(idx===0){body+=`<h1>${esc(t)}</h1>`;return}
   if(/^Adviser:/.test(t)||/SOA ·/.test(t)||/^Entity:/.test(t)){body+=`<p class="sub">${esc(t)}</p>`;return}
   if(t===''){body+='<div style="height:7px"></div>';return}
   const lead=ln.length-ln.replace(/^\s+/,'').length;
   if(t==='Hi Team,'){body+=`<p>${esc(t)}</p>`;return}
   if(lead===0 && /^Advice Fees/.test(t)){body+=`<h2>Advice Fees</h2>`+feeTable();feeDone=true;return}
   if(lead===0 && (/ Advice$/.test(t)||SECT.has(t)||/^CARE Investment Philosophy/.test(t))){body+=`<h2>${esc(t)}</h2>`;return}
   if(t.startsWith('•')){body+=`<p class="bul">${esc(t)}</p>`;return}
   if(lead<=2 && (/:$/.test(t)||/^(Strategy Recommendations|Product Recommendations|Super Accounts|Contributions|Costs paid from|Ongoing plan costs|Cash position|GRAND TOTAL|Commitment)/.test(t))){body+=`<p class="lbl">${esc(t)}</p>`;return}
   body+=`<p${lead>=4?' class="ind"':''}>${esc(t)}</p>`;});
 const css=`<style>@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');

 // Embed the full advice-request JSON as an HTML comment so the SOA generator can read the

 let arTag='';try{arTag='<!--MWS_AR_JSON_B64:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))+'-->';}catch(e){arTag='';}

/* Couple split: strategies in two per-client columns for Super/Contributions/Insurance */
function clientList(){return (F.ctype=='Couple')?[(F.c1name||'Client 1'),(F.c2name||'Client 2')]:[(F.c1name||'Personal')]}
const INS_GROUPS=[{t:'Core recommendation',open:true},{t:'Income Protection',open:false},{t:'TPD definition & sizing',open:false},{t:'Policy features & structure',open:false},{t:'Situational cover',open:false},{t:'Underwriting & occupation',open:false}];
function insGroup(name){if(/pre-assessment/i.test(name))return 5;if(/income protection/i.test(name))return 1;if(/TPD/.test(name))return 2;if(/Premium structure|reinstatement|buy-back|Future insurability/i.test(name))return 3;if(/child cover|Employer-paid|Trauma payout|workforce absence/i.test(name))return 4;return 0;}
function areaGroups(a){const A=a.area;
 if(a.insMulti)return {keys:['core','ip','tpd','sit'],G:{core:'Core recommendation',ip:'Income Protection',tpd:'TPD definition & sizing',sit:'Situational & Underwriting factors'},open:{core:1}};
 if(/Investment Plan/.test(A))return {keys:['core','existing','draw','cgt'],G:{core:'Core — establish & invest',existing:'Existing holdings',draw:'Drawdown & liquidity',cgt:'CGT'},open:{core:1}};
 if(a.superMulti)return {keys:['setup','pension','smsf','tpd','cgt'],G:{setup:'Fund setup & rollover',pension:'Pension & retirement',smsf:'SMSF',tpd:'TPD payout',cgt:'CGT'},open:{setup:1}};
 if(/Debt Management/.test(A))return {G:['Core — cashflow to debt','Consolidation & loan structure','Gearing / equity release','Property & custom'],open:[1,0,0,0],f:n=>/GEARING|Term Loan|equity|debt recycling/i.test(n)?2:(/Consolidate|Refinance|interest only|principal & interest|\bP&I\b/i.test(n)?1:(/home sale|Custom/i.test(n)?3:0))};
 if(/Investment Property/.test(A))return {G:['Acquire / restructure','Retain or sell existing'],open:[1,0],f:n=>/Retain an existing|Sell an existing/i.test(n)?1:0};
 if(a.isContrib)return {G:['Concessional (before-tax)','Non-concessional (after-tax)','Notes & thresholds'],open:[1,0,0],f:n=>/Division|Work test/i.test(n)?2:(/Non-concessional|Bring-forward|Spouse|co-contribution|Downsizer|FHSSS|First Home/i.test(n)?1:0)};
 if(a.isCash)return {G:['Cash hub & structure','Surplus & budgeting'],open:[1,0],f:n=>/surplus|tax savings|Budget/i.test(n)?1:0};
 return null;}
function renderStratList(a,ai,ci,list){const def=areaGroups(a);
 if(!def)return list.map(({s,i})=>stratRow(a,s,i,ai,ci)).join('');
 let buckets;
 if(def.keys){buckets=def.keys.map(k=>({t:def.G[k],open:!!def.open[k],items:[],k}));
   list.forEach(({s,i})=>{const b=buckets.find(x=>x.k===(s.g||def.keys[0]))||buckets[0];b.items.push({s,i});});
 }else{buckets=def.G.map((tt,gi)=>({t:tt,open:!!def.open[gi],items:[]}));
   list.forEach(({s,i})=>{let gi=def.f(s.name);if(gi==null||gi<0||gi>=buckets.length)gi=0;buckets[gi].items.push({s,i});});}
 return buckets.filter(b=>b.items.length).map(b=>`<details class="stratgroup"${b.open?' open':''}><summary>${b.t} <span class="gcount">(${b.items.length})</span></summary>`+b.items.map(({s,i})=>stratRow(a,s,i,ai,ci)).join('')+`</details>`).join('');}
function stratSplit(a){return F.ctype=='Couple' && (a.superMulti||a.insMulti||a.isContrib)}
function stratRow(a,s,i,ai,ci){
 const id=(ci==null)?ai+'_'+i:ai+'_'+i+'_c'+ci;
 const tag=s.to=='accumulator'?'<span class="tg acc">ACC</span>':s.to=='retirement'?'<span class="tg ret">RET</span>':'';
 const slotInputs=s.slots.map((sl,k)=>{const isFreq=/\bpm\b|\bpw\b|per month|per week|per annum|ongoing/i.test(sl);const ph=sl.replace(/\s*\bp\.?m\.?\b/i,'').replace(/\s*\bp\.?w\.?\b/i,'').trim();const df=/pm|month/i.test(sl)?'per month':(/pw|week/i.test(sl)?'per week':'');const fsel=isFreq?freqSelect(`class="freq" data-freq="${id}_${k}"`,df):'';return `<input class="sl" data-slot="${id}_${k}" placeholder="${ph}">${fsel}`;}).join('');
 const pickSel=s.pick?`<select class="pk" data-pick="${id}">`+s.pick.map(o=>`<option>${o}</option>`).join('')+`</select>`:'';
 const ownerSel=(ci==null)?`<select class="own" data-own="${id}">`+owners().map(o=>`<option>${o}</option>`).join('')+`</select>`:'';
 return `<label class="strat"><input type="checkbox" data-strat="${id}" data-name="${s.name.replace(/"/g,'&quot;')}" data-text="${(s.strat||'').replace(/"/g,'&quot;')}" data-custom="${s.custom?1:0}" data-estinv="${s.estInv?1:0}">`+
   `<span class="lbl">${s.name}${tag}</span>`+
   `<span class="opts">${ownerSel}${pickSel}${slotInputs}`+
   (s.custom?`<input class="sl" style="flex:1 1 100%" data-free="${id}" placeholder="free-type wording">`:'')+
   (s.estInv?estInvPanel(id):'')+(s.abp?abpPanel(id):'')+`</span></label>`;
}
function buildStrats(){
 DATA.forEach((a,ai)=>{const list=a.scen.map((s,i)=>({s,i}));const box=document.getElementById('strat_'+ai);if(!box)return;
  if(stratSplit(a)){const cl=clientList();
    box.innerHTML=`<div class="splitcols">`+cl.map((nm,ci)=>`<div class="splitcol"><h4>${nm||('Client '+(ci+1))}</h4>`+renderStratList(a,ai,ci,list)+`</div>`).join('')+`</div>`;
  }else{box.innerHTML=renderStratList(a,ai,null,list);}
 });
 document.querySelectorAll('[data-strat]').forEach(c=>c.addEventListener('change',e=>{e.target.closest('.strat').classList.toggle('on',e.target.checked);render()}));
 document.querySelectorAll('[data-own],[data-slot],[data-free],[data-pick],[data-freq]').forEach(i=>i.addEventListener('input',render));
 document.querySelectorAll('.estpanel [data-est]').forEach(inp=>{
   if(inp.type==='radio'){
     inp.addEventListener('change',e=>{const[id,kind]=e.target.dataset.est.split('.');ESTINV[id][kind]=e.target.value;e.target.closest('.chips').querySelectorAll('.srcchip').forEach(c=>c.classList.remove('on'));e.target.closest('.srcchip').classList.add('on');render()});
     inp.addEventListener('click',e=>{const[id,kind]=e.target.dataset.est.split('.');if(ESTINV[id][kind]===e.target.value){ESTINV[id][kind]='';e.target.checked=false;e.target.closest('.srcchip').classList.remove('on');render()}});
   }else{
     inp.addEventListener('input',e=>{const[id,kind]=e.target.dataset.est.split('.');ESTINV[id][kind]=e.target.value;render()});
   }
 });
 document.querySelectorAll('.estpanel [data-abp]').forEach(inp=>{
   const upd=(id)=>{const a=ABP[id];const num=v=>parseFloat(String(v||'').replace(/[^0-9.]/g,''))||0;let calc='';
     if(a.mode==='min'){const ann=num(a.bal)*num(a.pct)/100;if(ann)calc=`= $${Math.round(ann/12).toLocaleString('en-AU')} per month ($${Math.round(ann).toLocaleString('en-AU')} p.a.)`;}
     if(a.mode==='amt'){const mo=num(a.amt);if(mo)calc=`= $${mo.toLocaleString('en-AU')} per month ($${Math.round(mo*12).toLocaleString('en-AU')} p.a.)`;}
     const el=document.querySelector(`[data-abpcalc="${id}"]`);if(el)el.textContent=calc;};
   if(inp.type==='radio'){
     inp.addEventListener('change',e=>{const[id]=e.target.dataset.abp.split('.');ABP[id].mode=e.target.value;buildStratsPreserve(id)});
   }else if(inp.type==='checkbox'){
     inp.addEventListener('change',e=>{const[id]=e.target.dataset.abp.split('.');ABP[id].tbc=e.target.checked;e.target.closest('.srcchip').classList.toggle('on',e.target.checked);render()});
   }else{
     inp.addEventListener('input',e=>{const[id,kind]=e.target.dataset.abp.split('.');ABP[id][kind]=e.target.value;upd(id);render()});
   }
 });
 render();
}
function buildStratsPreserve(focusId){const checked=new Set([...document.querySelectorAll('[data-strat]:checked')].map(c=>c.dataset.strat));buildStrats();checked.forEach(id=>{const cb=document.querySelector(`[data-strat="${id}"]`);if(cb){cb.checked=true;cb.closest('.strat').classList.add('on');let el=cb.closest('details');while(el){el.open=true;el=el.parentElement?el.parentElement.closest('details'):null;}}});render()}
function gather(){const out=[];const ins=scopeInIdx();document.querySelectorAll('[data-strat]:checked').forEach(c=>{const id=c.dataset.strat;const ai=+id.split('_')[0];if(!ins.includes(ai))return;
  const cm=id.match(/_c(\d+)$/);let owner;
  if(cm){owner=(clientList()[+cm[1]]||'')}else{const own=document.querySelector(`[data-own="${id}"]`);owner=own?own.value:''}
  const free=document.querySelector(`[data-free="${id}"]`);
  const sl=[...document.querySelectorAll(`[data-slot^="${id}_"]`)].map(x=>{let v=(x.value||'').trim();if(!v)return '';const ph=x.placeholder||'';const num=parseFloat(v.replace(/[^0-9.]/g,''));
    if(/monthly/i.test(ph)&&num){return '$'+num.toLocaleString('en-AU')+' per month ($'+Math.round(num*12).toLocaleString('en-AU')+' p.a.)'}
    if(/weekly/i.test(ph)&&num){return '$'+num.toLocaleString('en-AU')+' per week ($'+Math.round(num*52).toLocaleString('en-AU')+' p.a.)'}
    if(/% upfront/i.test(ph)&&num){return num+'%'}
    if(/% \(up to\)/i.test(ph)&&num){return num+'%'}
    const fq=document.querySelector(`[data-freq="${x.dataset.slot}"]`);return v+(fq&&fq.value?' '+fq.value:'');}).filter(Boolean);
  const pk=document.querySelector(`[data-pick="${id}"]`);
  const est=(c.dataset.estinv=='1'&&ESTINV[id])?ESTINV[id]:null;
  const abp=(ABP[id]&&(ABP[id].mode||ABP[id].tbc||ABP[id].cond))?ABP[id]:null;
  out.push({area:DATA[ai].area,name:c.dataset.name,text:c.dataset.custom=='1'&&free&&free.value?free.value:c.dataset.text,owner,amounts:sl,pick:pk?pk.value:'',est,abp});});
  Object.keys(FREE).forEach(ai=>{if(!ins.includes(+ai))return;(FREE[ai]||[]).forEach(f=>{if(f.text)out.push({area:DATA[ai].area,name:f.text,text:f.text,owner:f.owner,amounts:[]})})});return out}
