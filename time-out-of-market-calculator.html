<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Out of Market Calculator — My Wealth Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';document.head.appendChild(s)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(typeof pdfjsLib!=='undefined'){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}</script>
<style>
@import url('https://fonts.cdnfonts.com/css/abc-arizona-flare');
@import url('https://fonts.cdnfonts.com/css/abc-arizona-serif');

/* ============ DESIGN TOKENS (from the MyWealth ROA generator) ============ */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#eef3f8; --row-alt:#f1f5fa; --input-bg:#f7fafd;
  --border:#d4dde7; --border-soft:#e6edf4; --border-strong:#c4d0dc;
  --navy:#0C2E3F; --navy-deep:#0a2433; --chrome:#0C2E3F; --chrome-deep:#0a2433; --heading:#0C2E3F;
  --blue:#2B6FD6; --blue-bright:#3B82E6; --blue-light:#e8f1fb; --blue-soft:#7fb0ef;
  --coral:#F56A5A; --coral-light:#fdeeec; --lime:#CFE87F; --lime-dark:#4a6a10; --lime-light:#f1f7df;
  --text:#16242e; --text-dim:#42586a; --text-muted:#5c6b78; --text-faint:#9aa6b2;
  --green:#27ae60; --green-light:#e8f5e9; --green-dark:#2e7d32;
  --red:#d63031; --red-light:#fdeaea; --amber:#b8860b; --amber-light:#fef6e0;
  --series-1:#2B6FD6; --series-2:#F56A5A;
  --hf:'ABC Arizona Flare','ABC Arizona Serif','Playfair Display','Georgia',serif;
  --bf:'Nunito Sans','Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  --shadow-sm:0 1px 2px rgba(12,46,63,.04); --shadow:0 2px 6px rgba(12,46,63,.06);
  --shadow-md:0 4px 12px rgba(12,46,63,.08); --shadow-lg:0 8px 24px rgba(12,46,63,.08);
}
[data-theme="night"]{
  --bg:#1C394E; --surface:#224A68; --surface-2:#2A5379; --row-alt:#27506F; --input-bg:#2F4A45;
  --border:#345a7b; --border-soft:#2c4f6e; --border-strong:#456a88; --chrome:#15293c; --chrome-deep:#2c4964;
  --navy:#2A5D8A; --navy-deep:#23547F; --heading:#f1f6fb;
  --blue:#8fbdf0; --blue-bright:#a9d0fb; --blue-light:#284f72; --blue-soft:#3d6585;
  --coral:#ff7a68; --coral-light:#5a2420; --lime:#CCE185; --lime-dark:#CCE185; --lime-light:#33401c;
  --text:#e9f1f8; --text-dim:#c4d3df; --text-muted:#a9bfd0; --text-faint:#90a8b8;
  --green:#5bb55b; --green-light:#1f3d33; --green-dark:#8fd08f;
  --red:#f1707a; --red-light:#3f2024; --amber:#e6b34d; --amber-light:#3a3320;
  --series-1:#8fbdf0; --series-2:#ff7a68;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--bf);font-size:13px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--hf)!important;color:var(--text);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:600;line-height:1.1}
h2{font-size:20px;font-weight:600;line-height:1.2}
h3{font-size:15px;font-weight:700;line-height:1.3}
a{color:inherit}
em{font-style:italic}

/* ============ TOPBAR ============ */
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:9px 24px;background:var(--chrome);border-bottom:1px solid var(--chrome-deep);position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;cursor:pointer}
.brand-stack{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--hf)!important;font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em}
.brand-solutions{font-size:7px;letter-spacing:3.4px;color:rgba(255,255,255,.55);font-weight:700;margin-top:3px;text-transform:uppercase}
.tool-label{font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1.6px;font-weight:700;line-height:1.5;padding-left:14px;border-left:1px solid rgba(255,255,255,.15)}
.topbar-mid{display:flex;align-items:center;justify-content:center;gap:14px;min-width:0}
.topbar-status{font-size:11px;color:rgba(255,255,255,.6);font-weight:600;white-space:nowrap}
.topnav{display:flex;gap:2px;align-items:center;justify-content:center}
.topnav a{padding:7px 13px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);text-decoration:none;border-radius:11px;cursor:pointer;transition:all .12s;white-space:nowrap}
.topnav a:hover{background:rgba(255,255,255,.1);color:#fff}
.topnav a.active{background:var(--blue);color:#fff}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.topbar .top-actions .btn-ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.topbar .top-actions .btn-ghost:hover{background:rgba(255,255,255,.18)}
.topbar .top-actions .import-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4);color:#fff}
.topbar .top-actions .import-btn:hover{background:rgba(255,255,255,.18)}
.theme-toggle-icon{font-size:14px;line-height:1}

/* ============ BUTTONS ============ */
.btn{background:var(--surface);color:var(--text-dim);border:1px solid var(--border);padding:8px 15px;border-radius:11px;font-family:var(--bf);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;text-decoration:none}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:var(--navy-deep);color:#fff}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-blue:hover{background:#0958c0;color:#fff}
.btn-coral{background:var(--coral);color:#fff;border-color:var(--coral)}
.btn-lime{background:var(--lime);color:var(--navy);border-color:var(--lime)}
.btn-green{background:#27ae60;color:#fff;border-color:#27ae60}
.btn-green:hover{background:#219a52;color:#fff}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-danger{background:var(--red-light);color:var(--red);border-color:var(--red-light)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}
.import-btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);padding:7px 14px;border-radius:10px;font-size:12px;font-weight:700;background:var(--surface)}

/* ============ LAYOUT ============ */
.main{flex:1;padding:20px;max-width:1280px;width:100%;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.card h2{margin-bottom:3px;font-size:17px}
.card-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:12px}

/* ============ HERO ============ */
.hero{background:linear-gradient(135deg,var(--chrome) 0%,var(--chrome-deep) 100%);color:#fff;padding:26px 28px 24px;border-radius:18px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30%;right:-8%;width:460px;height:460px;background:radial-gradient(circle,rgba(255,101,80,.12),transparent 65%);pointer-events:none}
.hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero-left{flex:1;min-width:240px}
.hero-sub{font-family:var(--bf);font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:2.4px;font-weight:600;margin-bottom:7px}
.hero h1{font-size:30px;color:#fff;line-height:1.06;font-weight:500;letter-spacing:-.015em}
.hero h1 em{font-style:italic;color:var(--coral);font-weight:400}
.hero-tag{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:10px;max-width:660px;line-height:1.6;font-weight:300}

/* ============ PICKER ============ */
.picker-intro{background:transparent;padding:2px 4px 12px;margin-bottom:4px}
.picker-intro h3{font-size:15px;font-weight:600;margin-bottom:2px}
.picker-intro p{font-size:12px;color:var(--text-muted);font-weight:300}
.scenario-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px;margin-bottom:14px}
.scenario-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:15px 16px;cursor:pointer;text-align:left;transition:all .18s;position:relative;user-select:none;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm)}
.scenario-card:hover{border-color:var(--blue-soft);box-shadow:var(--shadow-md);transform:translateY(-1px)}
.scenario-card.selected{border-color:var(--blue);background:linear-gradient(135deg,var(--blue-light) 0%,var(--surface) 100%);box-shadow:var(--shadow-md)}
.scenario-card.selected::after{content:'✓';position:absolute;top:10px;right:12px;width:18px;height:18px;background:var(--blue);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.scenario-card .sc-tag{font-size:8.5px;text-transform:uppercase;letter-spacing:1.3px;font-weight:700;color:var(--blue)}
.scenario-card .sc-name{font-family:var(--hf);font-size:15px;font-weight:600;color:var(--heading);line-height:1.18;padding-right:14px}
.scenario-card .sc-desc{font-size:11.5px;color:var(--text-muted);line-height:1.45;font-weight:300}

/* ============ WIZARD ============ */
.wizard-wrap{margin:0 auto;padding:16px 0 96px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:22px;align-items:start;max-width:1180px}
.wizard-side{position:sticky;top:70px;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;padding:12px 10px;box-shadow:var(--shadow-sm);max-height:calc(100vh - 90px);overflow:auto}
.sidebar-page-heading{font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:var(--text-faint);margin:4px 6px 10px}
.wizard-steps-v{display:flex;flex-direction:column;gap:3px}
.wizard-step{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:11px;padding:8px 10px;cursor:pointer;font-size:12px;color:var(--text-dim);font-family:var(--bf);font-weight:500;transition:all .12s}
.wizard-step .ws-dot{width:21px;height:21px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border-soft);font-size:10.5px;font-weight:700;color:var(--text-muted);flex:0 0 auto}
.wizard-step .ws-label{white-space:normal;line-height:1.25}
.wizard-step.done .ws-dot{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.wizard-step.todo .ws-dot{background:var(--surface-2);border-color:var(--border-strong);color:var(--text-faint)}
.wizard-step.current{border-color:transparent;background:var(--blue-light);color:var(--heading);font-weight:700}
.wizard-step.current .ws-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.wizard-step:hover{background:var(--surface-2)}
.wizard-step.current:hover{background:var(--blue-light)}
.wizard-side-foot{margin-top:14px;padding:12px 10px 4px;border-top:1px solid var(--border-soft)}
.wizard-side-foot .wf-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);font-weight:700}
.wizard-side-foot .wf-val{font-family:var(--hf);font-size:22px;font-weight:600;color:var(--heading);margin-top:3px}
.section-block{background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;box-shadow:var(--shadow-sm);overflow:visible}
.section-block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px 12px;margin:0;flex-wrap:wrap}
.section-block-title{font-family:var(--hf);font-size:19px;font-weight:500;letter-spacing:-.015em;color:var(--heading);line-height:1.2}
.section-block-body{padding:6px 24px 22px}
.page-separator{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.page-separator-num{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);background:var(--blue-light);padding:4px 10px;border-radius:999px}
.page-separator-label{font-size:11.5px;color:var(--text-muted);font-weight:300}
.wizard-hint{background:var(--amber-light);border:1px solid transparent;color:var(--amber);border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:600;margin:12px 24px 0}
.wizard-nav{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 14px;background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;position:sticky;bottom:14px;box-shadow:var(--shadow-lg);z-index:5}
.wizard-nav .wizard-nav-mid{flex:1;text-align:center;font-size:11.5px;color:var(--text-muted);font-weight:300}

/* ============ FIELDS ============ */
.field{margin-bottom:13px}
.field label{font-family:var(--bf);font-size:10.5px;font-weight:600;color:var(--text-muted);display:block;margin-bottom:5px;letter-spacing:.2px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--input-bg);color:var(--text);font-family:var(--bf);font-size:13px;transition:all .12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px rgba(43,111,214,.12)}
.field textarea{min-height:64px;resize:vertical;line-height:1.5;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.field .hint{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.45;font-weight:300}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;background:var(--surface-2);color:var(--text-muted);margin-left:8px;font-weight:700}
.pill.ok{background:var(--green-light);color:var(--green-dark)}
.info{background:var(--blue-light);border-left:3px solid var(--blue);padding:10px 14px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0;color:var(--text-dim)}
.warn{background:var(--amber-light);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;font-size:12.5px;margin:10px 0;color:var(--text-dim)}
.drop{border:2px dashed var(--border-strong);border-radius:10px;padding:16px;text-align:center;color:var(--text-muted);font-size:12.5px;cursor:pointer;transition:border-color .15s;background:var(--input-bg)}
.drop.over{border-color:var(--blue);color:var(--blue)}

/* ============ TABLES ============ */
table.data{border-collapse:collapse;width:100%;font-size:12.5px}
table.data th,table.data td{padding:6px 9px;border-bottom:1px solid var(--border-soft);text-align:right;white-space:nowrap}
table.data th{color:var(--text-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
table.data th:first-child,table.data td:first-child{text-align:left}
.sched-table input{padding:5px 7px;font-size:12.5px;border:1px solid var(--border);border-radius:7px;background:var(--input-bg);color:var(--text);font-family:var(--bf)}
.sched-table td{text-align:left}
.ledger-wrap{overflow:auto;max-height:420px;border:1px solid var(--border-soft);border-radius:10px}
.ledger-wrap th{position:sticky;top:0;background:var(--surface);z-index:1}

/* ============ RESULTS ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:16px 18px}
.stat .lbl{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.stat .val{font-family:var(--hf);font-size:28px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;color:var(--heading);letter-spacing:-.01em}
.stat .sub2{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:300}
.stat.hero-stat{background:linear-gradient(135deg,var(--blue-light) 0%,var(--surface) 100%);border-color:var(--blue-soft)}
.neg{color:var(--red)} .pos{color:var(--green-dark)}
.chartbox{position:relative;margin:8px 0 4px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:12px}
.chartbox svg{display:block;width:100%;height:auto}
.tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;box-shadow:var(--shadow-md);display:none;z-index:5;min-width:180px}
.tooltip .tt-date{font-weight:700;margin-bottom:4px;color:var(--heading)}
.tt-row{display:flex;justify-content:space-between;gap:14px}
.tt-row .sw,.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--text-dim);margin-top:4px;flex-wrap:wrap}
.meth{font-size:12.5px;color:var(--text-dim)}
.meth p{margin:6px 0}
details summary{cursor:pointer;font-weight:700;color:var(--heading);margin:10px 0 8px}
code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:11.5px}
.hidden{display:none!important}

/* ============ NIGHT-THEME OVERRIDES (match the ROA generator's default look) ============ */
[data-theme="night"] .topnav a.active{background:var(--lime);color:#16304a}
[data-theme="night"] .field label{color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-size:10px;font-weight:700}
[data-theme="night"] .field input,[data-theme="night"] .field select,[data-theme="night"] .field textarea{background:var(--surface-2);border-color:var(--border)}
[data-theme="night"] .field input:focus,[data-theme="night"] .field select:focus,[data-theme="night"] .field textarea:focus{background:var(--surface)}
[data-theme="night"] .btn-blue{background:#3d6f9e;border-color:#3d6f9e;color:#fff}
[data-theme="night"] .btn-blue:hover{background:#4a80b3;color:#fff}
[data-theme="night"] .btn-green{background:#3f7a4a;border-color:#3f7a4a}
[data-theme="night"] .sched-table input{background:var(--surface-2);border-color:var(--border);color:var(--text)}
[data-theme="night"] .stat .val{color:var(--heading)}
[data-theme="night"] .hero{background:linear-gradient(135deg,#15293c 0%,#1a3346 100%)}

@media(max-width:1080px){
  .topbar{grid-template-columns:1fr auto;padding:10px 14px;gap:8px}
  .topbar-mid{display:none}
  .tool-label{display:none}
  .wizard-wrap{grid-template-columns:1fr}
  .wizard-side{position:static;max-height:none}
  .main{padding:14px}
}
@media print{
  body{background:#fff}
  .topbar,.wizard-side,.wizard-nav,.no-print,.drop,textarea{display:none!important}
  .wizard-wrap{grid-template-columns:1fr;padding:0}
  .section-block,.card,.chartbox{border:none;box-shadow:none}
  .ledger-wrap{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

/* ================= STATE ================= */
const DEFAULTS = () => ({
  scenario:'contribCash', basis:'buy', theme:'night',
  clientName:'', fundName:'',
  tomStart:'', tomEnd:'',
  grossContrib:'2300', contribDay:'6', feeOn:'no', advFee:'187.50', adminFee:'0',
  intMode:'actual', intRate:'4.0', baseCash:'0',
  startCash:'', startInv:'', endCash:'', endInv:'',
  cashTx:[],
  openUnits:'0', actualUnits:'0',
  lumpAmt:'100000',
  swMode:'units', swAmt:'10000', swRate:'0', swSell:'', swBuy:'',
  phLump:'120000', phN:'6', phEvery:'1', phRate:'0',
  prices:[], dists:[], sched:[], intCredits:[], phInst:[],
});
let F = DEFAULTS();
const state = { page:'picker', wizardStep:0, result:null, needChart:false };
const DRAFT_KEY = 'tom_calc_draft';

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const e = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function parseDateStr(s){ if(s==null)return null; s=String(s).trim().replace(/["']/g,''); if(!s)return null; let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return iso(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})[\/\.-](\d{1,2})[\/\.-](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return iso(y,+m[2]-1,+m[1]);}
  if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s+(\d{4})$/))){const mo=MONTHS[m[2].slice(0,3).toLowerCase()];if(mo!=null)return iso(+m[3],mo,+m[1]);}
  if((m=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})$/))){const mo=MONTHS[m[1].slice(0,3).toLowerCase()];if(mo!=null)return iso(+m[3],mo,+m[2]);}
  const d=new Date(s); return isNaN(d)?null:iso(d.getFullYear(),d.getMonth(),d.getDate()); }
function parseNum(s){ if(s==null)return null; const v=parseFloat(String(s).replace(/[$,\s%]/g,'')); return isNaN(v)?null:v; }
const num=k=>parseNum(F[k])??0;
function fmtDate(isoStr){ if(!isoStr)return''; const [y,mo,d]=isoStr.split('-').map(Number); return `${pad(d)} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo-1]} ${y}`; }
function fmt$(n,dp=2){ const neg=n<0; const v=Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (neg?'-$':'$')+v; }
function fmtU(n){ return n.toLocaleString('en-AU',{minimumFractionDigits:4,maximumFractionDigits:4}); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function firstIdxOnOrAfter(rows,date){ for(let i=0;i<rows.length;i++)if(rows[i].date>=date)return i; return -1; }
function lastIdxOnOrBefore(rows,date){ for(let i=rows.length-1;i>=0;i--)if(rows[i].date<=date)return i; return -1; }
function addMonths(isoStr,k){ let [y,m,d]=isoStr.split('-').map(Number); m-=1; m+=k; while(m>11){m-=12;y++;} while(m<0){m+=12;y--;} const dim=new Date(y,m+1,0).getDate(); return iso(y,m,Math.min(d,dim)); }

/* ================= PARSERS ================= */
function splitRows(text){ return text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length).map(l=>l.includes('\t')?l.split('\t'):splitCsvLine(l)); }
function splitCsvLine(line){ const out=[];let cur='',q=false; for(const ch of line){ if(ch==='"'){q=!q;continue;} if(ch===','&&!q){out.push(cur);cur='';}else cur+=ch; } out.push(cur); return out.map(c=>c.trim()); }
function parsePrices(text){
  const rows=splitRows(text); if(!rows.length)return{error:'No rows found.'};
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,10);i++){ const low=rows[i].map(c=>c.toLowerCase()); const di=low.findIndex(c=>/date/.test(c));
    if(di>=0){ const bi=low.findIndex(c=>/buy/.test(c)); const si=low.findIndex(c=>/sell|exit|redeem/.test(c)); const ni=low.findIndex(c=>(/nav|mid|unit\s*price|price/.test(c))&&!/buy|sell/.test(c)); if(bi>=0||si>=0||ni>=0){hi=i;cols={di,bi,si,ni};break;} } }
  if(hi<0)cols={di:0,bi:1,si:2,ni:3};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i];const date=parseDateStr(r[cols.di]);if(!date)continue;
    const buy=cols.bi>=0?parseNum(r[cols.bi]):null,sell=cols.si>=0?parseNum(r[cols.si]):null,nav=cols.ni>=0?parseNum(r[cols.ni]):null;
    const first=buy??nav??sell;if(first==null)continue; out.push({date,buy:buy??first,sell:sell??first,nav:nav??first}); }
  if(!out.length)return{error:'No parsable price rows — check the columns include Date and at least one price.'};
  out.sort((a,b)=>a.date<b.date?-1:1);
  const dedup=[],seen=new Set(); for(const r of out){if(!seen.has(r.date)){seen.add(r.date);dedup.push(r);}}
  return{rows:dedup};
}
function parseDists(text){
  const rows=splitRows(text); if(!rows.length)return{error:'No rows found.'};
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,6);i++){ const low=rows[i].map(c=>c.toLowerCase());
    const ei=low.findIndex(c=>(/ex/.test(c)&&/date|div/.test(c))||/^ex\b/.test(c)); const ci=low.findIndex(c=>/cpu|cent|c\/unit|distribution/.test(c)&&!/date/.test(c));
    if(ei>=0&&ci>=0){const ri=low.findIndex(c=>/re-?invest|pay/.test(c)&&/date/.test(c));const pi=low.findIndex(c=>/price/.test(c));cols={ei,ci,ri,pi};hi=i;break;} }
  if(hi<0)cols={ei:0,ci:1,ri:2,pi:3};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i];const ex=parseDateStr(r[cols.ei]);const cpu=parseNum(r[cols.ci]);if(!ex||cpu==null)continue;
    out.push({ex,cpu,reinvest:cols.ri>=0?parseDateStr(r[cols.ri]):null,price:cols.pi>=0?parseNum(r[cols.pi]):null}); }
  if(!out.length)return{error:'No parsable distribution rows found.'};
  return{rows:out};
}
/* Cash-transactions report parser — Date, Description, Credit/Debit (or signed Amount) */
function parseCashTx(text){
  const rows=splitRows(text); if(!rows.length)return{error:'No rows found.'};
  let hi=-1,cols=null;
  for(let i=0;i<Math.min(rows.length,12);i++){ const low=rows[i].map(c=>c.toLowerCase());
    const di=low.findIndex(c=>/date/.test(c)); if(di<0)continue;
    const ai=low.findIndex(c=>/^amount|amount$|amount|value/.test(c)&&!/balance/.test(c));
    const ci=low.findIndex(c=>/credit|money in|paid in|deposit/.test(c));
    const dbi=low.findIndex(c=>/debit|money out|paid out|withdraw/.test(c));
    const dsi=low.findIndex(c=>/desc|detail|narrat|transaction|type|particular|reference/.test(c));
    if(ai>=0||ci>=0||dbi>=0){ hi=i; cols={di,dsi,ai,ci,dbi}; break; }
  }
  if(hi<0)return{error:'Could not find a Date and an Amount/Credit/Debit column in that file.'};
  const out=[];
  for(let i=hi+1;i<rows.length;i++){ const r=rows[i]; const date=parseDateStr(r[cols.di]); if(!date)continue;
    const desc=cols.dsi>=0?(r[cols.dsi]||''):'';
    let amount=null;
    if(cols.ai>=0&&parseNum(r[cols.ai])!=null) amount=parseNum(r[cols.ai]);
    else { const cr=cols.ci>=0?parseNum(r[cols.ci]):null, db=cols.dbi>=0?parseNum(r[cols.dbi]):null; if(cr!=null||db!=null) amount=(cr||0)-(Math.abs(db||0)); }
    if(amount==null)continue;
    out.push({date,desc:String(desc).trim(),amount});
  }
  if(!out.length)return{error:'No transaction rows parsed — check the Date and amount columns.'};
  return{rows:out};
}
function txCategory(desc){
  const d=(desc||'').toLowerCase();
  if(/interest/.test(d))return 'interest';
  if(/fee|adviser|advice|admin|platform|management|commission/.test(d))return 'fee';
  if(/deposit|contribution|direct debit|\bdd\b|transfer in|bpay|eft|received/.test(d))return 'contribution';
  if(/buy|purchase|invest|subscription|application/.test(d))return 'investment';
  if(/sell|redem|withdrawal|redeem/.test(d))return 'redemption';
  return 'other';
}
function setPrices(rows){
  F.prices=rows;
  if(!F.tomStart)F.tomStart=rows[0].date;
  if(!F.tomEnd)F.tomEnd=rows[rows.length-1].date;
  if(!F.swSell)F.swSell=rows[0].date;
  if(!F.swBuy)F.swBuy=rows[Math.min(rows.length-1,10)].date;
}

/* ================= WIZARD STEPS ================= */
function wizardSteps(){
  const base=[{k:'prices',l:'Price history'},{k:'dists',l:'Distributions'}];
  const sc=F.scenario; let mid;
  if(sc==='contribCash')mid=[{k:'setup',l:'Client & period'},{k:'balances',l:'Account balances'},{k:'contrib',l:'Contributions & fees'},{k:'interest',l:'Cash interest offset'}];
  else if(sc==='lumpCash')mid=[{k:'setup',l:'Client & period'},{k:'balances',l:'Account balances'},{k:'lump',l:'The lump sum & fees'},{k:'interest',l:'Cash interest offset'}];
  else if(sc==='feeDrag')mid=[{k:'setup',l:'Client & period'},{k:'balances',l:'Account balances'},{k:'contrib',l:'Contributions & fees'},{k:'holdings',l:'Unit holdings'}];
  else if(sc==='switch')mid=[{k:'setup',l:'Client & fund'},{k:'switch',l:'The switch'}];
  else mid=[{k:'setup',l:'Client & period'},{k:'phasing',l:'Lump vs phasing'}];
  return base.concat(mid,[{k:'results',l:'Results'}]);
}
function stepStatus(k){
  const has=v=>!!(v&&String(v).trim());
  switch(k){
    case 'prices': return F.prices.length?'ok':'todo';
    case 'dists': return 'ok';
    case 'setup': return (has(F.clientName)&&has(F.fundName)&&(F.scenario==='switch'||(has(F.tomStart)&&has(F.tomEnd))))?'ok':'todo';
    case 'balances': return has(F.startCash)?'ok':'todo';
    case 'contrib': return effectiveSchedule().length?'ok':'todo';
    case 'interest': return 'ok';
    case 'lump': return num('lumpAmt')>0?'ok':'todo';
    case 'holdings': return num('actualUnits')>0?'ok':'todo';
    case 'switch': return (has(F.swSell)&&has(F.swBuy))?'ok':'todo';
    case 'phasing': return F.phInst.length?'ok':'todo';
    case 'results': return state.result&&!state.result.error?'ok':'todo';
  }
  return 'ok';
}

/* ================= SCHEDULE / PHASING / INTEREST ================= */
function feePerContrib(){ return F.feeOn==='yes' ? (num('advFee')+num('adminFee')) : 0; }
function netMonthly(){ return Math.max(0, num('grossContrib')-feePerContrib()); }
function rowNet(r){ if(r.type==='oneoff')return r.gross; return Math.max(0,r.gross-feePerContrib()); }
function effectiveSchedule(){
  if(F.scenario==='lumpCash'){ const amt=num('lumpAmt'); return [{date:F.tomStart,type:'oneoff',gross:amt,net:amt}]; }
  return F.sched.filter(r=>r.include&&r.date&&r.gross>0).map(r=>({...r,net:rowNet(r)})).filter(r=>r.net>0);
}
function genSchedule(){
  if(!F.prices.length){alert('Load the price history first.');return;}
  const start=F.tomStart||F.prices[0].date,end=F.tomEnd||F.prices[F.prices.length-1].date;
  const day=Math.min(31,Math.max(1,parseInt(F.contribDay)||6)),gross=num('grossContrib');
  const out=[]; let [y,m]=start.split('-').map(Number); m-=1;
  for(let k=0;k<60;k++){ const dim=new Date(y,m+1,0).getDate(); const target=iso(y,m,Math.min(day,dim));
    if(target>end)break;
    if(target>=start){const idx=firstIdxOnOrAfter(F.prices,target);const mapped=(idx>=0&&F.prices[idx].date<=end)?F.prices[idx].date:null;if(mapped)out.push({date:mapped,type:'monthly',gross,include:true});}
    m++;if(m>11){m=0;y++;} }
  const oneoffs=F.sched.filter(r=>r.type==='oneoff');
  F.sched=out.concat(oneoffs).sort((a,b)=>a.date<b.date?-1:1);
  render();
}
function genPhasing(){
  const start=F.tomStart||(F.prices[0]&&F.prices[0].date); if(!start){alert('Load prices and set the start date.');return;}
  const lump=num('phLump'),n=Math.max(1,parseInt(F.phN)||1),every=Math.max(1,parseInt(F.phEvery)||1);
  const each=lump/n; F.phInst=[];
  for(let k=0;k<n;k++)F.phInst.push({date:addMonths(start,k*every),amount:+each.toFixed(2)});
  render();
}

/* ================= ENGINES (verified) ================= */
function calculate(){
  if(!F.prices.length)return{error:'Load the price history first.'};
  const basis=F.basis,sc=F.scenario; let R;
  if(sc==='switch')R=runSwitch(basis);
  else if(sc==='phasing')R=runPhasing(basis);
  else if(sc==='feeDrag')R=runUnits(basis);
  else R=runCash(basis,sc);
  if(!R||R.error)return R||{error:'Could not calculate.'};
  R.scenario=sc;R.basis=basis;R.twoSeries=sc!=='feeDrag';
  return R;
}
function runCash(basis,sc){
  const start=F.tomStart,end=F.tomEnd;
  if(!start||!end||start>=end)return{error:'Set a valid period (start before end).'};
  const rows=F.prices.filter(r=>r.date>=start&&r.date<=end); if(rows.length<2)return{error:'Fewer than two pricing days in the period.'};
  const sched=effectiveSchedule(); if(!sched.length)return{error:'No contributions to model — generate a schedule or enter a lump sum.'};
  const warnings=[]; const contribByIdx={}; let totalNet=0,totalGross=0;
  for(const c of sched){const idx=firstIdxOnOrAfter(rows,c.date);if(idx===-1){warnings.push(`Contribution on ${fmtDate(c.date)} is after the last pricing day — excluded.`);continue;}contribByIdx[idx]=(contribByIdx[idx]||0)+c.net;totalNet+=c.net;totalGross+=c.gross;}
  const dists=F.dists.filter(d=>d.ex&&d.cpu>0&&d.ex>=rows[0].date&&d.ex<=rows[rows.length-1].date).map(d=>{const exIdx=lastIdxOnOrBefore(rows,d.ex);let creditIdx=d.reinvest?firstIdxOnOrAfter(rows,d.reinvest):(exIdx+1<rows.length?exIdx+1:exIdx);if(creditIdx===-1)creditIdx=rows.length-1;return{...d,exIdx,creditIdx};});
  const intMode=F.intMode,creditsByIdx={};
  if(intMode==='actual'){for(const cr of F.intCredits.filter(c=>c.date&&c.amount>0)){let idx=firstIdxOnOrAfter(rows,cr.date);if(idx===-1)idx=rows.length-1;(creditsByIdx[idx]=creditsByIdx[idx]||[]).push(cr);}}
  const rate=num('intRate')/100,baseCash0=(parseNum(F.startCash)??num('baseCash'));
  const series=[],ledger=[]; let cf=0,M=0,G=baseCash0,prevP=null,prevDate=null,accrued=0,interestTotal=0,distTotal=0; const pending={};
  for(let i=0;i<rows.length;i++){
    const p=rows[i][basis],contrib=contribByIdx[i]||0,r=i>0?(p-prevP)/prevP:0,distCredit=pending[i]||0;
    cf=(cf+contrib)*(1+r)+distCredit; distTotal+=distCredit; M+=contrib; G+=contrib;
    let intToday=0;
    if(intMode==='rate'){if(prevDate){accrued+=M*rate/365*daysBetween(prevDate,rows[i].date);if(rows[i].date.slice(0,7)!==prevDate.slice(0,7)){intToday=accrued;M+=accrued;G+=accrued;interestTotal+=accrued;accrued=0;}}}
    else if(intMode==='actual'&&creditsByIdx[i]){for(const cr of creditsByIdx[i]){const share=G>0?M/G:0;const app=cr.amount*share;intToday+=app;M+=app;interestTotal+=app;G+=cr.amount;}}
    for(const d of dists){if(i===d.exIdx){const units=cf/p;const cash=units*d.cpu/100;d.units=units;d.cash=cash;pending[d.creditIdx]=(pending[d.creditIdx]||0)+cash;}}
    series.push({date:rows[i].date,a:cf,b:M}); ledger.push({date:rows[i].date,price:p,ret:i>0?r:null,contrib,distCredit,cf,int:intToday,actual:M}); prevP=p;prevDate=rows[i].date;
  }
  if(intMode==='rate'&&accrued>0){const last=ledger[ledger.length-1];last.int+=accrued;last.actual+=accrued;interestTotal+=accrued;series[series.length-1].b=last.actual;}
  const A=cf,B=ledger[ledger.length-1].actual;
  return {kind:'cash',rows,series,ledger,dists,warnings,A,B,net:A-B,totalNet,totalGross,interestTotal,distTotal,growthForegone:A-distTotal-totalNet,start:rows[0].date,end:rows[rows.length-1].date,intMode,rate,baseCash0,sc};
}
function runUnits(basis){
  const start=F.tomStart,end=F.tomEnd;
  if(!start||!end||start>=end)return{error:'Set a valid period (start before end).'};
  const rows=F.prices.filter(r=>r.date>=start&&r.date<=end); if(rows.length<2)return{error:'Fewer than two pricing days in the period.'};
  const sched=effectiveSchedule(); if(!sched.length)return{error:'No contributions to model.'};
  const warnings=[]; const contribByIdx={}; let totalNet=0,totalGross=0;
  for(const c of sched){const idx=firstIdxOnOrAfter(rows,c.date);if(idx===-1){warnings.push(`Contribution on ${fmtDate(c.date)} is after the last pricing day — excluded.`);continue;}contribByIdx[idx]=(contribByIdx[idx]||0)+c.net;totalNet+=c.net;totalGross+=c.gross;}
  const dists=F.dists.filter(d=>d.ex&&d.cpu>0&&d.ex>=rows[0].date&&d.ex<=rows[rows.length-1].date).map(d=>{const exIdx=lastIdxOnOrBefore(rows,d.ex);let creditIdx=d.reinvest?firstIdxOnOrAfter(rows,d.reinvest):(exIdx+1<rows.length?exIdx+1:exIdx);if(creditIdx===-1)creditIdx=rows.length-1;return{...d,exIdx,creditIdx};});
  const openUnits=num('openUnits'),actualUnits=num('actualUnits');
  let units=openUnits; const pendingU={}; let distUnitsTotal=0,boughtUnits=0; const series=[],ledger=[];
  for(let i=0;i<rows.length;i++){
    const p=rows[i][basis],contrib=contribByIdx[i]||0,bought=contrib>0?contrib/p:0; units+=bought;boughtUnits+=bought;
    const du=pendingU[i]||0;units+=du;distUnitsTotal+=du;
    for(const d of dists){if(i===d.exIdx){const cash=units*d.cpu/100;const rp=d.price||rows[d.creditIdx][basis];const u=cash/rp;d.units=units;d.cash=cash;d.unitsCredited=u;pendingU[d.creditIdx]=(pendingU[d.creditIdx]||0)+u;}}
    series.push({date:rows[i].date,a:units*p,b:null,units}); ledger.push({date:rows[i].date,price:p,contrib,bought,distU:du,units,value:units*p});
  }
  const endPrice=rows[rows.length-1][basis],shortfall=units-actualUnits;
  return {kind:'units',rows,series,ledger,dists,warnings,A:units,B:actualUnits,shortfall,endPrice,loss:shortfall*endPrice,openUnits,boughtUnits,distUnitsTotal,totalNet,totalGross,start:rows[0].date,end:rows[rows.length-1].date};
}
function runSwitch(basis){
  const sellDate=F.swSell,buyDate=F.swBuy; if(!sellDate||!buyDate)return{error:'Set the sell and buy-back dates.'};
  const rows=F.prices; const sellIdx=firstIdxOnOrAfter(rows,sellDate),buyIdx=firstIdxOnOrAfter(rows,buyDate);
  if(sellIdx<0||buyIdx<0||buyIdx<sellIdx)return{error:'Sell/buy dates must be within the data, buy on or after sell.'};
  const Ssell=rows[sellIdx].sell,Bbuy=rows[buyIdx].buy; const amt=num('swAmt'),mode=F.swMode,rate=num('swRate');
  const unitsSold=mode==='units'?amt:amt/Ssell; const P=unitsSold*Ssell,gapDays=daysBetween(rows[sellIdx].date,rows[buyIdx].date);
  const interest=P*(rate/100)/365*gapDays,cashAtBuy=P+interest,unitsBack=cashAtBuy/Bbuy;
  let unitsNeverSold=unitsSold,distUnits=0;
  const distList=F.dists.filter(d=>d.ex&&d.cpu>0&&d.ex>rows[sellIdx].date&&d.ex<=rows[buyIdx].date);
  for(const d of distList){const cash=unitsNeverSold*d.cpu/100;const rp=d.price||rows[firstIdxOnOrAfter(rows,d.reinvest||d.ex)].buy;const u=cash/rp;unitsNeverSold+=u;distUnits+=u;}
  const valPrice=Bbuy,shortfall=unitsNeverSold-unitsBack,loss=shortfall*valPrice;
  const reentryCost=unitsSold*(Bbuy-Ssell),spreadAtSell=unitsSold*(rows[sellIdx].buy-rows[sellIdx].sell),distMissed=distUnits*valPrice,interestOffset=-interest;
  const series=[];
  for(let i=sellIdx;i<=buyIdx;i++){const p=rows[i][basis];const stayed=unitsSold*p;const accr=P*(rate/100)/365*daysBetween(rows[sellIdx].date,rows[i].date);const roundtrip=(i<buyIdx)?(P+accr):unitsBack*p;series.push({date:rows[i].date,a:stayed,b:roundtrip});}
  return {kind:'switch',rows:rows.slice(sellIdx,buyIdx+1),series,dists:[],warnings:[],sellIdx,buyIdx,Ssell,Bbuy,unitsSold,P,gapDays,interest,unitsBack,unitsNeverSold,shortfall,loss,valPrice,reentryCost,spreadAtSell,distMissed,interestOffset,distUnits,start:rows[sellIdx].date,end:rows[buyIdx].date,ledger:series.map((s,k)=>({date:s.date,price:rows[sellIdx+k][basis],stayed:s.a,roundtrip:s.b}))};
}
function runPhasing(basis){
  const start=F.tomStart,end=F.tomEnd; if(!start||!end||start>=end)return{error:'Set the day-1 and comparison dates.'};
  const win=F.prices.filter(r=>r.date>=start&&r.date<=end); if(win.length<2)return{error:'Fewer than two pricing days in the window.'};
  const lump=num('phLump'),rate=num('phRate'); const inst=F.phInst.length?F.phInst:[{date:start,amount:lump}];
  const instByIdx={}; for(const ins of inst){if(!ins.date||ins.amount<=0)continue;const i=firstIdxOnOrAfter(win,ins.date);if(i>=0)instByIdx[i]=(instByIdx[i]||0)+ins.amount;}
  const dists=F.dists.filter(d=>d.ex&&d.cpu>0&&d.ex>=win[0].date&&d.ex<=win[win.length-1].date).map(d=>{const exIdx=lastIdxOnOrBefore(win,d.ex);let creditIdx=firstIdxOnOrAfter(win,d.reinvest||d.ex);if(creditIdx<0)creditIdx=win.length-1;return{...d,exIdx,creditIdx};});
  const P0=win[0][basis]; let cfUnits=lump/P0,acUnits=0,cash=lump,accr=0; const pendCf={},pendAc={}; const series=[],ledger=[]; let prevDate=null;
  for(let i=0;i<win.length;i++){
    const p=win[i][basis];
    if(prevDate&&rate>0){accr+=cash*(rate/100)/365*daysBetween(prevDate,win[i].date);if(win[i].date.slice(0,7)!==prevDate.slice(0,7)){cash+=accr;accr=0;}}
    const inv=instByIdx[i]||0;const put=Math.min(inv,cash);let bought=0; if(put>0){bought=put/p;acUnits+=bought;cash-=put;}
    cfUnits+=pendCf[i]||0;acUnits+=pendAc[i]||0;
    for(const d of dists){if(i===d.exIdx){const rp=d.price||win[d.creditIdx][basis];pendCf[d.creditIdx]=(pendCf[d.creditIdx]||0)+(cfUnits*d.cpu/100)/rp;pendAc[d.creditIdx]=(pendAc[d.creditIdx]||0)+(acUnits*d.cpu/100)/rp;}}
    const acVal=acUnits*p+cash+accr; series.push({date:win[i].date,a:cfUnits*p,b:acVal}); ledger.push({date:win[i].date,price:p,invested:put,bought,cfUnits,acUnits,cash:cash+accr,cfVal:cfUnits*p,acVal}); prevDate=win[i].date;
  }
  const endP=win[win.length-1][basis]; const cfValue=cfUnits*endP,acValue=acUnits*endP+cash+accr;
  return {kind:'phasing',rows:win,series,ledger,dists:[],warnings:[],cfUnits,acUnits,cfValue,acValue,advantage:cfValue-acValue,endP,uninvested:cash+accr,lump,start:win[0].date,end:win[win.length-1].date};
}

/* file helpers — accept CSV/TSV text, Excel (.xlsx via SheetJS) and PDF (via pdf.js) */
function readFile(f,onText){
  if(/\.xlsx?$/i.test(f.name)||/\.xlsm$/i.test(f.name)){ readExcel(f,onText); return; }
  const rd=new FileReader(); rd.onload=()=>onText(rd.result); rd.readAsText(f);
}
function excelToTSV(ab){
  if(typeof XLSX==='undefined')return null;
  const wb=XLSX.read(ab,{type:'array',cellDates:true});
  let best=null,bestRows=0;
  for(const name of wb.SheetNames){ const ws=wb.Sheets[name]; const arr=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'dd mmm yyyy',blankrows:false}); if(arr.length>bestRows){bestRows=arr.length;best=arr;} }
  if(!best)return '';
  return best.map(r=>r.map(c=>c==null?'':String(c)).join('\t')).join('\n');
}
function readExcel(f,onText){
  if(typeof XLSX==='undefined'){ alert('The Excel reader (SheetJS) hasn’t loaded — check your connection, or paste the rows from Excel instead.'); return; }
  const rd=new FileReader(); rd.onload=()=>{ try{ const tsv=excelToTSV(new Uint8Array(rd.result)); onText(tsv); }catch(err){ alert('Could not read that Excel file: '+err.message+'. Try copy-pasting the rows instead.'); } }; rd.readAsArrayBuffer(f);
}

function handleCashTxText(t){

}

/* PDF account-statement reader — extract text, then best-effort scrape cash / investment / total balances */
async function readAccountPdf(f,which){
  if(typeof pdfjsLib==='undefined'){ alert('The PDF reader (pdf.js) hasn’t loaded — check your connection, or type the balances in manually.'); return; }
  try{
    const ab=await f.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); text+=' '+c.items.map(it=>it.str).join(' '); }
    const g=scrapeBalances(text);
    const pfx=which==='start'?'start':'end';
    if(g.cash!=null)F[pfx+'Cash']=String(g.cash);
    if(g.inv!=null)F[pfx+'Inv']=String(g.inv);
    if(g.cash==null&&g.inv==null&&g.total!=null&&g.inv==null){ /* only total found */ }
    render();
    const found=[g.cash!=null?'cash '+fmt$(g.cash):'',g.inv!=null?'investment '+fmt$(g.inv):'',g.total!=null?'total '+fmt$(g.total):''].filter(Boolean).join(', ');
    alert(found?`Read from ${f.name}:\n${found}\n\nCheck the figures below and edit if the statement layout confused the parser.`:`Couldn’t confidently read balances from ${f.name}. Please type them in below.`);
  }catch(err){ alert('Could not read that PDF: '+err.message+'. Please type the balances in manually.'); }
}
function scrapeBalances(text){
  const t=text.replace(/\s+/g,' ');
  const amt=s=>{ const m=String(s).replace(/[,$\s]/g,'').match(/-?\d+(?:\.\d+)?/); return m?parseFloat(m[0]):null; };
  // capture the first $ amount appearing shortly after a label keyword
  const near=(kw)=>{ const re=new RegExp(kw+'[^$\\d-]{0,40}(\\$?\\s?-?[\\d,]+(?:\\.\\d{2})?)','i'); const m=t.match(re); return m?amt(m[1]):null; };
  const cash=near('cash account balance')??near('cash balance')??near('cash holding')??near('\\bcash\\b');
  const inv=near('investment balance')??near('invested')??near('portfolio value')??near('managed funds')??near('market value')??near('investments');
  const total=near('total portfolio value')??near('total account value')??near('total balance')??near('total value')??near('account value')??near('portfolio total');
  return {cash,inv,total};
}
function balTotal(cashK,invK){ const c=parseNum(F[cashK]),i=parseNum(F[invK]); if(c==null&&i==null)return null; return (c||0)+(i||0); }
function loadSample(){
  const rows=[]; let p=1.60; let d=new Date('2025-04-01'); const end=new Date('2025-08-29'); let seed=42;
  const rand=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
  while(d<=end){const dow=d.getDay();if(dow!==0&&dow!==6){p=p*(1+(rand()-0.47)*0.012);rows.push({date:iso(d.getFullYear(),d.getMonth(),d.getDate()),buy:+p.toFixed(4),sell:+(p*0.9994).toFixed(4),nav:+(p*0.9997).toFixed(4)});}d.setDate(d.getDate()+1);}
  setPrices(rows);
  F.dists=[{ex:'2025-06-30',cpu:1.9694,reinvest:'2025-07-01',price:rows.find(r=>r.date>='2025-07-01').buy}];
  if(!F.clientName)F.clientName='Sample Client'; if(!F.fundName)F.fundName='Sample Growth Fund (synthetic prices)';
  if(!F.startCash)F.startCash='5271.93'; if(!F.startInv)F.startInv='157871.10';
  if(F.scenario==='contribCash'||F.scenario==='feeDrag'){F.sched=[];genSchedule();return;}
  if(F.scenario==='phasing'){genPhasing();return;}
  render();
}

/* ================= UNDO / REDO / RESET ================= */
const __undo={stack:[],redo:[],last:'',restoring:false,cap:50};
function __snap(){ try{return JSON.stringify(F);}catch(_){return'';} }
function recordUndo(){ if(__undo.restoring)return; const s=__snap(); if(!s||s===__undo.last)return; if(__undo.last){__undo.stack.push(__undo.last);if(__undo.stack.length>__undo.cap)__undo.stack.shift();__undo.redo.length=0;} __undo.last=s; }
function __apply(s){ __undo.restoring=true; try{F=JSON.parse(s);applyTheme();render();}catch(_){}__undo.restoring=false; }
function undoAction(){ if(!__undo.stack.length)return; const prev=__undo.stack.pop(); __undo.redo.push(__undo.last); __undo.last=prev; __apply(prev); }
function redoAction(){ if(!__undo.redo.length)return; const nxt=__undo.redo.pop(); __undo.stack.push(__undo.last); __undo.last=nxt; __apply(nxt); }
function confirmResetAll(){

  return `<div class="grid g2">

    <div class="hint" style="margin-top:8px">Distributions are computed as <em>units held at the ex-date × CPU</em> and credited on the reinvest date, so they compound into later ex-dates.</div>`;
}
function body_setup(){

    <div class="grid g2" style="margin-bottom:4px">
      <label class="import-btn btn-sm" style="justify-content:center" title="Upload the account statement/valuation PDF for the START of the period">📄 Upload start-of-period statement (PDF)<input type="file" id="pdfStart" accept=".pdf" style="display:none"></label>
      <div style="align-self:center;font-size:11px;color:var(--text-muted)">Upload the PDF to auto-fill, or type the figures below (both work; the parser fills what it can find and you confirm).</div>

    </div>
    <h3 style="font-family:var(--hf);color:var(--heading);margin:16px 0 8px">End of period — ${F.tomEnd?fmtDate(F.tomEnd):'(set the end date)'}</h3>
    <div class="grid g2" style="margin-bottom:4px">
      <label class="import-btn btn-sm" style="justify-content:center" title="Upload the account statement/valuation PDF for the END of the period">📄 Upload end-of-period statement (PDF)<input type="file" id="pdfEnd" accept=".pdf" style="display:none"></label>
      <div></div>
    </div>
    <div class="grid g3">
      ${fld('Cash balance ($)',inp('endCash','number','step="0.01" min="0"'))}

    <table class="data sched-table" style="margin-top:6px"><thead><tr><th>Date</th><th>Type</th><th>Gross $</th><th>Net invested $</th><th>Include</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table>

      <span class="hint" style="margin:0">One-off deposits invest in full. Contributions on a non-pricing day move to the next pricing day. Untick “Include” for contributions invested correctly.</span></div>`;

function body_interest(){
  const base=parseNum(F.startCash);
  const off=F.intMode==='none'?0:F.intCredits.reduce((a,b)=>a+(parseNum(b.amount)||0),0);
  const credRows=F.intCredits.map((r,i)=>`<tr>
      <td><input type="date" value="${e(r.date)}" onchange="F.intCredits[${i}].date=this.value;render()"></td>
      <td><input type="number" step="0.01" value="${e(r.amount)}" onchange="F.intCredits[${i}].amount=parseNum(this.value)||0;render()"></td>
      <td class="no-print"><button class="btn btn-xs btn-ghost" onclick="F.intCredits.splice(${i},1);render()">✕</button></td></tr>`).join('');
  let h=`<div class="info">The cash-interest offset is <strong>inferred from the actual cash-transactions report</strong> — the interest the account genuinely paid. Because the contributions sat in cash, the balance was higher than it would have been if invested, so the client earned <em>more</em> interest than the counterfactual. Each credit is apportioned pro-rata between the ${base!=null?fmt$(base)+' ':''}base cash (which earns its interest either way) and the uninvested contributions; only the contributions’ share is the offset.</div>
    <div class="grid g2" style="margin:4px 0 2px">
      <label class="import-btn btn-blue btn-sm" style="justify-content:center" title="Upload the cash-account transactions export — the calculator picks out the interest credits">⬆ Upload cash transactions (Excel / CSV)<input type="file" id="cashTxFile" accept=".xlsx,.xlsm,.xls,.csv,.txt,.tsv" style="display:none"></label>
      <div style="align-self:center">${fld('Or paste the transactions',`<textarea id="cashTxPaste" rows="2" placeholder="Date&#9;Description&#9;Credit&#9;Debit&#10;01 May 2025&#9;Interest&#9;4.29&#9;"></textarea>`)}<button class="btn btn-sm" onclick="handleCashTxText($('cashTxPaste').value)">Parse pasted transactions</button></div>
    </div>`;
  h+=`<div class="grid g2" style="margin-top:6px">
      <div>
        <div class="field"><label>Interest credits used as the offset (total ${fmt$(off)})</label></div>
        <table class="data sched-table" style="max-width:420px"><thead><tr><th>Credit date</th><th>Amount $</th><th class="no-print"></th></tr></thead><tbody>${credRows||'<tr><td colspan="3" style="color:var(--text-muted)">None yet — upload the transactions report above.</td></tr>'}</tbody></table>
        <div class="row" style="margin-top:6px"><button class="btn btn-sm" onclick="F.intCredits.push({date:'',amount:0});render()">+ Add credit manually</button>
          <button class="btn btn-sm btn-ghost" onclick="F.intMode='${F.intMode==='none'?'actual':'none'}';render()">${F.intMode==='none'?'Enable offset':'Ignore interest'}</button></div>
      </div>
      <div>${cashTxSummary()}</div>
    </div>`;
  return h;
}
function cashTxSummary(){
  if(!F.cashTx.length)return `<div class="hint">No transactions loaded yet. The report typically has Date, Description and Credit/Debit (or a signed Amount) columns — the parser categorises each line and pulls the interest credits automatically.</div>`;
  const cats={}; for(const t of F.cashTx){cats[t.cat]=(cats[t.cat]||0)+t.amount;}
  const order=['interest','contribution','fee','investment','redemption','other'];
  const chip=c=>cats[c]!=null?`<tr><td style="text-transform:capitalize">${c}</td><td>${fmt$(cats[c])}</td><td style="color:var(--text-muted)">${F.cashTx.filter(t=>t.cat===c).length}</td></tr>`:'';
  return `<div class="field"><label>Loaded transactions — ${F.cashTx.length} rows, categorised</label></div>
    <table class="data"><thead><tr><th>Category</th><th>Net $</th><th># </th></tr></thead><tbody>${order.map(chip).join('')}</tbody></table>
    <details style="margin-top:6px"><summary style="font-size:11px">Show all transactions</summary><div class="ledger-wrap" style="max-height:220px;margin-top:6px"><table class="data"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead><tbody>${F.cashTx.map((t,i)=>`<tr><td>${fmtDate(t.date)}</td><td style="text-align:left;max-width:180px;overflow:hidden;text-overflow:ellipsis">${e(t.desc)}</td><td><select onchange="F.cashTx[${i}].cat=this.value;syncInterestFromTx();render()" style="font-size:11px;padding:2px 4px">${['interest','contribution','fee','investment','redemption','other'].map(c=>`<option ${t.cat===c?'selected':''}>${c}</option>`).join('')}</select></td><td>${fmt$(t.amount)}</td></tr>`).join('')}</tbody></table></div></details>`;
}
function syncInterestFromTx(){ const interest=F.cashTx.filter(r=>r.cat==='interest'&&r.amount>0).map(r=>({date:r.date,amount:+r.amount.toFixed(2)})); F.intCredits=interest; if(interest.length)F.intMode='actual'; }
function body_lump(){

function body_holdings(){

/* ---- results step ---- */
function body_results(){
  const R=state.result;
  if(!R||R.error){ return `<div class="warn">${e(R&&R.error&&R.error!=='no prices'?R.error:'Complete the earlier steps (load prices and fill the inputs) to see a result.')}</div>`; }
  let cards='',bw='';
  if(R.kind==='cash'){
    const sign=R.net>=0?'neg':'pos'; const bLabel=R.sc==='lumpCash'?`${fmt$(R.totalNet)} lump + ${fmt$(R.interestTotal)} interest`:`${fmt$(R.totalNet)} contributions + ${fmt$(R.interestTotal)} interest`;
    cards=`<div class="stat"><div class="lbl">A · Counterfactual (invested)</div><div class="val">${fmt$(R.A)}</div><div class="sub2">invested on receipt, distributions reinvested</div></div>
      <div class="stat"><div class="lbl">B · Actual (sat in cash)</div><div class="val">${fmt$(R.B)}</div><div class="sub2">${bLabel}</div></div>
      <div class="stat hero-stat"><div class="lbl">Net opportunity cost (A − B)</div><div class="val ${sign}">${fmt$(R.net)}</div><div class="sub2">${fmtDate(R.start)} – ${fmtDate(R.end)} · ${R.basis.toUpperCase()} basis</div></div>`;
    bw=`<table class="data" style="max-width:560px"><tr><td>Market growth foregone (excl. distributions)</td><td>${fmt$(R.growthForegone)}</td></tr>
      <tr><td>Missed distributions on the counterfactual units</td><td>${fmt$(R.distTotal)}</td></tr>
      <tr><td>Less: interest earned on the idle cash${R.intMode==='actual'?' (apportioned)':''}</td><td>${fmt$(-R.interestTotal)}</td></tr>
      <tr><th>Net opportunity cost</th><th>${fmt$(R.net)}</th></tr></table>`;
  } else if(R.kind==='units'){
    const sign=R.loss>=0?'neg':'pos';
    cards=`<div class="stat"><div class="lbl">A · Counterfactual units</div><div class="val">${fmtU(R.A)}</div><div class="sub2">${fmtU(R.openUnits)} opening + ${fmtU(R.boughtUnits)} bought + ${fmtU(R.distUnitsTotal)} dist</div></div>
      <div class="stat"><div class="lbl">B · Actual units held</div><div class="val">${fmtU(R.B)}</div><div class="sub2">at ${fmtDate(R.end)}</div></div>
      <div class="stat hero-stat"><div class="lbl">Opportunity loss</div><div class="val ${sign}">${fmt$(R.loss)}</div><div class="sub2">${fmtU(R.shortfall)} shortfall × ${fmt$(R.endPrice,4)}</div></div>`;
  } else if(R.kind==='switch'){
    const sign=R.loss>=0?'neg':'pos';
    cards=`<div class="stat"><div class="lbl">If never sold</div><div class="val">${fmtU(R.unitsNeverSold)}</div><div class="sub2">${R.gapDays} days out · sold @ ${fmt$(R.Ssell,4)}, back @ ${fmt$(R.Bbuy,4)}</div></div>
      <div class="stat"><div class="lbl">After the round trip</div><div class="val">${fmtU(R.unitsBack)}</div><div class="sub2">${fmt$(R.P)} proceeds${R.interest?` + ${fmt$(R.interest)} int`:''} ÷ Buy</div></div>
      <div class="stat hero-stat"><div class="lbl">Opportunity loss</div><div class="val ${sign}">${fmt$(R.loss)}</div><div class="sub2">${fmtU(R.shortfall)} shortfall × ${fmt$(R.valPrice,4)}</div></div>`;
    bw=`<table class="data" style="max-width:560px"><tr><td>Re-entry cost — sold at ${fmt$(R.Ssell,4)}, bought at ${fmt$(R.Bbuy,4)} (spread + drift)</td><td>${fmt$(R.reentryCost)}</td></tr>
      <tr><td>Distribution missed while in cash</td><td>${fmt$(R.distMissed)}</td></tr>
      <tr><td>Less: interest earned in cash</td><td>${fmt$(R.interestOffset)}</td></tr>
      <tr><th>Opportunity loss</th><th>${fmt$(R.loss)}</th></tr></table>
      <div class="hint">The pure bid-ask spread at the sell date alone is ${fmt$(R.spreadAtSell)} — the rest is market drift over the ${R.gapDays}-day gap.</div>`;
  } else {
    const sign=R.advantage>=0?'pos':'neg'; const verdict=R.advantage>=0?'Lump-sum would have won':'Phasing would have won';
    cards=`<div class="stat"><div class="lbl">Lump sum invested day 1</div><div class="val">${fmt$(R.cfValue)}</div><div class="sub2">${fmtU(R.cfUnits)} units</div></div>
      <div class="stat"><div class="lbl">Phased in (actual)</div><div class="val">${fmt$(R.acValue)}</div><div class="sub2">${fmtU(R.acUnits)} units + ${fmt$(R.uninvested)} cash</div></div>
      <div class="stat hero-stat"><div class="lbl">Lump-sum advantage</div><div class="val ${sign}">${fmt$(R.advantage)}</div><div class="sub2">${verdict}</div></div>`;
  }
  if(R.warnings&&R.warnings.length)bw+=`<div class="warn">${R.warnings.map(w=>'• '+e(w)).join('<br>')}</div>`;
  if(R.dists&&R.dists.length)bw+=`<div class="hint" style="margin-top:8px">Distributions modelled: ${R.dists.map(d=>`${fmtDate(d.ex)} @ ${d.cpu} c/u → ${R.kind==='cash'?fmt$(d.cash||0):(fmtU(d.unitsCredited||0)+' units')} credited ${fmtDate(R.rows[d.creditIdx].date)}`).join(' · ')}</div>`;

  return `<div class="cards">${cards}</div>${bw}
    <h3 style="margin-top:16px;font-family:var(--hf);color:var(--heading)">${chartTitle(R)}</h3>
    <div class="chartbox" id="chartbox"><svg id="chart" role="img" aria-label="Counterfactual vs actual over the period"></svg><div class="tooltip" id="tooltip"></div></div>
    <div class="legend" id="legend"></div>
    <div class="row no-print" style="margin-top:12px"><button class="btn btn-sm" onclick="csvExport()">Download ledger CSV</button><button class="btn btn-sm" onclick="window.print()">Print / save PDF</button></div>
    <details style="margin-top:14px"><summary>Daily ledger</summary><div class="ledger-wrap">${ledgerHTML(R)}</div></details>
    <details style="margin-top:8px" open><summary>Methodology &amp; assumptions</summary><div class="meth">${methHTML(R)}</div></details>`;
}
function chartTitle(R){ return {cash:'Counterfactual invested value vs actual cash balance',units:'Counterfactual portfolio value (units × price)',switch:'Staying invested vs selling to cash and buying back',phasing:'Lump sum (day 1) vs phased entry'}[R.kind]; }
function ledgerHTML(R){
  const pct=v=>v==null?'':(v*100).toFixed(3)+'%';
  if(R.kind==='cash')return `<table class="data"><thead><tr><th>Date</th><th>${R.basis.toUpperCase()} $</th><th>Return</th><th>Contribution</th><th>Dist credit</th><th>Counterfactual $</th><th>Interest</th><th>Actual cash $</th></tr></thead><tbody>${R.ledger.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${l.price.toFixed(4)}</td><td>${pct(l.ret)}</td><td>${l.contrib?fmt$(l.contrib):''}</td><td>${l.distCredit?fmt$(l.distCredit):''}</td><td>${fmt$(l.cf)}</td><td>${l.int?fmt$(l.int):''}</td><td>${fmt$(l.actual)}</td></tr>`).join('')}</tbody></table>`;
  if(R.kind==='units')return `<table class="data"><thead><tr><th>Date</th><th>${R.basis.toUpperCase()} $</th><th>Contribution</th><th>Units bought</th><th>Dist units</th><th>Cumulative units</th><th>Value $</th></tr></thead><tbody>${R.ledger.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${l.price.toFixed(4)}</td><td>${l.contrib?fmt$(l.contrib):''}</td><td>${l.bought?fmtU(l.bought):''}</td><td>${l.distU?fmtU(l.distU):''}</td><td>${fmtU(l.units)}</td><td>${fmt$(l.value)}</td></tr>`).join('')}</tbody></table>`;
  if(R.kind==='switch')return `<table class="data"><thead><tr><th>Date</th><th>${R.basis.toUpperCase()} $</th><th>Stayed invested $</th><th>Round-trip $</th></tr></thead><tbody>${R.ledger.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${l.price.toFixed(4)}</td><td>${fmt$(l.stayed)}</td><td>${fmt$(l.roundtrip)}</td></tr>`).join('')}</tbody></table>`;
  return `<table class="data"><thead><tr><th>Date</th><th>${R.basis.toUpperCase()} $</th><th>Invested</th><th>Lump units</th><th>Phased units</th><th>Cash</th><th>Lump $</th><th>Phased $</th></tr></thead><tbody>${R.ledger.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${l.price.toFixed(4)}</td><td>${l.invested?fmt$(l.invested):''}</td><td>${fmtU(l.cfUnits)}</td><td>${fmtU(l.acUnits)}</td><td>${fmt$(l.cash)}</td><td>${fmt$(l.cfVal)}</td><td>${fmt$(l.acVal)}</td></tr>`).join('')}</tbody></table>`;
}
function methHTML(R){
  const client=F.clientName||'(client)',fund=F.fundName||'(fund)',today=new Date().toISOString().slice(0,10);
  const feeOn=F.feeOn==='yes';
  const feeTxt=feeOn?`The adviser fee of ${fmt$(num('advFee'))}/contribution${num('adminFee')>0?` plus ${fmt$(num('adminFee'))} admin/platform charges`:''} is debited from the contributions, so the counterfactual invests the NET amount; the fees are payable in both scenarios and are not recoverable.`:`No advice fee is deducted — the full amount is modelled as investable.`;
  let core='';
  if(R.kind==='cash'){
    const intTxt={none:'No interest is credited on the idle cash.',rate:`Interest is accrued daily at ${(R.rate*100).toFixed(2)}% p.a. on the idle balance and credited monthly (total ${fmt$(R.interestTotal)}); interest on any pre-existing base cash is earned in both scenarios and cancels out.`,actual:`Actual interest credits are apportioned to the idle money pro-rata by balance share before each credit (base cash at start ${fmt$(R.baseCash0)}); the apportioned ${fmt$(R.interestTotal)} is the valid offset.`}[R.intMode];
    core=`<p><strong>Counterfactual (A):</strong> ${R.sc==='lumpCash'?'the lump sum is':'each net contribution is'} invested on ${R.sc==='lumpCash'?'the start date':'its date'}; daily returns use the ${R.basis.toUpperCase()} price. Value<sub>t</sub> = (Value<sub>t−1</sub> + Contribution<sub>t</sub>)×(1+r<sub>t</sub>) + DistributionCredit<sub>t</sub>. A = ${fmt$(R.A)}.</p>
      <p><strong>Actual (B):</strong> the money sat in cash. ${intTxt} B = ${fmt$(R.B)}.</p>
      <p><strong>Net opportunity cost (A − B) = ${fmt$(R.net)}</strong> = growth foregone ${fmt$(R.growthForegone)} + missed distributions ${fmt$(R.distTotal)} − interest earned ${fmt$(R.interestTotal)}.</p>`;
  } else if(R.kind==='units'){
    core=`<p><strong>Counterfactual (A):</strong> from ${fmtU(R.openUnits)} opening units, the net contribution buys units at each date's ${R.basis.toUpperCase()} price; distributions compound into later ex-dates. A = ${fmtU(R.A)} units.</p>
      <p><strong>Actual (B):</strong> ${fmtU(R.B)} units held at ${fmtDate(R.end)} per platform valuation.</p>
      <p><strong>Opportunity loss = ${fmtU(R.shortfall)} × ${fmt$(R.endPrice,4)} = ${fmt$(R.loss)}</strong>, excluding fees (payable either way).</p>`;
  } else if(R.kind==='switch'){
    core=`<p><strong>Round trip:</strong> ${fmtU(R.unitsSold)} units sold at the ${fmtDate(R.start)} Sell price ${fmt$(R.Ssell,4)} → ${fmt$(R.P)} cash${R.interest?` (earning ${fmt$(R.interest)} over ${R.gapDays} days)`:''}, bought back at the ${fmtDate(R.end)} Buy price ${fmt$(R.Bbuy,4)} → ${fmtU(R.unitsBack)} units.</p>
      <p><strong>Never sold</strong> = ${fmtU(R.unitsNeverSold)} units. Shortfall ${fmtU(R.shortfall)} × ${fmt$(R.valPrice,4)} = <strong>${fmt$(R.loss)}</strong> = re-entry cost ${fmt$(R.reentryCost)} + missed distribution ${fmt$(R.distMissed)} − interest ${fmt$(R.interest)}.</p>`;
  } else {
    core=`<p><strong>Lump sum:</strong> ${fmt$(R.lump)} invested in full on ${fmtDate(R.start)} → ${fmtU(R.cfUnits)} units → ${fmt$(R.cfValue)} at ${fmtDate(R.end)}.</p>
      <p><strong>Phased:</strong> the same ${fmt$(R.lump)} drip-fed in ${F.phInst.length} instalment(s), remainder in cash → ${fmtU(R.acUnits)} units + ${fmt$(R.uninvested)} cash → ${fmt$(R.acValue)}.</p>
      <p><strong>Lump-sum advantage = ${fmt$(R.advantage)}.</strong> Positive means investing at once beat phasing over this window.</p>`;
  }
  return `<p><strong>${e(client)}</strong> · ${e(fund)} · ${fmtDate(R.start)} – ${fmtDate(R.end)} · ${R.rows.length} pricing days · prepared ${fmtDate(today)}</p>
    <p><strong>Scenario:</strong> ${e(SCEN[R.scenario].full)}</p>
    ${(R.kind==='cash'||R.kind==='units')?`<p><strong>Fees:</strong> ${feeTxt}</p>`:''}
    ${core}
    <p><strong>Assumptions &amp; limitations:</strong> same-day investment with no processing lag; contributions on non-pricing days move to the next pricing day; ${R.basis.toUpperCase()}-price basis is a stated convention (Sell/NAV would change the result immaterially); distributions assumed reinvested; tax ignored on both sides; fund management costs are embedded in unit prices; adviser/platform fees are only ever modelled as reductions of the investable amount, never as recoverable.</p>`;
}

/* ================= CHART ================= */
function drawChart(){
  const R=state.result; if(!R||R.error)return; const box=$('chartbox'),svg=$('chart'); if(!box||!svg)return;
  const W=Math.max(560,box.clientWidth-24||900),H=340,m={t:16,r:120,b:34,l:70};
  const iw=W-m.l-m.r,ih=H-m.t-m.b,two=R.twoSeries;
  const ys=R.series.map(s=>s.a).concat(two?R.series.map(s=>s.b):[]); const ymin=0,ymax=Math.max(...ys)*1.06||1,n=R.series.length;
  const x=i=>m.l+(n<=1?0:i/(n-1)*iw),y=v=>m.t+ih-(v-ymin)/(ymax-ymin)*ih;
  const css=getComputedStyle(document.documentElement);
  const c1=css.getPropertyValue('--series-1').trim(),c2=css.getPropertyValue('--series-2').trim(),grid=css.getPropertyValue('--border').trim(),tmut=css.getPropertyValue('--text-muted').trim(),tsec=css.getPropertyValue('--text-dim').trim(),cardc=css.getPropertyValue('--surface').trim();
  const labels={cash:['Counterfactual','Actual'],switch:['Stayed invested','Round trip'],phasing:['Lump sum','Phased'],units:['Counterfactual','Actual (end)']}[R.kind];
  let el='<g>'; const steps=4;
  for(let k=0;k<=steps;k++){const v=ymin+(ymax-ymin)*k/steps;el+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="${grid}" stroke-width="1"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="${tmut}">$${Math.round(v).toLocaleString()}</text>`;}
  const ticks=Math.min(6,n);
  for(let k=0;k<ticks;k++){const i=Math.round(k*(n-1)/(ticks-1||1));el+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="${tmut}">${fmtDate(R.series[i].date).slice(0,6)}</text>`;}
  const path=key=>R.series.map((s,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(s[key]).toFixed(1)).join('');
  if(two)el+=`<path d="${path('b')}" fill="none" stroke="${c2}" stroke-width="2" stroke-linejoin="round"/>`;
  el+=`<path d="${path('a')}" fill="none" stroke="${c1}" stroke-width="2" stroke-linejoin="round"/>`;
  const li=n-1;
  el+=`<text x="${x(li)+6}" y="${y(R.series[li].a)+4}" font-size="12" font-weight="700" fill="${tsec}">${labels[0]}</text>`;
  if(two){let yb=y(R.series[li].b);if(Math.abs(yb-y(R.series[li].a))<16)yb=y(R.series[li].a)+(yb>=y(R.series[li].a)?16:-16);el+=`<text x="${x(li)+6}" y="${yb+4}" font-size="12" font-weight="700" fill="${tsec}">${labels[1]}</text>`;}
  else{const ep=R.B*R.endPrice;el+=`<circle cx="${x(li)}" cy="${y(ep)}" r="5" fill="${c2}" stroke="${cardc}" stroke-width="2"/><text x="${x(li)+6}" y="${y(ep)+20}" font-size="12" font-weight="700" fill="${tsec}">${labels[1]}</text>`;}
  el+=`<line id="xhair" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="${tmut}" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  el+=`<circle id="dotA" r="4.5" fill="${c1}" stroke="${cardc}" stroke-width="2" visibility="hidden"/>`;
  if(two)el+=`<circle id="dotB" r="4.5" fill="${c2}" stroke="${cardc}" stroke-width="2" visibility="hidden"/>`;
  el+=`<rect id="hover" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></g>`;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=el;
  $('legend').innerHTML=`<span><span class="sw" style="background:${c1}"></span>${labels[0]}</span><span><span class="sw" style="background:${c2}"></span>${labels[1]}</span>`;
  const tt=$('tooltip'),hover=svg.querySelector('#hover'),xh=svg.querySelector('#xhair'),dA=svg.querySelector('#dotA'),dB=svg.querySelector('#dotB');
  hover.addEventListener('mousemove',ev=>{
    const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const sp=pt.matrixTransform(svg.getScreenCTM().inverse());
    const i=Math.max(0,Math.min(n-1,Math.round((sp.x-m.l)/(iw||1)*(n-1))));const s=R.series[i];
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
    dA.setAttribute('cx',x(i));dA.setAttribute('cy',y(s.a));dA.setAttribute('visibility','visible');
    if(dB){dB.setAttribute('cx',x(i));dB.setAttribute('cy',y(s.b));dB.setAttribute('visibility','visible');}
    let html=`<div class="tt-date">${fmtDate(s.date)}</div><div class="tt-row"><span><span class="sw" style="background:${c1}"></span>${labels[0]}</span><strong>${fmt$(s.a)}</strong></div>`;
    if(two)html+=`<div class="tt-row"><span><span class="sw" style="background:${c2}"></span>${labels[1]}</span><strong>${fmt$(s.b)}</strong></div><div class="tt-row" style="margin-top:3px;border-top:1px solid var(--border);padding-top:3px"><span>Gap</span><strong>${fmt$(s.a-s.b)}</strong></div>`;
    else html+=`<div class="tt-row"><span>Units</span><strong>${fmtU(s.units)}</strong></div>`;
    tt.innerHTML=html;tt.style.display='block';
    const bb=box.getBoundingClientRect();let lx=ev.clientX-bb.left+16;if(lx+220>bb.width)lx=ev.clientX-bb.left-230;tt.style.left=lx+'px';tt.style.top=(ev.clientY-bb.top-20)+'px';
  });
  hover.addEventListener('mouseleave',()=>{tt.style.display='none';xh.setAttribute('visibility','hidden');dA.setAttribute('visibility','hidden');if(dB)dB.setAttribute('visibility','hidden');});
}

/* ================= MAIN RENDER ================= */
function render(){
  recordUndo(); saveDraftSoon();
  const ae=document.activeElement; let fk=null,selS=null,selE=null;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.dataset&&ae.dataset.fk){ fk=ae.dataset.fk; try{selS=ae.selectionStart;selE=ae.selectionEnd;}catch(_){} }
  let html=renderTopbar();
  html += state.page==='picker' ? renderPicker() : renderWizard();
  $('app').innerHTML=html;
  // wire drops on the relevant step
  wireDropIfPresent('priceDrop','priceFile',handlePriceText);
  wireDropIfPresent('distDrop','distFile',handleDistText);
  const ps=$('pdfStart'); if(ps)ps.addEventListener('change',ev=>{if(ev.target.files[0])readAccountPdf(ev.target.files[0],'start');});
  const pe=$('pdfEnd'); if(pe)pe.addEventListener('change',ev=>{if(ev.target.files[0])readAccountPdf(ev.target.files[0],'end');});
  const ct=$('cashTxFile'); if(ct)ct.addEventListener('change',ev=>{if(ev.target.files[0])readFile(ev.target.files[0],handleCashTxText);});
  if(state.needChart&&$('chart')){ drawChart(); state.needChart=false; }
  // restore focus/caret
  if(fk){ const el=document.querySelector(`[data-fk="${fk}"]`); if(el){ el.focus(); try{if(selS!=null)el.setSelectionRange(selS,selE);}catch(_){} } }
}
function wireDropIfPresent(dropId,fileId,onText){
  const drop=$(dropId),file=$(fileId); if(!drop||!file)return;
  drop.addEventListener('click',()=>file.click());
  drop.addEventListener('dragover',ev=>{ev.preventDefault();drop.classList.add('over');});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',ev=>{ev.preventDefault();drop.classList.remove('over');if(ev.dataTransfer.files[0])readFile(ev.dataTransfer.files[0],onText);});
  file.addEventListener('change',ev=>{if(ev.target.files[0])readFile(ev.target.files[0],onText);});
}

/* keyboard shortcuts */
document.addEventListener('keydown',ev=>{
  const t=ev.target,tag=(t&&t.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable))return;
  const k=(ev.key||'').toLowerCase();
  if((ev.ctrlKey||ev.metaKey)&&!ev.shiftKey&&k==='z'){ev.preventDefault();undoAction();}
  else if(((ev.ctrlKey||ev.metaKey)&&k==='y')||((ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&k==='z')){ev.preventDefault();redoAction();}
});

/* ================= INIT ================= */
(function init(){
  try{ const t=localStorage.getItem('tom_theme'); if(t)F.theme=t; }catch(_){}
  applyTheme();
  try{
    const raw=localStorage.getItem(DRAFT_KEY);
    if(raw){ const d=JSON.parse(raw); if(d&&d.F&&(d.F.prices&&d.F.prices.length || (d.F.clientName||'').trim())){
      if(confirm('Restore your previous Time Out of Market working draft in this tab?')){ F=Object.assign(DEFAULTS(),d.F); state.page=d.page||'picker'; state.wizardStep=d.wizardStep||0; applyTheme(); }
    } }
  }catch(_){}
  __undo.last=__snap();
  render();
})();
</script>
