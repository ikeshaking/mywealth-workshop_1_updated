<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MyWealth Solutions — Professional Year Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.cdnfonts.com/css/abc-arizona-flare');
@import url('https://fonts.cdnfonts.com/css/abc-arizona-serif');

/* ============================================================
   DESIGN TOKENS — MyWealth Brand
============================================================ */
:root{
  --bg:#eef2f6;
  --surface:#ffffff;
  --surface-2:#eef3f8;
  --row-alt:#f1f5fa;
  --input-bg:#f7fafd;
  --border:#d4dde7;
  --border-soft:#e6edf4;
  --border-strong:#c4d0dc;
  --navy:#0C2E3F;
  --navy-deep:#0a2433;
  /* App chrome (header band, hero) — stays deep navy in BOTH themes, matching the ROA generator. */
  --chrome:#0C2E3F;
  --chrome-deep:#0a2433;
  --heading:#0C2E3F;
  --blue:#2B6FD6;
  --blue-bright:#3B82E6;
  --blue-light:#e8f1fb;
  --blue-soft:#7fb0ef;
  --blue-link:#2B6FD6;
  --coral:#F56A5A;
  --coral-light:#fdeeec;
  --lime:#CFE87F;
  --lime-dark:#4a6a10;
  --lime-light:#f1f7df;
  --text:#16242e;
  --text-dim:#42586a;
  --text-muted:#5c6b78;
  --text-faint:#9aa6b2;
  --green:#27ae60;
  --green-light:#e8f5e9;
  --green-dark:#2e7d32;
  --red:#d63031;
  --red-light:#fdeaea;
  --amber:#b8860b;
  --amber-light:#fef6e0;
  --purple:#6d28d9;
  --purple-light:#f3edff;
  --teal:#E5F4F6;
  --hf:'ABC Arizona Flare','ABC Arizona Serif','Playfair Display','Georgia',serif;
  --bf:'Nunito Sans','Nunito',-apple-system,BlinkMacSystemFont,sans-serif;
  --shadow-sm:0 1px 2px rgba(12,46,63,.04);
  --shadow:0 2px 6px rgba(12,46,63,.06);
  --shadow-md:0 4px 12px rgba(12,46,63,.08);
  --shadow-lg:0 8px 24px rgba(12,46,63,.08);
  color-scheme:light;
}

/* NIGHT MODE — lifted from the ROA generator: light steel-navy page and cards,
   soft pastel-blue accents, lime active pills, gold entered-field values. */
html[data-theme="dark"]{
  --bg:#1C394E;
  --surface:#224A68;
  --surface-2:#2A5379;
  --row-alt:#27506F;
  --input-bg:#2F4A45;
  --border:#345a7b;
  --border-soft:#2c4f6e;
  --border-strong:#456a88;
  /* Chrome stays a deep steel-navy so the header band reads the same in both themes. */
  --chrome:#15293c;
  --chrome-deep:#2c4964;
  /* Navy text/fill tokens kept in the readable mid/light-blue band for dark surfaces. */
  --navy:#4a8cc9;
  --navy-deep:#7fb0de;
  --heading:#f1f6fb;
  --blue:#8fbdf0;
  --blue-bright:#a9d0fb;
  --blue-light:#284f72;
  --blue-soft:#3d6585;
  --blue-link:#8fbdf0;
  --coral:#ff7a68;
  --coral-light:#5a2420;
  --lime:#CCE185;
  --lime-dark:#CCE185;
  --lime-light:#33401c;
  --field-value:#F9D949;
  --text:#eef4fa;
  --text-dim:#cfdce7;
  --text-muted:#bccfdf;
  --text-faint:#a6bece;
  --green:#5bb55b;
  --green-light:#1f3d33;
  --green-dark:#8fd08f;
  --red:#f1707a;
  --red-light:#3f2024;
  --amber:#e6b34d;
  --amber-light:#3a3320;
  --purple:#a78bfa;
  --purple-light:#2e1f52;
  --teal:#2A5379;
  --shadow-sm:0 1px 2px rgba(6,16,26,.22);
  --shadow:0 2px 6px rgba(6,16,26,.26);
  --shadow-md:0 4px 12px rgba(6,16,26,.3);
  --shadow-lg:0 8px 24px rgba(6,16,26,.38);
  color-scheme:dark;
}
/* Dark-mode legibility: readable placeholders and clearer form-control edges. */
html[data-theme="dark"] ::placeholder{color:#8fa8ba;opacity:1}
html[data-theme="dark"] input,
html[data-theme="dark"] textarea,
html[data-theme="dark"] select{border-color:#436788}
html[data-theme="dark"] input[type="date"]{color:var(--text)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--bf);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4,h5,h6{font-family:var(--hf)!important;color:var(--text);margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:600;line-height:1.1}
h2{font-size:20px;font-weight:600;line-height:1.2}
h3{font-size:15px;font-weight:700;line-height:1.3}
h4{font-size:13px;font-weight:700}
p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* ============================================================
   APP SHELL
============================================================ */
#app{min-height:100vh;display:flex;flex-direction:column}

.topbar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  padding:10px 18px;background:var(--chrome);border-bottom:1px solid var(--chrome-deep);
  position:sticky;top:0;z-index:50;
}
.top-actions{min-width:0}
.brand{display:flex;align-items:center;cursor:pointer}
.brand-stack{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--hf)!important;font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em}
.brand-solutions{font-size:7px;letter-spacing:3.4px;color:rgba(255,255,255,.55);font-weight:700;margin-top:3px;text-transform:uppercase}
.tool-label{font-size:9px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1.6px;font-weight:700;line-height:1.5;padding-left:14px;margin-left:14px;border-left:1px solid rgba(255,255,255,.15)}

.topnav{display:flex;gap:2px;align-items:center;justify-content:center}
.topnav a{
  padding:7px 10px;font-size:12px;font-weight:600;color:rgba(255,255,255,.75);
  text-decoration:none;border-radius:11px;cursor:pointer;transition:all .12s;white-space:nowrap;
}
.topnav a:hover{background:rgba(255,255,255,.1);color:#fff;text-decoration:none}
.topnav a.active{background:var(--blue);color:#fff}
html[data-theme="dark"] .topnav a.active{background:var(--blue);color:#0f1820}

.top-actions{display:flex;gap:8px;align-items:center}
.role-switch{
  display:flex;background:var(--surface-2);border-radius:6px;padding:2px;gap:2px;border:1px solid var(--border);
}
.role-switch button{
  background:transparent;border:none;padding:4px 10px;font-size:10px;font-weight:700;
  color:var(--text-muted);border-radius:4px;cursor:pointer;
  font-family:var(--bf);text-transform:uppercase;letter-spacing:.6px;
}
.role-switch button.active{background:var(--surface);color:var(--blue);box-shadow:var(--shadow-sm)}
.theme-toggle{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);cursor:pointer;width:32px;height:32px;
  border-radius:10px;font-size:14px;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
}
.theme-toggle:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.menu-btn{
  display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);padding:6px 10px;
  border-radius:10px;cursor:pointer;font-size:16px;color:#fff;
}

/* Hide the decorative brand tag before things get tight */
@media(max-width:1080px){ .tool-label{display:none} }
@media(max-width:1240px){
  .topbar{grid-template-columns:1fr auto;padding:10px 16px;gap:8px}
  .topnav{display:none}
  .topnav.open{
    display:flex;flex-direction:column;position:fixed;top:54px;left:0;right:0;
    background:var(--chrome);padding:12px;border-bottom:1px solid var(--chrome-deep);
    box-shadow:var(--shadow-lg);z-index:49;gap:3px;
  }
  .topnav.open a{padding:10px 14px;border-radius:10px;width:100%}
  .main{padding:16px!important}
  .menu-btn{display:block}
}

.main{flex:1;padding:24px;max-width:1400px;width:100%;margin:0 auto}

/* ============================================================
   HERO BANNER — MyWealth topographic imagery
============================================================ */
.hero{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#fff;padding:28px 28px 24px;border-radius:12px;margin-bottom:20px;
  position:relative;overflow:hidden;min-height:180px;
}
.hero::before{
  content:'';position:absolute;top:-30%;right:-10%;width:480px;height:480px;
  background:radial-gradient(circle,rgba(255,101,80,.18),transparent 65%);pointer-events:none;
}
.hero::after{
  /* Topographic contour lines - stylised */
  content:'';position:absolute;top:0;right:0;width:45%;height:100%;opacity:.22;pointer-events:none;
  background-image:
    radial-gradient(ellipse 600px 200px at 100% 30%, transparent 0, transparent 30%, rgba(13,107,224,.6) 30%, rgba(13,107,224,.6) 31%, transparent 31%, transparent 40%, rgba(13,107,224,.5) 40%, rgba(13,107,224,.5) 41%, transparent 41%, transparent 52%, rgba(13,107,224,.4) 52%, rgba(13,107,224,.4) 53%, transparent 53%, transparent 66%, rgba(13,107,224,.3) 66%, rgba(13,107,224,.3) 67%, transparent 67%);
}
.hero-inner{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hero-left{flex:1;min-width:260px}
.hero-sub{font-family:var(--bf);font-size:10px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-bottom:6px}
.hero h1{font-size:30px;color:#fff;line-height:1.08;font-weight:600;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--coral);font-weight:400}
.hero-tag{font-size:13px;color:rgba(255,255,255,.85);margin-top:10px;max-width:620px;line-height:1.55}
.hero-right{display:flex;flex-direction:column;gap:5px;min-width:260px}
.hf-row{display:flex;align-items:center;gap:8px}
.hf-row label{font-family:var(--bf);font-size:9px;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:1px;font-weight:700;width:80px;text-align:right;flex-shrink:0}
.hf-row input,.hf-row select{
  font-family:var(--bf);font-size:12px;border:none;padding:6px 10px;border-radius:5px;
  background:var(--lime);color:var(--navy);font-weight:700;width:180px;
}
.hf-row input:focus,.hf-row select:focus{outline:2px solid #fff}
.hf-row input::placeholder{color:rgba(12,46,63,.35)}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-chip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);font-size:10px;font-weight:600;padding:3px 10px;border-radius:999px;backdrop-filter:blur(10px)}

/* ============================================================
   PAGE HEAD
============================================================ */
.page-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.breadcrumb{font-family:var(--bf);font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:5px}
.page-head h1{font-size:28px;line-height:1.1;font-weight:600}
.page-head .subtitle{color:var(--text-dim);font-size:13px;margin-top:6px;max-width:680px;line-height:1.55;font-family:var(--bf)}

/* ============================================================
   CARDS
============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;box-shadow:var(--shadow-sm);position:relative}
.card-accent{border-left:4px solid var(--blue);background:linear-gradient(135deg,var(--blue-light) 0%,var(--surface) 100%)}
html[data-theme="dark"] .card-accent{background:linear-gradient(135deg,rgba(93,166,255,.1) 0%,var(--surface) 100%)}

/* 5-value row — all pills on one line */
.values-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.value-pill{padding:10px 8px;background:rgba(12,46,63,.05);border-radius:8px;border-left:3px solid var(--navy);text-align:center}
.value-pill-text{font-family:var(--hf);font-size:13px;color:var(--navy);font-weight:700;line-height:1.2}
@media (max-width:640px){.values-row{grid-template-columns:repeat(5,1fr);gap:4px}.value-pill{padding:6px 4px}.value-pill-text{font-size:10px}}

/* Workshop Questions */
.workshop-list{list-style:none;padding:0;margin:0}
.workshop-item{padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--blue);border-radius:6px;margin-bottom:10px}
.workshop-prompt{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-family:var(--hf);font-size:13px;font-weight:700;color:var(--navy)}
html[data-theme="dark"] .workshop-prompt{color:var(--blue)}
.workshop-num{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.workshop-q{font-family:var(--bf);font-size:12px;line-height:1.6;color:var(--text-dim);margin-left:32px;margin-bottom:8px}
.workshop-notes-label{display:block;margin-left:32px;font-family:var(--bf)}
.workshop-notes-label span{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:block}
.workshop-notes-label textarea{width:100%;padding:8px 10px;font-family:var(--bf);font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);resize:vertical}

/* Signoff lock indicator */
.signoff-lock{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--amber-light);color:var(--amber);letter-spacing:.3px;margin-left:auto}
.workshop-item{padding:14px 16px;background:var(--surface-2);border-left:3px solid var(--blue);border-radius:6px;margin-bottom:10px}
.workshop-prompt{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;font-family:var(--hf);font-size:13px;font-weight:700;color:var(--navy)}
html[data-theme="dark"] .workshop-prompt{color:var(--blue)}
.workshop-num{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;min-width:22px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.workshop-q{font-family:var(--bf);font-size:12px;line-height:1.6;color:var(--text-dim);margin-left:32px;margin-bottom:8px}
.workshop-notes-label{display:block;margin-left:32px;font-family:var(--bf)}
.workshop-notes-label span{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;display:block}
.workshop-notes-label textarea{width:100%;padding:8px 10px;font-family:var(--bf);font-size:11px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);resize:vertical}
.intro-banner{background:linear-gradient(135deg,var(--navy) 0%,#143a52 100%);border-radius:10px;padding:18px 22px;margin-bottom:20px;color:#fff;box-shadow:var(--shadow-md)}
.intro-banner-inner{display:flex;align-items:flex-start;gap:16px}
.intro-icon{font-size:32px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.intro-text{flex:1;min-width:0}
.intro-title{font-family:var(--hf);font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;margin-bottom:5px}
.intro-body{font-family:var(--bf);font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.6}
.intro-body strong{color:#fff;font-weight:700}

/* Get the most out of your PY — 3-card block */
.get-most-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.get-most-grid{grid-template-columns:1fr}}
.gm-card{background:var(--blue-light);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
html[data-theme="dark"] .gm-card{background:rgba(93,166,255,.08)}
.gm-tag{background:var(--blue);color:#fff;font-family:var(--hf);font-size:12px;font-weight:700;font-style:italic;padding:7px 14px;letter-spacing:.3px}
.gm-body{padding:14px 16px;font-family:var(--bf);font-size:12px;line-height:1.55;color:var(--text-dim);flex:1}
.gm-body strong{color:var(--text);font-weight:700}

/* PY Timeline — embedded PDF image with clickable hotspots */
.pytimeline-card{padding:0;position:relative;overflow:hidden;border-radius:10px}
/* Make the timeline more landscape: the wrap is shorter than the original image aspect,
   and the inner (holding image + hotspots) is sized to the original aspect but shifted up
   so we crop top and bottom whitespace evenly. Hotspots scale with the image because they
   live inside .pytimeline-inner. */
.pytimeline-wrap{position:relative;line-height:0;overflow:hidden;aspect-ratio: 1800 / 720}
.pytimeline-inner{position:absolute;left:0;right:0;top:-20%;line-height:0}
.pytimeline-img{width:100%;height:auto;display:block}
.pytimeline-hotspot{position:absolute;cursor:pointer;border-radius:4px;transition:background-color .15s,box-shadow .15s;z-index:2}
.pytimeline-hotspot:hover{background:rgba(217,240,154,.25);box-shadow:0 0 0 2px rgba(217,240,154,.6)}

/* Session flags (PDF session-type labels) */
.session-flags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.session-flag{font-family:var(--bf);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:4px 10px;background:var(--navy);color:#fff;border-radius:999px;position:relative}
html[data-theme="dark"] .session-flag{background:var(--blue);color:var(--navy-deep)}

/* Other Training grid (PDF page 13 requirements) */
.other-training-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
@media(max-width:1100px){.other-training-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.other-training-grid{grid-template-columns:repeat(2,1fr)}}
.other-training-tile{padding:8px 10px;background:var(--surface-2);border-radius:6px;border-left:2px solid var(--coral);position:relative;cursor:help;min-width:0}
.other-training-tile .ot-icon{font-size:14px;margin-bottom:2px;line-height:1}
.other-training-tile .ot-title{font-family:var(--hf);font-size:11px;font-weight:700;color:var(--navy);margin-bottom:2px;line-height:1.2}
html[data-theme="dark"] .other-training-tile .ot-title{color:var(--blue)}
.other-training-tile .ot-meta{font-family:var(--bf);font-size:9px;color:var(--text-muted);line-height:1.3}
.other-training-tile .ot-meta a{color:var(--blue-link);text-decoration:none;font-weight:600}
.other-training-tile .ot-meta a:hover{text-decoration:underline}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:transparent;border-radius:10px 10px 0 0}
.card.q1::before{background:var(--blue)}
.card.q2::before{background:var(--green)}
.card.q3::before{background:var(--amber)}
.card.q4::before{background:var(--purple)}
.card.q5::before{background:var(--coral)}
.card.q6::before{background:var(--text-muted)}
.card.navy::before{background:var(--navy)}
.card.accent::before{background:linear-gradient(90deg,var(--blue),var(--coral))}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.card-header h3{margin:0}
.card-header .subtitle{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.5;font-family:var(--bf)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ============================================================
   GRID HELPERS
============================================================ */
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-auto{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
@media(max-width:860px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row-between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.muted{color:var(--text-muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* ============================================================
   BUTTONS & INPUTS
============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:7px 13px;font-family:var(--bf);font-size:12px;font-weight:600;
  line-height:1;border:1px solid transparent;border-radius:6px;cursor:pointer;
  transition:all .12s;white-space:nowrap;text-decoration:none;
}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-deep);text-decoration:none}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-bright);text-decoration:none}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong)}
.btn-secondary:hover{background:var(--surface-2);border-color:var(--text-muted);text-decoration:none}
.btn-ghost{background:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-danger{background:transparent;color:var(--red);border-color:rgba(192,57,43,.3)}
.btn-danger:hover{background:rgba(192,57,43,.08);border-color:var(--red)}
.btn-sm{padding:4px 9px;font-size:11px}

input,select,textarea{
  font-family:var(--bf);font-size:12px;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:6px;padding:7px 9px;width:100%;
  transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
textarea{min-height:70px;resize:vertical;line-height:1.5}
input[type="checkbox"]{width:auto;margin:0 6px 0 0;cursor:pointer;accent-color:var(--blue)}
input[type="range"]{width:100%;accent-color:var(--blue)}
label.field{display:block}
label.field>span{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}

/* ============================================================
   STATS / KPIs
============================================================ */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat .label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.stat .value{font-family:var(--hf);font-size:28px;font-weight:600;color:var(--text);line-height:1.05;letter-spacing:-.02em}
.stat .sub{font-size:11px;color:var(--text-muted);margin-top:3px;font-family:var(--bf)}
.stat.accent{background:var(--blue-light);border-color:rgba(13,107,224,.15)}
.stat.accent .value{color:var(--blue)}
.stat.ok{background:var(--green-light);border-color:rgba(26,122,76,.2)}
.stat.ok .value{color:var(--green)}
.stat.warn{background:var(--amber-light);border-color:rgba(184,134,11,.2)}
.stat.warn .value{color:var(--amber)}
.stat.coral{background:var(--coral-light);border-color:rgba(255,101,80,.2)}
.stat.coral .value{color:var(--coral)}

/* ============================================================
   PROGRESS
============================================================ */
.progress{background:var(--surface-2);border-radius:999px;height:6px;overflow:hidden;border:1px solid var(--border)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--coral));border-radius:999px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.progress.slim{height:5px}

/* ============================================================
   BADGES
============================================================ */
.badge{
  display:inline-flex;align-items:center;padding:2px 8px;font-family:var(--bf);
  font-size:10px;font-weight:600;border-radius:999px;line-height:1.6;
  background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);
}
.badge.navy{background:rgba(12,46,63,.08);color:var(--navy);border-color:rgba(12,46,63,.15)}
html[data-theme="dark"] .badge.navy{color:var(--navy-deep)}
.badge.blue{background:var(--blue-light);color:var(--blue);border-color:rgba(13,107,224,.2)}
.badge.coral{background:var(--coral-light);color:var(--coral);border-color:rgba(255,101,80,.2)}
.badge.lime{background:var(--lime-light);color:var(--lime-dark);border-color:rgba(74,106,16,.2)}
.badge.ok{background:var(--green-light);color:var(--green);border-color:rgba(26,122,76,.2)}
.badge.warn{background:var(--amber-light);color:var(--amber);border-color:rgba(184,134,11,.25)}
.badge.danger{background:var(--red-light);color:var(--red);border-color:rgba(192,57,43,.25)}
.badge.purple{background:var(--purple-light);color:var(--purple);border-color:rgba(109,40,217,.25)}
/* Milestone classification tiers (legal gate vs MyWealth standard vs development) */
.badge.gate{background:var(--red-light);color:var(--red);border-color:rgba(214,48,49,.3);font-weight:700}
.badge.std{background:var(--blue-light);color:var(--blue);border-color:rgba(43,111,214,.28)}
.badge.dev{background:var(--surface-2);color:var(--text-muted);border-color:var(--border)}
.kind-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--text-muted);margin-top:2px}
.kind-legend span{display:inline-flex;align-items:center;gap:5px}
.kind-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.kind-legend .k-gate{background:var(--red)}
.kind-legend .k-std{background:var(--blue)}
.kind-legend .k-dev{background:var(--text-faint)}
/* Draft / placeholder content badge */
.draft-badge{display:inline-block;background:var(--amber-light);color:var(--amber);border:1px solid rgba(184,134,11,.35);font-size:8.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;white-space:nowrap}
/* PY portal hours reminder card */
.portal-card{background:linear-gradient(135deg,var(--blue-light) 0%,var(--surface) 100%);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.portal-card .pc-icon{font-size:28px;flex-shrink:0}
.portal-card .pc-body{flex:1;min-width:220px}
.portal-card .pc-body h3{font-size:15px;margin-bottom:3px}
.portal-card .pc-body p{font-size:12px;color:var(--text-dim);line-height:1.5}
.portal-card .pc-actions{display:flex;flex-direction:column;gap:6px;min-width:220px}
.portal-card .pc-actions input{font-size:11px;padding:6px 9px}
/* Program status banner */
.status-banner{border-radius:14px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--border)}
.status-banner .sb-badge{font-family:var(--hf);font-size:18px;font-weight:600;padding:6px 16px;border-radius:999px;white-space:nowrap}
.status-banner .sb-detail{flex:1;min-width:240px;font-size:12px;line-height:1.55}
.status-banner .sb-detail b{font-weight:700}
.status-ontrack{background:var(--green-light);border-color:rgba(39,174,96,.35)}
.status-ontrack .sb-badge{background:var(--green);color:#fff}
.status-attention{background:var(--amber-light);border-color:rgba(184,134,11,.35)}
.status-attention .sb-badge{background:var(--amber);color:#fff}
.status-blocked{background:var(--red-light);border-color:rgba(214,48,49,.4)}
.status-blocked .sb-badge{background:var(--red);color:#fff}
.status-ready{background:var(--blue-light);border-color:rgba(43,111,214,.4)}
.status-ready .sb-badge{background:var(--blue);color:#fff}
/* Your next steps — the hybrid dashboard's lead panel */
.ns-status{font-family:var(--hf);font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;white-space:nowrap}
.status-ontrack.ns-status{background:var(--green);color:#fff}
.status-attention.ns-status{background:var(--amber);color:#fff}
.status-blocked.ns-status{background:var(--red);color:#fff}
.status-ready.ns-status{background:var(--blue);color:#fff}
.ns-grid{display:grid;grid-template-columns:minmax(220px,1fr) 1.4fr;gap:16px;margin-top:4px}
@media(max-width:760px){.ns-grid{grid-template-columns:1fr}}
.ns-current{display:flex;flex-direction:column;gap:3px;padding:16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--blue);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,background .15s}
.ns-current:hover{background:var(--blue-light);transform:translateY(-1px);box-shadow:var(--shadow)}
.ns-current-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted)}
.ns-current-q{font-family:var(--hf);font-size:21px;font-weight:700;color:var(--heading);line-height:1.15}
.ns-current-tag{font-size:12px;color:var(--text-dim);line-height:1.45;margin-top:2px}
.ns-focuses{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ns-focus{font-size:11px;font-weight:600;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 9px;white-space:nowrap}
.ns-current-open{margin-top:auto;padding-top:12px;font-size:12px;font-weight:700;color:var(--blue)}
.ns-actions-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:9px}
.ns-actions .attention-row{margin-bottom:8px}
.ns-actions .attention-row:last-child{margin-bottom:0}
.ns-done{padding:14px;border-radius:10px;background:var(--green-light);color:var(--green-dark);font-weight:700;font-size:13px;line-height:1.5}
.ns-more{font-size:11px;color:var(--text-muted);padding:6px 2px 0}
.ns-progress{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ns-progress .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted)}
.ns-progress b{font-family:var(--hf);font-size:15px;color:var(--heading)}
.ns-progress .progress{flex:1;min-width:160px}
.measure-reasons{margin:6px 0 0;padding-left:18px;font-size:11.5px;color:var(--text-dim);line-height:1.6}
/* Quarter entry / exit readiness criteria */
.readiness{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.readiness{grid-template-columns:1fr}}
.readiness-col{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface);transition:background .15s,border-color .15s}
.readiness-col.entry{border-left:4px solid var(--blue)}
.readiness-col.exit{border-left:4px solid var(--green)}
.readiness-head{font-family:var(--hf);font-size:13px;font-weight:700;color:var(--heading);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.readiness-count{margin-left:auto;font-family:var(--bf);font-size:10px;font-weight:700;color:var(--text-muted);background:var(--surface-2);border-radius:16px;padding:2px 9px;letter-spacing:.3px}
.readiness-col.complete.entry{background:var(--blue-light);border-color:rgba(43,111,214,.4)}
.readiness-col.complete.entry .readiness-count{background:var(--blue);color:#fff}
.readiness-col.complete.exit{background:var(--green-light);border-color:rgba(39,174,96,.4)}
.readiness-col.complete.exit .readiness-count{background:var(--green);color:#fff}
.readiness ul{list-style:none;padding:0;margin:0}
.readiness li{padding:5px 0;border-top:1px solid var(--border-soft);display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--text-dim);line-height:1.5}
.readiness li:first-child{border-top:none}
.readiness li .readiness-crit{flex:1;min-width:0}
.readiness li input{width:15px;height:15px;margin-top:2px;flex-shrink:0;accent-color:var(--blue)}
.readiness li.on{color:var(--text)}

/* ============================================================
   ALERTS
============================================================ */
.alert{padding:11px 13px;border-radius:8px;border:1px solid var(--border);font-size:12px;line-height:1.55;display:flex;align-items:flex-start;gap:10px;font-family:var(--bf)}
.alert strong{display:block;margin-bottom:2px;font-weight:700}
.alert-info{background:var(--blue-light);border-color:rgba(13,107,224,.2);color:var(--blue)}
.alert-warn{background:var(--amber-light);border-color:rgba(184,134,11,.2);color:var(--amber)}
.alert-ok{background:var(--green-light);border-color:rgba(26,122,76,.2);color:var(--green)}
.alert-danger{background:var(--red-light);border-color:rgba(192,57,43,.2);color:var(--red)}
.alert-navy{background:rgba(12,46,63,.06);border-color:rgba(12,46,63,.15);color:var(--navy)}
html[data-theme="dark"] .alert-navy{color:var(--navy-deep)}
.alert-lime{background:var(--lime-light);border-color:rgba(74,106,16,.25);color:var(--lime-dark)}
.alert .icon{font-size:16px;line-height:1;flex-shrink:0}

/* ============================================================
   TIMELINE STRIP (PY plan visual)
============================================================ */
.timeline{
  display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:0;background:var(--surface-2);
  border-radius:10px;border:1px solid var(--border);overflow:hidden;position:relative;
}
.tl-cell{
  padding:14px 10px;text-align:center;position:relative;border-right:1px solid var(--border);
}
.tl-cell:last-child{border-right:none}
.tl-cell.current{background:var(--navy);color:#fff}
html[data-theme="dark"] .tl-cell.current{background:var(--blue)}
.tl-cell.current .tl-label{color:rgba(255,255,255,.75)}
.tl-cell.current .tl-date{color:#fff}
.tl-cell.current input{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.tl-label{font-family:var(--bf);font-size:9px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.tl-date{font-family:var(--hf);font-size:14px;color:var(--navy);font-weight:700;line-height:1.2}
html[data-theme="dark"] .tl-date{color:var(--navy-deep)}
.tl-cell input{margin-top:6px;font-size:10px;padding:3px 5px;background:var(--surface);border:1px solid var(--border)}
@media(max-width:720px){
  .timeline{grid-template-columns:repeat(2,1fr)}
  .tl-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
  .tl-cell:nth-child(2n){border-right:none}
  .tl-cell:nth-last-child(-n+2){border-bottom:none}
}

/* Timeline connector (journey strip) */
.journey-strip{
  display:flex;align-items:center;gap:0;margin-bottom:20px;overflow-x:auto;padding:4px 0;
}
.journey-node{
  flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .12s;
  font-size:11px;font-weight:600;color:var(--text-dim);
}
.journey-node:hover{border-color:var(--blue);color:var(--blue)}
.journey-node.active{background:var(--navy);color:#fff;border-color:var(--navy)}
html[data-theme="dark"] .journey-node.active{background:var(--blue);border-color:var(--blue)}
.journey-node.done{background:var(--green-light);color:var(--green);border-color:rgba(26,122,76,.3)}
.journey-chip{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:var(--surface-2);color:var(--text-dim)}
.journey-node.active .journey-chip{background:rgba(255,255,255,.2);color:#fff}
.journey-node.done .journey-chip{background:var(--green);color:#fff}
.journey-arrow{color:var(--text-faint);font-size:12px;margin:0 4px;flex-shrink:0}

/* ============================================================
   QUARTER SUBPAGE NAV
============================================================ */
.subnav{
  display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:4px;margin-bottom:18px;overflow-x:auto;
}
.subnav button{
  background:transparent;border:none;padding:8px 14px;font-family:var(--bf);font-size:12px;
  font-weight:600;color:var(--text-dim);border-radius:6px;cursor:pointer;transition:all .12s;
  white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
}
.subnav button:hover{color:var(--text)}
.subnav button.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .subnav button.active{color:var(--navy-deep)}
.subnav .tab-count{background:var(--surface);color:var(--text-muted);font-size:10px;padding:1px 6px;border-radius:999px;font-weight:700}
.subnav button.active .tab-count{background:var(--blue-light);color:var(--blue)}

/* ============================================================
   QUARTER HEAD
============================================================ */
.quarter-head{
  display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:18px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.quarter-head::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--blue)}
.quarter-head.q1::before{background:var(--blue)}
.quarter-head.q2::before{background:var(--green)}
.quarter-head.q3::before{background:var(--amber)}
.quarter-head.q4::before{background:var(--purple)}
.quarter-head.q5::before{background:var(--coral)}
.quarter-head.q6::before{background:var(--text-muted)}
.quarter-chip{
  width:52px;height:52px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--hf);font-weight:700;font-size:16px;flex-shrink:0;box-shadow:var(--shadow);
}
.quarter-chip.q1{background:var(--blue)}
.quarter-chip.q2{background:var(--green)}
.quarter-chip.q3{background:var(--amber)}
.quarter-chip.q4{background:var(--purple)}
.quarter-chip.q5{background:var(--coral)}
.quarter-chip.q6{background:var(--text-muted)}
.quarter-head .info{flex:1;min-width:200px}
.quarter-head h2{font-size:24px;line-height:1.1;margin:0;font-weight:600}
.quarter-head .tagline{font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--bf)}
.quarter-head .progress-box{text-align:right;min-width:100px}
.quarter-head .progress-box .label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;font-family:var(--bf)}
.quarter-head .progress-box .big{font-family:var(--hf);font-size:22px;font-weight:600;line-height:1.2;margin-top:2px}

/* Focus tiles */
.focus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.focus-tile{
  padding:14px 10px;text-align:center;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
}
.focus-tile .emoji{font-size:24px;display:block;margin-bottom:4px}
.focus-tile .name{font-family:var(--hf);font-weight:700;font-size:12px;color:var(--navy);line-height:1.2}
html[data-theme="dark"] .focus-tile .name{color:var(--navy-deep)}
.focus-tile .desc{font-family:var(--bf);font-size:10px;color:var(--text-muted);margin-top:3px;line-height:1.3}

/* ============================================================
   MILESTONES
============================================================ */
.milestone-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:5px}
.milestone{border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;transition:border-color .12s}
.milestone:hover{border-color:var(--border-strong)}
.milestone.done{background:var(--green-light);border-color:rgba(26,122,76,.2)}
.milestone-head{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;user-select:none}
.milestone-head:hover{background:var(--surface-2)}
.milestone.done .milestone-head:hover{background:rgba(26,122,76,.1)}
.milestone-head input[type="checkbox"]{width:16px;height:16px;flex-shrink:0;margin:0}
.milestone-title{flex:1;font-family:var(--hf);font-size:13px;font-weight:700;color:var(--navy)}
html[data-theme="dark"] .milestone-title{color:var(--navy-deep)}
.milestone.done .milestone-title{text-decoration:line-through;color:var(--text-muted)}
.milestone-target{font-size:10px;color:var(--text-muted);white-space:nowrap;font-weight:600}
.milestone-arrow{color:var(--text-faint);font-size:10px;transition:transform .2s;flex-shrink:0}
.milestone-arrow.open{transform:rotate(90deg)}
.milestone-body{padding:0 14px 14px 39px;font-size:12px;color:var(--text-dim);line-height:1.6;display:none;font-family:var(--bf)}
.milestone-body.open{display:block}
.milestone-body .ref{display:block;margin-top:8px;font-size:10px;color:var(--text-muted);font-family:ui-monospace,Menlo,monospace;padding-top:8px;border-top:1px dashed var(--border)}

/* ============================================================
   TRAINING MODULES (expandable)
============================================================ */
.module-list{display:flex;flex-direction:column;gap:8px}
.module{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.module-head{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;transition:background .1s}
.module-head:hover{background:var(--surface-2)}
.module-icon{
  width:32px;height:32px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;background:var(--blue-light);color:var(--blue);
}
.module-head h4{flex:1;font-family:var(--hf);font-size:14px;font-weight:700;color:var(--navy);margin:0}
html[data-theme="dark"] .module-head h4{color:var(--navy-deep)}
.module-meta{font-family:var(--bf);font-size:10px;color:var(--text-muted);font-weight:600}
.module-arrow{color:var(--text-faint);font-size:10px;transition:transform .2s}
.module-arrow.open{transform:rotate(90deg)}
.module-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border);margin-top:0;padding-top:14px;font-family:var(--bf)}
.module-body.open{display:block}
.module-body h5{font-family:var(--hf);font-size:12px;font-weight:700;color:var(--navy);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
/* Module completion progress pill (in the module header) */
.mod-progress{margin-left:8px;font-family:var(--bf);font-size:10px;font-weight:700;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:2px 9px;vertical-align:middle;white-space:nowrap}
/* Module completion step tracker (in the module body) — clearly labelled */
.mod-steps-track{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.mstep{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 6px}
.mstep i{width:18px;height:18px;border-radius:50%;font-style:normal;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--border);color:var(--text-muted)}
.mstep.done{color:var(--green-dark,#2e7d32);background:var(--green-light);border-color:rgba(39,174,96,.35)}
.mstep.done i{background:var(--green);color:#fff}
.mstep-arrow{color:var(--text-faint);font-size:13px}
/* Assessment block */
.assessment-block{margin-top:14px;padding:14px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.assessment-head{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.assessment-head .assessment-sub{font-size:9px;font-weight:400;letter-spacing:.4px;text-transform:none;color:var(--text-muted);font-style:italic}
.assessment-grid{display:grid;grid-template-columns:1.4fr 1fr .7fr 1fr .9fr;gap:10px}
@media(max-width:760px){.assessment-grid{grid-template-columns:1fr 1fr}}
.assessment-block .field{margin:0}
.asmt-pass{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:600;color:var(--text)}
.asmt-pass input{width:16px;height:16px;accent-color:var(--green)}
.asmt-remediation{margin-top:10px}
.asmt-remediation > summary{cursor:pointer;font-size:11px;font-weight:700;color:var(--text-muted);list-style:none}
.asmt-remediation > summary::-webkit-details-marker{display:none}
.asmt-remediation > summary::before{content:'▶';font-size:8px;margin-right:6px;color:var(--text-muted);display:inline-block;transition:transform .15s}
.asmt-remediation[open] > summary::before{transform:rotate(90deg)}
.asmt-remediation .field{margin-top:10px}
.status-key{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--text-muted);margin-top:2px}
.status-key b{color:var(--text-dim);font-weight:700}
html[data-theme="dark"] .module-body h5{color:var(--navy-deep)}
.module-body h5:first-child{margin-top:0}
.module-body ul{list-style:none;padding:0;margin:0}
.module-body li{padding:5px 0 5px 18px;font-size:12px;line-height:1.55;color:var(--text-dim);position:relative}
.module-body li::before{content:'•';position:absolute;left:6px;color:var(--blue);font-weight:700}
/* Tick-list items don't get the bullet dot — they have a checkbox */
.module-body .tick-list li{padding-left:0}
.module-body .tick-list li::before{display:none;content:none}
.module-body p{font-size:12px;line-height:1.55;color:var(--text-dim);margin-bottom:8px}
.module-tag{font-size:9px;padding:2px 7px;background:var(--surface-2);color:var(--text-muted);border-radius:999px;font-weight:600}
.module-tag.core{background:var(--blue-light);color:var(--blue)}
.module-tag.ethics{background:var(--coral-light);color:var(--coral)}
.module-tag.tech{background:var(--lime-light);color:var(--lime-dark)}
.module-tag.reg{background:var(--amber-light);color:var(--amber)}

/* Resource card */
.resource-card{
  padding:11px 14px;background:var(--surface-2);border-radius:7px;border-left:3px solid var(--blue);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.resource-card h5{font-family:var(--hf);font-weight:700;font-size:12px;color:var(--navy);margin:0}
html[data-theme="dark"] .resource-card h5{color:var(--navy-deep)}
.resource-card p{font-family:var(--bf);font-size:11px;color:var(--text-muted);margin-top:2px}
.resource-card a{font-size:10px;color:var(--blue);font-family:ui-monospace,Menlo,monospace;text-decoration:none;font-weight:600;flex-shrink:0}

/* Log rows & tables */
.table-wrap{border:1px solid var(--border);border-radius:8px;overflow-x:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse}
th{font-family:var(--bf);font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle;font-family:var(--bf)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface-2)}
td input,td select{padding:5px 7px;font-size:11px}

/* Assess slider */
.assess-row{display:grid;grid-template-columns:1fr 220px 36px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.assess-row:last-child{border-bottom:none}
.assess-label{font-family:var(--bf);font-size:12px;color:var(--text);line-height:1.4}
.assess-row .val{font-family:var(--hf);font-size:14px;text-align:right;color:var(--blue);font-weight:700}
@media(max-width:720px){
  .assess-row{grid-template-columns:1fr 36px;grid-template-areas:'label val' 'slider slider'}
  .assess-label{grid-area:label}
  .assess-row .val{grid-area:val}
  .assess-row input[type=range]{grid-area:slider}
}
/* Behavioural competency levels */
.comp-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
@media(max-width:820px){.comp-scale{grid-template-columns:1fr 1fr}}
.comp-scale .lvl{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.comp-scale .lvl .n{font-family:var(--hf);font-size:15px;font-weight:700;color:var(--blue)}
.comp-scale .lvl .nm{font-size:11px;font-weight:700;color:var(--text);margin:1px 0 3px}
.comp-scale .lvl .ds{font-size:10px;color:var(--text-muted);line-height:1.4}
.lvl-row{padding:12px 0;border-bottom:1px solid var(--border)}
.lvl-row:last-child{border-bottom:none}
.lvl-label{font-size:12.5px;color:var(--text);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.4}
.lvl-info{background:none;border:1px solid var(--border);border-radius:12px;font-size:10px;font-weight:700;color:var(--blue);padding:1px 9px;cursor:pointer;white-space:nowrap}
.lvl-info:hover{background:var(--blue-light)}
.lvl-pickers{display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.lvl-pick{display:flex;align-items:center;gap:9px}
.lvl-who{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);width:74px;text-align:right}
.lvl-btns{display:inline-flex;gap:4px}
.lvl-btns button{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-family:var(--bf);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s}
.lvl-btns button:hover{border-color:var(--blue);color:var(--blue)}
.lvl-btns button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.lvl-pick.sup .lvl-btns button.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.lvl-var{font-size:10px;font-weight:700;color:var(--amber);background:var(--amber-light);border:1px solid rgba(184,134,11,.35);border-radius:12px;padding:2px 10px}
.lvl-detail{margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.lvl-detail ol{margin:0;padding-left:20px;font-size:11px;color:var(--text-dim);line-height:1.5}
.lvl-detail li{margin-bottom:3px}
.lvl-detail li b{color:var(--text)}
/* Per-quarter competency progression grid */
.comp-progress{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cp-row{display:grid;grid-template-columns:1fr 60px 60px 60px 60px;border-top:1px solid var(--border-soft)}
.cp-row:first-child{border-top:none}
.cp-head{background:var(--surface-2);font-weight:700}
.cp-dom{padding:8px 12px;font-size:11.5px;color:var(--text-dim);display:flex;align-items:center}
.cp-head .cp-dom{color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.cp-cell{padding:8px 6px;text-align:center;font-family:var(--hf);font-size:13px;font-weight:700;color:var(--text);border-left:1px solid var(--border-soft)}
.cp-head .cp-cell{font-family:var(--bf);font-size:11px;color:var(--text-muted)}
.cp-cell.cur{background:var(--blue-light);color:var(--blue)}
/* Development actions + progression decision (reflection tab) */
.dev-action{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.dev-action.carried{background:var(--amber-light);border-color:rgba(184,134,11,.3)}
.dev-action-head{font-size:12.5px;color:var(--text);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dev-action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:640px){.dev-action-grid{grid-template-columns:1fr}}
.dev-action .field{margin:0}
.decision-btns{display:flex;gap:10px;flex-wrap:wrap}
.decision-btn{flex:1;min-width:200px;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--bf);font-size:12.5px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .12s}
.decision-btn:hover{border-color:var(--border-strong)}
.decision-btn.sel.ok{border-color:var(--green);background:var(--green-light);color:var(--green-dark,#2e7d32)}
.decision-btn.sel.warn{border-color:var(--amber);background:var(--amber-light);color:var(--amber)}
.decision-btn.sel.danger{border-color:var(--red);background:var(--red-light);color:var(--red)}
/* Change history (audit) list */
.audit-list{list-style:none;margin:0;padding:0}
.audit-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border-soft)}
.audit-item:last-child{border-bottom:none}
.audit-icon{font-size:16px;line-height:1.3;flex-shrink:0;width:22px;text-align:center}
.audit-main{flex:1;min-width:0}
.audit-action{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.4}
.audit-delta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;color:var(--text-muted);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.audit-detail{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:2px}
.audit-meta{font-size:10.5px;color:var(--text-muted);margin-top:3px}
/* Role switch on the dark chrome header */
.topbar .role-switch{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
.topbar .role-switch button{color:rgba(255,255,255,.7)}
.topbar .role-switch button.active{background:#fff;color:var(--chrome)}
@media(max-width:1500px){.topbar .role-switch{display:none}}

/* Signoff box */
.signoff{padding:14px;border-radius:8px;background:var(--lime-light);border:1px dashed var(--lime-dark);display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:720px){.signoff{grid-template-columns:1fr}}
.signoff-field label{display:block;color:var(--lime-dark);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px;font-size:9px;font-family:var(--bf)}

/* Empty state */
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty h3{color:var(--text-dim);margin-bottom:8px}
.empty p{margin-bottom:14px;font-family:var(--bf);font-size:13px}

/* Dilemma */
.standard-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:10px;font-weight:600;color:var(--text-muted);user-select:none}
.standard-tag.active{background:var(--blue-light);color:var(--blue);border-color:rgba(13,107,224,.3)}
.standard-tag input{display:none}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* PRINT */
@media print{
  @page{ margin:13mm 11mm; }
  /* Print every colour exactly — so the pack looks like the on-screen version, not stripped B&W. */
  *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
  .topbar,.menu-btn,.theme-toggle,.role-switch,.card-actions,.btn,.subnav,
  .global-search,.search-panel,.journey-strip,.save-status,.modal-backdrop{display:none!important}
  html,body{background:#fff!important}
  body{color:var(--text)}
  .main{padding:0!important;max-width:100%!important;margin:0!important}
  /* Keep whole components together across page breaks. */
  .card,.quarter-head,.stat,.module,.milestone,.signoff-block,.timeline,.gm-card,
  .value-pill,.focus-tile,.workshop-item,.alert,.intro-banner,.other-training-tile{
    break-inside:avoid;box-shadow:none!important;
  }
  .hero{background:linear-gradient(135deg,#0C2E3F,#0a2433)!important;color:#fff!important}
  /* Show collapsed content and hide interactive-only chrome. */
  .module-body,.milestone-body{display:block!important}
  .module-arrow,.milestone-arrow,.tl-click-hint,.item-del,.card::before{display:none!important}
  a{color:var(--blue)!important;text-decoration:none}
  input,textarea,select{background:#fff!important;border:1px solid #cfd8e2!important;color:#16242e!important}
}

/* ===== PRINT PACK CHROME (the combined per-quarter document) ===== */
.print-quarter-wrapper{font-family:var(--bf);color:var(--text)}
.print-quarter-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  background:linear-gradient(135deg,#0C2E3F 0%,#0a2433 100%);color:#fff;
  padding:20px 24px;border-radius:14px;margin-bottom:20px;position:relative;overflow:hidden;
}
.print-quarter-header::before{content:'';position:absolute;top:-40%;right:-6%;width:320px;height:320px;background:radial-gradient(circle,rgba(245,106,90,.18),transparent 65%);pointer-events:none}
.print-quarter-header .pqh-brand{font-family:var(--hf);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:8px}
.print-quarter-header h1{color:#fff!important;font-size:26px;font-weight:600;line-height:1.1}
.print-quarter-header .pqh-meta{text-align:right;font-size:10.5px;color:rgba(255,255,255,.82);line-height:1.6;white-space:nowrap;position:relative;z-index:1}
.print-quarter-header .pqh-meta b{color:#fff}
.print-quarter-wrapper > h2{
  font-family:var(--hf);font-size:19px;font-weight:600;color:#0C2E3F;
  border-bottom:2px solid #2B6FD6;padding-bottom:6px;margin:26px 0 14px;letter-spacing:-.01em;
}
.print-quarter-wrapper > h2:first-of-type{margin-top:6px}

/* ============ GLOBAL SEARCH BAR ============ */
.global-search{position:relative;margin-right:8px}
.global-search input{font-family:var(--bf);font-size:12px;padding:6px 10px 6px 30px;width:150px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);transition:width .15s}
.global-search input:focus{outline:none;border-color:var(--blue);width:230px;box-shadow:0 0 0 3px rgba(13,107,224,.1)}
.global-search::before{content:"🔍";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:.55;pointer-events:none}
.search-panel{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;width:460px;max-width:92vw;max-height:60vh;overflow-y:auto;box-shadow:var(--shadow-lg);z-index:100;display:none;padding:8px}
.search-panel.open{display:block}
.search-result{padding:9px 10px;border-radius:6px;cursor:pointer;font-family:var(--bf);font-size:12px;color:var(--text-dim);display:flex;gap:10px;align-items:flex-start;border-left:3px solid transparent}
.search-result:hover{background:var(--surface-2);border-left-color:var(--blue)}
.search-result .sr-type{font-size:9px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;flex-shrink:0;margin-top:2px;min-width:74px}
.search-result .sr-body{flex:1;min-width:0}
.search-result .sr-title{font-weight:600;color:var(--text);margin-bottom:2px}
.search-result .sr-ctx{font-size:10px;color:var(--text-muted)}
.search-empty{padding:20px;text-align:center;color:var(--text-muted);font-size:12px}
@media(max-width:1200px){.global-search{display:none}}

/* ============ TOOLTIPS ============ */
[data-tip]{position:relative;cursor:help;border-bottom:1px dotted var(--text-muted)}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:11px;font-weight:500;white-space:normal;max-width:min(280px,80vw);width:max-content;z-index:200;line-height:1.4;box-shadow:var(--shadow-lg);pointer-events:none;font-family:var(--bf)}
[data-tip]:hover::before{content:'';position:absolute;bottom:calc(100% + 1px);left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--navy);z-index:200;pointer-events:none}

/* ============ SIGN-OFF SECTIONS ============ */
.signoff-block{margin-top:14px;padding:12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--border-strong)}
.signoff-block .signoff-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.signoff-block .signoff-meta{font-size:9px;font-weight:400;letter-spacing:.4px;text-transform:none;color:var(--text-muted);font-style:italic}
.signoff-meta-row{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.signoff-meta-row input{font-family:var(--bf);font-size:11px;padding:5px 7px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);width:100%}

/* Supervisor signature — signed state */
.signoff-block.signed{background:var(--green-light);border:1px solid rgba(39,174,96,.4);border-style:solid}
.signoff-tick-line{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;color:var(--text-dim)}
.signoff-tick-line .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;background:var(--surface)}
.signoff-block.signed .signoff-tick-line .box{background:var(--green);border-color:var(--green);color:#fff}
.signoff-signbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
.signoff-await{font-size:10.5px;color:var(--text-muted);font-style:italic}
.sig-stamp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:8px;background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.35)}
.sig-stamp .sig-mark{font-family:'Playfair Display',var(--hf);font-size:20px;font-style:italic;font-weight:600;color:var(--green-dark,#2e7d32);line-height:1;white-space:nowrap}
.sig-stamp .sig-info{font-size:10.5px;color:var(--text-dim);line-height:1.4}
.sig-stamp .sig-info b{color:var(--text);font-weight:700}
.btn-sign{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-sign:hover{background:var(--navy-deep);color:#fff}

/* Proof-of-evidence note on milestones */
.proof-note{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--blue-light);border:1px solid rgba(43,111,214,.25);font-size:11px;color:var(--text-dim);line-height:1.5}
.proof-note b{color:var(--blue);font-weight:700;text-transform:uppercase;letter-spacing:.4px;font-size:9.5px;display:block;margin-bottom:3px}
.proof-note .proof-date{color:var(--text-muted);font-style:italic;font-size:9.5px}

/* Autosave status pill in the top bar */
.save-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:rgba(255,255,255,.7);padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);white-space:nowrap;transition:color .2s,background .2s}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:#5bd08a;box-shadow:0 0 0 0 rgba(91,208,138,.5)}
.save-status.saving .dot{background:var(--lime);animation:savePulse 1s infinite}
.save-status.saving{color:#fff}
@keyframes savePulse{0%{box-shadow:0 0 0 0 rgba(207,232,127,.5)}70%{box-shadow:0 0 0 5px rgba(207,232,127,0)}100%{box-shadow:0 0 0 0 rgba(207,232,127,0)}}
@media(max-width:1080px){.save-status .txt{display:none}}

/* Lightweight branded modal (proof confirmation + supervisor sign) */
.modal-backdrop{position:fixed;inset:0;background:rgba(12,46,63,.55);backdrop-filter:blur(2px);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;overflow:hidden;animation:modalIn .16s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{background:var(--chrome);color:#fff;padding:15px 20px}
.modal-head h3{color:#fff;font-size:16px;margin:0}
.modal-head .modal-sub{font-size:11px;color:rgba(255,255,255,.7);margin-top:3px;font-family:var(--bf)}
.modal-body{padding:18px 20px;font-size:12.5px;color:var(--text-dim);line-height:1.6}
.modal-body label.field>span{display:block;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.modal-body .field{margin-bottom:12px}
.modal-body .modal-check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;font-size:12px;color:var(--text);cursor:pointer}
.modal-body .modal-check input{width:16px;height:16px;margin:1px 0 0;flex-shrink:0}
.modal-err{color:var(--red);font-size:11px;font-weight:600;margin-top:2px;min-height:15px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}

/* ============ TICKABLE SUB-ITEMS ============ */
.tick-list{list-style:none;padding:0;margin:0 0 10px 0}
.tick-item{padding:5px 0;border-bottom:1px solid var(--surface-2);font-size:13px;line-height:1.5}
.tick-item:last-child{border-bottom:none}
.tick-item{color:var(--text-dim);display:flex;align-items:flex-start;gap:8px;position:relative;padding-right:26px}
.tick-item .ti-text{flex:1;min-width:0}
.tick-item.done .ti-text{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--text-faint)}
.tick-item input[type="checkbox"]{accent-color:var(--blue);flex-shrink:0;margin-top:3px;width:15px;height:15px;cursor:pointer}
.tick-item .item-del{position:absolute;right:0;top:3px;background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;opacity:0;padding:0 6px;line-height:1}
.tick-item:hover .item-del{opacity:.7}
.tick-item .item-del:hover{opacity:1;color:var(--red)}
.module-tag.custom{background:var(--purple-light);color:var(--purple)}
.mod-section{margin-bottom:14px}

/* ============ PRINT PER QUARTER ============ */
body.printing-quarter .topbar,
body.printing-quarter .subnav,
body.printing-quarter .card-actions,
body.printing-quarter .role-switch,
body.printing-quarter .theme-toggle,
body.printing-quarter .menu-btn,
body.printing-quarter .journey-strip,
body.printing-quarter .search-panel,
body.printing-quarter .global-search{display:none!important}

/* ============ CLICKABLE TIMELINE CELLS ============ */
.tl-cell{cursor:pointer;transition:transform .1s}
.tl-cell:hover{background:var(--surface-2)}
.tl-cell.current:hover{filter:brightness(1.1)}
.tl-cell .tl-click-hint{font-size:9px;color:var(--blue);font-weight:600;margin-top:4px;letter-spacing:.4px;text-transform:uppercase;opacity:0;transition:opacity .1s}
.tl-cell:hover .tl-click-hint{opacity:1}
.tl-cell.current .tl-click-hint{color:#fff}

/* ============ SUBNAV (clean, no tacky icons) ============ */
.subnav button{font-family:var(--bf)!important}

/* ============ DASHBOARD GATES LAYOUT ============ */
.gates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.gate-card{padding:12px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.gate-card.done{border-left-color:var(--green);background:var(--green-light)}
.gate-card.warn{border-left-color:var(--coral);background:var(--coral-light)}
.gate-card .gate-icon{font-size:18px;flex-shrink:0}
.gate-card .gate-body{flex:1;min-width:0}
.gate-card .gate-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
.gate-card .gate-sub{font-size:10px;color:var(--text-muted);margin-top:3px}
.gate-card .gate-input{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gate-card .gate-input input[type="date"],.gate-card .gate-input input[type="text"]{font-family:var(--bf);font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);flex:1;min-width:0}
.gate-card .gate-input input[type="checkbox"]{width:14px;height:14px;accent-color:var(--green);flex-shrink:0}

/* ============ GATES STRIP (compact pills) ============ */
.gates-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.gate-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;position:relative}
.gate-pill:hover{border-color:var(--blue);background:var(--blue-light)}
.gate-pill.done{background:var(--green-light);border-color:var(--green)}
.gate-pill input[type="checkbox"]{width:18px;height:18px;accent-color:var(--green);flex-shrink:0;cursor:pointer}
.gate-pill-body{display:flex;flex-direction:column;min-width:0;flex:1}
.gate-pill-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.25;font-family:var(--hf)}
.gate-pill.done .gate-pill-title{color:var(--green)}
.gate-pill-sub{font-size:10px;color:var(--text-muted);margin-top:2px}

/* ============ ATTENTION PANEL ============ */
.attention-row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--coral);text-decoration:none;color:inherit;transition:all .15s;cursor:pointer}
.attention-row:hover{background:var(--blue-light);border-left-color:var(--blue);transform:translateX(2px)}
.attention-marker{font-family:var(--hf);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;color:#fff;flex-shrink:0;min-width:32px;text-align:center}
.attention-marker.q1{background:var(--blue)}
.attention-marker.q2{background:var(--green)}
.attention-marker.q3{background:var(--amber)}
.attention-marker.q4{background:var(--purple)}
.attention-marker.q5{background:var(--coral)}
.attention-marker.q6{background:var(--text-muted)}
.attention-title{flex:1;font-size:12px;font-weight:600;line-height:1.3;color:var(--text)}
.attention-arrow{color:var(--text-muted);font-size:16px;transition:transform .15s}
.attention-row:hover .attention-arrow{color:var(--blue);transform:translateX(3px)}

/* ============ DILEMMA ROWS ============ */
.dilemma-rows{display:flex;flex-direction:column;gap:8px}
.dilemma-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:8px;border-left:3px solid var(--coral);position:relative}
.dilemma-row.done{border-left-color:var(--green);background:var(--green-light)}
.dilemma-label{font-size:12px;font-weight:600;color:var(--text);font-family:var(--hf)}
.dilemma-count{font-family:var(--hf);font-size:20px;font-weight:600;color:var(--text)}
.dilemma-status{font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.3px}
.dilemma-status.ok{background:var(--green);color:#fff}
.dilemma-status.warn{background:var(--coral);color:#fff}
.card-inner-hint{margin-top:10px;padding:8px 10px;background:var(--blue-light);border-radius:6px;font-size:11px;color:var(--text-dim);font-style:italic}

/* ============ TOOLTIPS (data-tip) ============ */
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%) translateY(4px);
  background:var(--navy);
  color:#fff;
  font-family:var(--bf);
  font-size:11px;
  font-weight:500;
  padding:8px 12px;
  border-radius:6px;
  white-space:normal;
  width:max-content;
  max-width:260px;
  line-height:1.45;
  box-shadow:var(--shadow-lg);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:100;
  text-align:left;
}
/* When tooltip is on edge elements, keep inside viewport */
.gates-strip > [data-tip]:first-child::after,
.attention-row:first-child[data-tip]::after,
.focus-grid > [data-tip]:first-child::after,
.focus-grid > [data-tip]:nth-child(5n+1)::after,
.other-training-grid > [data-tip]:first-child::after,
.other-training-grid > [data-tip]:nth-child(6n+1)::after{left:0;transform:translateX(0) translateY(4px)}
.gates-strip > [data-tip]:first-child:hover::after,
.attention-row:first-child[data-tip]:hover::after,
.focus-grid > [data-tip]:first-child:hover::after,
.focus-grid > [data-tip]:nth-child(5n+1):hover::after,
.other-training-grid > [data-tip]:first-child:hover::after,
.other-training-grid > [data-tip]:nth-child(6n+1):hover::after{transform:translateX(0) translateY(0)}
.gates-strip > [data-tip]:last-child::after,
.focus-grid > [data-tip]:last-child::after,
.focus-grid > [data-tip]:nth-child(5n)::after,
.other-training-grid > [data-tip]:last-child::after,
.other-training-grid > [data-tip]:nth-child(6n)::after{left:auto;right:0;transform:translateX(0) translateY(4px)}
.gates-strip > [data-tip]:last-child:hover::after,
.focus-grid > [data-tip]:last-child:hover::after,
.focus-grid > [data-tip]:nth-child(5n):hover::after,
.other-training-grid > [data-tip]:last-child:hover::after,
.other-training-grid > [data-tip]:nth-child(6n):hover::after{transform:translateX(0) translateY(0)}
/* Session flags — position tooltip BELOW the flag so it isn't clipped by the card's overflow:hidden */
.session-flags > [data-tip]::after{
  bottom:auto;
  top:calc(100% + 8px);
  max-width:min(260px, calc(100vw - 40px));
}
.session-flags > [data-tip]::before{
  bottom:auto;
  top:calc(100% + 3px);
  border-top-color:transparent;
  border-bottom-color:var(--navy);
}
html[data-theme="dark"] .session-flags > [data-tip]::before{
  border-bottom-color:#2a3d52;
}
[data-tip]::before{
  content:'';
  position:absolute;
  bottom:calc(100% + 3px);
  left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:var(--navy);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  z-index:100;
}
[data-tip]:hover::after,[data-tip]:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
[data-tip]:hover::before{transform:translateX(-50%)}
html[data-theme="dark"] [data-tip]::after{background:#2a3d52;border:1px solid var(--border-strong)}
html[data-theme="dark"] [data-tip]::before{border-top-color:#2a3d52}

@media print{
  .tick-item input[type="checkbox"],.signoff-block input[type="checkbox"]{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .signoff-block{background:#f4f4f4!important;border:1px solid #bbb!important}
  .tick-item.done .ti-text{text-decoration:line-through}
  .module{break-inside:avoid;page-break-inside:avoid}
  .mod-section{break-inside:avoid;page-break-inside:avoid}
  .global-search,.search-panel{display:none!important}
}

/* ===== Inline Edit Mode ===== */
/* Always-on inline editing — subtle affordance on hover, clear ring on focus. */
.edit-target{ border-radius:4px; transition:background .12s ease, outline-color .12s ease; }
.edit-target:hover{ outline:1px dashed var(--border-strong); outline-offset:2px; cursor:text; background:rgba(43,111,214,.05); }
.edit-target:focus{ outline:2px solid var(--blue); outline-offset:2px; background:rgba(43,111,214,.07); }
/* Classification badges are click-to-cycle (recategorise), not text-edited. */
[data-cycle-kind],[data-cycle-tag]{cursor:pointer;user-select:none}
[data-cycle-kind]:hover,[data-cycle-tag]:hover{filter:brightness(.96);box-shadow:0 0 0 2px rgba(43,111,214,.2)}
#editToolbar{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:9999; display:flex; align-items:center; gap:12px;
  background:var(--navy); color:#fff;
  padding:10px 14px; border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  font-family:var(--bf); font-size:13px;
}
#editToolbar .et-label{ font-weight:600; white-space:nowrap; }
#editToolbar .btn{ white-space:nowrap; }

<script>
/* ============================================================
   MyWealth PY Program v2 — redesigned with MyWealth brand

============================================================ */

// Capture a pristine copy of the page HTML now, before the app renders into it.
// "Export shareable copy" reuses this to produce a fresh, self-contained HTML
// file with the current edits baked into the __EMBEDDED_STATE__ slot above.
const __PRISTINE_HTML__ = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

// Utilities
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Strip any "[placeholder — …]" marker so the text reads cleanly (no badge).
const draftify = html => String(html).replace(/\s*\[placeholder[^\]]*\]/gi, '');
const hasDraft = s => /\[placeholder/i.test(String(s || ''));

// Behavioural competency scale — rate what someone can DO, not just what they know.
const COMPETENCY_SCALE = [
  { n:1, name:'Aware',      desc:'Understands why it matters and the basic concepts, but has not applied it.' },
  { n:2, name:'Assisted',   desc:'Can do it, but with supervisor guidance and correction.' },

  { n:5, name:'Expert',     desc:'Coaches others and improves the approach; spots systemic issues.' }
];
// Observable, competency-specific examples (keyed by a snippet of the item text). Others fall back to the scale.
const COMPETENCY_EXAMPLES = {
  'Scope definition': [
    'Explains why scope matters',
    'Drafts scope with supervisor correction',

    'Presents with supervisor support and correction',
    'Presents standard advice clearly and handles routine questions',

    'Coaches others and sets the presentation standard'
  ]
};
function competencyExamples(itemText) {
  for (const key in COMPETENCY_EXAMPLES) { if (String(itemText).includes(key)) return COMPETENCY_EXAMPLES[key]; }
  return null;
}

// Reflection model — the same six core questions each quarter, then quarter-specific prompts.
const CORE_REFLECTION = [
  { key:'core_did',       q:'1. What did I do?' },

];
const EVIDENCE_TYPES = ['', 'File / SOA', 'Meeting observation', 'Assessment result', 'Supervisor feedback', 'Ethical dilemma', 'Calculation / modelling', 'Client interaction', 'Rework example'];
const DEV_STATUS = ['Not started', 'In progress', 'Complete', 'Blocked'];
// Module category tags (editable/reclassifiable in Edit mode)
const MODULE_TAGS = [
  { value:'core', label:'Core' },
  { value:'tech', label:'Technical' },
  { value:'reg', label:'Regulatory' },
  { value:'engagement', label:'Engagement' },
  { value:'ethics', label:'Ethics' },
  { value:'custom', label:'Custom' }
];
const PROGRESSION_DECISIONS = [
  { key:'ready',     label:'Ready to progress', cls:'ok' },
  { key:'ready-dev', label:'Ready to progress with development actions', cls:'warn' },
  { key:'not-ready', label:'Not yet ready — remediation required', cls:'danger' }
];
const uid = p => p + '_' + Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = iso => {
  if (!iso) return '—';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(parts[2])} ${m[parseInt(parts[1])-1]} ${parts[0]}`;
};
const fmtDateTime = iso => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  try {
    return d.toLocaleString(undefined, { day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit' });
  } catch (_) { return d.toString(); }
};
const addMonths = (iso, months) => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  let nm = m - 1 + months, ny = y;
  while (nm > 11) { nm -= 12; ny++; }
  while (nm < 0) { nm += 12; ny--; }
  const dim = new Date(ny, nm + 1, 0).getDate();
  return `${ny}-${String(nm+1).padStart(2,'0')}-${String(Math.min(d, dim)).padStart(2,'0')}`;
};
