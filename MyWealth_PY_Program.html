  dilemmas() {
    const s = Store.getState();
    const dils = s.dilemmas;
    const q3Count = Derived.dilemmaCount(3);
    const q4Count = Derived.dilemmaCount(4);

    return `
    <div class="page-head">
      <div>
        <div class="breadcrumb">Program · Ethics Log</div>
        <h1>Ethical dilemmas log</h1>
        <p class="subtitle">The PY Standard requires <strong>at least 2 ethical dilemmas</strong> identified, worked through and resolved in each of Q3 and Q4. Apply the 12 Standards of the Code of Ethics.</p>
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" data-action="add-dilemma">＋ New dilemma</button>
      </div>
    </div>

    <div class="grid grid-3" style="margin-bottom:20px">
      <div class="stat ${q3Count>=2?'ok':'warn'}">
        <div class="label">Q3 dilemmas</div>
        <div class="value">${q3Count} <span style="font-size:13px;color:var(--text-muted)">/ 2 min</span></div>
        <div class="sub">${q3Count>=2?'✓ Requirement met':'Still needed: ' + (2-q3Count)}</div>
      </div>
      <div class="stat ${q4Count>=2?'ok':'warn'}">
        <div class="label">Q4 dilemmas</div>
        <div class="value">${q4Count} <span style="font-size:13px;color:var(--text-muted)">/ 2 min</span></div>
        <div class="sub">${q4Count>=2?'✓ Requirement met':'Still needed: ' + (2-q4Count)}</div>
      </div>
      <div class="stat accent">
        <div class="label">Total logged</div>
        <div class="value">${dils.length}</div>
        <div class="sub">All quarters</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h3>How to document a dilemma</h3>
      <p class="small muted" style="margin-top:6px;line-height:1.6;font-family:var(--bf)">
        Use the 4-step framework: <strong>(1) Facts</strong> — what actually happened; <strong>(2) Analysis</strong> — which Code Standards and Values apply, which parties are affected; <strong>(3) Decision</strong> — what you did (or would do) and why; <strong>(4) Supervisor comment</strong> — agreed rationale and any remediation. Your log should stand up as evidence to an FSCP review.
      </p>
    </div>

    ${dils.length === 0 ? `
      <div class="empty">
        <h3>No dilemmas logged yet</h3>
        <p>Even mid-Q2 you may encounter minor dilemmas (e.g. a client wanting to scope out super advice they probably need). Capture them here.</p>
        <button class="btn btn-primary" data-action="add-dilemma">＋ Log first dilemma</button>
      </div>
    ` : `
    <div class="stack-lg">
      ${dils.map(d => `
        <div class="card">
          <div class="card-header">
            <div style="flex:1;display:grid;grid-template-columns:130px 100px 1fr;gap:10px;align-items:end">
              <label class="field"><span>Date</span><input type="date" data-dil-field="${d.id}:date" value="${esc(d.date)}"></label>
              <label class="field"><span>Quarter</span>
                <select data-dil-field="${d.id}:quarter">
                  ${[1,2,3,4,5,6].map(q => `<option value="${q}" ${d.quarter===q?'selected':''}>Q${q}</option>`).join('')}
                </select>
              </label>
              <label class="field"><span>Title</span><input data-dil-field="${d.id}:title" value="${esc(d.title)}" placeholder="e.g. Client requested scope exclusion that seems adverse"></label>
            </div>
            <button class="btn btn-sm btn-danger" data-dil-delete="${d.id}" title="Delete">Delete</button>
          </div>

          <div class="grid grid-2">
            <label class="field">
              <span>1. Facts</span>
              <textarea data-dil-field="${d.id}:facts" placeholder="Brief, factual. Names anonymised.">${esc(d.facts)}</textarea>
            </label>
            <label class="field">
              <span>2. Analysis — Standards & Values</span>
              <textarea data-dil-field="${d.id}:analysis" placeholder="Which Standards apply? Which Values? Who is affected?">${esc(d.analysis)}</textarea>
            </label>
            <label class="field">
              <span>3. Decision</span>
              <textarea data-dil-field="${d.id}:decision" placeholder="The course of action and the ethical reasoning.">${esc(d.decision)}</textarea>
            </label>
            <label class="field">
              <span>4. Supervisor comment</span>
              <textarea data-dil-field="${d.id}:supervisorComment" placeholder="Endorsement, additional perspective, remediation plan.">${esc(d.supervisorComment)}</textarea>
            </label>
          </div>

          <div style="margin-top:12px">
            <div class="small muted" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;font-size:10px">Standards triggered</div>
            <div style="display:flex;flex-wrap:wrap;gap:5px">
              ${CONTENT.codeOfEthics.standards.map(st => `
                <label class="standard-tag ${d.standards.includes(st.n)?'active':''}">
                  <input type="checkbox" data-dil-standard="${d.id}:${st.n}" ${d.standards.includes(st.n)?'checked':''}>
                  <span>S${st.n}</span>
                </label>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    `}
    `;
  },

  competency() {
    const s = Store.getState();
    const role = s.ui.role;
    const COMPQ = ['q1','q2','q3','q4'];
    const cq = COMPQ.includes(s.ui.compQuarter) ? s.ui.compQuarter : 'q1';
    const scoresFor = q => s.competencyScores[q] || {};

    return `
    <div class="page-head">
      <div>
        <div class="breadcrumb">Program · Competency</div>
        <h1>Competency assessment</h1>
        <p class="subtitle">Rate what the candidate can <em>do</em> — not just what they know — against a behavioural scale. Candidate and supervisor rate separately; a flag appears where they differ by 2+ levels.</p>
      </div>
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><div><h3>Behavioural rating scale</h3><div class="subtitle">The same 1–5 meaning applies to every competency, so ratings are consistent between supervisors.</div></div></div>
      <div class="comp-scale">
        ${COMPETENCY_SCALE.map(l => `<div class="lvl"><div class="n">${l.n}</div><div class="nm">${esc(l.name)}</div><div class="ds">${esc(l.desc)}</div></div>`).join('')}
      </div>
    </div>

    <div class="alert alert-navy" style="margin-bottom:20px">
      <span class="icon">🎯</span>
      <div>
        <strong>The four competency domains</strong>
        At the end of the PY, your supervisor must attest competency across: (1) Technical; (2) Client care & practice; (3) Regulatory compliance & consumer protection; (4) Professionalism & ethics. Use the bottom of this page for formal sign-off.
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><div><h3>Quarterly competency assessment</h3><div class="subtitle">Complete an assessment at the end of each quarter — each quarter is stored separately so you can see progression across the PY.</div></div></div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">
        ${COMPQ.map(q => `<button class="btn btn-sm ${cq===q?'btn-blue':'btn-ghost'}" data-compq="${q}">Q${q.slice(1)}</button>`).join('')}
        <span class="muted small" style="margin-left:auto;align-self:center">Editing: <b>Q${cq.slice(1)}</b></span>
      </div>
      <div class="comp-progress">
        <div class="cp-row cp-head"><div class="cp-dom">Domain — supervisor avg by quarter</div>${COMPQ.map(q=>`<div class="cp-cell ${q===cq?'cur':''}">Q${q.slice(1)}</div>`).join('')}</div>
        ${CONTENT.competencies.map((dom,di)=>`<div class="cp-row"><div class="cp-dom">${esc(dom.domain)}</div>${COMPQ.map(q=>{
          const sc=scoresFor(q), items=dom.items;
          const tot=items.reduce((a,_,ii)=>a+((sc[`${di}_${ii}`]&&sc[`${di}_${ii}`].supervisor)||0),0);
          const avg=items.length?tot/items.length:0;
          return `<div class="cp-cell ${q===cq?'cur':''}">${avg?avg.toFixed(1):'—'}</div>`;
        }).join('')}</div>`).join('')}
      </div>
    </div>

    ${CONTENT.competencies.map((dom, di) => {
      const sc0 = scoresFor(cq);
      const items = dom.items;
      const totalCand = items.reduce((sum, _, ii) => sum + ((sc0[`${di}_${ii}`] && sc0[`${di}_${ii}`].candidate) || 0), 0);
      const totalSup = items.reduce((sum, _, ii) => sum + ((sc0[`${di}_${ii}`] && sc0[`${di}_${ii}`].supervisor) || 0), 0);
      const avgCand = items.length ? (totalCand / items.length).toFixed(1) : '0.0';
      const avgSup = items.length ? (totalSup / items.length).toFixed(1) : '0.0';
      return `
        <div class="card" style="margin-bottom:16px">
          <div class="card-header">
            <div>
              <h3>Domain ${di+1}: ${esc(dom.domain)}</h3>
              <div class="subtitle">Q${cq.slice(1)} · ${items.length} items · Candidate avg: <strong>${avgCand}</strong> · Supervisor avg: <strong>${avgSup}</strong></div>
            </div>
          </div>
          <div>
            ${items.map((it, ii) => {
              const key = `${di}_${ii}`;
              const sc = sc0[key] || { candidate: 0, supervisor: 0 };
              const variance = (sc.candidate && sc.supervisor) ? Math.abs(sc.candidate - sc.supervisor) : 0;
              const btns = (who) => `<div class="lvl-btns">${[1,2,3,4,5].map(n => `<button data-lvl="${cq}:${key}:${who}:${n}" class="${sc[who]===n?'sel':''}" data-tip="${esc(COMPETENCY_SCALE[n-1].name + ' — ' + COMPETENCY_SCALE[n-1].desc)}">${n}</button>`).join('')}</div>`;
              return `
                <div class="lvl-row">
                  <div class="lvl-label">${esc(it)}</div>
                  <div class="lvl-pickers">
                    <div class="lvl-pick cand"><span class="lvl-who">Candidate</span>${btns('candidate')}</div>
                    <div class="lvl-pick sup"><span class="lvl-who">Supervisor</span>${btns('supervisor')}</div>
                    ${variance >= 2 ? `<span class="lvl-var" data-tip="Candidate and supervisor differ by ${variance} levels — discuss at the 1:1 and align on evidence.">Δ ${variance} · discuss</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}

    <div class="card">
      <div class="card-header">
        <div>
          <h3>Supervisor competency attestation</h3>
          <div class="subtitle">Required before the Final Completion Certificate is issued.</div>
        </div>
      </div>
      <div class="grid grid-2">
        <label class="field"><span>Technical competence</span><textarea data-signoff="technical" placeholder="Supervisor narrative">${esc(s.supervisorSignoffs.technical||'')}</textarea></label>
        <label class="field"><span>Client care and practice</span><textarea data-signoff="clientCare" placeholder="Discovery, SOA presentation, ongoing service">${esc(s.supervisorSignoffs.clientCare||'')}</textarea></label>
        <label class="field"><span>Regulatory compliance & consumer protection</span><textarea data-signoff="regulatory" placeholder="BID, DDO, AML/CTF, Privacy, fee consent">${esc(s.supervisorSignoffs.regulatory||'')}</textarea></label>
        <label class="field"><span>Professionalism and ethics</span><textarea data-signoff="ethics" placeholder="Code of Ethics application; dilemma handling">${esc(s.supervisorSignoffs.ethics||'')}</textarea></label>
      </div>

      <div class="signoff" style="margin-top:20px">
        <div class="signoff-field">
          <label>Supervisor final recommendation</label>
          <textarea data-signoff="finalCertificate" placeholder="'I attest that the candidate has met the work and training standard in s921B(4)...'">${esc(s.supervisorSignoffs.finalCertificate||'')}</textarea>
        </div>
        <div class="signoff-field">
          <label>Signatures</label>
          <div style="display:flex;flex-direction:column;gap:8px">
            <input placeholder="Candidate name" data-bind="profile.candidateName" value="${esc(s.profile.candidateName)}">
            <input placeholder="Supervisor name" data-bind="profile.supervisorName" value="${esc(s.profile.supervisorName)}">
            <input type="date" data-bind="profile.finalCertificateDate" value="${esc(s.profile.finalCertificateDate)}" placeholder="Certificate date">
          </div>
        </div>
      </div>
    </div>
    `;
  },


  code() {
    const coe = CONTENT.codeOfEthics;
    return `
    <div class="page-head">
      <div>

/* ============================================================
   EDIT MODE — inline, password-gated content editing
   Overrides are stored locally (state.contentOverrides) and
   applied on every render. Editing requires the password each
   session (EditMode.active is not persisted).
============================================================ */
// Always-on inline editing (prototype mode): every content text element is
// editable in place, and edits persist locally (contentOverrides) across
// re-renders. No password or mode toggle.
const EditMode = {
  active: true,
  // Leaf-text elements that are safe to edit in place.
  SELECTOR: 'h1,h2,h3,h4,h5,p,li,td,th,blockquote,.tagline,.subtitle,.desc,.name,.ot-title,.ot-meta,.milestone-title,.milestone-target,.md-desc,.tick-item .ti-text,.card-inner-hint,.breadcrumb,.attention-title,.hero-tag,.hero-sub,.gm-tag,.gm-body,.intro-title,.intro-body,.gate-pill-title,.gate-pill-sub,.assess-label,.lvl-label,.workshop-q,.value-pill-text,.session-flag,.sc-name,.sc-desc,.module-duration,.module-body>p,.badge,.readiness-title,.readiness-crit,.alert>div,.comp-scale .nm,.comp-scale .ds,.sb-detail,.status-key span,.dev-action-head,.mstep,.hf-row label,.pc-body h3,.pc-body p,.hero h1',
  _hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) | 0; }
    return (h >>> 0).toString(36);
  },
  // Walk the rendered DOM: apply saved overrides and make text editable.
  apply(root) {
    if (!root) return;
    const overrides = (Store.getState().contentOverrides) || {};
    const view = (Router.current().parts[0] || 'dashboard');
    const seen = Object.create(null);
    const els = root.querySelectorAll(this.SELECTOR);
    els.forEach(el => {
      // Skip classification badges (they cycle on click), links, and containers with controls.
      if (el.hasAttribute('data-noedit')) return;
      if (el.parentElement && el.parentElement.closest('[data-edit-key]')) return;
      if (el.closest('a')) return;
      if (el.querySelector('input,select,textarea,button,a[data-nav]')) return;
      const orig = (el.textContent || '').trim();
      if (!orig) return;
      const base = view + '|' + this._hash(orig);
      const occ = (seen[base] = (seen[base] || 0) + 1) - 1;
      const key = base + '|' + occ;
      el.setAttribute('data-edit-key', key);
      el.setAttribute('data-edit-orig', orig);
      if (Object.prototype.hasOwnProperty.call(overrides, key)) {
        el.textContent = overrides[key];
      }
      el.setAttribute('contenteditable', 'true');
      el.classList.add('edit-target');
    });
  },
  saveFrom(el) {
    const key = el.getAttribute('data-edit-key');
    if (!key) return;
    const orig = el.getAttribute('data-edit-orig') || '';
    const val = (el.textContent || '').trim();
    Actions.saveContentOverride(key, val, orig);
  }
};

/* ============================================================
   APP — mount + event delegation
============================================================ */
const App = {
  root: null, navEl: null,

  mount(rootEl, navEl) {
    this.root = rootEl;
    this.navEl = navEl;
    Store.subscribe(() => this.render());
    Router.subscribe(() => this.render());
    this.wireGlobalEvents();
    this.wireSearch();
    this.render();
  },

  // ======== GLOBAL SEARCH ========
  buildSearchIndex() {
    const idx = [];
    CONTENT.quarters.forEach(q => {
      (q.milestones || []).forEach((m) => {
        idx.push({ type: 'milestone', label: m.t, meta: 'Q' + q.number + ' · Milestone', hash: '#/quarters/' + q.id + '/milestones', text: (m.t + ' ' + (m.b || '')).toLowerCase() });
      });
      (q.trainingModules || []).forEach(mod => {
        idx.push({ type: 'module', label: mod.title, meta: 'Q' + q.number + ' · Module', hash: '#/quarters/' + q.id + '/training', text: (mod.title + ' ' + (mod.tagline || '')).toLowerCase() });
        (mod.sections || []).forEach(sec => {
          idx.push({ type: 'section', label: sec.h, meta: 'Q' + q.number + ' · ' + mod.title, hash: '#/quarters/' + q.id + '/training', text: sec.h.toLowerCase() });
          (sec.items || []).forEach(item => {
            idx.push({ type: 'concept', label: item, meta: 'Q' + q.number + ' · ' + mod.title + ' › ' + sec.h, hash: '#/quarters/' + q.id + '/training', text: item.toLowerCase() });
          });
        });
      });
    });
    if (CONTENT.codeOfEthics && CONTENT.codeOfEthics.standards) {
      CONTENT.codeOfEthics.standards.forEach(std => {
        idx.push({ type: 'code', label: 'Standard ' + std.n + ': ' + std.title, meta: 'Code of Ethics', hash: '#/code', text: (std.title + ' ' + (std.description || '')).toLowerCase() });
      });
    }
    this._searchIndex = idx;
  },
  searchFor(query) {
    if (!this._searchIndex) this.buildSearchIndex();
    const q = query.trim().toLowerCase();
    if (q.length < 2) return [];
    const terms = q.split(/\s+/);
    const scored = [];
    this._searchIndex.forEach(entry => {
      let score = 0;
      let allMatch = true;
      for (const t of terms) {
        if (entry.text.includes(t)) {
          score += entry.label.toLowerCase().includes(t) ? 3 : 1;
        } else {
          allMatch = false;
          break;
        }
      }
      if (allMatch) scored.push({ entry, score });
    });
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 20).map(x => x.entry);
  },
  renderSearchResults(query, resultsEl) {
    if (!resultsEl) resultsEl = document.getElementById('searchPanel');
    if (!resultsEl) return;
    if (!query || query.length < 2) {
      resultsEl.classList.remove('open');
      resultsEl.innerHTML = '';
      return;
    }
    const results = this.searchFor(query);
    if (results.length === 0) {
      resultsEl.innerHTML = '<div class="search-empty">No matches found</div>';
    } else {
      resultsEl.innerHTML = results.map(r => {
        return '<div class="search-result" data-search-hash="' + r.hash + '">' +
          '<div class="sr-match">' + esc(r.label) + '</div>' +
          '<div class="sr-meta">' + esc(r.meta) + '</div>' +
        '</div>';
      }).join('');
    }
    resultsEl.classList.add('open');
  },
  wireSearch() {
    const input = document.getElementById('searchInput');
    const resultsEl = document.getElementById('searchPanel');
    if (!input || !resultsEl) return;
    const render = (q) => this.renderSearchResults(q, resultsEl);
    input.addEventListener('input', (e) => render(e.target.value));
    input.addEventListener('focus', (e) => { if (e.target.value) render(e.target.value); });
    document.addEventListener('click', (e) => {
      const r = e.target.closest('[data-search-hash]');
      if (r) {
        location.hash = r.getAttribute('data-search-hash');
        input.value = '';
        resultsEl.classList.remove('open');
        return;
      }
      if (!e.target.closest('.global-search')) {
        resultsEl.classList.remove('open');
      }
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        resultsEl.classList.remove('open');
        input.blur();
      } else if (e.key === 'Enter') {
        const first = resultsEl.querySelector('.search-result');
        if (first) {
          location.hash = first.getAttribute('data-search-hash');
          input.value = '';
          resultsEl.classList.remove('open');
        }
      }
    });
  },

  renderNav() {
    const role = Store.getState().ui.role;
    const { parts } = Router.current();
    const section = parts[0] || 'dashboard';
    this.navEl.innerHTML = NAV
      .filter(n => n.roles.includes(role))
      .map(n => `<a data-nav="${n.path}" class="${n.path === section ? 'active' : ''}">${esc(n.label)}</a>`)
      .join('');
  },

  render() {
    // Preserve focus and scroll position across re-renders
    const active = document.activeElement;
    let focusKey = null;
    let selStart = null, selEnd = null;
    const scrollY = window.scrollY || 0;
    if (active && active !== document.body && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
      focusKey = this.getFocusKey(active);
      if (active.selectionStart !== undefined) {
        try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e) {}
      }
    }

    const { parts } = Router.current();
    const section = parts[0] || 'dashboard';
    const qid = parts[1] || '';
    const sub = parts[2] || '';

    // Nav entries are no longer role-gated — single unified view

    let html = '';
    try {
      if (section === 'dashboard') html = Views.dashboard();
      else if (section === 'quarters') html = Views.quarters(qid, sub);
      else if (section === 'competency') html = Views.competency();
      else if (section === 'approach') html = Views.approach();
      else if (section === 'code') html = Views.code();
      else if (section === 'resources') html = Views.resources();
      else if (section === 'history') html = Views.history();
      else if (section === 'settings') html = Views.settings();
      else html = `<div class="empty"><h3>Page not found</h3><p>No such route: <code>${esc(location.hash)}</code></p><a class="btn btn-primary" href="#/dashboard">Go to Dashboard</a></div>`;
    } catch (e) {
      console.error(e);
      html = `<div class="empty"><h3>Something went wrong rendering this page</h3><p class="mono">${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">Reload</button></div>`;
    }
    this.root.innerHTML = html;
    this.renderNav();
    EditMode.apply(this.root);

    // Restore focus and scroll
    if (focusKey) {
      const el = this.findFocusTarget(focusKey);
      if (el) {
        el.focus();
        if (selStart !== null && el.setSelectionRange) {
          try { el.setSelectionRange(selStart, selEnd); } catch(e) {}
        }
      }
    }
    // Restore scroll position
    window.scrollTo(0, scrollY);
  },

  getFocusKey(el) {
    const attrs = ['data-bind','data-bind-num','data-bind-checkbox','data-log-field','data-log-check','data-dil-field','data-dil-standard','data-soa-field','data-task-field','data-milestone-note','data-milestone-check','data-comp-score','data-signoff','data-supchk','data-module-hours','data-module-done','data-module-check','data-signoff-tick','data-signoff-name','data-signoff-date','data-workshop-note','data-asmt','data-asmt-pass','data-readiness','data-refmeta','data-actfield'];
    for (const a of attrs) {
      const v = el.getAttribute(a);
      if (v) return { attr: a, value: v };
    }
    return null;
  },
  findFocusTarget(key) {
    try { return document.querySelector(`[${key.attr}="${CSS.escape(key.value)}"]`); }
    catch(e) { return document.querySelector(`[${key.attr}="${key.value}"]`); }
  },

  wireGlobalEvents() {
    document.addEventListener('click', (e) => {
      // While editing inline text, let the browser place the caret — skip app click handlers
      if (EditMode.active && e.target.closest('[contenteditable="true"]')) return;

      // Competency behavioural level buttons + observable-levels toggle
      const lvlBtn = e.target.closest('[data-lvl]');
      if (lvlBtn) { const [quarter, key, who, n] = lvlBtn.getAttribute('data-lvl').split(':'); Actions.setCompetencyScore(quarter, key, who, Number(n)); return; }
      const compQ = e.target.closest('[data-compq]');
      if (compQ) { Actions.setCompQuarter(compQ.getAttribute('data-compq')); return; }
      const cycK = e.target.closest('[data-cycle-kind]');
      if (cycK) { e.stopPropagation(); const [key, next] = cycK.getAttribute('data-cycle-kind').split(':'); Actions.setMilestoneKind(key, next); return; }
      const cycT = e.target.closest('[data-cycle-tag]');
      if (cycT) { e.stopPropagation(); const [id, next] = cycT.getAttribute('data-cycle-tag').split(':'); Actions.setModuleTag(id, next); return; }
      const lvlInfo = e.target.closest('[data-lvlinfo]');
      if (lvlInfo) { const d = document.getElementById('lvld_' + lvlInfo.getAttribute('data-lvlinfo')); if (d) d.hidden = !d.hidden; return; }
      const refRate = e.target.closest('[data-refrate]');
      if (refRate) { const [qid, who, n] = refRate.getAttribute('data-refrate').split(':'); Actions.setReflectionRating(qid, who, Number(n)); return; }
      const refDec = e.target.closest('[data-refdecision]');
      if (refDec) { const [qid, key] = refDec.getAttribute('data-refdecision').split(':'); Actions.setReflectionDecision(qid, key); return; }
      const histF = e.target.closest('[data-history-filter]');
      if (histF) { const v = histF.getAttribute('data-history-filter'); Store.mutate(s => { s.ui.historyFilter = v; }); return; }
      const roleBtn = e.target.closest('[data-role-set]');
      if (roleBtn) { const r = roleBtn.getAttribute('data-role-set'); Store.mutate(s => { s.ui.role = r; }); document.querySelectorAll('.role-switch button').forEach(b => b.classList.toggle('active', b.getAttribute('data-role-set') === r)); return; }

      // Top nav
      const navLink = e.target.closest('[data-nav]');
      if (navLink) {
        e.preventDefault();
        Router.navigate('#/' + navLink.getAttribute('data-nav'));
        const tn = document.getElementById('topnav');
        if (tn) tn.classList.remove('open');
        return;
      }

      // Journey strip / timeline (jump between quarters) — always land on overview
      const jump = e.target.closest('[data-jump-q]');
      if (jump) {
        Router.navigate('#/quarters/' + jump.getAttribute('data-jump-q') + '/overview');
        return;
      }

      // Quarter subpage tab
      const subpage = e.target.closest('[data-subpage]');
      if (subpage) {
        const { parts } = Router.current();
        const qid = parts[1] || 'q1';
        Router.navigate('#/quarters/' + qid + '/' + subpage.getAttribute('data-subpage'));
        return;
      }

      // Milestone expand
      const msHead = e.target.closest('[data-toggle-milestone]');
      if (msHead && !e.target.matches('input[type=checkbox]')) {
        const li = msHead.closest('.milestone');
        if (li) {
          const body = li.querySelector('.milestone-body');
          const arr = li.querySelector('.milestone-arrow');
          if (body) body.classList.toggle('open');
          if (arr) arr.classList.toggle('open');
        }
        return;
      }

      // Milestone checkbox — requires proof-of-evidence confirmation before ticking.
      const msChk = e.target.closest('[data-milestone-check]');
      if (msChk && msChk.tagName === 'INPUT') {
        e.stopPropagation();
        e.preventDefault(); // don't visually toggle until confirmed; state drives the checkbox
        Actions.handleMilestoneToggle(msChk.getAttribute('data-milestone-check'));
        return;
      }

      // Training module expand — also persist to state so re-renders keep it open
      const modHead = e.target.closest('[data-toggle-module]');
      if (modHead && !e.target.matches('input,label,a,button')) {
        const mod = modHead.closest('.module');
        if (mod) {
          const body = mod.querySelector('.module-body');
          const arr = mod.querySelector('.module-arrow');
          const willOpen = body && !body.classList.contains('open');
          if (body) body.classList.toggle('open');
          if (arr) arr.classList.toggle('open');
          const modId = modHead.getAttribute('data-toggle-module');
          // Update state WITHOUT triggering a re-render (direct mutation + persist)
          Actions.setModuleOpenSilent(modId, willOpen);
        }
        return;
      }

      // Action buttons
      const act = e.target.closest('[data-action]');
      if (act) {
        const a = act.getAttribute('data-action');
        if (a === 'add-log') Actions.addLogEntry();
        else if (a === 'add-module') Actions.addCustomModule(act.getAttribute('data-quarter'));
        else if (a === 'add-section') Actions.addCustomSection(act.getAttribute('data-module'));
        else if (a === 'delete-custom-section') Actions.deleteCustomSection(act.getAttribute('data-module'), Number(act.getAttribute('data-idx')));
        else if (a === 'add-key-concept') Actions.addKeyConcept(act.getAttribute('data-module'), Number(act.getAttribute('data-section')));
        else if (a === 'delete-key-concept') Actions.deleteKeyConcept(act.getAttribute('data-module'), Number(act.getAttribute('data-section')), Number(act.getAttribute('data-idx')));
        else if (a === 'delete-module') Actions.deleteCustomModule(act.getAttribute('data-module'));
        else if (a === 'print-quarter') Actions.printQuarter(act.getAttribute('data-quarter'));
        else if (a === 'add-resource-category') Actions.addResourceCategory();
        else if (a === 'add-resource-link') Actions.addResourceLink(act.getAttribute('data-category'));
        else if (a === 'delete-resource') Actions.deleteResource(act.getAttribute('data-id'));
        else if (a === 'add-dilemma') Actions.addDilemma();
        else if (a === 'recalc-dates') Actions.recalcDates();
        else if (a === 'export') Actions.exportJSON();
        else if (a === 'export-shareable') Actions.exportShareableHTML();
        else if (a === 'add-dev-action') Actions.addDevAction(act.getAttribute('data-quarter'));
        else if (a === 'del-dev-action') { if (confirm('Delete this development action?')) Actions.deleteDevAction(act.getAttribute('data-id')); }
        else if (a === 'sign-module') Actions.signModule(act.getAttribute('data-module'));
        else if (a === 'unlock-module-sign') Actions.unlockModuleSign(act.getAttribute('data-module'));
        else if (a === 'lock-signoff') Actions.lockSignoff();
        else if (a === 'unlock-signoff') Actions.unlockSignoff();
        else if (a === 'clear-signoff-password') Actions.clearSignoffPassword();
        else if (a === 'reset-edits') Actions.resetContentOverrides();
        else if (a === 'import') {
          const f = document.getElementById('importFileInput');
          if (f && f.files[0]) Actions.importJSON(f.files[0]);
          else alert('Choose a JSON file first.');
        }
        else if (a === 'print') window.print();
        else if (a === 'reset') Actions.resetAll();
        return;
      }

      // Delete buttons
      const logDel = e.target.closest('[data-log-delete]');
      if (logDel) { Actions.deleteLogEntry(logDel.getAttribute('data-log-delete')); return; }
      const dilDel = e.target.closest('[data-dil-delete]');
      if (dilDel) { if (confirm('Delete this dilemma?')) Actions.deleteDilemma(dilDel.getAttribute('data-dil-delete')); return; }

      // Theme toggle
      if (e.target.closest('#themeToggle')) {
        const t = Store.getState().ui.theme === 'dark' ? 'light' : 'dark';
        Actions.setTheme(t);
        document.getElementById('themeToggle').textContent = t === 'dark' ? '☀️' : '🌙';
        return;
      }

      // Mobile nav
      if (e.target.closest('#menuBtn')) {
        const tn = document.getElementById('topnav');
        if (tn) tn.classList.toggle('open');
        return;
      }

      // Brand click
      if (e.target.closest('#brandLink')) {
        Router.navigate('#/dashboard');
        return;
      }
    });

    // CHANGE event
    document.addEventListener('change', (e) => {
      const rdChk = e.target.closest('[data-readiness]');
      if (rdChk) {
        const [qid, phase, idx] = rdChk.getAttribute('data-readiness').split(':');
        Actions.toggleReadiness(qid, phase, Number(idx), rdChk.checked);
        return;
      }
      const refMeta = e.target.closest('[data-refmeta]');
      if (refMeta) { const [qid, field] = refMeta.getAttribute('data-refmeta').split(':'); Actions.setReflectionMeta(qid, field, refMeta.value); return; }
      const actField = e.target.closest('[data-actfield]');
      if (actField) { const [id, field] = actField.getAttribute('data-actfield').split(':'); Actions.updateDevAction(id, field, actField.value); return; }
      const asmtPass = e.target.closest('[data-asmt-pass]');
      if (asmtPass) { Actions.setModuleAssessmentPass(asmtPass.getAttribute('data-asmt-pass'), asmtPass.checked); return; }
      const asmtF = e.target.closest('[data-asmt]');
      if (asmtF) { const [id, field] = asmtF.getAttribute('data-asmt').split(':'); Actions.setModuleAssessment(id, field, asmtF.value); return; }
      const modChk = e.target.closest('[data-module-check]');
      if (modChk) {
        const [mid, key] = modChk.getAttribute('data-module-check').split(':');
        Actions.setModuleCheck(mid, key, modChk.checked);
        return;
      }
      const sigChk = e.target.closest('[data-signoff-tick]');
      if (sigChk) {
        const [mid, idx] = sigChk.getAttribute('data-signoff-tick').split(':');
        Actions.setSignoffTick(mid, idx, sigChk.checked);
        return;
      }
      const sigName = e.target.closest('[data-signoff-name]');
      if (sigName) {
        Actions.setSignoffField(sigName.getAttribute('data-signoff-name'), 'name', sigName.value);
        return;
      }
      const sigDate = e.target.closest('[data-signoff-date]');
      if (sigDate) {
        Actions.setSignoffField(sigDate.getAttribute('data-signoff-date'), 'date', sigDate.value);
        return;
      }

      const t = e.target;
      const bind = t.getAttribute('data-bind');
      if (bind) { setPath(bind, t.value); return; }
      const bindNum = t.getAttribute('data-bind-num');
      if (bindNum) { setPath(bindNum, Number(t.value) || 0); return; }
      const bindCb = t.getAttribute('data-bind-checkbox');
      if (bindCb) { setPath(bindCb, t.checked); return; }

      const logF = t.getAttribute('data-log-field');
      if (logF) {
        const [id, field] = logF.split(':');
        const val = t.type === 'number' ? (Number(t.value) || 0) : t.value;
        Actions.updateLogEntry(id, { [field]: val });
        return;
      }
      const logCk = t.getAttribute('data-log-check');
      if (logCk) { Actions.updateLogEntry(logCk, { structured: t.checked }); return; }

      const dilF = t.getAttribute('data-dil-field');
      if (dilF) {
        const [id, field] = dilF.split(':');
        const val = field === 'quarter' ? Number(t.value) : t.value;
        Actions.updateDilemma(id, { [field]: val });
        return;
      }
      const dilS = t.getAttribute('data-dil-standard');
      if (dilS) {
        const [id, nStr] = dilS.split(':');
        const n = Number(nStr);
        Store.mutate(s => {
          const d = s.dilemmas.find(x => x.id === id);
          if (!d) return;
          if (t.checked && !d.standards.includes(n)) d.standards.push(n);
          if (!t.checked) d.standards = d.standards.filter(x => x !== n);
        });
        return;
      }



      const so = t.getAttribute('data-signoff');
      if (so) { Actions.setSupervisorSignoff(so, t.value); return; }

      const modDone = t.getAttribute('data-module-done');
      if (modDone) { Actions.toggleModule(modDone); return; }
      const modHrs = t.getAttribute('data-module-hours');
      if (modHrs) { Actions.setModuleHours(modHrs, t.value); return; }

      const supchk = t.getAttribute('data-supchk');
      if (supchk) { Actions.setSupervisorCheck(supchk, t.checked); return; }
    });

    // BLUR for inline-edited content (contenteditable) — persist override silently
    document.addEventListener('blur', (e) => {
      const t = e.target;
      if (EditMode.active && t.getAttribute && t.getAttribute('data-edit-key')) {
        EditMode.saveFrom(t);
      }
    }, true);

    // BLUR for textareas (persist on blur) — prevents re-render-on-keystroke flicker
    document.addEventListener('blur', (e) => {
      const t = e.target;
      if (t.tagName !== 'TEXTAREA' && t.tagName !== 'INPUT') return;
      const mn = t.getAttribute('data-milestone-note');
      if (mn) { Actions.setMilestoneNote(mn, t.value); return; }
      const wn = t.getAttribute('data-workshop-note');
      if (wn) { Actions.setWorkshopNote(wn, t.value); return; }
      const bind = t.getAttribute('data-bind');
      if (bind) { setPath(bind, t.value); return; }
    }, true);

    // Live update competency slider value display
    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.matches('[data-comp-score]')) {
        const row = t.closest('.assess-row');
        if (row) {
          const valEl = row.querySelector('.val');
          if (valEl) valEl.textContent = t.value;
        }
      }
    });
  }
};

// ============================================================
//  CHANGE HISTORY (in-app audit log)
//  A local, append-only record of who changed what, and when.
//  NOTE: this is a convenience record stored in the same browser as the
//  data, so it is NOT a tamper-proof system of record. Export regularly.
// ============================================================
let __auditSeq = 0;
function currentActor(s) {
  const role = (s.ui && s.ui.role) || 'candidate';
  const nm = role === 'supervisor' ? (s.profile && s.profile.supervisorName) : (s.profile && s.profile.candidateName);
  return (role === 'supervisor' ? 'Supervisor' : 'Candidate') + (nm ? ' (' + nm + ')' : '');
}
function pushAudit(s, action, detail, meta) {
  meta = meta || {};
  if (!Array.isArray(s.auditLog)) s.auditLog = [];
  s.auditLog.unshift({
    id: 'a' + Date.now().toString(36) + '_' + (__auditSeq++),
    ts: new Date().toISOString(),
    actor: meta.actor || currentActor(s),
    cat: meta.cat || 'general',
    action: action,
    detail: detail || '',
    from: (meta.from === undefined || meta.from === null) ? '' : String(meta.from),
    to: (meta.to === undefined || meta.to === null) ? '' : String(meta.to)
  });
  if (s.auditLog.length > 3000) s.auditLog.length = 3000;
}
function milestoneTitleByKey(key) {
  const parts = String(key).split('_'); const idx = Number(parts.pop()); const qid = parts.join('_');
  const q = CONTENT.quarters.find(x => x.id === qid);
  return (q && q.milestones[idx]) ? q.milestones[idx].t : key;
}
function moduleTitleById(id) {
  for (const q of CONTENT.quarters) { for (const m of (q.trainingModules || [])) { if (m.id === id) return m.title; } }
  return id;
}
function moduleTagFor(m) {
  const ov = Store.getState().moduleTagOverride || {};
  return ov[m.id] || m.tag || 'core';
}
// Total vs ticked sub-items for a module (across base + custom sections/items).
function moduleItemsStatusFor(modId) {
  const s = Store.getState();
  let mdef = null;
  for (const q of CONTENT.quarters) { for (const m of (q.trainingModules || [])) { if (m.id === modId) mdef = m; } }
  if (!mdef) { for (const qid in (s.customModules || {})) { for (const m of (s.customModules[qid] || [])) { if (m.id === modId) mdef = m; } } }
  const checks = (s.moduleChecks && s.moduleChecks[modId]) || {};
  const baseSections = (mdef && mdef.sections) || [];
  const customSecs = (s.customSections && s.customSections[modId]) || [];
  const allSections = [...baseSections, ...customSecs];
  let total = 0, done = 0;
  allSections.forEach((sec, si) => {
    const base = (sec.items || []).length;
    const custom = ((s.customItems && s.customItems[modId] && s.customItems[modId][si]) || []).length;
    const t = base + custom; total += t;
    for (let ii = 0; ii < t; ii++) if (checks[si + '_' + ii]) done++;
  });
  return { total, done, allDone: total > 0 && done === total };
}
function competencyLabelByKey(key) {
  const [di, ii] = String(key).split('_');
  const dom = CONTENT.competencies[Number(di)];
  return (dom && dom.items[Number(ii)]) ? dom.items[Number(ii)] : key;
}

function setPath(path, value) {
  const gateLabels = {
    'profile.degreeVerified':'Approved degree verified',
    'profile.examPassed':'ASIC Financial Adviser Exam passed',
    'profile.farUpdatedProvisional':'FAR status → Provisional',
    'profile.finalCertificateIssued':'Final Completion Certificate issued',
    'profile.farUpdatedFullProvider':'FAR status → Relevant Provider'
  };
  Store.mutate(s => {
    const keys = path.split('.');
    let obj = s;
    for (let i = 0; i < keys.length - 1; i++) {
      if (!(keys[i] in obj)) obj[keys[i]] = {};
      obj = obj[keys[i]];
    }
    const prev = obj[keys[keys.length - 1]];
    obj[keys[keys.length - 1]] = value;
    if (gateLabels[path] && prev !== value) {
      pushAudit(s, 'PY checkpoint ' + (value ? 'ticked' : 'unticked'), gateLabels[path], { cat:'gate', from: prev ? 'ticked' : 'unticked', to: value ? 'ticked' : 'unticked' });
    }
  });
}

/* ============================================================
   AUTOSAVE INDICATOR
   State already persists on every change; this flashes a visible
   "Saving… / Saved" pill and a periodic flush guarantees anything
   typed but not yet blurred is written every couple of seconds.
============================================================ */
let __saveTimer = null;
function flashSaved() {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  el.classList.add('saving');
  const t = el.querySelector('.txt');
  if (t) t.textContent = 'Saving…';
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(() => {
    el.classList.remove('saving');
    if (t) t.textContent = 'Saved';
    try { el.title = 'All changes saved · ' + new Date().toLocaleTimeString(); } catch (_) {}
  }, 500);
}
// Every 2s, flush the field currently being edited so in-progress typing
// isn't lost if the tab is closed before the field blurs.
function flushActiveField() {
  const t = document.activeElement;
  if (!t || (t.tagName !== 'TEXTAREA' && t.tagName !== 'INPUT')) return;
  const v = t.value;
  const mn = t.getAttribute('data-milestone-note');
  if (mn) { Store.mutateSilent(s => { if (s.milestones[mn]) s.milestones[mn].note = v; }); return; }
  const wn = t.getAttribute('data-workshop-note');
  if (wn) { const [modId, idx] = wn.split(':'); Store.mutateSilent(s => { (s.workshopNotes[modId] = s.workshopNotes[modId] || {})[idx] = v; }); return; }
  const bind = t.getAttribute('data-bind');
  if (bind) { Store.mutateSilent(s => { const k = bind.split('.'); let o = s; for (let i=0;i<k.length-1;i++){ o[k[i]] = o[k[i]] || {}; o = o[k[i]]; } o[k[k.length-1]] = v; }); return; }
}

/* ============================================================
   MODAL — lightweight branded dialog (proof + supervisor sign)
============================================================ */
const Modal = {
  el: null,
  open(opts) {
    this.close();
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${opts.title || ''}</h3>${opts.sub ? `<div class="modal-sub">${opts.sub}</div>` : ''}</div>
      <div class="modal-body">${opts.bodyHTML || ''}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-mclose>${opts.cancelText || 'Cancel'}</button>
        <button class="btn ${opts.confirmClass || 'btn-primary'}" data-mconfirm>${opts.confirmText || 'Confirm'}</button>
      </div></div>`;
    document.body.appendChild(back);
    this.el = back;
    const finish = () => this.close();
    back.addEventListener('click', e => { if (e.target === back) finish(); });
    back.querySelector('[data-mclose]').addEventListener('click', finish);
    const confirmBtn = back.querySelector('[data-mconfirm]');
    confirmBtn.addEventListener('click', async () => {
      if (opts.onConfirm) { const ok = await opts.onConfirm(back); if (ok === false) return; }
      finish();
    });
    back.addEventListener('keydown', e => {
      if (e.key === 'Escape') finish();
      if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); confirmBtn.click(); }
    });
    const f = back.querySelector('input,textarea');
    if (f) setTimeout(() => f.focus(), 30);
    return back;
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } }
};

/* BOOTSTRAP */
(function bootstrap() {
  const saved = Store.getState();
  document.documentElement.setAttribute('data-theme', saved.ui.theme || 'light');
  const tt = document.getElementById('themeToggle');
  if (tt) tt.textContent = (saved.ui.theme === 'dark') ? '☀️' : '🌙';
  document.querySelectorAll('.role-switch button').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-role-set') === saved.ui.role);
  });

  if (!location.hash) location.hash = '#/dashboard';

  App.mount(document.getElementById('mainContent'), document.getElementById('topnav'));

  // Autosave heartbeat — flush any in-progress edit every 2 seconds.
  setInterval(flushActiveField, 2000);
  // Save before the tab is closed / hidden so nothing is lost.
  window.addEventListener('beforeunload', flushActiveField);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushActiveField(); });
})();

</script>
