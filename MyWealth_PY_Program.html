const Store = (() => {
  let state = loadState() || seedState();
  const subscribers = new Set();
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); window.__lastSaved = Date.now(); if (typeof flashSaved === 'function') flashSaved(); }
    catch (e) { console.warn('persist failed', e); }
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      // Precedence: this browser's own saved data first; otherwise a state
      // baked into the file via "Export shareable copy" (so a recipient opening
      // a shared copy sees the sharer's edits); otherwise a blank seed.
      let s;
      if (raw) s = JSON.parse(raw);
      else if (window.__EMBEDDED_STATE__) s = JSON.parse(JSON.stringify(window.__EMBEDDED_STATE__));
      else return null;
      const seed = seedState();
      // migrations — backfill new keys
      for (const k in seed.milestones) if (!s.milestones?.[k]) { s.milestones = s.milestones||{}; s.milestones[k] = { done: false, note: '', proof: '', proofDate: '' }; }
      // backfill proof fields on existing milestones
      for (const k in (s.milestones||{})) { const m = s.milestones[k]; if (m && typeof m.proof !== 'string') m.proof = ''; if (m && typeof m.proofDate !== 'string') m.proofDate = ''; }
      // Competency scores are now per-quarter { q1:{...}, q2:{...}, q3:{...}, q4:{...} }
      if (!s.competencyScores || typeof s.competencyScores !== 'object') s.competencyScores = {};
      const compHasQuarters = ['q1','q2','q3','q4'].some(q => s.competencyScores[q]);
      if (!compHasQuarters) {
        const legacy = {};
        for (const k in s.competencyScores) { if (/^\d+_\d+$/.test(k)) legacy[k] = s.competencyScores[k]; }
        s.competencyScores = { q1: legacy, q2:{}, q3:{}, q4:{} };
      }
      ['q1','q2','q3','q4'].forEach(q => { if (!s.competencyScores[q]) s.competencyScores[q] = {}; });
      for (const q of ['q1','q2','q3','q4']) for (const k in seed.competencyScores.q1) { if (!s.competencyScores[q][k]) s.competencyScores[q][k] = { candidate: 0, supervisor: 0 }; }
      for (const k in seed.modulesDone) if (!s.modulesDone?.[k]) { s.modulesDone = s.modulesDone||{}; s.modulesDone[k] = { done: false, hours: 0, notes: '' }; }
      // backfill assessment record on existing modules
      for (const k in (s.modulesDone||{})) { const md = s.modulesDone[k]; if (md && !md.assessment) md.assessment = { format:'', result:'', attempt:1, assessor:'', date:'', passed:false, remediation:'', reassessment:'' }; }
      if (!s.ui) s.ui = seed.ui;
      if (!s.dilemmas) s.dilemmas = [];
      if (!s.logbook) s.logbook = [];
      if (!s.soaLog) s.soaLog = [];
      if (!s.taskLog) s.taskLog = [];
      if (!s.moduleChecks) s.moduleChecks = {};
      if (!s.signoffState) s.signoffState = {};
      if (!s.customModules) s.customModules = {};
      if (!s.customItems) s.customItems = {};
      if (!s.customSections) s.customSections = {};
      if (!s.workshopNotes) s.workshopNotes = {};
      if (!s.quarterReadiness) s.quarterReadiness = {};
      if (!s.reflectionMeta) s.reflectionMeta = { q1:{}, q2:{}, q3:{}, q4:{}, q5:{}, q6:{} };
      ['q1','q2','q3','q4','q5','q6'].forEach(q => { if (!s.reflectionMeta[q]) s.reflectionMeta[q] = {}; });
      if (!Array.isArray(s.devActions)) s.devActions = [];
      if (!Array.isArray(s.auditLog)) s.auditLog = [];
      if (typeof s.signoffLocked !== 'boolean') s.signoffLocked = false;
      if (typeof s.signoffPasswordHash !== 'string') s.signoffPasswordHash = '';
      if (!s.customResources) s.customResources = [];
      if (!s.openModules) s.openModules = {};
      if (!s.holdingBack) s.holdingBack = { initial:'', q1:'', q2:'', q3:'', q4:'' };
      if (!s.contentOverrides) s.contentOverrides = {};
      if (!s.milestoneKindOverride) s.milestoneKindOverride = {};
      if (!s.moduleTagOverride) s.moduleTagOverride = {};
      if (typeof s.editPasswordHash !== 'string') s.editPasswordHash = '';
      CONTENT.quarters.forEach(q => {
        (q.trainingModules || []).forEach(m => {
          if (!s.moduleChecks[m.id]) s.moduleChecks[m.id] = {};
          if (!s.signoffState[m.id]) s.signoffState[m.id] = { ticks:{}, name:'', date:'', signed:false, signedBy:'', signedAt:'' };
          else { const ss = s.signoffState[m.id]; if (typeof ss.signed !== 'boolean') ss.signed = false; if (typeof ss.signedBy !== 'string') ss.signedBy = ''; if (typeof ss.signedAt !== 'string') ss.signedAt = ''; }
        });
      });
      if (!s.reflections) s.reflections = seed.reflections;
      // Migrate reflections: q1-q6 are now objects (per-prompt answers); `final` stays string.
      // If a legacy string exists, preserve it in a `_legacy` key so it's not lost silently.
      ['q1','q2','q3','q4','q5','q6'].forEach(q => {
        const existing = s.reflections[q];
        if (existing == null) {
          s.reflections[q] = {};
        } else if (typeof existing === 'string') {
          s.reflections[q] = existing.trim() ? { _legacy: existing } : {};
        }
      });
      if (typeof s.reflections.final !== 'string') s.reflections.final = '';
      if (!s.supervisorSignoffs) s.supervisorSignoffs = seed.supervisorSignoffs;
      if (!s.supervisorChecks) s.supervisorChecks = {};
      if (!s.hours) s.hours = seed.hours;
      if (s.profile && typeof s.profile.pyPortalUrl !== 'string') s.profile.pyPortalUrl = '';
      ['q1','q2','q3','q4','q5','q6'].forEach(q => { if (!s.hours[q]) s.hours[q] = { work:0, structured:0 }; });
      return s;
    } catch (e) { console.warn(e); return null; }
  }
  function notify() { subscribers.forEach(fn => { try { fn(state); } catch (e) { console.error(e); } }); }
  return {
    getState: () => state,
    subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); },
    mutate(fn) { fn(state); persist(); notify(); },
    // Silent mutate — persists state but does NOT trigger a re-render. Used for UI-state-only
    // changes (e.g. which modules are open) so they don't cause visual flicker/collapse.
    mutateSilent(fn) { fn(state); persist(); },
    reset() { state = seedState(); persist(); notify(); },
    replace(ns) { state = ns; persist(); notify(); }
  };
})();

const Derived = {
  // Hours are now manual entry (state.hours), updated by hand — the official record lives in the TAL system for GPS.
  quarterWork(qId) { const h = (Store.getState().hours||{})[qId]; return Number(h && h.work) || 0; },
  quarterStructured(qId) { const h = (Store.getState().hours||{})[qId]; return Number(h && h.structured) || 0; },
  quarterTotal(qId) { return Derived.quarterWork(qId) + Derived.quarterStructured(qId); },
  totalWork() { return ['q1','q2','q3','q4','q5','q6'].reduce((a,q)=>a+Derived.quarterWork(q),0); },
  totalStructured() { return ['q1','q2','q3','q4','q5','q6'].reduce((a,q)=>a+Derived.quarterStructured(q),0); },
  totalHours() { return Derived.totalWork() + Derived.totalStructured(); },
  // Hours entered against training modules (structured training). These roll up
  // to the dashboard structured-training total so module hours tally on the main page.
  moduleHoursTotal() {
    const md = Store.getState().modulesDone || {};
    return Object.values(md).reduce((a, m) => a + (Number(m && m.hours) || 0), 0);
  },
  moduleHoursForQuarter(qId) {
    const s = Store.getState();
    const q = CONTENT.quarters.find(x => x.id === qId);
    if (!q) return 0;
    const custom = (s.customModules && s.customModules[qId]) || [];
    const mods = [...(q.trainingModules || []), ...custom];
    return mods.reduce((a, m) => a + (Number(s.modulesDone[m.id] && s.modulesDone[m.id].hours) || 0), 0);
  },
  // Structured training total that INCLUDES module hours (manual quarter entry + module logs).
  structuredTotal() { return Derived.totalStructured() + Derived.moduleHoursTotal(); },
  // Classify a milestone into the three tiers from its existing flags:
  //   critical  -> Mandatory PY gate (legal requirement; failing it blocks progression)
  //   req       -> MyWealth capability standard
  //   otherwise -> Development activity
  MILESTONE_KINDS: {
    gate: { key:'gate', label:'Mandatory', cls:'gate', tip:'Mandatory legal PY requirement that can block progression or completion.' },
    std:  { key:'std',  label:'MyWealth Standard', cls:'std', tip:'A MyWealth capability standard — expected performance during the PY.' },
    dev:  { key:'dev',  label:'Development', cls:'dev', tip:'A development activity — valuable exposure, not a hard gate. Exposure varies with client flow.' }
  },
  // Classify a milestone. An explicit per-milestone override (set in Edit mode) wins;
  // otherwise it's derived from the content flags.
  milestoneKind(m, key) {
    const ov = key && Store.getState().milestoneKindOverride && Store.getState().milestoneKindOverride[key];
    if (ov && Derived.MILESTONE_KINDS[ov]) return Derived.MILESTONE_KINDS[ov];
    if (m.critical) return Derived.MILESTONE_KINDS.gate;
    const isDev = /(observ|shadow|\bmock\b|workshop)/i.test(m.t || '');
    if (m.req && !isDev) return Derived.MILESTONE_KINDS.std;
    return Derived.MILESTONE_KINDS.dev;
  },
  kindProgress() {
    const ms = Store.getState().milestones;
    const out = { gate:{done:0,total:0}, std:{done:0,total:0}, dev:{done:0,total:0} };
    CONTENT.quarters.forEach(q => {
      if (q.optional) return; // exclude optional Q5/Q6 extensions from core progress
      q.milestones.forEach((m, idx) => {
        const k = Derived.milestoneKind(m, `${q.id}_${idx}`).key;
        out[k].total++;
        if (ms[`${q.id}_${idx}`] && ms[`${q.id}_${idx}`].done) out[k].done++;
      });
    });
    return out;
  },
  // Program status — critical gates OVERRIDE percentages so a high completion % can never
  // mask an incomplete legal gate. Returns { key, label, cls, reasons[] }.
  programStatus() {
    const s = Store.getState(); const p = s.profile; const currentQ = Derived.getCurrentQuarter();
    const crit = Derived.criticalMilestones();
    const blockers = [];
    const regGates = [
      { ok: p.degreeVerified,        due: 3, label: 'Approved degree not yet verified (required before Q3).' },
      { ok: p.examPassed,            due: 3, label: 'ASIC Financial Adviser Exam not yet passed (required before Q3).' },
      { ok: p.farUpdatedProvisional, due: 3, label: 'FAR status not yet updated to Provisional (start of Q3).' },
    ];
    regGates.forEach(g => { if (!g.ok && currentQ >= g.due) blockers.push(g.label); });
    crit.filter(c => !c.done && c.qNum < currentQ).forEach(c => blockers.push(`Overdue critical gate (Q${c.qNum}): ${c.title}`));

    if (p.finalCertificateIssued && crit.every(c => c.done)) {
      return { key:'ready', label:'Completion ready', cls:'status-ready',
        reasons:['All mandatory gates and critical milestones are complete — ready for the Final Completion Certificate and FAR update.'] };
    }
    if (blockers.length) return { key:'blocked', label:'Progression blocked', cls:'status-blocked', reasons: blockers };

    const attn = [];
    if (!p.examPassed && currentQ >= 2) attn.push('Book and sit the ASIC Financial Adviser Exam — required before Q3.');
    crit.filter(c => !c.done && c.qNum === currentQ).forEach(c => attn.push(`Critical gate due this quarter: ${c.title}`));
    if (attn.length) return { key:'attention', label:'Attention required', cls:'status-attention', reasons: attn };

    return { key:'ontrack', label:'On track', cls:'status-ontrack',
      reasons:['No outstanding gates for your current quarter — keep progressing through your milestones and modules.'] };
  },
  milestoneProgress(qId = null) {
    const ms = Store.getState().milestones;
    const keys = Object.keys(ms).filter(k => !qId || k.startsWith(qId + '_'));
    const done = keys.filter(k => ms[k].done).length;
    return { done, total: keys.length, pct: keys.length ? Math.round(done / keys.length * 100) : 0 };
  },
  criticalMilestones() {
    const ms = Store.getState().milestones;
    const out = [];
    CONTENT.quarters.forEach(q => {
      q.milestones.forEach((m, idx) => {
        if (m.critical) {
          const key = `${q.id}_${idx}`;
          out.push({ quarter: q.id, qNum: q.number, title: m.t, done: !!ms[key]?.done, optional: q.optional });
        }
      });
    });
    return out.filter(c => !c.optional);
  },
  overallPct() {
    const workH = Derived.totalWork(), structH = Derived.structuredTotal();
    const hoursPct = Math.min(100, (workH / 1500) * 50 + (structH / 100) * 50);
    const mp = Derived.milestoneProgress();
    // only count mandatory quarters (q1-q4) for mandatory-requirement progress
    const mandKeys = Object.keys(Store.getState().milestones).filter(k => !k.startsWith('q5_') && !k.startsWith('q6_'));
    const mandDone = mandKeys.filter(k => Store.getState().milestones[k].done).length;
    const mandPct = mandKeys.length ? Math.round(mandDone / mandKeys.length * 100) : 0;
    return Math.round((hoursPct + mandPct) / 2);
  },
  getCurrentQuarter() {
    const p = Store.getState().profile;
    const t = todayISO();
    if (p.q4Start && t >= p.q4Start) return 4;
    if (p.q3Start && t >= p.q3Start) return 3;
    if (p.q2Start && t >= p.q2Start) return 2;
    if (p.q1Start && t >= p.q1Start) return 1;
    return p.currentQuarter || 1;
  },
  dilemmaCount(qNum) { return Store.getState().dilemmas.filter(d => d.quarter === qNum).length; }
};

const Actions = {
  toggleMilestone(key) { Store.mutate(s => { s.milestones[key].done = !s.milestones[key].done; }); },
  setMilestoneNote(key, note) { Store.mutate(s => { s.milestones[key].note = note; }); },
  // Quarter entry/exit readiness ticks (phase = 'entry' | 'exit')
  toggleReadiness(qId, phase, idx, val) {
    Store.mutate(s => {
      if (!s.quarterReadiness) s.quarterReadiness = {};
      if (!s.quarterReadiness[qId]) s.quarterReadiness[qId] = { entry:{}, exit:{} };
      if (!s.quarterReadiness[qId][phase]) s.quarterReadiness[qId][phase] = {};
      if (val) s.quarterReadiness[qId][phase][idx] = true; else delete s.quarterReadiness[qId][phase][idx];
      const q = CONTENT.quarters.find(x => x.id === qId);
      const crit = q && q[phase] && q[phase][idx] ? q[phase][idx] : (phase + ' #' + (Number(idx)+1));
      pushAudit(s, (phase === 'entry' ? 'Entry' : 'Exit') + ' criterion ' + (val ? 'confirmed' : 'un-confirmed'), (qId ? qId.toUpperCase() + ' — ' : '') + crit, { cat:'readiness', to: val ? 'confirmed' : 'cleared' });
    });
  },
  // Ticking a milestone requires the candidate to confirm evidence is on file and
  // describe the proof. Un-ticking simply reopens it (the proof note is kept on record).
  handleMilestoneToggle(key) {
    const s = Store.getState();
    const m = s.milestones[key];
    if (!m) return;
    if (m.done) { Store.mutate(st => { st.milestones[key].done = false; pushAudit(st, 'Milestone reopened', milestoneTitleByKey(key), { cat:'milestone', from:'complete', to:'incomplete' }); }); return; }
    Modal.open({
      title: '📎 Confirm evidence of completion',
      sub: 'Milestones can only be ticked once proof is saved.',
      confirmText: 'Confirm & mark complete',
      confirmClass: 'btn-blue',
      bodyHTML: `
        <p style="margin-bottom:12px">Before marking this complete, confirm you have <b>saved a record of proof</b> that verifies it — a file note, certificate, email, screenshot or logbook entry. Describe what the proof is and where it is saved; it becomes a note on this milestone.</p>
        <label class="field"><span>Proof / evidence note</span><textarea id="mProof" placeholder="e.g. ASIC exam pass email sent to PY Manager and saved in employee folder in gdrive">${esc(m.proof || '')}</textarea></label>
        <label class="modal-check"><input type="checkbox" id="mConfirm"><span>I confirm a record of this proof has been saved and can be produced on request.</span></label>
        <div class="modal-err" id="mErr"></div>`,
      onConfirm: (root) => {
        const proof = root.querySelector('#mProof').value.trim();
        const conf = root.querySelector('#mConfirm').checked;
        const err = root.querySelector('#mErr');
        if (!proof) { err.textContent = 'Please describe the proof you have saved.'; return false; }
        if (!conf) { err.textContent = 'Please tick the confirmation box.'; return false; }
        Store.mutate(st => { const mm = st.milestones[key]; mm.done = true; mm.proof = proof; mm.proofDate = todayISO(); pushAudit(st, 'Milestone completed', milestoneTitleByKey(key) + ' — proof: ' + proof, { cat:'milestone', from:'incomplete', to:'complete' }); });
        return true;
      }
    });
  },
  // Supervisor signs a module sign-off: records name + exact date-time stamp, sets
  // the four review confirmations, and locks the block. Protected by the supervisor PIN
  // so the candidate cannot self-complete it.
  signModule(modId) {
    const s = Store.getState();
    const ss = s.signoffState[modId] || {};
    const hasPin = !!s.signoffPasswordHash;
    const lines = ['Key concepts covered & understood','Practical scenarios discussed','Questions answered; Q&A completed','Candidate demonstrated applied understanding'];
    Modal.open({
      title: '✍️ Supervisor sign-off',
      sub: hasPin ? 'Enter the supervisor PIN to sign and date-stamp.' : 'Set a supervisor PIN, then sign.',
      confirmText: 'Sign & date-stamp',
      confirmClass: 'btn-sign',
      bodyHTML: `
        <p style="margin-bottom:12px">Signing confirms the supervisor reviewed this module with the candidate. It records the supervisor name and an exact date &amp; time stamp, then locks the section.</p>
        <div style="margin-bottom:12px">${lines.map(t => `<div class="signoff-tick-line"><span class="box">✓</span><span>${t}</span></div>`).join('')}</div>
        <label class="field"><span>Supervisor name</span><input type="text" id="sgName" value="${esc(ss.name || s.profile.supervisorName || '')}" placeholder="Full name"></label>
        <label class="field"><span>${hasPin ? 'Supervisor PIN' : 'Create a supervisor PIN (min 4 characters)'}</span><input type="password" id="sgPin" placeholder="••••" autocomplete="off"></label>
        ${hasPin ? '' : '<label class="field"><span>Confirm PIN</span><input type="password" id="sgPin2" placeholder="••••" autocomplete="off"></label>'}
        <label class="modal-check"><input type="checkbox" id="sgConfirm"><span>I am the supervisor and I attest to the above.</span></label>
        <div class="modal-err" id="sgErr"></div>`,
      onConfirm: async (root) => {
        const err = root.querySelector('#sgErr');
        const name = root.querySelector('#sgName').value.trim();
        const pin = root.querySelector('#sgPin').value;
        const conf = root.querySelector('#sgConfirm').checked;
        if (!name) { err.textContent = 'Enter the supervisor name.'; return false; }
        if (!pin || pin.length < 4) { err.textContent = 'PIN must be at least 4 characters.'; return false; }
        if (!conf) { err.textContent = 'Please tick the attestation box.'; return false; }
        let hash;
        if (hasPin) {
          hash = await Actions._hash(pin);
          if (hash !== s.signoffPasswordHash) { err.textContent = 'Incorrect supervisor PIN.'; return false; }
        } else {
          const pin2 = root.querySelector('#sgPin2').value;
          if (pin !== pin2) { err.textContent = 'PINs do not match.'; return false; }
          hash = await Actions._hash(pin);
        }
        const nowIso = new Date().toISOString();
        Store.mutate(st => {
          if (!st.signoffPasswordHash) st.signoffPasswordHash = hash;
          const t = st.signoffState[modId] || (st.signoffState[modId] = { ticks:{}, name:'', date:'' });
          t.signed = true; t.signedBy = name; t.signedAt = nowIso; t.name = name; t.date = todayISO();
          t.ticks = { 0:true, 1:true, 2:true, 3:true };
          pushAudit(st, 'Supervisor sign-off signed', moduleTitleById(modId), { cat:'signoff', actor: 'Supervisor (' + name + ')', to:'signed' });
        });
        return true;
      }
    });
  },
  async unlockModuleSign(modId) {
    const s = Store.getState();
    if (!s.signoffPasswordHash) { Store.mutate(st => { const t = st.signoffState[modId]; if (t) { const who = t.signedBy; t.signed = false; pushAudit(st, 'Supervisor sign-off revoked', moduleTitleById(modId), { cat:'signoff', actor: who ? 'Supervisor (' + who + ')' : undefined, from:'signed', to:'revoked' }); } }); return; }
    const pin = prompt('Enter the supervisor PIN to amend / revoke this signature:');
    if (!pin) return;
    const hash = await Actions._hash(pin);
    if (hash !== s.signoffPasswordHash) { alert('❌ Incorrect PIN.'); return; }
    Store.mutate(st => { const t = st.signoffState[modId]; if (t) { const who = t.signedBy; t.signed = false; pushAudit(st, 'Supervisor sign-off revoked', moduleTitleById(modId), { cat:'signoff', actor: who ? 'Supervisor (' + who + ')' : undefined, from:'signed', to:'revoked' }); } });
  },
  setWorkshopNote(key, note) {
    // key format: "modId:idx"
    const [modId, idx] = key.split(':');
    Store.mutateSilent(s => {
      if (!s.workshopNotes) s.workshopNotes = {};
      if (!s.workshopNotes[modId]) s.workshopNotes[modId] = {};
      s.workshopNotes[modId][idx] = note;
    });
  },
  async _hash(str) {
    const enc = new TextEncoder().encode(str);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  },
  async lockSignoff() {
    const s = Store.getState();
    if (s.signoffLocked) { alert('Already locked.'); return; }
    const pw = prompt('Set a supervisor password to lock sign-off sections.\n\nOnly someone with this password will be able to tick supervisor sign-off boxes.\n\nEnter password (min 4 chars):');
    if (!pw || pw.length < 4) { alert('Cancelled or too short.'); return; }
    const confirm2 = prompt('Confirm password:');
    if (confirm2 !== pw) { alert('Passwords do not match — not locked.'); return; }
    const hash = await Actions._hash(pw);
    Store.mutate(s => {
      s.signoffPasswordHash = hash;
      s.signoffLocked = true;
    });
    alert('🔒 Supervisor sign-off locked. Unlock with the password to edit ticks.');
  },
  async unlockSignoff() {
    const s = Store.getState();
    if (!s.signoffLocked) return;
    const pw = prompt('Enter supervisor password to unlock sign-off:');
    if (!pw) return;
    const hash = await Actions._hash(pw);
    if (hash !== s.signoffPasswordHash) { alert('❌ Wrong password.'); return; }
    Store.mutate(s => { s.signoffLocked = false; });
    alert('✓ Unlocked. Sign-off sections are now editable.');
  },
  async clearSignoffPassword() {
    const s = Store.getState();
    if (!s.signoffPasswordHash) { alert('No password set.'); return; }
    const pw = prompt('Enter current supervisor password to remove lock:');
    if (!pw) return;
    const hash = await Actions._hash(pw);
    if (hash !== s.signoffPasswordHash) { alert('❌ Wrong password.'); return; }
    if (!confirm('Remove supervisor password entirely? Sign-off will be unlocked and stay unlocked.')) return;
    Store.mutate(s => { s.signoffLocked = false; s.signoffPasswordHash = ''; });
    alert('Password removed.');
  },
  async setupEditPassword() {
    const s = Store.getState();
    if (s.editPasswordHash) { alert('An edit password is already set. Remove it first to change it.'); return false; }
    const pw = prompt('Set an EDIT password.\n\nEdit mode lets you click any text in the app and change the wording. Changes are stored locally in this browser only (this is a convenience layer, not secure storage).\n\nEnter password (min 4 chars):');
    if (!pw || pw.length < 4) { alert('Cancelled or too short.'); return false; }
    const confirm2 = prompt('Confirm edit password:');
    if (confirm2 !== pw) { alert('Passwords do not match.'); return false; }
    const hash = await Actions._hash(pw);
    Store.mutate(s => { s.editPasswordHash = hash; });
    return true;
  },
  async verifyEditPassword() {
    const s = Store.getState();
    const pw = prompt('Enter edit password to turn on Edit mode:');
    if (!pw) return false;

    if (hash !== s.editPasswordHash) { alert('❌ Wrong password.'); return false; }

  },
  async clearEditPassword() {
    const s = Store.getState();
    if (!s.editPasswordHash) { alert('No edit password set.'); return; }

  setMilestoneKind(key, kind) {

      if (kind) s.milestoneKindOverride[key] = kind; else delete s.milestoneKindOverride[key];
      pushAudit(s, 'Milestone reclassified', milestoneTitleByKey(key) + ' → ' + ((Derived.MILESTONE_KINDS[kind]||{}).label || kind), { cat:'milestone', to: kind });

  },
  setModuleTag(id, tag) {

      if (!s.moduleTagOverride) s.moduleTagOverride = {};
      s.moduleTagOverride[id] = tag;
      pushAudit(s, 'Module recategorised', moduleTitleById(id) + ' → ' + ((MODULE_TAGS.find(t => t.value === tag) || {}).label || tag), { cat:'module', to: tag });

  saveContentOverride(key, value, orig) {

  toggleModule(id) { Store.mutate(s => { const nv = !s.modulesDone[id].done; s.modulesDone[id].done = nv; pushAudit(s, 'Module content ' + (nv ? 'completed' : 'reopened'), moduleTitleById(id), { cat:'module', from: !nv, to: nv }); }); },
  // Assessment record — text/select fields persist silently (no flicker); the pass toggle re-renders the status.

  updateProfile(patch) { Store.mutate(s => { Object.assign(s.profile, patch); }); },
  recalcDates() {

  addLogEntry() { Store.mutate(s => { s.logbook.unshift({ id: uid('log'), date: todayISO(), quarter: 'q' + Derived.getCurrentQuarter(), type: 'observed', hours: 0, activity: '', description: '', structured: false }); }); },
  updateLogEntry(id, p) { Store.mutate(s => { const e = s.logbook.find(x => x.id === id); if (e) Object.assign(e, p); }); },
  deleteLogEntry(id) { Store.mutate(s => { s.logbook = s.logbook.filter(x => x.id !== id); }); },

  addCustomModule(quarterId) {

  addCustomSection(modId) {

      for (const qid in s.customModules) {
        const mod = (s.customModules[qid] || []).find(m => m.id === modId);
        if (mod) {
          mod.sections = mod.sections || [];

      if (!s.customSections) s.customSections = {};

    });
  },
  deleteKeyConcept(modId, sectionIdx, customIdx) {
    if (!confirm('Remove this key concept?')) return;
    Store.mutate(s => {
      if (s.customItems[modId] && s.customItems[modId][sectionIdx]) {
        s.customItems[modId][sectionIdx].splice(customIdx, 1);
      }
    });
  },
  deleteCustomModule(modId) {
    if (!confirm('Delete this custom module and its ticks?')) return;
    Store.mutate(s => {
      for (const qid in s.customModules) {
        s.customModules[qid] = (s.customModules[qid] || []).filter(m => m.id !== modId);
      }
      delete s.modulesDone[modId];
      delete s.moduleChecks[modId];
      delete s.signoffState[modId];
      delete s.customItems[modId];
      delete s.openModules[modId];
    });
  },
  addResourceCategory() {
    const name = prompt('Category name:', 'My Resources');
    if (!name) return;
    Store.mutate(s => {
      if (!s.customResources) s.customResources = [];
      s.customResources.push({ id: 'rc_'+Math.random().toString(36).slice(2,8), category: name, isCategory: true });
    });
  },
  addResourceLink(category) {
    const title = prompt('Link title:');
    if (!title) return;
    const url = prompt('URL (https://...):');
    if (!url) return;
    const note = prompt('Optional note:', '') || '';
    Store.mutate(s => {
      if (!s.customResources) s.customResources = [];
      s.customResources.push({ id: 'r_'+Math.random().toString(36).slice(2,8), category, title, url, note });
    });
  },
  deleteResource(id) {
    if (!confirm('Delete this resource?')) return;
    Store.mutate(s => {
      const item = (s.customResources||[]).find(r => r.id === id);
      if (item && item.isCategory) {
        s.customResources = s.customResources.filter(r => r.id !== id && r.category !== item.category);
      } else {
        s.customResources = (s.customResources||[]).filter(r => r.id !== id);
      }
    });
  },
  printQuarter(quarterId) {
    const q = CONTENT.quarters.find(x => x.id === quarterId);
    if (!q) return;
    const s = Store.getState();

    // Build a print-only HTML blob combining all quarter content
    const prevHTML = document.getElementById('app').innerHTML;
    // Force the light professional theme for the printout regardless of on-screen mode.
    const prevTheme = document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', 'light');
    const combined = `
      <div class="print-quarter-wrapper">
        <div class="print-quarter-header">
          <div>
            <div class="pqh-brand">MyWealth Solutions · Professional Year</div>
            <div style="font-size:10px;color:rgba(255,255,255,.6);letter-spacing:2px;text-transform:uppercase;font-weight:700">Quarter ${q.number}</div>
            <h1 style="margin:3px 0 0">${esc(q.title)}</h1>
            <div style="font-size:12px;color:rgba(255,255,255,.82);font-style:italic;margin-top:3px">${esc(q.tagline)}</div>
          </div>
          <div class="pqh-meta">
            Printed ${new Date().toLocaleDateString('en-AU')}<br>
            Candidate: <b>${esc(s.profile.candidateName || '—')}</b><br>
            Supervisor: <b>${esc(s.profile.supervisorName || '—')}</b>
          </div>
        </div>

        <h2 style="margin-top:24px;page-break-before:auto">Overview</h2>
        ${Views._qOverview(q)}

        <h2 style="margin-top:24px;page-break-before:always">Milestones</h2>
        ${Views._qMilestones(q, s, quarterId)}

        <h2 style="margin-top:24px;page-break-before:always">Training modules</h2>
        ${Views._qTraining(q, s)}

        <h2 style="margin-top:24px;page-break-before:always">Reflection</h2>
        ${(() => {
          const prompts = Views._reflectionPrompts(quarterId);
          if (!prompts.length) {
            const legacy = typeof s.reflections[quarterId] === 'string' ? s.reflections[quarterId] : '';
            return `<div class="card"><div style="font-size:12px;line-height:1.7;white-space:pre-wrap;min-height:120px">${esc(legacy || '[No reflection yet — to complete]')}</div></div>`;
          }
          return prompts.map(p => {
            const val = Views._getReflectionValue(s, quarterId, p.key);
            return `<div class="card" style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;margin-bottom:6px">${esc(p.q)}</div><div style="font-size:12px;line-height:1.7;white-space:pre-wrap;min-height:60px">${esc(val || '[No answer yet — to complete]')}</div></div>`;
          }).join('');
        })()}
      </div>
    `;

      window.print();

  setReflection(q, v) { Store.mutate(s => { s.reflections[q] = v; }); },
  // Reflection meta — text fields persist silently; ratings/decisions re-render (variance + conditional UI).
  setReflectionMeta(qId, field, val) {
    Store.mutateSilent(s => { if (!s.reflectionMeta[qId]) s.reflectionMeta[qId] = {}; s.reflectionMeta[qId][field] = val; });
  },
  setReflectionRating(qId, who, n) {
    Store.mutate(s => { if (!s.reflectionMeta[qId]) s.reflectionMeta[qId] = {}; s.reflectionMeta[qId][who === 'supervisor' ? 'supervisorRating' : 'candidateRating'] = n; });
  },
  setReflectionDecision(qId, key) {
    Store.mutate(s => {
      if (!s.reflectionMeta[qId]) s.reflectionMeta[qId] = {};
      s.reflectionMeta[qId].decision = key;
      const label = (PROGRESSION_DECISIONS.find(d => d.key === key) || {}).label || key;
      pushAudit(s, 'Quarter progression decision', qId.toUpperCase() + ' — ' + label, { cat:'readiness', to: label });

  },
  addDevAction(qId) {
    Store.mutate(s => {
      if (!s.devActions) s.devActions = [];
      s.devActions.unshift({ id: uid('act'), quarter: qId, action:'', owner: s.profile.candidateName || '', due:'', measure:'', status:'Not started', nextReview:'', progress:'' });
    });
  },
  updateDevAction(id, field, val) {
    Store.mutateSilent(s => { const a = (s.devActions || []).find(x => x.id === id); if (a) a[field] = val; });
  },
  deleteDevAction(id) {
    Store.mutate(s => { s.devActions = (s.devActions || []).filter(x => x.id !== id); });
  },
  setCompetencyScore(quarter, key, who, v) {
    Store.mutate(s => {
      if (!s.competencyScores[quarter]) s.competencyScores[quarter] = {};
      if (!s.competencyScores[quarter][key]) s.competencyScores[quarter][key] = { candidate:0, supervisor:0 };
      const prev = s.competencyScores[quarter][key][who] || 0;
      s.competencyScores[quarter][key][who] = Number(v) || 0;
      pushAudit(s, 'Competency rating set (' + who + ', ' + String(quarter).toUpperCase() + ')', competencyLabelByKey(key) + ' → Level ' + (Number(v)||0), { cat:'competency', from:'L'+prev, to:'L'+(Number(v)||0) });
    });
  },
  setCompQuarter(q) { Store.mutate(s => { s.ui.compQuarter = q; }); },
  setSupervisorSignoff(k, v) { Store.mutate(s => { s.supervisorSignoffs[k] = v; }); },
  setSupervisorCheck(k, v) { Store.mutate(s => { s.supervisorChecks[k] = v; }); },
  setTheme(t) { Store.mutate(s => { s.ui.theme = t; }); document.documentElement.setAttribute('data-theme', t); },
  setRole(r) { Store.mutate(s => { s.ui.role = r; }); },
  exportJSON() {
    const data = JSON.stringify(Store.getState(), null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const p = Store.getState().profile;
    const safeName = (p.candidateName || 'candidate').replace(/[^a-zA-Z0-9-]/g, '_');
    a.href = url; a.download = `mywealth_py_${safeName}_${todayISO()}.json`;
    a.click(); URL.revokeObjectURL(url);
  },
  exportShareableHTML() {
    // Bake the current state into a fresh, self-contained copy of this HTML file.
    // Anyone can open the downloaded file on any device/browser and see these
    // edits as the starting point — and keep editing (their changes save to
    // their own browser). __PRISTINE_HTML__ is the app shell captured at load.
    try {
      // Escape every "<" so a stray closing-script sequence inside the data
      // can't prematurely terminate the embedded script tag.
      const json = JSON.stringify(Store.getState()).replace(/</g, '\\u003c');
      // Match the marker slot whatever it currently holds (null in the master
      // file, or a prior baked-in state) so re-exporting a shared copy works too.
      const markerRe = /window\.__EMBEDDED_STATE__=[\s\S]*?;\/\*EMBED_STATE_MARKER\*\//;
      if (!markerRe.test(__PRISTINE_HTML__)) { alert('Could not prepare shareable copy (marker missing).'); return; }
      const html = __PRISTINE_HTML__.replace(markerRe, 'window.__EMBEDDED_STATE__=' + json + ';/*EMBED_STATE_MARKER*/');
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const p = Store.getState().profile;
      const safeName = (p.candidateName || 'shared').replace(/[^a-zA-Z0-9-]/g, '_');
      a.href = url; a.download = `MyWealth_PY_Program_${safeName}_${todayISO()}.html`;
      a.click(); URL.revokeObjectURL(url);
    } catch (e) { alert('Export failed: ' + e.message); }
  },
  importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result); if (!obj.schemaVersion) throw new Error('Not a valid backup');
        Store.replace(obj);
        Store.mutate(s => pushAudit(s, 'Data imported from JSON backup', 'State replaced from file "' + (file.name || 'backup.json') + '"', { cat:'data' }));
      }
      catch (e) { alert('Import failed: ' + e.message); }
    };
    reader.readAsText(file);
  },
  resetAll() { if (confirm('Wipe all PY data in this browser? Export first if you need a backup.')) Store.reset(); }
};

/* ============================================================
   ROUTER
============================================================ */
const Router = (() => {
  const subs = new Set();
  function current() {
    const hash = location.hash.slice(1) || '/dashboard';
    const parts = hash.split('/').filter(Boolean);
    return { hash, parts };
  }
  function navigate(p) { if (!p.startsWith('#')) p = '#' + p; location.hash = p.slice(1); }
  window.addEventListener('hashchange', () => subs.forEach(fn => fn(current())));
  return { subscribe(fn) { subs.add(fn); return () => subs.delete(fn); }, current, navigate };
})();

    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><div><h3>Get the most out of your Professional Year</h3><div class="subtitle">Three things to hold in mind from day one.</div></div></div>
      <div class="get-most-grid">
        <div class="gm-card">
          <div class="gm-tag">Your Niche</div>
          <div class="gm-body">
            While going through your Professional Year training, <strong>take time to reflect on what type of clients you are most drawn to helping</strong> (is it retirees? Families? HNW?).
            <br><br>
            What advice space do you feel most engaged and attracted towards? <strong>This is the first inklings of your potential niche.</strong>
          </div>
        </div>
        <div class="gm-card">
          <div class="gm-tag">Be Patient</div>
          <div class="gm-body">
            <strong>Your PY is set out to be 12 months long.</strong>
            <br><br>
            However, in our experience, <strong>it takes a minimum 18 months+ to be fully completed</strong> and with full confidence to start advising your clients independently.
          </div>
        </div>
        <div class="gm-card">
          <div class="gm-tag">You Are Individual</div>
          <div class="gm-body">
            Associate tasks can be varied, so not all PYs will look the same. <strong>Training around associate tasks will not always be structured</strong>, as learning will take place on the job, during your tenure.
            <br><br>
            <strong>When you begin to see clients independently is also subject to career development</strong>, the position of the business, and your own personal readiness based on what your supervisor recommends.
          </div>
        </div>
      </div>
    </div>

    <div style="margin-bottom:20px">

        <div class="card-header">

        <div class="stack">
          ${CONTENT.oneOnOneAgenda.items.map((it,i) => `
            <div class="attention-row" style="cursor:default">

              <span class="attention-title">${esc(it)}</span>
            </div>`).join('')}

    <div class="alert alert-info">
      <span class="icon">ℹ️</span>

  },

  quarters(activeQ, sub) {
    const ids = ['q1','q2','q3','q4','q5','q6'];
    const active = activeQ && ids.includes(activeQ) ? activeQ : 'q1';
    const subPage = sub || 'overview';
    const quarter = CONTENT.quarters.find(q => q.id === active);
    const mp = Derived.milestoneProgress(active);
    const s = Store.getState();

    // Journey strip
    const journey = ids.map(qid => {
      const q = CONTENT.quarters.find(x => x.id === qid);
      const pr = Derived.milestoneProgress(qid);
      const isActive = qid === active;
      const isDone = pr.pct === 100;
      const label = q.optional ? `Q${q.number}*` : `Q${q.number}`;
      return `<div class="journey-node ${isActive?'active':isDone?'done':''}" data-jump-q="${qid}"><span class="journey-chip">${label}</span><span>${esc(q.title)}</span></div>`;
    }).join('<span class="journey-arrow">›</span>');

    return `
    <div class="page-head">
      <div>
        <div class="breadcrumb">Program · Quarters</div>
        <h1>Quarter-by-quarter plan</h1>
        <p class="subtitle">Sequential quarters — Q3 and Q4 <strong>cannot</strong> be accelerated. Q5 and Q6 are optional MyWealth extensions for advanced wealth management and leadership development.</p>
      </div>
    </div>

    <div class="journey-strip">${journey}</div>

    <div class="quarter-head ${active}">
      <span class="quarter-chip ${active}">Q${quarter.number}</span>
      <div class="info">
        <h2>${esc(quarter.title)}</h2>
        <div class="tagline">${esc(quarter.tagline)}</div>
      </div>
      <div class="progress-box">
        <div class="label">Milestones</div>
        <div class="big" style="color:var(--${active === 'q1' ? 'blue' : active === 'q2' ? 'green' : active === 'q3' ? 'amber' : active === 'q4' ? 'purple' : active === 'q5' ? 'coral' : 'text-muted'})">${mp.done}/${mp.total}</div>
        ${quarter.optional?'<span class="badge">Optional</span>':''}
      </div>
    </div>

    <div class="subnav">
      <button class="${subPage==='overview'?'active':''}" data-subpage="overview">Overview</button>
      <button class="${subPage==='milestones'?'active':''}" data-subpage="milestones">Milestones <span class="tab-count">${mp.done}/${mp.total}</span></button>
      <button class="${subPage==='training'?'active':''}" data-subpage="training">Training <span class="tab-count">${(quarter.trainingModules||[]).length}</span></button>
      <button class="${subPage==='workshop'?'active':''}" data-subpage="workshop">Workshop Questions</button>
      <button class="${subPage==='hours'?'active':''}" data-subpage="hours">Reflection</button>
    </div>

    ${this._quarterSubpage(quarter, subPage, s, active)}
    `;
  },

  _quarterSubpage(quarter, subPage, s, active) {
    if (subPage === 'overview') return this._qOverview(quarter);
    if (subPage === 'milestones') return this._qMilestones(quarter, s, active);
    if (subPage === 'training') return this._qTraining(quarter, s);
    if (subPage === 'workshop') return this._qWorkshop(quarter, s);
    if (subPage === 'hours') return this._qHours(quarter, s, active);
    return this._qOverview(quarter);
  },

  _qOverview(q) {
    const s = Store.getState();
    const rd = (s.quarterReadiness && s.quarterReadiness[q.id]) || { entry:{}, exit:{} };
    const readinessCol = (phase, items, icon, title) => {
      if (!items || !items.length) return '';
      const ticks = rd[phase] || {};
      const done = items.filter((_, i) => ticks[i]).length;
      const complete = done === items.length;
      return `<div class="readiness-col ${phase} ${complete?'complete':''}">
        <div class="readiness-head">${icon} <span class="readiness-title">${title}</span> <span class="readiness-count">${done}/${items.length}</span></div>
        <ul>${items.map((c, i) => `<li class="${ticks[i]?'on':''}"><input type="checkbox" data-readiness="${q.id}:${phase}:${i}" ${ticks[i]?'checked':''}><span class="readiness-crit">${esc(c)}</span></li>`).join('')}</ul>
      </div>`;
    };
    const gateAlert = {
      q1: `<div class="alert alert-navy"><span class="icon">📘</span><div><strong>Client disclosure — Q1 onwards</strong>Before any client interaction (observation or otherwise), the client must be informed in writing that you are a PY candidate and that your supervisor is responsible for any personal advice. Keep the signed acknowledgement on file.</div></div>`,
      q2: `<div class="alert alert-warn"><span class="icon">⚠️</span><div><strong>Gate to Q3</strong>You CANNOT commence Q3 work activities or structured training until (a) you pass the ASIC Financial Adviser Exam, (b) your approved degree is verified, and (c) the licensee updates your FAR status to 'Provisional Relevant Provider'.</div></div>`,
      q3: `<div class="alert alert-info"><span class="icon">⚖️</span><div><strong>Ethical dilemmas — Q3</strong>The PY Standard requires a minimum of 2 ethical dilemmas worked through in Q3. At MWS these are handled as supervisor workshop discussions and captured in your quarterly reflection — not a separate log. Q3 CANNOT be accelerated.</div></div>`,
      q4: `<div class="alert alert-info"><span class="icon">📜</span><div><strong>Completion — Q4</strong>Further 2 ethical dilemmas; licensee audit of min 5 client files; supervisor attestation across all 4 competency domains. Q4 CANNOT be accelerated. Final Completion Certificate triggers FAR update within 30 business days.</div></div>`,
      q5: `<div class="alert alert-lime"><span class="icon">✨</span><div><strong>Optional extension</strong>This quarter is not required by the PY Standard. Recommended for candidates transitioning to wealth management clients. Assumes Final Completion Certificate already issued.</div></div>`,
      q6: `<div class="alert alert-lime"><span class="icon">🏆</span><div><strong>Leadership track</strong>Optional final extension — path to senior adviser, CFP® designation, and future PY Supervisor role (requires 2+ yrs as Relevant Provider post-PY).</div></div>`
    };
    // Tooltip text for common focus-tile names
    const focusTips = {
      'Observation': 'Shadow experienced advisers on Discovery meetings, SOA presentations, and Review meetings. Document what you observed — including what you noticed about communication style, rapport, client pushback, and ethical judgment calls. Min shadowing hours vary by licensee.',
      'Systems': 'Master the firm\'s technology stack: XPLAN or equivalent CRM (client data, note-taking, document storage), calculators (PTW, How Long, Insurance Needs), Risk Researcher, Morningstar, advice software, Enzumo, IRESS. Being fast in systems is a massive productivity multiplier.',
      'Compliance': 'Licensee compliance induction covers: AML/CTF (AUSTRAC CDD obligations), Privacy Act (APPs 1–13), BID + Safe Harbour (Corporations Act s961B), DDO (Pt 7.8A, TMD match), internal dispute resolution (ASIC RG 271), record-keeping (Corporations Regs 7.7.09).',
      'Code of Ethics': 'The Financial Planners and Advisers Code of Ethics 2019 contains 12 Standards grouped into 5 Values: Trustworthiness, Competence, Honesty, Fairness, Diligence. Know all 12 Standards by number and application — heavily tested in ASIC Exam.',
      'Exam prep': 'ASIC Financial Adviser Exam — you MUST pass before commencing Q3. 3.5 hr open-book MCQ exam. Begin structured study in Q1, sit exam by end of Q2. Typical prep = 80–120 hours (25 hours count as structured PY training).',
      'Risk insurance': 'Life, TPD (Own/Any), Trauma, IP (Agreed Value/Indemnity). Product, underwriting, tax, replacement analysis, LIF commission rules, employer-paid cover, business insurance.',
      'First home': 'FHSSS mechanics, Home Guarantee Scheme, deposit strategies, borrowing capacity, stamp duty. For PPR and investment upgrade/downsize scenarios see Q3.',
      'Debt strategy': 'Debt recycling (non-deductible → deductible), debt consolidation analysis, offset vs redraw, negative gearing, lending structures. Identify when each suits.',
      'SOA drafting': 'Build the ability to author a compliant, clear SOA: scope → goals → strategy → product → implementation → fees. Master calculators, modelling tools, paraplanner handoff. Quality comes from discipline on inputs.',
      'ASIC Exam': 'Pass the ASIC Financial Adviser Exam this quarter. Without it you cannot progress to Q3. See Exam Prep module for 25-hour structured pathway.',
      'DA delivery': 'Discovery Appointments — you lead the meeting, Supervisor may be present. Demonstrate structured fact-find, risk tolerance conversation, goal-setting.',
      'SOA sign-off': 'Supervisor must review and sign every SOA you author in Q3. Build for audit trail — peer review, adviser review, supervisor final sign-off.',
      'Client meetings': 'Solo meetings for low-complexity clients with Supervisor reviewing notes afterward. Progress toward indirect supervision model.',
      'Ethics': 'Min 2 ethical dilemmas identified, worked through, and resolved in Q3 — documented with reference to 12 Standards and Safe Harbour. Same requirement in Q4.',
      'Independence': 'Operating independently of direct supervisor oversight. Supervisor countersigns SOAs but you drive end-to-end advice process.',
      'File audit': 'Licensee audit of minimum 5 client files you have produced. Covers scope definition, fact-find completeness, strategy reasoning, product research, implementation execution.',
      'Estate planning': 'Wills, BDBNs, reversionary pensions, testamentary trusts, EPoA. Recognise when to refer to an estate lawyer (always for document drafting).',
      'SMSF': 'Structure, trustee obligations, investment strategy, sole purpose test, in-specie, LRBAs, business real property, related-party arrangements. SMSF advice requires licensee authorisation.',
      'Aged care': 'Home Care Packages, Residential Aged Care (RAC), RAD/DAP, means-tested care fees, Centrelink impacts, gifting rules. Specialised area — may be scoped out if outside licensee authorisation.',
      'CPD planning': 'Year-1-post-PY CPD plan: minimum 40 hrs/yr across Technical / Client Care / Regulatory / Prof & Ethics / General categories. Document learning log for audit.',
      'Final certificate': 'Issued by licensee after audit, competency attestation, and logbook sign-off. Licensee must lodge FAR update to "Relevant Provider" within 30 business days (Corporations Act s922Q).'
    };
    // PDF session-type labels — per-quarter indicators from source doc
    const sessionFlags = {
      q1: [{ t: 'Sessions with PY Supervisor', tip: 'One-on-one structured sessions with your designated PY supervisor — logged as structured training hours' }],
      q2: [{ t: 'Sessions with PY Supervisor', tip: 'Continue regular 1:1 sessions — exam prep and module review' }],
      q3: [
        { t: 'Sessions with PY Supervisor', tip: '1:1 sessions continue throughout Q3 — script practice, case reviews' },
        { t: 'Subject to business position & readiness', tip: 'Q3 delivery activities (partial DA, reviews, SOA participation) depend on MyWealth\'s current workflow and your readiness — supervisor determines pace' }
      ],
      q4: [
        { t: 'Sessions with PY Supervisor', tip: 'Ongoing 1:1 sessions — mock DA/SOA review, audit prep' },
        { t: 'Subject to business position & readiness', tip: 'Q4 activities (mock DA/SOA cadence, SMSF training) depend on business position and candidate readiness' }
      ],
      q5: [
        { t: 'Sessions with PY Supervisor', tip: '1:1 sessions continue — first-client preparation' },
        { t: 'Managed by the COO', tip: 'Q5 (Game Time) is managed by the COO — including taking first clients, referral relationships, CSO/RSO management' }
      ],
      q6: []
    };
    const flags = sessionFlags[q.id] || [];
    return `
      <div class="card ${q.id}">
        <div class="card-header">
          <div><h3>About this quarter</h3></div>
          <div class="card-actions">
            <button class="btn btn-secondary btn-sm" data-action="print-quarter" data-quarter="${q.id}" data-tip="Prints Overview + Milestones + Training + Reflection in one combined document">🖨 Print full quarter</button>
          </div>
        </div>
        <p style="font-size:13px;line-height:1.6;color:var(--text-dim);font-family:var(--bf)">${esc(q.summary)}</p>
        ${flags.length ? `<div class="session-flags">
          ${flags.map(f => `<span class="session-flag" data-tip="${esc(f.tip)}">${esc(f.t)}</span>`).join('')}
        </div>` : ''}
        <div class="focus-grid">
          ${q.focuses.map(f => {
            const tip = focusTips[f.name] || '';
            return `<div class="focus-tile"${tip?` data-tip="${esc(tip)}"`:''}><span class="emoji">${f.emoji}</span><div class="name">${esc(f.name)}</div><div class="desc">${esc(f.desc)}</div></div>`;
          }).join('')}

      </div>
      ${(q.entry || q.exit) ? `
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div><h3>Quarter readiness</h3><div class="subtitle">Confirm each criterion with your Supervisor. <b>Entry</b> = ready to commence Q${q.number}; <b>Exit</b> = ready to progress. These make progression defensible beyond a completion %.</div></div></div>
        <div class="readiness">
          ${readinessCol('entry', q.entry, '✅', `Ready to commence Q${q.number}`)}
          ${readinessCol('exit', q.exit, '🎯', `Ready to progress from Q${q.number}`)}
        </div>
      </div>` : ''}
      <div style="margin-top:16px">${gateAlert[q.id] || ''}</div>
      ${(BOOKS_BANK[q.id] && BOOKS_BANK[q.id].length) ? `
      <div class="card" style="margin-top:16px">
        <div class="card-header"><div><h3>📚 Recommended reading — Q${q.number}</h3><div class="subtitle">A running theme through the PY. Add your own and capture takeaways (click any text to edit).</div></div></div>
        <div class="stack">
          ${BOOKS_BANK[q.id].map(b => `
            <div class="resource-card" style="border-left-color:var(--lime)">
              <div>
                <h5>${esc(b.title)}${b.author ? ` <span style="font-weight:400;color:var(--text-muted)">— ${esc(b.author)}</span>` : ''}</h5>
                <p>${esc(b.note)}</p>
              </div>
            </div>`).join('')}
        </div>
      </div>` : ''}
    `;
  },

  _reflectionPrompts(quarterId) {
    const prompts = {

        { key: 'shadow', q: '2. Shadowing another Supervisor', placeholder: 'Which Supervisor have you shadowed, across how many quarters? What have you taken from their approach?' },

  _getReflectionValue(s, quarterId, key) {
    const r = s.reflections && s.reflections[quarterId];
    if (!r) return '';
    // Back-compat: if reflection is still a legacy string, surface it against the first prompt only
    if (typeof r === 'string') {
      const prompts = this._reflectionPrompts(quarterId);
      if (prompts.length && prompts[0].key === key) return r;
      return '';
    }
    // If a _legacy string was preserved from a previous version, show it against the first prompt
    // so the user can copy it into the right sub-prompt and then clear _legacy by editing.
    if (r._legacy && !r[key]) {
      const prompts = this._reflectionPrompts(quarterId);
      if (prompts.length && prompts[0].key === key) return r._legacy;
    }
    return r[key] || '';
  },

  _qTraining(q, s) {
    const customMods = (s.customModules && s.customModules[q.id]) || [];
    const mods = [...(q.trainingModules || []), ...customMods];
    const open = s.openModules || {};

    if (mods.length === 0) {
      return `<div class="empty"><h3>No structured modules for this quarter</h3><p>This quarter's focus is primarily practical work and mentoring.</p>
        <button class="btn btn-primary" data-action="add-module" data-quarter="${q.id}" style="margin-top:12px">＋ Add custom module</button>
      </div>`;
    }

    let totalItems = 0, doneItems = 0;
    mods.forEach(m => {
      (m.sections || []).forEach((sec, si) => {
        const base = (sec.items||[]).length;
        const custom = (s.customItems?.[m.id]?.[si] || []).length;
        totalItems += base + custom;
        for (let ii=0; ii<base+custom; ii++) {
          if (s.moduleChecks?.[m.id]?.[si + '_' + ii]) doneItems++;
        }
      });
    });
    const itemsPct = totalItems ? Math.round(doneItems/totalItems*100) : 0;
    const doneCount = mods.filter(m => s.modulesDone[m.id]?.done).length;

        <div class="stat ok"><div class="label">Completed</div><div class="value">${doneCount}</div></div>
        <div class="stat"><div class="label">Items ticked</div><div class="value">${doneItems}<span style="font-size:13px;color:var(--text-muted)"> / ${totalItems}</span></div><div class="progress slim" style="margin-top:6px"><div style="width:${itemsPct}%;background:var(--blue)"></div></div></div>
      </div>

      <div class="row" style="gap:8px;margin-bottom:14px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" data-action="add-module" data-quarter="${q.id}">＋ Add custom module</button>
      </div>

      <div class="alert alert-info" style="margin-bottom:14px"><span class="icon">📎</span><div><strong>Tick each sub-item as you complete it.</strong> Open modules stay open. The Supervisor sign-off block at the bottom of each module is for quarterly review meetings.</div></div>

      <div class="module-list">
        ${mods.map(m => {
          const md = s.modulesDone[m.id] || { done: false, hours: 0 };
          const checks = (s.moduleChecks && s.moduleChecks[m.id]) || {};
          const signoff = (s.signoffState && s.signoffState[m.id]) || {ticks:{},name:'',date:''};
          const asmt = md.assessment || {};
          const isCustom = customMods.some(c => c.id === m.id);
          const isOpen = !!open[m.id];
          const customSecs = (s.customSections?.[m.id] || []);
          const baseSections = (m.sections || []);
          const allSections = [...baseSections, ...customSecs.map(cs => ({...cs, _custom:true}))];
          let mItems = 0, mDone = 0;
          allSections.forEach((sec, si) => {
            const base = (sec.items||[]).length;
            const custom = (s.customItems?.[m.id]?.[si] || []).length;
            const total = base + custom;
            mItems += total;
            for (let ii=0; ii<total; ii++) if (checks[si+'_'+ii]) mDone++;
          });
          const mPct = mItems ? Math.round(mDone/mItems*100) : 0;
          // Content completed is derived from the sub-items: auto-ticks only when all are ticked.
          const contentDone = mItems > 0 ? (mDone === mItems) : !!md.done;
          const st3 = { content: contentDone, assess: !!asmt.passed, verified: !!signoff.signed };
          st3.stepsDone = (st3.content?1:0) + (st3.assess?1:0) + (st3.verified?1:0);
          const allDone3 = st3.content && st3.assess && st3.verified;
          return `
          <div class="module" data-module-id="${m.id}">
            <div class="module-head" data-toggle-module="${m.id}">
              <div class="module-icon">${m.icon || '📘'}</div>
              <h4>${esc(m.title)}${allDone3 ? ' <span class="badge ok" style="margin-left:6px">✓ Complete</span>' : (st3.stepsDone ? `<span class="mod-progress" data-tip="Content completed → Assessment passed → Supervisor verified">${st3.stepsDone}/3 steps</span>` : '')}</h4>
              ${(() => {
                const tag = moduleTagFor(m);
                const vals = MODULE_TAGS.map(t => t.value);
                const idx = vals.indexOf(tag); const next = vals[(idx + 1) % vals.length] || vals[0];
                return `<span class="module-tag ${tag}" data-noedit data-cycle-tag="${m.id}:${next}" title="Click to recategorise — currently ${String(tag).toUpperCase()}">${String(tag).toUpperCase()}</span>`;
              })()}
              <span class="module-meta module-duration">${esc(m.duration || '')}</span>
              <span class="module-meta" style="color:var(--blue);font-weight:700">${mDone}/${mItems} · ${mPct}%</span>
              <span class="module-arrow${isOpen?' open':''}">▶</span>
            </div>
            <div class="module-body${isOpen?' open':''}" id="mod-${m.id}">
              <p style="font-style:italic;color:var(--text-muted);margin-bottom:12px">${esc(m.tagline || '')}</p>
              ${allSections.map((sec, si) => {
                const customExtras = (s.customItems?.[m.id]?.[si] || []);
                const allItems = [...(sec.items||[]), ...customExtras];
                const baseLen = (sec.items||[]).length;
                const customSecIdx = si - baseSections.length; // index within customSections
                return `
                <div class="mod-section${sec._custom?' mod-section-custom':''}" data-section-idx="${si}">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                    <h5 style="margin-bottom:6px">${sec._custom ? '<span style="color:var(--blue);font-size:10px;font-weight:700;margin-right:6px">ADDED</span>' : ''}${draftify(esc(sec.h))}</h5>
                    <div style="display:flex;gap:6px">
                      <button class="btn btn-sm btn-ghost" data-action="add-key-concept" data-module="${m.id}" data-section="${si}" style="font-size:10px">＋ Key concept</button>
                      ${sec._custom ? `<button class="btn btn-sm btn-ghost" data-action="delete-custom-section" data-module="${m.id}" data-idx="${customSecIdx}" title="Delete this added section" style="font-size:10px;color:var(--red)">✕</button>` : ''}
                    </div>
                  </div>
                  <ul class="tick-list">${allItems.map((it, ii) => {
                    const key = si + '_' + ii;

                    const customItemIdx = ii - baseLen;
                    return `<li class="tick-item ${done?'done':''}">
                      <input type="checkbox" data-module-check="${m.id}:${key}" ${done?'checked':''}>
                      <span class="ti-text">${draftify(esc(it))}</span>
                      ${isCustomItem ? `<button class="item-del" data-action="delete-key-concept" data-module="${m.id}" data-section="${si}" data-idx="${customItemIdx}" title="Delete this key concept">✕</button>` : ''}
                    </li>`;
                  }).join('')}</ul>
                </div>
              `;}).join('')}
              <button class="btn btn-sm btn-secondary" data-action="add-section" data-module="${m.id}" style="margin-top:8px">＋ Add section</button>

              <div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);gap:16px;flex-wrap:wrap">
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600" data-tip="${mItems>0 ? 'Auto-completes when all '+mItems+' sub-items above are ticked — cannot be set manually.' : 'Mark the content complete.'}">
                  <input type="checkbox" ${mItems>0 ? 'disabled' : `data-module-done="${m.id}"`} ${st3.content?'checked':''}> Content completed${mItems>0 ? ` <span style="font-weight:400;color:var(--text-muted)">(auto · ${mDone}/${mItems} ticked)</span>` : ''}
                </label>
                <span style="font-size:11px;color:var(--text-muted)">⏱️ Log any training hours in the <b>PY portal</b>, not here.</span>
                ${isCustom ? `<button class="btn btn-sm btn-ghost" data-action="delete-module" data-module="${m.id}" style="color:var(--red);margin-left:auto">🗑 Delete module</button>` : ''}
              </div>
              <div class="mod-steps-track" data-tip="A module is fully complete only when all three steps are done.">
                <span class="mstep ${st3.content?'done':''}"><i>${st3.content?'✓':'1'}</i> Content completed</span>
                <span class="mstep-arrow">›</span>
                <span class="mstep ${st3.assess?'done':''}"><i>${st3.assess?'✓':'2'}</i> Assessment passed</span>
                <span class="mstep-arrow">›</span>
                <span class="mstep ${st3.verified?'done':''}"><i>${st3.verified?'✓':'3'}</i> Supervisor verified</span>
              </div>

              <div class="assessment-block">
                <div class="assessment-head">
                  <span>📝 Assessment <span class="assessment-sub">— capture the assessment evidence and result</span></span>
                  ${asmt.passed ? '<span class="badge ok">Passed</span>' : '<span class="badge">Not yet passed</span>'}
                </div>
                <div class="assessment-grid">
                  <label class="field"><span>Format</span>
                    <select data-asmt="${m.id}:format">
                      ${['','10-question quiz','Written case study','Calculation exercise','File review','Observed client role-play','Recorded presentation','Supervisor questioning','Self-audit exercise'].map(o => `<option value="${esc(o)}" ${(asmt.format||'')===o?'selected':''}>${o?esc(o):'— select —'}</option>`).join('')}
                    </select>
                  </label>
                  <label class="field"><span>Result</span><input type="text" data-asmt="${m.id}:result" value="${esc(asmt.result||'')}" placeholder="e.g. 9/10 or Competent"></label>
                  <label class="field"><span>Attempt</span><input type="number" min="1" step="1" data-asmt="${m.id}:attempt" value="${Number(asmt.attempt)||1}"></label>
                  <label class="field"><span>Assessor</span><input type="text" data-asmt="${m.id}:assessor" value="${esc(asmt.assessor||'')}" placeholder="Supervisor / assessor"></label>
                  <label class="field"><span>Date</span><input type="date" data-asmt="${m.id}:date" value="${esc(asmt.date||'')}"></label>
                </div>
                <label class="asmt-pass" data-tip="Step 2 of 3 — the assessment has been passed to the required standard."><input type="checkbox" data-asmt-pass="${m.id}" ${asmt.passed?'checked':''}> Assessment passed to standard</label>
                <details class="asmt-remediation"${(asmt.remediation||asmt.reassessment)?' open':''}>
                  <summary>Remediation / reassessment</summary>
                  <label class="field"><span>Remediation required</span><textarea data-asmt="${m.id}:remediation" style="min-height:44px" placeholder="What needs to improve before a re-attempt?">${esc(asmt.remediation||'')}</textarea></label>
                  <label class="field"><span>Reassessment result</span><input type="text" data-asmt="${m.id}:reassessment" value="${esc(asmt.reassessment||'')}" placeholder="Result on re-attempt"></label>
                </details>
              </div>

              ${(() => {
                const signed = !!signoff.signed;
                const lines = ['Key concepts covered & understood','Practical scenarios discussed','Questions answered; Q&A completed','Candidate demonstrated applied understanding'];
                const ticks = lines.map(txt =>
                  `<div class="signoff-tick-line"><span class="box">${signed?'✓':''}</span><span>${txt}</span></div>`
                ).join('');
                if (signed) {
                  return `<div class="signoff-block signed">
                    <div class="signoff-label"><span>📋 Supervisor sign-off</span><span class="signoff-lock" style="background:var(--green-light);color:var(--green-dark,#2e7d32)">✔ Signed</span></div>
                    ${ticks}
                    <div class="sig-stamp">
                      <span class="sig-mark">${esc(signoff.signedBy || signoff.name || 'Supervisor')}</span>
                      <span class="sig-info">Signed by <b>${esc(signoff.signedBy || signoff.name || '—')}</b><br>${fmtDateTime(signoff.signedAt)}</span>
                      <button class="btn btn-sm btn-ghost" data-action="unlock-module-sign" data-module="${m.id}" style="margin-left:auto">🔓 Amend</button>
                    </div>
                  </div>`;
                }
                return `<div class="signoff-block">
                  <div class="signoff-label"><span>📋 Supervisor sign-off <span class="signoff-meta">— to be completed with supervisor at quarterly review</span></span></div>
                  ${ticks}

                    <span class="signoff-await">🔒 Awaiting supervisor signature — the candidate cannot self-complete this section.</span>
                    <button class="btn btn-sm btn-sign" data-action="sign-module" data-module="${m.id}" style="margin-left:auto">✍️ Supervisor: Sign &amp; date-stamp</button>
                  </div>
                </div>`;
              })()}
            </div>
          </div>
          `;
        }).join('')}
      </div>
    `;
  },

            </div>

  _qHours(q, s, active) {
    const qNum = q.number;
    const meta = (s.reflectionMeta && s.reflectionMeta[active]) || {};
    const specific = Views._reflectionPrompts(active) || [];
    // Closed loop — actions committed to in earlier quarters that aren't complete yet.
    const carried = (s.devActions || []).filter(a => a.quarter && a.quarter < active && a.status !== 'Complete');
    const thisQ = (s.devActions || []).filter(a => a.quarter === active);
    const candR = meta.candidateRating || 0, supR = meta.supervisorRating || 0;
    const variance = (candR && supR) ? Math.abs(candR - supR) : 0;
    const ratingBtns = (who, cur) => `<div class="lvl-btns">${[1,2,3,4,5].map(n => `<button data-refrate="${active}:${who}:${n}" class="${cur===n?'sel':''}">${n}</button>`).join('')}</div>`;
    const statusBadge = st => `<span class="badge ${st==='Complete'?'ok':st==='Blocked'?'danger':st==='In progress'?'blue':''}">${esc(st)}</span>`;

    return `
      ${(qNum > 1 && carried.length) ? `

          <div class="lvl-pick cand"><span class="lvl-who">Candidate</span>${ratingBtns('candidate', candR)}</div>
          <div class="lvl-pick sup"><span class="lvl-who">Supervisor</span>${ratingBtns('supervisor', supR)}</div>

        <div class="decision-btns">

          <label class="field"><span>Review date</span><input type="date" data-refmeta="${active}:remReviewDate" value="${esc(meta.remReviewDate||'')}"></label>
          <label class="field"><span>Outcome</span><input type="text" data-refmeta="${active}:remOutcome" value="${esc(meta.remOutcome||'')}" placeholder="Result at review"></label>

    <div class="page-head">
      <div>
        <div class="breadcrumb">Program · Activity log</div>
        <h1>Activity log</h1>
        <p class="subtitle">An optional space to note observations, file work, meetings and training as evidence for reflections and sign-offs. Your official <b>hours and s8 logbook live in the licensee PY portal</b> — record them there, not here.</p>

      <div class="card-actions">
