<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debt Recycling — Client Service Officer Training | MyWealth Solutions</title>
<meta name="description" content="An interactive induction to the debt recycling strategy for MyWealth Solutions client service officers.">
<!-- Brand fonts. If the network blocks this, the fallback stack below is used. -->
<link rel="preconnect" href="https://fonts.cdnfonts.com">
<style>@import url('https://fonts.cdnfonts.com/css/abc-arizona-flare');@import url('https://fonts.cdnfonts.com/css/abc-arizona-serif');</style>
<style>
/* ============================================================
   DESIGN TOKENS — MyWealth brand (mirrors src/app/globals.css)
   ============================================================ */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#eef3f8; --row-alt:#f1f5fa; --input-bg:#f7fafd;
  --border:#d4dde7; --border-soft:#e6edf4; --border-strong:#c4d0dc;
  --navy:#0C2E3F; --navy-deep:#0a2433; --chrome:#0C2E3F; --chrome-deep:#0a2433; --heading:#0C2E3F;
  --blue:#2B6FD6; --blue-bright:#3B82E6; --blue-light:#e8f1fb; --blue-soft:#7fb0ef;
  --coral:#F56A5A; --coral-light:#fdeeec; --lime:#CFE87F; --lime-dark:#4a6a10; --lime-light:#f1f7df;
  --text:#16242e; --text-dim:#42586a; --text-muted:#5c6b78; --text-faint:#9aa6b2;
  --green:#27ae60; --green-light:#e8f5e9; --green-dark:#2e7d32;
  --red:#d63031; --red-light:#fdeaea; --amber:#b8860b; --amber-light:#fef6e0;
  --purple:#6d28d9; --purple-light:#f3edff; --teal:#E5F4F6;
  --hf:'ABC Arizona Flare','ABC Arizona Serif','Playfair Display',Georgia,serif;
  --bf:'Nunito Sans','Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --shadow-sm:0 1px 2px rgba(12,46,63,.04); --shadow:0 2px 6px rgba(12,46,63,.06);
  --shadow-md:0 4px 12px rgba(12,46,63,.08); --shadow-lg:0 8px 24px rgba(12,46,63,.10);
  color-scheme:light;
}
/* Dark palette, applied either by explicit toggle or by OS preference. */
html[data-theme="dark"]{
  --bg:#1C394E; --surface:#224A68; --surface-2:#2A5379; --row-alt:#27506F; --input-bg:#1e4160;
  --border:#345a7b; --border-soft:#2c4f6e; --border-strong:#456a88;
  --chrome:#15293c; --chrome-deep:#2c4964; --navy:#4a8cc9; --navy-deep:#7fb0de; --heading:#f1f6fb;
  --blue:#8fbdf0; --blue-bright:#a9d0fb; --blue-light:#284f72; --blue-soft:#3d6585;
  --coral:#ff7a68; --coral-light:#5a2420; --lime:#CCE185; --lime-dark:#CCE185; --lime-light:#33401c;
  --text:#eef4fa; --text-dim:#cfdce7; --text-muted:#bccfdf; --text-faint:#a6bece;
  --green:#5bb55b; --green-light:#1f3d33; --green-dark:#8fd08f;
  --red:#f1707a; --red-light:#3f2024; --amber:#e6b34d; --amber-light:#3a3320;
  --purple:#a78bfa; --purple-light:#2e1f52; --teal:#2A5379;
  --shadow-sm:0 1px 2px rgba(6,16,26,.22); --shadow:0 2px 6px rgba(6,16,26,.26);
  --shadow-md:0 4px 12px rgba(6,16,26,.3); --shadow-lg:0 8px 24px rgba(6,16,26,.38);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#1C394E; --surface:#224A68; --surface-2:#2A5379; --row-alt:#27506F; --input-bg:#1e4160;
    --border:#345a7b; --border-soft:#2c4f6e; --border-strong:#456a88;
    --chrome:#15293c; --chrome-deep:#2c4964; --navy:#4a8cc9; --navy-deep:#7fb0de; --heading:#f1f6fb;
    --blue:#8fbdf0; --blue-bright:#a9d0fb; --blue-light:#284f72; --blue-soft:#3d6585;
    --coral:#ff7a68; --coral-light:#5a2420; --lime:#CCE185; --lime-dark:#CCE185; --lime-light:#33401c;
    --text:#eef4fa; --text-dim:#cfdce7; --text-muted:#bccfdf; --text-faint:#a6bece;
    --green:#5bb55b; --green-light:#1f3d33; --green-dark:#8fd08f;
    --red:#f1707a; --red-light:#3f2024; --amber:#e6b34d; --amber-light:#3a3320;
    --purple:#a78bfa; --purple-light:#2e1f52; --teal:#2A5379;
    color-scheme:dark;
  }
}

/* ============================================================ BASE */
*{margin:0;padding:0;box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--bf);line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;font-size:14.5px}
h1,h2,h3,h4{font-family:var(--hf);color:var(--heading);letter-spacing:-.015em;line-height:1.2}
h1{font-size:clamp(22px,2.6vw,30px)}
h2{font-size:clamp(18px,2vw,23px);margin-bottom:6px}
h3{font-size:16.5px;margin-bottom:4px}
h4{font-size:14.5px;font-family:var(--bf);font-weight:800;color:var(--heading);letter-spacing:0}
p{margin:0 0 11px}
ul,ol{margin:0 0 14px 20px}
li{margin-bottom:6px}
strong{font-weight:800;color:var(--heading)}
a{color:var(--blue)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================ CHROME */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--chrome) 0%,var(--chrome-deep) 100%);
  color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-md)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-stack{display:flex;flex-direction:column;line-height:1}
.brand-name{font-family:var(--hf);font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em}
.brand-solutions{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--lime);font-weight:700;margin-top:3px}
.tool-label{font-size:12px;color:#cfe0ee;border-left:1px solid rgba(255,255,255,.25);padding-left:12px;
  margin-left:2px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.top-progress{display:flex;align-items:center;gap:8px;font-size:12px;color:#cfe0ee;font-weight:700}
.tp-track{width:120px;height:7px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.tp-fill{height:100%;background:var(--lime);border-radius:99px;transition:width .35s ease}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;
  padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--bf)}
.icon-btn:hover{background:rgba(255,255,255,.22)}

/* ============================================================ LAYOUT */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);gap:22px;max-width:1620px;margin:0 auto;padding:20px 22px 72px}
.sidebar{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto}
.side-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.side-title{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:800;
  margin:4px 6px 8px}
.nav-toggle{display:none;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;
  border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--heading);
  font-family:var(--bf);font-size:13.5px;font-weight:800;cursor:pointer;margin-bottom:8px}
.navlist.collapsed{display:none}
.navpct{font-size:11.5px;font-weight:800;color:var(--blue);margin-left:6px}
.mins{color:var(--blue);font-weight:800}
#totalMins{color:var(--blue);letter-spacing:.02em;text-transform:none;font-size:10.5px}
.navlist{list-style:none;margin:0}
.navlist li{margin:0 0 2px}
.navbtn{width:100%;text-align:left;display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:10px;
  background:transparent;border:1px solid transparent;cursor:pointer;font-family:var(--bf);font-size:13.5px;
  color:var(--text-dim);font-weight:700;line-height:1.3}
.navbtn:hover{background:var(--surface-2)}
.navbtn[aria-current="true"]{background:var(--blue-light);border-color:var(--blue-soft);color:var(--heading)}
.nav-num{flex:none;width:21px;height:21px;border-radius:6px;background:var(--surface-2);color:var(--text-muted);
  font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.navbtn[aria-current="true"] .nav-num{background:var(--blue);color:#fff}
.navbtn.done .nav-num{background:var(--green);color:#fff}
.navbtn.done .nav-num::after{content:"✓"}
.navbtn.done .nav-num span{display:none}
.nav-sub{display:block;font-weight:600;font-size:11.5px;color:var(--text-faint);margin-top:1px}

/* ============================================================ CONTENT CARDS */
.main{min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 24px;
  box-shadow:var(--shadow);margin-bottom:16px}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:800;margin-bottom:8px}
.lede{font-size:15.5px;color:var(--text-dim);margin-bottom:0}
.hr{height:1px;background:var(--border-soft);margin:20px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}

.tile{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px 16px}
.tile h4{margin-bottom:5px}
.tile p{margin:0;font-size:13.5px;color:var(--text-dim)}

.callout{border-radius:12px;padding:14px 16px;margin:16px 0;border:1px solid;font-size:14px}
.callout h4{margin-bottom:4px;display:flex;align-items:center;gap:7px}
.callout p:last-child,.callout ul:last-child{margin-bottom:0}
.c-rule{background:var(--coral-light);border-color:var(--coral)}
.c-rule h4{color:var(--coral)}
.c-tip{background:var(--lime-light);border-color:var(--lime)}
.c-tip h4{color:var(--lime-dark)}
.c-note{background:var(--blue-light);border-color:var(--blue-soft)}
.c-note h4{color:var(--blue)}
.c-warn{background:var(--amber-light);border-color:var(--amber)}
.c-warn h4{color:var(--amber)}
.c-firm{background:var(--purple-light);border-color:var(--purple)}
.c-firm h4{color:var(--purple)}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.02em}
.p-ded{background:var(--green-light);color:var(--green-dark)}
.p-non{background:var(--red-light);color:var(--red)}
.p-blue{background:var(--blue-light);color:var(--blue)}

table.t{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:13px}
table.t th{text-align:left;background:var(--surface-2);color:var(--heading);font-weight:800;font-size:11.5px;
  letter-spacing:.06em;text-transform:uppercase;padding:9px 11px;border-bottom:1px solid var(--border)}
table.t td{padding:9px 11px;border-bottom:1px solid var(--border-soft);vertical-align:top;color:var(--text-dim)}
table.t tr:nth-child(even) td{background:var(--row-alt)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.figure{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:14px;padding:16px;margin:16px 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.svgscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Cap diagram width: the SVG text is sized in viewBox units, so an uncapped
   figure on a wide screen renders its labels far larger than the body copy. */
.figure svg,.svgscroll svg{max-width:880px;display:block;margin-left:auto;margin-right:auto}
.figure figcaption{font-size:12.5px;color:var(--text-muted);margin-top:10px;text-align:center;font-weight:600}

/* ============================================================ EXERCISES */
.ex{border:1.5px solid var(--blue-soft);background:var(--surface);border-radius:14px;padding:16px 18px;margin:18px 0}
.ex-head{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.ex-kind{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#fff;background:var(--blue);
  padding:3px 8px;border-radius:99px}
.ex-q{font-weight:800;color:var(--heading);font-size:15px;margin:8px 0 11px}
.opts{list-style:none;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;
  background:var(--input-bg);cursor:pointer;font-size:14px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--blue-soft)}
.opt input{margin-top:3px;accent-color:var(--blue);flex:none}
.opt.correct{border-color:var(--green);background:var(--green-light)}
.opt.wrong{border-color:var(--red);background:var(--red-light)}
.opt.missed{border-color:var(--green);border-style:dashed}
.opt[aria-disabled="true"]{cursor:default}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 17px;border-radius:10px;
  font-size:13.5px;font-weight:800;font-family:var(--bf);border:1px solid transparent;cursor:pointer}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-bright)}
.btn-ghost{background:transparent;color:var(--text-dim);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-coral{background:var(--coral);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.fb{margin-top:12px;border-radius:11px;padding:12px 14px;font-size:14px;border:1px solid;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-light);border-color:var(--green);color:var(--green-dark)}
.fb.no{background:var(--red-light);border-color:var(--red);color:var(--red)}
.fb strong{color:inherit}
.fb .why{color:var(--text-dim);display:block;margin-top:6px;font-weight:600}
html[data-theme="dark"] .fb.ok,html[data-theme="dark"] .fb.no{color:var(--text)}

/* drag + drop */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--border-strong);border-radius:12px;
  background:var(--input-bg);min-height:58px;margin-bottom:14px;align-content:flex-start}
.bank:empty::after{content:"All placed";color:var(--text-faint);font-size:13px;font-style:italic}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--border-strong);
  border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;color:var(--text);cursor:grab;
  box-shadow:var(--shadow-sm);max-width:100%;text-align:left;font-family:var(--bf);line-height:1.35}
.chip:hover{border-color:var(--blue)}
.chip.sel{border-color:var(--blue);background:var(--blue-light);box-shadow:0 0 0 3px rgba(43,111,214,.18)}
.chip.dragging{opacity:.45}
.chip.correct{border-color:var(--green);background:var(--green-light)}
.chip.wrong{border-color:var(--red);background:var(--red-light)}
.chip .ord{flex:none;width:19px;height:19px;border-radius:6px;background:var(--blue);color:#fff;font-size:11px;
  font-weight:800;display:grid;place-items:center}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.zone{border:1.5px solid var(--border);border-radius:12px;background:var(--surface-2);padding:10px;min-height:110px}
.zone.over{border-color:var(--blue);background:var(--blue-light)}
.zone h5{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--heading);
  margin-bottom:8px;padding:0 2px;font-family:var(--bf)}
.zone .items{display:flex;flex-direction:column;gap:7px}
.seqzone{border:1.5px solid var(--border);border-radius:12px;background:var(--surface-2);padding:12px;min-height:80px}
.seqzone.over{border-color:var(--blue);background:var(--blue-light)}
.seqzone .items{display:flex;flex-direction:column;gap:8px;counter-reset:s}

/* dropdown cloze */
.cloze{font-size:15px;line-height:2.4}
.cloze select{font-family:var(--bf);font-size:13.5px;font-weight:700;padding:6px 9px;border-radius:9px;
  border:1.5px solid var(--border-strong);background:var(--input-bg);color:var(--text);max-width:100%}
.cloze select.correct{border-color:var(--green);background:var(--green-light)}
.cloze select.wrong{border-color:var(--red);background:var(--red-light)}
.clozerow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border-soft)}
.clozerow>*{min-width:0}
.clozerow:last-of-type{border-bottom:0}
.clozerow .lbl{font-size:14px}

/* hotspot diagram */
.hotspot{position:relative}
.hs-btn{cursor:pointer}
.hs-btn:hover .hs-shape{filter:brightness(1.06)}
.hs-panel{margin-top:12px;border:1px solid var(--border);background:var(--surface-2);border-radius:12px;padding:14px 16px;
  min-height:74px;font-size:14px}
.hs-panel h4{margin-bottom:4px}
.hs-panel .muted{color:var(--text-muted);font-style:italic}

/* Compact mode — display scaling and browser zoom vary a lot, so this is a
   deliberate second density the reader can pick rather than a guess at theirs. */
html.compact body{font-size:12.5px;line-height:1.5}
html.compact h1{font-size:clamp(18px,1.8vw,22px)}
html.compact h2{font-size:clamp(15px,1.5vw,18px)}
html.compact h3{font-size:14px}
html.compact h4{font-size:13px}
html.compact .lede{font-size:13px}
html.compact .figure svg,html.compact .svgscroll svg{max-width:760px}
html.compact .eyebrow{font-size:9.5px}
html.compact .layout{max-width:1720px;gap:18px;grid-template-columns:236px minmax(0,1fr);padding:16px 20px 60px}
html.compact .card{padding:16px 20px;margin-bottom:13px}
html.compact .ex{padding:13px 16px;margin:15px 0}
html.compact .ex-q{font-size:14px}
html.compact .opt{padding:9px 11px;font-size:13.5px}
html.compact table.t{font-size:12.5px}
html.compact table.t td,html.compact table.t th{padding:7px 9px}
html.compact .figure{padding:13px;margin:14px 0}
html.compact .tile{padding:12px 14px}
html.compact .callout{padding:12px 14px;margin:13px 0}
html.compact .navbtn{padding:7px 9px;font-size:13px}
html.compact .flipcard{height:140px}

/* content arrives as you scroll rather than all at once */
.reveal{opacity:0;transform:translateY(16px);
  transition:opacity .55s cubic-bezier(.22,.61,.36,1),transform .55s cubic-bezier(.22,.61,.36,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media print{.reveal{opacity:1!important;transform:none!important}}

/* expandable detail */
.acc{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:16px 0}
.acc-row+.acc-row{border-top:1px solid var(--border-soft)}
.acc-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:13px 15px;
  background:var(--surface);border:0;cursor:pointer;font-family:var(--bf);font-size:14.5px;font-weight:800;
  color:var(--heading);line-height:1.35}
.acc-btn:hover{background:var(--surface-2)}
.acc-num{flex:none;width:24px;height:24px;border-radius:7px;background:var(--blue-light);color:var(--blue);
  font-size:12px;font-weight:800;display:grid;place-items:center}
.acc-btn .chev{margin-left:auto;flex:none;color:var(--text-faint);font-size:12px;transition:transform .25s ease}
.acc-row.open .acc-btn{background:var(--blue-light)}
.acc-row.open .chev{transform:rotate(90deg)}
.acc-body{max-height:0;overflow:hidden;background:var(--surface-2);transition:max-height .34s ease}
.acc-row.open .acc-body{max-height:900px}
.acc-body .inner{padding:12px 16px 15px 50px;font-size:14px;color:var(--text-dim)}
.acc-body .inner p:last-child{margin-bottom:0}
@media (prefers-reduced-motion:reduce){.acc-body{transition:none}}

/* flip cards — quick definitions */
.flipgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px;margin-bottom:12px}
.flipcard{perspective:900px;height:154px;border:0;background:none;padding:0;cursor:pointer;font-family:var(--bf)}
.flipinner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flipcard.on .flipinner{transform:rotateY(180deg)}
.flipface{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:12px;
  border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12px 14px;text-align:center;overflow:hidden}
.flipfront{background:var(--surface-2)}
.flipfront .term{font:800 15px var(--bf);color:var(--heading)}
.flipfront .hint{font:700 10px var(--bf);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);margin-top:10px}
.flipback{background:var(--blue-light);border-color:var(--blue-soft);transform:rotateY(180deg)}
.flipback .def{font:600 12.5px/1.45 var(--bf);color:var(--text)}
@media (prefers-reduced-motion:reduce){.flipinner{transition:none}}

/* the deduction calculator */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:start;margin-bottom:12px}
.calcfield{display:flex;flex-direction:column;gap:5px}
.calcfield .cl{font:800 11px var(--bf);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.calcfield .cv{font:800 21px var(--bf);color:var(--heading);font-variant-numeric:tabular-nums}
.calcfield input[type=range]{width:100%;accent-color:var(--blue)}
.calcfield select{font-family:var(--bf);font-size:14px;font-weight:700;padding:7px 9px;border-radius:9px;
  border:1.5px solid var(--border-strong);background:var(--input-bg);color:var(--text)}
.calcout{background:var(--blue-light);border:1.5px solid var(--blue);border-radius:12px;padding:16px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;text-align:center}
.calcout .ol{font:800 10px var(--bf);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.calcout .ov{font-family:var(--hf);font-size:26px;color:var(--heading);font-variant-numeric:tabular-nums;line-height:1.15}
.calcout .ov.good{color:var(--green-dark)}

/* stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.stepdot{border:1.5px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 11px;font-size:12.5px;
  font-weight:800;color:var(--text-muted);cursor:pointer;font-family:var(--bf)}
.stepdot[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
html[data-theme="dark"] .stepdot[aria-current="true"]{color:var(--chrome)}
.stepbody{border:1px solid var(--border-soft);border-radius:12px;background:var(--surface);padding:16px 18px}

/* score + certificate */
.scorewrap{text-align:center;padding:10px 0 4px}
.scorebig{font-family:var(--hf);font-size:52px;color:var(--heading);line-height:1}
.scorelab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:800}
.cert{border:3px double var(--navy);border-radius:14px;padding:30px;text-align:center;background:var(--surface)}
.cert .cbrand{font-family:var(--hf);font-size:26px;color:var(--heading)}
.cert .cname{font-family:var(--hf);font-size:32px;color:var(--blue);margin:14px 0 6px;border-bottom:1px solid var(--border);
  display:inline-block;padding:0 26px 6px;min-width:280px}
.cert input{font-family:var(--hf);font-size:30px;color:var(--blue);text-align:center;border:0;border-bottom:1px dashed var(--border-strong);
  background:transparent;width:min(420px,90%);padding:4px}

.pagenav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.footnote{font-size:12px;color:var(--text-faint);text-align:center;margin-top:22px;line-height:1.6}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;padding:14px 12px 60px;gap:14px}
  .sidebar{position:static;max-height:none}
  .card{padding:18px 16px;border-radius:14px}
  .tool-label{display:none}
  .tp-track{width:70px}
  .nav-toggle{display:flex}
  .top-progress{display:none}   /* the sidebar already shows progress; the topbar needs the room */
  /* Compact's layout rule is more specific than this block, so restate it here
     or the sidebar keeps its column and pushes the page sideways. */
  html.compact .layout{grid-template-columns:1fr;padding:14px 12px 60px;max-width:100%}
  .side-title{display:none}
  /* Diagrams stay legible by scrolling sideways inside their own box, never the page. */
  .figure svg,.svgscroll svg{min-width:640px}
  .zones{grid-template-columns:1fr}
  .clozerow{grid-template-columns:1fr;gap:6px;align-items:start}
  .cloze select{width:100%}
}
@media print{
  .topbar,.sidebar,.pagenav,.btnrow,.no-print{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:0;padding:0}
}

<body>

<header class="topbar">
  <div class="brand" aria-label="MyWealth Solutions">
    <div class="brand-stack">
      <span class="brand-name">MyWealth</span>
      <span class="brand-solutions">Solutions</span>
    </div>
    <span class="tool-label">Debt Recycling — CSO Training</span>
  </div>
  <div class="top-right">
    <div class="top-progress" title="Modules completed">
      <span id="tpText">0%</span>
      <span class="tp-track"><span class="tp-fill" id="tpFill" style="width:0%"></span></span>
    </div>
    <button class="icon-btn" id="sizeBtn" type="button" aria-label="Use larger text">Larger</button>
    <button class="icon-btn" id="motionBtn" type="button" aria-label="Pause diagram animations">Pause</button>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">🌙</button>
    <button class="icon-btn no-print" id="resetBtn" type="button" title="Clear all answers and progress">Reset</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Modules">
    <div class="side-card">
      <div class="side-title">Modules <span id="totalMins"></span></div>
      <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="nav">
        <span>Modules <span id="navPct" class="navpct">0%</span></span><span aria-hidden="true">☰</span>
      </button>
      <ul class="navlist" id="nav"></ul>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script>
/* ============================================================================
   Debt Recycling — Client Service Officer training
   A single-file, dependency-free learning module.

   Structure:
     MODULES[]            content, declared further down in push() blocks
     Exercise renderers   mcq | multi | sort | sequence | cloze | hotspot
     State                answers + completion, persisted to localStorage
   ========================================================================== */
"use strict";

var MODULES = [];
var STORE_KEY = "mws.debtrecycling.training.v1";

var State = {
  data: { answers: {}, done: {}, name: "" },
  load: function () {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        this.data.answers = p.answers || {};
        this.data.done = p.done || {};
        this.data.name = p.name || "";
      }
    } catch (e) { /* private browsing / storage disabled — run in-memory */ }
  },
  save: function () {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); } catch (e) {}
  },
  mark: function (id, ok) { this.data.answers[id] = !!ok; this.save(); refreshProgress(); },
  answered: function (id) { return Object.prototype.hasOwnProperty.call(this.data.answers, id); },
  complete: function (slug) { this.data.done[slug] = true; this.save(); refreshProgress(); renderNav(); }
};

/* -------------------------------------------------------------- utilities */
function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
function exHead(kind, title) {
  return el("div", { class: "ex-head" }, [
    el("span", { class: "ex-kind", text: kind }),
    el("span", { class: "sr", text: "Exercise: " + (title || kind) })
  ]);
}
function feedback() { return el("div", { class: "fb", role: "status", "aria-live": "polite" }); }
function showFb(node, ok, msg, why) {
  node.className = "fb show " + (ok ? "ok" : "no");
  node.innerHTML = "";
  node.appendChild(el("strong", { text: (ok ? "✓ " : "✗ ") + msg }));
  if (why) node.appendChild(el("span", { class: "why", html: why }));
}

/* ============================================================================
   EXERCISE ENGINE
   Every exercise declares an id; correctness is stored against that id so a
   learner's progress survives a refresh.
   ========================================================================== */

/* ---------------------------------------------------- multiple choice */
function renderMcq(ex) {
  var wrap = el("div", { class: "ex" }, [exHead("Multiple choice"), el("p", { class: "ex-q", html: ex.q })]);
  var list = el("ul", { class: "opts" });
  var inputs = [];
  ex.opts.forEach(function (o, i) {
    var input = el("input", { type: "radio", name: ex.id, value: i });
    inputs.push(input);
    var li = el("li", {}, [el("label", { class: "opt" }, [input, el("span", { html: o })])]);
    list.appendChild(li);
  });
  var fb = feedback();
  var check = el("button", { class: "btn btn-primary", type: "button", text: "Check answer" });
  check.addEventListener("click", function () {
    var picked = inputs.findIndex(function (n) { return n.checked; });
    if (picked < 0) { showFb(fb, false, "Choose an answer first."); return; }
    inputs.forEach(function (n, i) {
      var lab = n.parentNode;
      lab.className = "opt" + (i === ex.a ? " correct" : (i === picked ? " wrong" : ""));
      lab.setAttribute("aria-disabled", "true");
      n.disabled = true;
    });
    var ok = picked === ex.a;
    showFb(fb, ok, ok ? "Correct." : "Not quite.", ex.why);
    State.mark(ex.id, ok);
    check.disabled = true;
  });
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "btnrow" }, [check]));
  wrap.appendChild(fb);
  return wrap;
}

/* ------------------------------------------- multi-select (choose all) */
function renderMulti(ex) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Select all that apply"),
    el("p", { class: "ex-q", html: ex.q })
  ]);
  var list = el("ul", { class: "opts" });
  var inputs = [];
  ex.opts.forEach(function (o, i) {
    var input = el("input", { type: "checkbox", value: i });
    inputs.push(input);
    list.appendChild(el("li", {}, [el("label", { class: "opt" }, [input, el("span", { html: o })])]));
  });
  var fb = feedback();
  var check = el("button", { class: "btn btn-primary", type: "button", text: "Check answer" });
  check.addEventListener("click", function () {
    var picked = [];
    inputs.forEach(function (n, i) { if (n.checked) picked.push(i); });
    if (!picked.length) { showFb(fb, false, "Select at least one option."); return; }
    var ok = true;
    inputs.forEach(function (n, i) {
      var want = ex.a.indexOf(i) >= 0, got = n.checked, lab = n.parentNode;
      if (want && got) lab.className = "opt correct";
      else if (!want && got) { lab.className = "opt wrong"; ok = false; }
      else if (want && !got) { lab.className = "opt missed"; ok = false; }
      lab.setAttribute("aria-disabled", "true");
      n.disabled = true;
    });
    showFb(fb, ok, ok ? "All correct." : "Some missed — the dashed outlines are the ones you needed.", ex.why);
    State.mark(ex.id, ok);
    check.disabled = true;
  });
  wrap.appendChild(list);
  wrap.appendChild(el("div", { class: "btnrow" }, [check]));
  wrap.appendChild(fb);
  return wrap;
}

/* ------------------------------------------------------- drag helpers */
var dragSel = null; /* the chip currently picked up, by click or by drag */

function makeChip(text, key) {
  var c = el("button", { class: "chip", type: "button", draggable: "true", "data-key": key });
  c.appendChild(el("span", { html: text }));
  c.addEventListener("dragstart", function (e) {
    dragSel = c; c.classList.add("dragging");
    try { e.dataTransfer.setData("text/plain", key); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
  });
  c.addEventListener("dragend", function () { c.classList.remove("dragging"); });
  return c;
}
function selectChip(c) {
  if (dragSel === c) { c.classList.remove("sel"); dragSel = null; return; }
  if (dragSel) dragSel.classList.remove("sel");
  dragSel = c; c.classList.add("sel");
}
function dropTarget(node, onDrop) {
  node.addEventListener("dragover", function (e) { e.preventDefault(); node.classList.add("over"); });
  node.addEventListener("dragleave", function () { node.classList.remove("over"); });
  node.addEventListener("drop", function (e) {
    e.preventDefault(); node.classList.remove("over");
    if (dragSel) { onDrop(dragSel); dragSel.classList.remove("sel", "dragging"); dragSel = null; }
  });
  /* Clicks bubble up from any chip already sitting here, which is deliberate: tapping
     anywhere in a column — including on a card already in it — drops the held card. */
  node.addEventListener("click", function () {
    if (dragSel) { onDrop(dragSel); dragSel.classList.remove("sel"); dragSel = null; }
  });
}
/* A chip only claims the click when nothing else is being held; otherwise it lets the
   event reach the zone underneath so the held chip lands. */
function chipClick(chip, ownAction) {
  chip.addEventListener("click", function (e) {
    /* Holding a card from somewhere else? Let the click reach the zone so it lands here.
       Holding one from this same container? Just switch which card is held. */
    if (dragSel && dragSel !== chip && dragSel.parentNode !== chip.parentNode) return;
    e.stopPropagation();
    if (dragSel && dragSel !== chip) { selectChip(chip); return; }
    ownAction();
  });
}

/* -------------------------------------------- sort items into buckets */
function renderSort(ex) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Drag & drop"),
    el("p", { class: "ex-q", html: ex.q }),
    el("p", { class: "sr", text: "Keyboard and touch: tap a card to pick it up, then tap the column you want it in." })
  ]);
  var bank = el("div", { class: "bank", "aria-label": "Cards to sort" });
  var zones = el("div", { class: "zones" });
  var zoneBodies = {};
  ex.zones.forEach(function (z) {
    var body = el("div", { class: "items" });
    var zn = el("div", { class: "zone" }, [el("h5", { html: z.label }), body]);
    zoneBodies[z.key] = body;
    dropTarget(zn, function (chip) { body.appendChild(chip); });
    zones.appendChild(zn);
  });
  dropTarget(bank, function (chip) { bank.appendChild(chip); });

  shuffle(ex.items).forEach(function (it) {
    var chip = makeChip(it.t, it.z);
    chipClick(chip, function () { selectChip(chip); });
    bank.appendChild(chip);
  });

  var fb = feedback();
  var check = el("button", { class: "btn btn-primary", type: "button", text: "Check answer" });
  var reset = el("button", { class: "btn btn-ghost", type: "button", text: "Start over" });
  check.addEventListener("click", function () {
    if (bank.querySelector(".chip")) { showFb(fb, false, "Place every card before checking."); return; }
    var ok = true, right = 0, total = 0;
    ex.zones.forEach(function (z) {
      Array.prototype.forEach.call(zoneBodies[z.key].children, function (chip) {
        total++;
        var good = chip.getAttribute("data-key") === z.key;
        chip.classList.add(good ? "correct" : "wrong");
        chip.draggable = false;
        if (good) right++; else ok = false;
      });
    });
    showFb(fb, ok, ok ? "All " + total + " placed correctly." : right + " of " + total + " correct.", ex.why);
    State.mark(ex.id, ok);
    check.disabled = true;
  });
  reset.addEventListener("click", function () {
    wrap.replaceWith(renderSort(ex));
  });
  wrap.appendChild(bank);
  wrap.appendChild(zones);
  wrap.appendChild(el("div", { class: "btnrow" }, [check, reset]));
  wrap.appendChild(fb);
  return wrap;
}

/* ---------------------------------------------- put steps in sequence */
function renderSeq(ex) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Put in order"),
    el("p", { class: "ex-q", html: ex.q }),
    el("p", { class: "sr", text: "Tap a step to pick it up, then tap the ordered list to add it. Tap a placed step to send it back." })
  ]);
  var bank = el("div", { class: "bank", "aria-label": "Steps, shuffled" });
  var body = el("div", { class: "items" });
  var zone = el("div", { class: "seqzone" }, [el("h5", { text: "In order, first to last" }), body]);

  function renumber() {
    Array.prototype.forEach.call(body.children, function (chip, i) {
      var ord = chip.querySelector(".ord");
      if (!ord) { ord = el("span", { class: "ord" }); chip.insertBefore(ord, chip.firstChild); }
      ord.textContent = String(i + 1);
    });
  }
  function makeStep(text, key) {
    var chip = makeChip(text, key);
    chipClick(chip, function () {
      if (chip.parentNode === body) { chip.querySelector(".ord").remove(); bank.appendChild(chip); renumber(); }
      else selectChip(chip);
    });
    return chip;
  }
  dropTarget(zone, function (chip) { body.appendChild(chip); renumber(); });
  dropTarget(bank, function (chip) { var o = chip.querySelector(".ord"); if (o) o.remove(); bank.appendChild(chip); renumber(); });

  shuffle(ex.items.map(function (t, i) { return { t: t, i: i }; })).forEach(function (o) {
    bank.appendChild(makeStep(o.t, String(o.i)));
  });

  var fb = feedback();
  var check = el("button", { class: "btn btn-primary", type: "button", text: "Check order" });
  var reset = el("button", { class: "btn btn-ghost", type: "button", text: "Start over" });
  check.addEventListener("click", function () {
    if (bank.querySelector(".chip")) { showFb(fb, false, "Place every step before checking."); return; }
    var ok = true;
    Array.prototype.forEach.call(body.children, function (chip, i) {
      var good = chip.getAttribute("data-key") === String(i);
      chip.classList.add(good ? "correct" : "wrong");
      chip.draggable = false;
      if (!good) ok = false;
    });
    showFb(fb, ok, ok ? "Correct order." : "Not the right order — the red steps are out of place.", ex.why);
    State.mark(ex.id, ok);
    check.disabled = true;
  });
  reset.addEventListener("click", function () { wrap.replaceWith(renderSeq(ex)); });
  wrap.appendChild(bank);
  wrap.appendChild(zone);
  wrap.appendChild(el("div", { class: "btnrow" }, [check, reset]));
  wrap.appendChild(fb);
  return wrap;
}

/* ------------------------------------------- dropdown routing / cloze */
function renderCloze(ex) {
  var wrap = el("div", { class: "ex" }, [exHead("Choose from the list"), el("p", { class: "ex-q", html: ex.q })]);
  var box = el("div", { class: "cloze" });
  var sels = [];
  ex.rows.forEach(function (r, ri) {
    var sel = el("select", { "aria-label": r.lbl.replace(/<[^>]+>/g, "") });
    sel.appendChild(el("option", { value: "", text: "— choose —" }));
    r.opts.forEach(function (o, i) { sel.appendChild(el("option", { value: String(i), text: o })); });
    sels.push(sel);
    box.appendChild(el("div", { class: "clozerow" }, [el("span", { class: "lbl", html: r.lbl }), sel]));
  });
  var fb = feedback();
  var check = el("button", { class: "btn btn-primary", type: "button", text: "Check answers" });
  check.addEventListener("click", function () {
    if (sels.some(function (s) { return s.value === ""; })) { showFb(fb, false, "Answer every row first."); return; }
    var ok = true, right = 0;
    sels.forEach(function (s, i) {
      var good = Number(s.value) === ex.rows[i].a;
      s.className = good ? "correct" : "wrong";
      s.disabled = true;
      if (good) right++; else ok = false;
    });
    showFb(fb, ok, ok ? "All correct." : right + " of " + sels.length + " correct.", ex.why);
    State.mark(ex.id, ok);
    check.disabled = true;
  });
  wrap.appendChild(box);
  wrap.appendChild(el("div", { class: "btnrow" }, [check]));
  wrap.appendChild(fb);
  return wrap;
}

/* --------------------------------------- clickable diagram (hotspots) */
function renderHotspot(spec) {
  var wrap = el("div", { class: "ex hotspot" }, [
    exHead("Explore the diagram"),
    el("p", { class: "ex-q", html: spec.q })
  ]);
  var host = el("div", { class: "svgscroll", html: spec.svg });
  var panel = el("div", { class: "hs-panel" }, [el("p", { class: "muted", text: "Click any account in the diagram to see what it is and what it is for." })]);
  var seen = {};
  wrap.appendChild(host);
  wrap.appendChild(panel);
  host.querySelectorAll("[data-hs]").forEach(function (g) {
    g.classList.add("hs-btn");
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    var key = g.getAttribute("data-hs");
    var info = spec.spots[key];
    g.setAttribute("aria-label", info.t);
    function open() {
      panel.innerHTML = "";
      panel.appendChild(el("h4", { html: info.t }));
      panel.appendChild(el("div", { html: info.d }));
      seen[key] = true;
      if (Object.keys(seen).length === Object.keys(spec.spots).length) State.mark(spec.id, true);
    }
    g.addEventListener("click", open);
    g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  return wrap;
}

/* ------------------------------------------------- step-through panel */
function renderStepper(spec) {
  var wrap = el("div", { class: "figure" });
  var dots = el("div", { class: "stepper", role: "tablist" });
  var bodyBox = el("div", { class: "stepbody" });
  var btns = [];
  function show(i) {
    btns.forEach(function (b, j) { b.setAttribute("aria-current", String(j === i)); });
    bodyBox.innerHTML = "";
    bodyBox.appendChild(el("h4", { html: spec.steps[i].t }));
    bodyBox.appendChild(el("div", { html: spec.steps[i].d }));
  }
  spec.steps.forEach(function (s, i) {
    var b = el("button", { class: "stepdot", type: "button", role: "tab", text: s.n || String(i + 1) });
    b.addEventListener("click", function () { show(i); });
    btns.push(b); dots.appendChild(b);
  });
  wrap.appendChild(dots);
  wrap.appendChild(bodyBox);
  show(0);
  return wrap;
}

/* -------------------------------------------- expandable detail rows */
function renderAccordion(spec) {
  var wrap = el("div", { class: "acc" });
  spec.items.forEach(function (it, i) {
    var row = el("div", { class: "acc-row" });
    var body = el("div", { class: "acc-body" }, [el("div", { class: "inner", html: it.d })]);
    var kids = [];
    if (spec.numbered !== false) kids.push(el("span", { class: "acc-num", text: String(i + 1) }));
    kids.push(el("span", { html: it.t }));
    kids.push(el("span", { class: "chev", "aria-hidden": "true", text: "▶" }));
    var btn = el("button", { class: "acc-btn", type: "button", "aria-expanded": "false" }, kids);
    btn.addEventListener("click", function () {
      var open = row.classList.toggle("open");
      btn.setAttribute("aria-expanded", String(open));
    });
    row.appendChild(btn);
    row.appendChild(body);

/* ------------------- what actually happens to total debt over a cycle */
function svgSawtooth() {
  var base = 254, PX = 0.333;                    /* $1,000 = 0.333px, so $600k = 200px */
  function bar(x, nd, d, label, total, note, delay) {
    var dh = Math.round(d * PX), ndh = Math.round(nd * PX), top = base - dh - ndh, out = '';
    if (d) out += '<rect x="' + x + '" y="' + (base - dh) + '" width="130" height="' + dh +
      '" rx="6" style="fill:var(--blue);opacity:.88">' + grow('height', dh, delay) + grow('y', base - dh, delay, base) + '</rect>' +
      '<text x="' + (x + 65) + '" y="' + (base - dh / 2 + 4) + '" text-anchor="middle" style="font:800 11px var(--bf);fill:#fff">$' + d + 'k</text>';
    if (nd) out += '<rect x="' + x + '" y="' + top + '" width="130" height="' + ndh +
      '" rx="6" style="fill:var(--coral);opacity:.9">' + grow('height', ndh, delay) + grow('y', top, delay, base - dh) + '</rect>' +
      '<text x="' + (x + 65) + '" y="' + (top + ndh / 2 + 4) + '" text-anchor="middle" style="font:800 11px var(--bf);fill:#fff">$' + nd + 'k</text>';
    out += '<text x="' + (x + 65) + '" y="' + (base + 22) + '" text-anchor="middle" style="' + F.h + '">' + label + '</text>' +
      '<text x="' + (x + 65) + '" y="' + (base + 40) + '" text-anchor="middle" style="' + F.s + '">total debt ' + total + '</text>';
    if (note) out += '<text x="' + (x + 65) + '" y="' + (top - 12) + '" text-anchor="middle" style="font:800 10.5px var(--bf);fill:var(--coral)">' + note + '</text>';
    return out;
  }
  return '<svg data-anim viewBox="0 0 800 330" role="img" aria-label="Total debt starts at $400k, rises to $600k when the split is drawn, falls back to $400k as surplus pays down the home loan, and ends at $400k entirely deductible. The non-deductible block only ever shrinks.">' +
    '<rect x="60" y="14" width="120" height="14" rx="4" style="fill:var(--coral);opacity:.9"/>' +

    '<rect x="360" y="14" width="120" height="14" rx="4" style="fill:var(--blue);opacity:.88"/>' +
    '<text x="488" y="26" style="' + F.b + '">Deductible</text>' +
    '<line x1="40" y1="121" x2="770" y2="121" style="stroke:var(--border-strong);stroke-width:1.5;stroke-dasharray:5 4"/>' +
    '<text x="770" y="116" text-anchor="end" style="' + F.s + '">where total debt started — $400k</text>' +
    '<line x1="40" y1="254" x2="770" y2="254" style="stroke:var(--border-strong);stroke-width:1.5"/>' +
    bar(60, 400, 0, 'Today', '$400k', null, '0.15s') +
    bar(240, 400, 200, 'Draw $200k', '$600k', 'debt up $200k', '0.5s') +
    bar(420, 200, 200, 'Four years on', '$400k', null, '0.85s') +
    bar(600, 0, 400, 'Keep going', '$400k', null, '1.2s') +
    '<text x="400" y="322" text-anchor="middle" style="' + F.s + '">Total debt rises at each drawdown and falls between them. The coral block only ever shrinks.</text>' +
    '</svg>';

function renderFlip(spec) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Flip the cards"),
    el("p", { class: "ex-q", html: spec.q })
  ]);
  var grid = el("div", { class: "flipgrid" });
  var seen = {};
  spec.cards.forEach(function (c, i) {
    var card = el("button", { class: "flipcard", type: "button", "aria-label": c.t + " — reveal definition" }, [
      el("div", { class: "flipinner" }, [
        el("div", { class: "flipface flipfront" }, [
          el("span", { class: "term", html: c.t }),
          el("span", { class: "hint", text: "tap to reveal" })
        ]),
        el("div", { class: "flipface flipback" }, [el("span", { class: "def", html: c.d })])
      ])
    ]);
    card.addEventListener("click", function () {
      card.classList.toggle("on");
      seen[i] = true;
      if (Object.keys(seen).length === spec.cards.length) State.mark(spec.id, true);
    });
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  wrap.appendChild(el("p", { class: "footnote", style: "text-align:left;margin-top:2px",

/* -------------------------------------------- the deduction calculator */
function renderCalc(spec) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Try it"),
    el("p", { class: "ex-q", html: spec.q })
  ]);
  var money = function (n) { return "$" + Math.round(n).toLocaleString("en-AU"); };

  var amt = el("input", { type: "range", min: "25000", max: "500000", step: "5000", value: "100000", "aria-label": "Investment split size" });
  var rate = el("input", { type: "range", min: "3", max: "10", step: "0.1", value: "6", "aria-label": "Interest rate" });
  var mtr = el("select", { "aria-label": "Marginal tax rate" });
  [["47", "47% — over $190,000"], ["39", "39% — $135,001 to $190,000"], ["32", "32% — $45,001 to $135,000"],
   ["17", "17% — $18,201 to $45,000"], ["0", "0% — under the tax-free threshold"]]
    .forEach(function (o) { mtr.appendChild(el("option", { value: o[0], text: o[1] })); });

  var amtV = el("span", { class: "cv" }), rateV = el("span", { class: "cv" });
  var oInt = el("div", { class: "ov" }), oSave = el("div", { class: "ov good" }),
      oNet = el("div", { class: "ov" }), oEff = el("div", { class: "ov good" });

  var out = el("div", { class: "calcout" }, [
    el("div", {}, [el("div", { class: "ol", text: "Interest a year" }), oInt]),
    el("div", {}, [el("div", { class: "ol", text: "Tax saved" }), oSave]),
    el("div", {}, [el("div", { class: "ol", text: "Real cost after tax" }), oNet]),
    el("div", {}, [el("div", { class: "ol", text: "Effective rate" }), oEff])
  ]);

  function update() {
    var a = Number(amt.value), r = Number(rate.value), m = Number(mtr.value) / 100;
    var interest = a * r / 100;
    amtV.textContent = money(a);
    rateV.textContent = r.toFixed(1) + "%";
    oInt.textContent = money(interest);
    oSave.textContent = money(interest * m);
    oNet.textContent = money(interest * (1 - m));
    oEff.textContent = (r * (1 - m)).toFixed(2) + "%";
    State.mark(spec.id, true);
  }
  [amt, rate, mtr].forEach(function (n) { n.addEventListener("input", update); n.addEventListener("change", update); });

  wrap.appendChild(el("div", { class: "calc" }, [
    el("div", { class: "calcfield" }, [el("span", { class: "cl", text: "Investment split" }), amtV, amt]),
    el("div", { class: "calcfield" }, [el("span", { class: "cl", text: "Interest rate" }), rateV, rate]),
    el("div", { class: "calcfield" }, [el("span", { class: "cl", text: "Client's marginal rate" }), mtr])
  ]));
  wrap.appendChild(out);
  wrap.appendChild(el("p", { class: "footnote", style: "text-align:left",
    html: "Set the marginal rate to 0% and the deduction is worth nothing. That is why the benefit grows with income — and why this is not a strategy for everyone." }));
  update();
  return wrap;
}

/* ============================================================================
   FINAL ASSESSMENT renderer
   Registered by wrapping renderEx so the switch above stays untouched.
   ========================================================================== */
function renderExam(spec) {
  var wrap = el("div", { class: "ex" }, [
    exHead("Final assessment"),
    el("p", { class: "ex-q", html: "Answer all " + spec.questions.length +
      " questions, then submit. You need " + Math.round(spec.pass * 100) + "% to pass. You can retake it as many times as you like." })
  ]);
  var groups = [];
  spec.questions.forEach(function (q, qi) {
    var block = el("div", { class: "tile", style: "margin-bottom:12px" });
    block.appendChild(el("h4", { html: (qi + 1) + ". " + q.q }));
    var list = el("ul", { class: "opts", style: "margin-top:10px" });
    var inputs = [];
    q.opts.forEach(function (o, i) {
      var input = el("input", { type: q.multi ? "checkbox" : "radio", name: spec.id + "-" + qi, value: String(i) });
      inputs.push(input);
      list.appendChild(el("li", {}, [el("label", { class: "opt" }, [input, el("span", { html: o })])]));
    });
    block.appendChild(list);
    var why = el("div", { class: "fb" });
    block.appendChild(why);
    groups.push({ q: q, inputs: inputs, why: why });
    wrap.appendChild(block);
  });

  var fb = feedback();
  var out = el("div");
  var submit = el("button", { class: "btn btn-primary", type: "button", text: "Submit assessment" });
  var again = el("button", { class: "btn btn-ghost", type: "button", text: "Retake" });
  again.style.display = "none";

  submit.addEventListener("click", function () {
    var unanswered = groups.filter(function (g) { return !g.inputs.some(function (n) { return n.checked; }); });
    if (unanswered.length) { showFb(fb, false, "You still have " + unanswered.length + " unanswered question" + (unanswered.length > 1 ? "s" : "") + "."); return; }
    var score = 0;
    groups.forEach(function (g) {
      var want = g.q.multi ? g.q.a : [g.q.a];
      var ok = true;
      g.inputs.forEach(function (n, i) {
        var shouldBe = want.indexOf(i) >= 0, lab = n.parentNode;
        if (shouldBe && n.checked) lab.className = "opt correct";
        else if (!shouldBe && n.checked) { lab.className = "opt wrong"; ok = false; }
        else if (shouldBe && !n.checked) { lab.className = "opt missed"; ok = false; }
        n.disabled = true;
      });
      if (ok) score++;
      showFb(g.why, ok, ok ? "Correct." : "Not quite.", g.q.why);
    });
    var pct = Math.round((score / groups.length) * 100);
    var passed = score / groups.length >= spec.pass;
    State.mark(spec.id, passed);
    submit.style.display = "none";
    again.style.display = "";

    out.innerHTML = "";
    out.appendChild(el("div", { class: "scorewrap" }, [
      el("div", { class: "scorebig", text: pct + "%" }),
      el("div", { class: "scorelab", text: score + " of " + groups.length + " correct" })
    ]));
    if (passed) {
      out.appendChild(el("div", { class: "callout c-tip" }, [
        el("h4", { text: "🎉 Passed" }),
        el("p", { style: "margin:0", text: "Enter your name below and print or save the certificate for your training record." })
      ]));
      out.appendChild(buildCertificate());
    } else {
      out.appendChild(el("div", { class: "callout c-rule" }, [
        el("h4", { text: "Just short" }),
        el("p", { style: "margin:0", html: "You need " + Math.round(spec.pass * 100) + "% to pass. Read the explanations above, " +
          "revisit the modules they point to, then retake it." })
      ]));
    }
    out.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  again.addEventListener("click", function () { wrap.replaceWith(renderExam(spec)); });

  wrap.appendChild(el("div", { class: "btnrow" }, [submit, again]));
  wrap.appendChild(fb);
  wrap.appendChild(out);
  return wrap;
}

function buildCertificate() {
  var d = new Date();
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var dateStr = d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  var name = el("input", { type: "text", placeholder: "Your name", value: State.data.name || "", "aria-label": "Your name" });
  name.addEventListener("input", function () { State.data.name = name.value; State.save(); });
  var cert = el("div", { class: "cert", style: "margin-top:14px" }, [
    el("div", { class: "cbrand", text: "MyWealth Solutions" }),
    el("div", { class: "scorelab", text: "Certificate of completion" }),
    el("p", { style: "margin-top:18px;color:var(--text-dim)", text: "This certifies that" }),
    name,
    el("p", { style: "margin-top:18px;color:var(--text-dim)", html:
      "has completed <strong>Debt Recycling — Client Service Officer Training</strong><br>and passed the final assessment." }),
    el("p", { style: "margin-top:16px;font-size:13px;color:var(--text-muted)", text: dateStr })
  ]);
  var print = el("button", { class: "btn btn-primary no-print", style: "margin-top:12px", type: "button", text: "🖨 Print / save as PDF" });
  print.addEventListener("click", function () { window.print(); });
  var box = el("div");
  box.appendChild(cert);
  box.appendChild(print);
  return box;
}

    '<div class="tablewrap"><table class="t"><thead><tr><th style="width:30%">Term</th><th>What it means</th></tr></thead><tbody>' +
    '<tr><td><strong>Debt recycling</strong></td><td>Converting non-deductible home loan debt into tax-deductible investment debt, without increasing total debt.</td></tr>' +
    '<tr><td><strong>Non-deductible debt</strong></td><td>Borrowings used for private purposes. The interest cannot be claimed.</td></tr>' +
    '<tr><td><strong>Deductible debt</strong></td><td>Borrowings used to acquire income-producing assets. The interest can be claimed.</td></tr>' +
    '<tr><td><strong>Purpose (use) test</strong></td><td>The ATO principle that deductibility follows what the borrowed money was used for, not what secures the loan.</td></tr>' +
    '<tr><td><strong>Loan split</strong></td><td>A portion of one loan facility carved out with its own account number, statements and repayment terms.</td></tr>' +
    '<tr><td><strong>Equity</strong></td><td>What the property is worth minus what is still owed on it.</td></tr>' +
    '<tr><td><strong>Usable (available) equity</strong></td><td>The portion that can actually be borrowed — generally 80% of the property\'s value less the outstanding loan. Always a smaller number than total equity.</td></tr>' +
    '<tr><td><strong>Borrowing to invest (gearing)</strong></td><td>Increasing borrowings and using the funds to buy investments. It is what creates the deductible interest.</td></tr>' +
    '<tr><td><strong>Offset account</strong></td><td>A transaction account linked to a loan; the balance reduces the interest-charged loan balance without being a repayment.</td></tr>' +
    '<tr><td><strong>Term loan</strong></td><td>A set amount over a set term, advanced up front. Repayments generally cannot be re-borrowed, which is why the investment split carries its own offset.</td></tr>' +
    '<tr><td><strong>Redraw</strong></td><td>Taking back money previously repaid into a loan. It counts as fresh borrowing, so its purpose decides its deductibility.</td></tr>' +
    '<tr><td><strong>Mixed-purpose loan</strong></td><td>One loan used for both private and investment purposes. Interest must be apportioned, and repayments come off both purposes proportionally.</td></tr>' +
    '<tr><td><strong>Capitalising interest</strong></td><td>Adding unpaid interest to the loan balance instead of paying it. On an investment loan this is a tax question — escalate.</td></tr>' +
    '<tr><td><strong>Cash Management Account (CMA)</strong></td><td>The clean hub account used only for investment money, giving one traceable statement trail.</td></tr>' +
    '<tr><td><strong>Debt transfer instruction</strong></td><td>The document prepared by the associate adviser setting out which funds move, from where, to where, and in what order. Refreshed each year. You act on it — you do not write it.</td></tr>' +
    '<tr><td><strong>Modelling tool</strong></td><td>Where the strategy is projected forward. Only as good as the debt balances and fund-use figures put into it.</td></tr>' +
    '<tr><td><strong>Contract note</strong></td><td>The confirmation of a buy or sell trade. Evidence of what borrowed funds bought, and of the cost base.</td></tr>' +
    '<tr><td><strong>Distribution</strong></td><td>Income paid by a managed fund or ETF to unit holders — the equivalent of a dividend from a company.</td></tr>' +
    '<tr><td><strong>Effective interest rate</strong></td><td>The headline rate after the deduction is taken off — what the borrowing really costs. Headline rate × (1 − marginal rate). A 6% loan for a client on 47% has an effective rate of 3.18%.</td></tr>' +
    '<tr><td><strong>Marginal tax rate</strong></td><td>The rate applying to the client\'s next dollar of income, and therefore the rate a deduction saves them. For 2026–27, including the Medicare levy: 17%, 32%, 39% or 47%.</td></tr>' +
    '<tr><td><strong>Medicare levy</strong></td><td>2% of taxable income, on top of the tax rates. It is why the top marginal rate is quoted as 47% rather than 45%.</td></tr>' +
    '<tr><td><strong>Franking credit</strong></td><td>A credit for tax the company already paid on profits behind a dividend. Can reduce the client\'s tax or generate a refund.</td></tr>' +
    '<tr><td><strong>Interest-only (IO)</strong></td><td>Repayments cover interest only, so the balance does not fall. Common on investment splits to preserve deductible debt.</td></tr>' +
    '<tr><td><strong>Principal &amp; interest (P&amp;I)</strong></td><td>Repayments reduce the balance as well as covering interest. Standard on the home loan split.</td></tr>' +

    '<tr><td><strong>LMI</strong></td><td>Lenders Mortgage Insurance. Generally payable below 20% equity, which is why 20% is the usual starting point.</td></tr>' +
    '<tr><td><strong>Ring-fenced (quarantined) loss</strong></td><td>A rental loss that cannot be offset against salary or other income, only against future residential rental income or a capital gain. Applies from 1 July 2027 to established residential property bought after 12 May 2026.</td></tr>' +
    '<tr><td><strong>Cost base indexation</strong></td><td>From 1 July 2027, replaces the general 50% CGT discount: the cost base is adjusted for inflation so only the real gain is taxed, with a 30% minimum tax on net gains. Applies to all CGT assets.</td></tr>' +
    '<tr><td><strong>Negative gearing</strong></td><td>Borrowing to invest where costs exceed income, with the loss reducing taxable income. A different strategy to debt recycling.</td></tr>' +
    '</tbody></table></div>',

    '<div class="hr"></div><h2>Final assessment</h2>',

    { id: "m10exam", kind: "exam", pass: 0.8, questions: [
      { q: "What does debt recycling change about a client's debt?",
        opts: ["The total amount owed", "Its character — non-deductible debt becomes deductible debt", "The interest rate", "The lender"], a: 1,
        why: "Restructure, not increase. (Module 3)" },
      { q: "Interest on a loan is deductible when…",
        opts: ["The loan is secured against an investment asset", "The borrowed money was used to acquire an income-producing asset", "The loan is labelled an investment loan by the bank", "The client is on a high marginal tax rate"], a: 1,
        why: "The purpose test. Security, product name and tax rate are all irrelevant to whether the deduction exists. (Module 4)" },
      { q: "Both splits have an offset. What belongs in each?",
        opts: [
          "The client's own cash in either — it makes no difference",
          "Own cash against the home loan split; borrowed funds not yet invested against the investment split",
          "Borrowed funds against the home loan split; own cash against the investment split",
          "Offsets are not used in debt recycling"
        ], a: 1,
        why: "Two offsets, two jobs. Own cash cuts non-deductible interest; undrawn borrowed funds sit against the investment term loan so no net interest is charged on money not yet working. (Module 5)" },
      { q: "Where must a drawdown from the investment split land?",
        opts: ["The client's everyday transaction account", "The offset account", "A clean, nil-balance account such as a CMA, then straight into the investment", "Split A, to reduce the home loan"], a: 2,
        why: "Traceability is the deduction. Mixing borrowed funds with personal money breaks the trail. (Modules 6 and 7)" },
      { q: "A client redraws $20,000 from their $100,000 investment split to pay for a holiday. What is the consequence?",
        opts: ["No consequence — the split was created for investment", "The whole split loses deductibility", "The split becomes mixed-purpose: 80% of the interest is deductible and repayments are apportioned across both purposes", "The client simply repays it and the problem is resolved"], a: 2,
        why: "Apportionment, and it is sticky. (Module 7)" },

    { q: "Split B has fallen from $120,000 to $105,000 since the last review. This is…",
        opts: ["Good news — less debt", "Neutral — balances move", "A problem: deductible debt has been destroyed and cannot easily be rebuilt. Flag it to the adviser", "Only a problem if the client also sold investments"], a: 2,
        why: "On the investment split, a falling balance works against the strategy. (Module 8)" },
      { q: "Select every event that should be escalated to the adviser the same day.",
        multi: true,
        opts: ["The client is refinancing both loans to a new lender", "The client has reduced their working hours", "A quarterly distribution has been reinvested", "The client wants to pay a lump sum off the investment split", "You are updating the client's postal address"], a: [0, 1, 3],
        why: "Refinances can merge the splits, income changes undermine serviceability, and lump sums off the investment split destroy deductible debt. A distribution reinvesting normally, and an address update, are ordinary business. (Modules 7, 8 and 10)" },

    { q: "A client on a 47% marginal rate paid $9,000 of interest on their investment split. The approximate tax benefit is…",
        opts: ["$9,000", "$4,230", "$2,880", "Nil until the investments are sold"], a: 1,
        why: "$9,000 × 47% = $4,230. The deduction reduces taxable income; it does not refund the interest. (Module 4)" },
      { q: "A client asks you directly whether the interest on their new split is tax-deductible. The right response is to…",
        opts: ["Confirm that it is, since the split was set up for investing", "Route the question to the adviser and the accountant, promptly", "Tell them to call the ATO", "Say you are not permitted to discuss anything tax-related"], a: 1,
        why: "You may know the answer; it is still advice about a specific client's circumstances. Route it — and route it quickly. (Module 8)" },
      { q: "Select everything our guide identifies as a genuine risk or precondition of debt recycling.",
        multi: true,
        opts: ["Losses are amplified in a downturn", "The family home is usually the security", "A minimum horizon of around seven years", "Personal insurance, particularly income protection, matters", "The ATO may retrospectively disallow the strategy"], a: [0, 1, 2, 3],
        why: "Debt recycling is legal under Australian tax law where funds are used for an income-producing purpose. The risks are structural and market-based. (Modules 3 and 10)" }
    ] },

(function () {
  var THEME_KEY = "mws.debtrecycling.theme";

  function applyTheme(t) {
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");   /* follow the OS */
    var btn = document.getElementById("themeBtn");
    if (btn) {
      var isDark = t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      btn.textContent = isDark ? "☀️" : "🌙";
      btn.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    }
  }
  var stored = null;
  try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(stored);

  document.getElementById("themeBtn").addEventListener("click", function () {
    var isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = isDark ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme(next);
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!window.confirm("Clear every answer and start the training again from scratch?")) return;
    State.data = { answers: {}, done: {}, name: "" };
    State.save();
    renderNav();
    renderModule((location.hash || "").replace("#/", "") || MODULES[0].slug);
  });

  var SIZE_KEY = "mws.debtrecycling.size";
  function applySize() {
    var compact = true;   /* denser by default; the control below opts out */
    try { compact = localStorage.getItem(SIZE_KEY) !== "normal"; } catch (e) {}
    document.documentElement.classList.toggle("compact", compact);
    var b = document.getElementById("sizeBtn");
    if (b) {
      b.textContent = compact ? "Larger" : "Smaller";
      b.setAttribute("aria-label", compact ? "Use larger text" : "Use smaller text");
    }
  }
  document.getElementById("sizeBtn").addEventListener("click", function () {
    var compact = document.documentElement.classList.contains("compact");
    try { localStorage.setItem(SIZE_KEY, compact ? "normal" : "compact"); } catch (e) {}
    applySize();
  });
  applySize();

  document.getElementById("motionBtn").addEventListener("click", function () {
    try { localStorage.setItem(MOTION_KEY, motionWanted() ? "off" : "on"); } catch (e) {}
    applyMotion();
  });

  document.getElementById("navToggle").addEventListener("click", function () {
    setNavOpen(document.getElementById("nav").classList.contains("collapsed"));
  });

  State.load();
  renderNav();
  if (window.innerWidth <= 900) setNavOpen(false);

  function route() { renderModule((location.hash || "").replace("#/", "") || MODULES[0].slug); }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
