.brand .logo{font-family:'ABC Arizona Flare','Playfair Display',serif;font-size:26px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.4px}
.brand .logo-sub{font-size:11px;letter-spacing:.44em;text-transform:uppercase;color:#e6eef5;margin-top:3px;padding-left:2px}
.brand .tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7fa6c0;margin-top:12px}
.nav{padding:10px 10px 24px}
.nav-group{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#5f7f96;padding:15px 12px 6px}
.nav-group:first-child{padding-top:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;color:#aec6d6;font-weight:600;font-size:13px;transition:.13s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--blue);color:#fff}
.nav-item .ni-num{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.nav-item.active .ni-num{background:rgba(255,255,255,.25)}
.nav-item .ni-num.done{background:#34C759;color:#06331c}
.nav-item.active .ni-num.done{background:#34C759;color:#06331c}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px}
.topbar .sub{color:var(--text-muted);font-size:12px}
.topstat{font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--blue);background:var(--blue-light);border:1px solid var(--blue-soft);border-radius:20px;padding:5px 13px;white-space:nowrap}
.spacer{flex:1}
.content{padding:26px 30px 80px;max-width:1080px;width:100%}
.section{display:none}
.section.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-head{margin-bottom:12px}
.section-head h2{font-size:19px}
.section-head p{color:var(--text-muted);margin-top:3px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;margin-bottom:13px;box-shadow:var(--shadow)}
.card-title{font-family:'Nunito';font-weight:800;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-title .bar{width:4px;height:15px;background:var(--blue);border-radius:2px}
/* Forms */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
label{display:block;font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
input,select,textarea{width:100%;padding:6px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);font-family:inherit;font-size:12.5px;transition:.13s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,111,214,.12)}
textarea{resize:vertical;min-height:60px}
.field{margin-bottom:2px}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--blue);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:8px 9px;text-align:left}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--border-soft);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--row-alt)}
.tbl input,.tbl select,.tbl textarea{padding:6px 8px;font-size:12.5px;border-color:transparent;background:transparent}
.tbl input:focus,.tbl select:focus,.tbl textarea:focus{background:var(--input-bg);border-color:var(--blue)}
.tbl td.num input{text-align:right}
.row-tools{display:flex;gap:4px}
.icon-btn{border:none;background:var(--surface-2);color:var(--text-muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.12s}
.icon-btn:hover{background:var(--coral-light);color:var(--coral)}
.totals{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:var(--blue-light);border-radius:var(--radius-sm)}
.totals .t{font-size:12px;color:var(--text-dim)}
.totals .t b{display:block;font-size:17px;color:var(--heading);font-family:'ABC Arizona Flare','Playfair Display';margin-top:2px}
/* Buttons */
.btn{border:none;border-radius:var(--radius-sm);padding:9px 16px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;transition:.13s;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-bright)}
.btn-ghost{background:var(--surface-2);color:var(--text-dim)}.btn-ghost:hover{background:var(--border-soft);color:var(--text)}
.btn-add{background:var(--lime-light);color:var(--lime-dark);border:1px dashed var(--lime-dark)}.btn-add:hover{background:var(--lime)}
.btn-coral{background:var(--coral);color:#fff}.btn-coral:hover{filter:brightness(1.05)}
.btn-sm{padding:6px 11px;font-size:12px}
.theme-toggle{border:1px solid var(--border);background:var(--surface);color:var(--text-dim);border-radius:20px;padding:6px 13px;cursor:pointer;font-size:12px;font-weight:600}
/* Import dropzones */
.imports{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:9px}
.dz{border:1.5px dashed var(--border-strong);border-radius:var(--radius);padding:10px 11px;background:var(--surface-2);cursor:pointer;transition:.13s;position:relative}
.dz:hover{border-color:var(--blue);background:var(--blue-light)}
.dz h4{font-size:12px;color:var(--heading);font-family:'Nunito';font-weight:800;margin-bottom:2px;line-height:1.2}
.dz p{font-size:10.5px;color:var(--text-muted);line-height:1.3}
.dz .badge{display:inline-block;margin:0 0 4px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:9px;text-transform:uppercase;letter-spacing:.03em}
.badge-soon{background:var(--coral-light);color:var(--coral)}
.badge-ready{background:var(--green-light);color:var(--green-dark)}
.dz input[type=file]{display:none}
.hint{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.5}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700;background:var(--blue-light);color:var(--blue)}
.rating-sel{font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.person-tag{font-family:'ABC Arizona Flare','Playfair Display';font-size:13px;color:var(--heading);margin-bottom:8px;font-weight:700}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:24px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* Checklist hybrid layout */
.cl-wrap{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.cl-side{position:sticky;top:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
.cl-side .cl-side-h{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);padding:6px 8px 8px}
.cl-sec-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:transparent;color:var(--text-dim);font-weight:700;font-size:12px;padding:7px 9px;border-radius:8px;cursor:pointer;transition:.12s;margin-bottom:1px}
.cl-sec-btn:hover{background:var(--surface-2);color:var(--text)}
.cl-sec-btn.active{background:var(--blue);color:#fff}
.cl-sec-btn .cl-ico{width:20px;text-align:center;flex-shrink:0}
.cl-sec-btn .cl-prog{margin-left:auto;font-size:10px;font-weight:800;color:var(--text-faint);background:var(--surface-2);border-radius:9px;padding:1px 7px}
.cl-sec-btn.active .cl-prog{background:rgba(255,255,255,.22);color:#fff}
.cl-sec-btn.done .cl-prog{background:var(--green-light);color:var(--green-dark)}
.cl-progressbar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:2px 0 12px}
.cl-progressbar > i{display:block;height:100%;background:var(--blue);border-radius:4px;transition:.3s}
.cl-item{padding:11px 0;border-bottom:1px solid var(--border-soft)}
.cl-item:last-child{border-bottom:none}
.cl-item .cl-q{font-size:13px;color:var(--heading);font-weight:700;margin-bottom:6px}
.cl-item .cl-help{font-size:11px;color:var(--text-muted);margin:-2px 0 7px;line-height:1.45}
.cl-perclient{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cl-perclient .cl-clabel{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:4px}
.cl-followup{margin-top:9px;padding:9px 11px;border-left:3px solid var(--blue);background:var(--blue-light);border-radius:0 8px 8px 0}
.cl-subhead{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin:16px 0 2px;padding-top:12px;border-top:1px solid var(--border-soft)}
.cl-subhead:first-child{border-top:none;padding-top:0;margin-top:2px}
.cl-substeps{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
.cl-substep{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
.cl-substep:hover{border-color:var(--blue);color:var(--text)}
.cl-substep.active{background:var(--blue);border-color:var(--blue);color:#fff}
.cl-substep.done:not(.active){border-color:#3a9d5d;color:#7fce9a}
.cl-substep-n{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:rgba(128,128,128,.28);font-size:10px;font-weight:800}
.cl-substep.active .cl-substep-n{background:rgba(255,255,255,.28)}
.cl-substep.done:not(.active) .cl-substep-n{background:rgba(58,157,93,.35);color:#bff0cf}
.cl-substep-p{opacity:.75;font-weight:600;font-size:10.5px}
.cl-flag{margin-top:8px;padding:8px 11px;border-radius:8px;font-size:12px;font-weight:600;line-height:1.5}
.cl-flag.warn{background:var(--coral-light);color:var(--coral);border:1px solid var(--coral)}
.cl-flag.ok{background:var(--green-light);color:var(--green-dark);border:1px solid var(--green)}
.cl-flag.info{background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-soft)}
.cl-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cl-seg button{border:none;background:var(--surface);color:var(--text-dim);font-weight:700;font-size:12px;padding:6px 14px;cursor:pointer;border-right:1px solid var(--border)}
.cl-seg button:last-child{border-right:none}
.cl-seg button.on{background:var(--blue);color:#fff}
.cl-seg button.on.no{background:var(--coral)}
.cl-seg button.on.na{background:var(--text-muted)}
/* Dashboard tiles */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:13px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.tile .tk{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.tile .tv{font-size:22px;font-weight:800;font-family:'ABC Arizona Flare','Playfair Display';color:var(--heading);margin-top:4px}
.tile .ts{font-size:11px;color:var(--text-muted);margin-top:2px}
.tile.accent{background:var(--blue-light);border-color:var(--blue-soft)}
.tile.warn{background:var(--coral-light);border-color:var(--coral)}
.upl-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:3px 6px 3px 11px;font-size:11.5px;font-weight:600;color:var(--text-dim);margin:3px 5px 3px 0}
.upl-chip .x{cursor:pointer;color:var(--coral);font-weight:800;border:none;background:transparent;font-size:13px;line-height:1}
/* Live Word-style document preview (File note / ROA) */
.doc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:1150px){.doc-wrap{grid-template-columns:1fr}}
.doc-page{background:#fff;color:#16242e;padding:40px 46px;border:1px solid #d9e2ec;border-radius:6px;box-shadow:0 8px 26px rgba(10,30,50,.14);font-family:'Nunito',system-ui,sans-serif;font-size:12.5px;line-height:1.6;min-height:400px}
.doc-page .doc-h{font-family:'ABC Arizona Flare','Playfair Display',serif;color:#0C6AE1;font-weight:700;font-size:15px;margin:15px 0 5px}
.doc-page .doc-h:first-child{margin-top:0}
.doc-page .doc-rule{border-top:1px solid #d9e2ec;margin:8px 0}
.doc-page .doc-p{margin:2px 0}
.doc-page .doc-li{margin:2px 0 2px 16px;position:relative}
.doc-page .doc-li:before{content:"•";position:absolute;left:-13px;color:#0C6AE1}
.doc-preview-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
.acct-block{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:var(--surface-2)}
.acct-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.acct-head input{font-weight:700}
@media(max-width:900px){.sidebar{display:none}.g2,.g3,.g4,.split,.imports{grid-template-columns:1fr}}
/* ---- live preview ---- */
.pv-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pv-scaler{transform-origin:top left;}
.pv-stage{overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px}
.wrprev-page{width:1123px;min-height:794px;background:#fff;color:#222;margin:0 auto 22px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:46px 52px;font-family:Nunito,'Segoe UI',sans-serif;box-sizing:border-box;position:relative}
.wrprev-page.cover{padding:0;overflow:hidden}
.wrprev-page.cover img,.wrprev-page.back img{width:100%;height:100%;object-fit:cover;display:block}
.pv-h1{font-family:'ABC Arizona Flare','Playfair Display',Georgia,serif;font-size:34px;color:#103143;margin:0 0 4px}
.pv-sub{color:#0C6AE1;font-weight:700;margin:0 0 22px}
.pv-h2{font-family:'ABC Arizona Flare','Playfair Display',Georgia,serif;font-size:21px;color:#0C6AE1;margin:22px 0 8px;border-bottom:2px solid #0C6AE1;padding-bottom:3px}
.pv-band{background:#0C2D3E;color:#fff;font-weight:700;font-size:12px;letter-spacing:.04em;padding:6px 12px;margin:14px 0 0;border-radius:3px}
.pv-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.pv-tbl th{background:#0C6AE1;color:#fff;text-align:left;padding:6px 9px;font-weight:700;border:1px solid #fff}
.pv-tbl.navy th{background:#0C2D3E}
.pv-tbl td{padding:5px 9px;border:1px solid #fff;vertical-align:top;background:#E3F2F4;color:#16242e}
.pv-tbl td.pv-lbl{background:#0B6AE1;color:#fff;font-weight:700}
.pv-tbl td.r,.pv-tbl th.r{text-align:right}
.pv-tot td{background:#5EA6FF;color:#fff;font-weight:700}
.pv-tot td.pv-val{background:#E3F2F4;color:#16242e}
.pv-dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:5px}
.pv-legend{font-size:11px;color:#555;margin:6px 0}
.pv-legend span.l{margin-right:14px;white-space:nowrap}
.pv-2col{display:flex;gap:26px}.pv-2col>div{flex:1}
.pv-2col-wide{gap:32px}
.pv-empty{color:#9aa6b2;font-style:italic;font-size:12px;padding:8px 0}
.pv-tbl td.c,.pv-tbl th.c{text-align:center}
.wrprev-page .pv-h3{font-family:'ABC Arizona Flare','Playfair Display',Georgia,serif;font-size:15px;color:#0C6AE1;margin:2px 0 6px}
.wrprev-page .pv-kv{font-size:12px;color:#222;margin:2px 0}
.wrprev-page .pv-p{font-size:12px;color:#333;line-height:1.5;margin:5px 0}
.wrprev-page .pv-ar{font-size:11px;color:#444;line-height:1.45;margin:4px 0}
.wrprev-page .pv-foot{font-size:10.5px;color:#777;font-style:italic;margin-top:6px}
.wrprev-page .pv-shade{background:#E3F2F4;border-radius:6px;padding:16px 18px}
.wrprev-page .pv-shade p{font-size:12px;color:#333;line-height:1.5;margin:6px 0}
.pv-fs{position:fixed;inset:0;z-index:9999;background:rgba(15,30,40,.92);display:none;flex-direction:column}
.pv-fs.open{display:flex}
.pv-fs-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:#fff}
.pv-fs-body{flex:1;overflow:auto;padding:24px}
/* ---- top workflow tab bar ---- */
.tabbar{display:flex;gap:4px;background:var(--navy);padding:8px 14px 0;flex-shrink:0}
.tabbtn{appearance:none;border:none;background:transparent;color:#9db4c7;font-family:'Nunito';font-weight:800;font-size:12.5px;padding:9px 15px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;transition:.12s}
.tabbtn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabbtn.active{background:var(--bg);color:var(--blue)}
/* ---- docked preview rail (SOA-style) ---- */
.workarea{display:flex;align-items:flex-start;min-height:0}
.workarea .content{flex:1}
.preview-rail{width:440px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:hidden;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column}
.pr-resize{position:absolute;left:0;top:0;width:7px;height:100%;cursor:col-resize;background:var(--line);opacity:.5;z-index:6}
.pr-resize:hover{opacity:1;background:var(--blue)}
.preview-rail.hidden{display:none}
.pr-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.pr-head b{font-size:14px;color:var(--heading)}
.pr-head .pr-btns{display:flex;gap:8px}
.pr-body{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.pr-scale{zoom:.37}
.pr-body .wrprev-page{box-shadow:0 4px 16px rgba(0,0,0,.16)}
@media(max-width:1024px){.preview-rail{display:none}}
/* ---- Compact / de-cluttered UI (fewer descriptions, tighter spacing) ---- */
.section-head{margin-bottom:8px}
.section-head h2{font-size:16px}
.section-head p{display:none}
.hint{display:none}
.card{padding:11px 14px;margin-bottom:9px}
.card-title{margin-bottom:9px;font-size:11px}
.content{padding:18px 24px 70px}
.topbar{padding:9px 22px}
.dz{padding:8px 10px}
.dz p{font-size:10px;line-height:1.28;max-height:3.9em;overflow:hidden}
.imports{gap:8px}
.smartdrop{border:2px dashed var(--blue-soft);border-radius:14px;background:var(--blue-light);padding:24px 20px;text-align:center;cursor:pointer;transition:.13s;display:block}
.smartdrop:hover,.smartdrop.drag{border-color:var(--blue);background:var(--surface-2)}
.smartdrop .sd-title{font-family:'ABC Arizona Flare','Playfair Display',serif;font-size:19px;color:var(--heading);font-weight:700}
.smartdrop .sd-sub{font-size:12.5px;color:var(--text-muted);margin:5px auto 0;max-width:660px;line-height:1.5}
.smartdrop .sd-types{font-size:11px;color:var(--text-dim);margin-top:8px}
.smartdrop input{display:none}
.sd-badge{display:inline-block;background:var(--green);color:#fff;border-radius:20px;padding:2px 11px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
/* whole-window drag & drop overlay */
#dropOverlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(12,46,63,.72);backdrop-filter:blur(2px)}
#dropOverlay.show{display:flex}
#dropOverlay .do-inner{border:3px dashed #7fb0ef;border-radius:18px;padding:44px 60px;text-align:center;color:#fff;background:rgba(12,46,63,.5);pointer-events:none}
#dropOverlay .do-ic{font-size:44px;line-height:1}
#dropOverlay .do-t{font-family:'ABC Arizona Flare','Playfair Display',serif;font-size:26px;font-weight:700;margin-top:10px}
#dropOverlay .do-s{font-size:13px;color:#cfe0ec;margin-top:6px}
/* dropzone/smart-drop labels are <label> elements — undo the global uppercase on their body text */
.dz h4,.dz p,.smartdrop .sd-title,.smartdrop .sd-sub,.smartdrop .sd-types,.cl-drop{text-transform:none;letter-spacing:normal}
/* checklist tab fills the full width; questions flow into columns so the space isn't wasted */
.content.cl-full{max-width:none}
.content.cl-full .cl-wrap{grid-template-columns:250px 1fr}
.cl-body{column-gap:44px}
@media(min-width:1180px){.content.cl-full .cl-body{column-count:2}}
@media(min-width:1750px){.content.cl-full .cl-body{column-count:3}}
.cl-body .cl-item{break-inside:avoid;-webkit-column-break-inside:avoid}
/* drag-drop old-checklist zone (replaces the plain upload button) */
.cl-drop{display:block;border:2px dashed var(--blue-soft);border-radius:10px;background:var(--blue-light);color:var(--blue);text-align:center;padding:12px 10px;font-size:12px;font-weight:700;line-height:1.4;cursor:pointer;transition:.13s}
.cl-drop:hover,.cl-drop.drag{border-color:var(--blue);background:var(--surface-2)}
.cl-drop input{display:none}
.cl-item{padding:9px 0}
.cl-item .cl-help{font-size:10.5px;margin:-1px 0 6px}
.cl-note{margin-top:6px}
.cl-note-add{background:none;border:none;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer;padding:2px 0;text-transform:none}
.cl-note-add:hover{text-decoration:underline}
.cl-note-ta{width:100%;font-size:12px;min-height:34px;max-height:150px;overflow-y:auto;resize:vertical;field-sizing:content;box-sizing:border-box}
/* bundled contributions grid */
.cl-cg-wrap{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 4px}
.cl-cg{border-collapse:collapse;font-size:12px;min-width:290px;flex:1}
.cl-cg th,.cl-cg td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:middle}
.cl-cg thead th{background:var(--navy);color:#fff;font-weight:700}
.cl-cg tbody th{background:var(--blue-light);color:var(--blue);font-weight:700;white-space:nowrap}
.cl-cg-in{width:100%;font-size:12px;padding:4px 6px}
.field{margin-bottom:2px}
.grid{gap:10px}

if(!S.extraPlatforms) S.extraPlatforms=[];   // manually-forced platform ids
function platformHaystack(){
  const hay=[];
  S.nestegg.forEach(a=>hay.push(a.name||""));
  S.lifestyle.forEach(a=>hay.push(a.name||""));
  ["client","partner"].forEach(w=>(S.portfolios[w]||[]).forEach(acc=>{hay.push(acc.acct||"");(acc.holdings||[]).forEach(h=>hay.push(h.product||""));}));
  return hay.join("  ||  ");
}
function detectedPlatforms(){
  const text=platformHaystack();
  const auto=PLATFORMS.filter(p=>p.re.test(text)).map(p=>p.id);
  const all=Array.from(new Set(auto.concat(S.extraPlatforms)));
  return PLATFORMS.filter(p=>all.includes(p.id));
}

/* ---------- asset-allocation donut charts (auto-generated) ---------- */
const ASSET_COLORS={
  "Domestic Equity":"#0C6AE1","International Equity":"#103143","Domestic Property":"#5EA6FF",
  "International Property":"#7FB0EF","Domestic Cash":"#CFE87F","International Cash":"#B5D85C",
  "Domestic Fixed Interest":"#4BACC6","International Fixed Interest":"#2E8BA0",
  "Alternative":"#F56A5A","Other":"#9AA6B2"
};
function allocColor(cls){
  if(ASSET_COLORS[cls]) return ASSET_COLORS[cls];
  const keys=Object.keys(ASSET_COLORS);
  let h=0; for(let i=0;i<cls.length;i++)h=(h*31+cls.charCodeAt(i))>>>0;
  return ASSET_COLORS[keys[h%keys.length]];
}
// returns base64 PNG (no prefix) of a donut + legend for the given allocation rows / key ('cur' or 'tgt')
function allocChartPNG(rows,key,title){
  const data=rows.map(r=>({label:r.cls,value:num(r[key]),color:allocColor(r.cls)})).filter(d=>d.value>0.0001);
  const cv=document.createElement("canvas"); cv.width=560; cv.height=720;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  const cx=cv.width/2, cy=250, rO=180, rI=104;
  const total=data.reduce((a,d)=>a+d.value,0)||1; let ang=-Math.PI/2;
  data.forEach(d=>{const s=d.value/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rO,ang,ang+s);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();ang+=s;});
  ctx.beginPath();ctx.arc(cx,cy,rI,0,Math.PI*2);ctx.fillStyle="#ffffff";ctx.fill();
  ctx.fillStyle="#103143";ctx.font="700 30px Nunito, Arial, sans-serif";ctx.textAlign="center";ctx.fillText(title,cx,40);
  // legend
  let ly=470; ctx.textAlign="left"; ctx.font="400 24px Nunito, Arial, sans-serif";
  data.forEach(d=>{
    ctx.fillStyle=d.color; ctx.fillRect(40,ly-16,22,22);
    ctx.fillStyle="#16242e"; ctx.fillText(d.label,74,ly+2);
    ctx.textAlign="right"; ctx.fillText((d.value).toFixed(2).replace(/\.00$/,"")+"%",cv.width-40,ly+2); ctx.textAlign="left";
    ly+=34;
  });
  return cv.toDataURL("image/png").split(",")[1];
}

// Composite a green "Prepared for <name>" pill onto the cover artwork (matches the template cover)
function coverWithNamePNG(){
  return new Promise((res)=>{
    try{
      if(typeof COVER_B64==="undefined"||!COVER_B64) return res(COVER_B64);
      const img=new Image();
      img.onload=()=>{
        try{
          const cw=img.naturalWidth||1350, chh=img.naturalHeight||950;
          const cv=document.createElement("canvas"); cv.width=cw; cv.height=chh;
          const x=cv.getContext("2d"); x.drawImage(img,0,0,cw,chh);
          const name=(S.meta.preparedFor||"").trim()||"[Client name]";

        }catch(e){ res(COVER_B64); }
      };

    }catch(e){ res(COVER_B64); }
  });
}

/* ---------- HUB24 / DWAportfolio report parser ---------- */
async function readPdfText(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let txt="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p); const c=await page.getTextContent();
    // group items by approximate line (y), then sort by x to keep row order
    const lines={};
    c.items.forEach(it=>{const y=Math.round(it.transform[5]);(lines[y]=lines[y]||[]).push([it.transform[4],it.str]);});
    Object.keys(lines).sort((a,b)=>b-a).forEach(y=>{txt+=lines[y].sort((a,b)=>a[0]-b[0]).map(t=>t[1]).join(" ")+"\n";});
    txt+="\n";
  }
  return txt;
}
function parseHub24Text(text){
  const acc=text.match(/Account Name:\s*([^\(]+?)\s*\(\s*([0-9A-Za-z]+)\s*-\s*([^\)]+)\)/);
  const asOf=(text.match(/As at\s*(\d{1,2}\/\d{1,2}\/\d{4})/)||[])[1]||"";
  if(!acc) return null;
  const id=acc[2].trim(), name=acc[1].trim(), type=acc[3].trim();
  // grab the Valuation Summary block
  const vi=text.indexOf("Valuation Summary"); const block=vi>=0?text.slice(vi):text;
  const holdings=[]; let total=0;
  block.split("\n").forEach(line=>{
    const m=line.match(/(GPS\d+)\s+(.+?)\s+([\d,]+\.\d{2})\s+[\d.]+%/);
    if(m){ holdings.push({product:m[1]+" - "+m[2].trim(), units:"", value:parseFloat(m[3].replace(/,/g,""))}); return; }
    const cash=line.match(/Cleared\s+Cleared Funds\s+([\d,]+\.\d{2})/);
    if(cash){ const v=parseFloat(cash[1].replace(/,/g,"")); if(v>0) holdings.push({product:"Cash", units:"", value:v}); }
    const tot=line.match(/Total\s+([\d,]+\.\d{2})\s+100\.00%/);
    if(tot) total=parseFloat(tot[1].replace(/,/g,""));
  });
  // Prefer the Consolidated Portfolio "Total Portfolio" end-of-period market value (the true current
  // balance). Tolerate integer columns like "0" (Performance reports) as well as $x,xxx.xx.
  const cp=text.match(/Total Portfolio\s+([\d,]+(?:\.\d{2})?)\s+([\d,()]+(?:\.\d{2})?)\s+([\d,()]+(?:\.\d{2})?)\s+([\d,]+(?:\.\d{2})?)/);
  if(cp) total=parseFloat(cp[4].replace(/,/g,""));
  if(!total) total=holdings.reduce((a,h)=>a+h.value,0);
  if(!holdings.length && total){ holdings.push({product:/super/i.test(type)?"Superannuation":"Account balance", units:"", value:total}); }
  if(!holdings.length && !total) return null;
  return {id,name,type,asOf,holdings,total};
}
async function importHub24(ev){
  return importAnyPlatform(ev);

/* ---------- unified platform uploader: auto-detects HUB24 / BT / Macquarie per file ---------- */
async function importAnyPlatform(ev){
  const files=[...ev.target.files]; if(!files.length)return;
  const applied=[], failed=[];
  for(const f of files){
    if(!/\.pdf$/i.test(f.name)){ failed.push(f.name+" — not a PDF"); continue; }
    let text="";
    try{ text=await readPdfText(f); }catch(e){ failed.push(f.name+" — couldn't read PDF (is the reader still loading? open the file in a normal browser tab)"); continue; }
    // Image-only / scanned PDFs (e.g. a CoreLogic property valuation) have no text layer — OCR them.
    if(!text || text.replace(/\s/g,"").length<40){
      try{ toast(f.name+" looks scanned — running OCR (this can take a moment)…"); text=await ocrPdfFile(f); }
      catch(e){ failed.push(f.name+" — scanned/image PDF and OCR unavailable (needs internet) — enter the value manually"); registerUpload(f.name,"Image PDF"); continue; }
      if(!text || text.replace(/\s/g,"").length<40){ failed.push(f.name+" — scanned PDF, no text found by OCR — enter the value manually"); registerUpload(f.name,"Image PDF (OCR empty)"); continue; }
      // OCR text is messy for tables; route it (auto-fills if a platform report, else keeps the text)
      const r=routeScannedText(text,f.name,"Scanned PDF"); applied.push(f.name+" (OCR) · "+r); continue;
    }
    try{
      // Review Data Snapshot (Jotform) → stage it as an override layer over the last-review base
      const snap=parseReviewSnapshot(text);
      if(snap){ stageSnapshotLayer(snap,f.name); applied.push("Review Data Snapshot · "+(snap.clientName||f.name)+" → staged as override layer"); registerUpload(f.name,"Review Data Snapshot"); continue; }
      // Insurance Schedule (SOI / existing insurances) → Insurance Cover table + Foundations
      const sched=parseInsuranceSchedule(text);
      if(sched && sched.rows.length){ applyInsuranceSchedule(sched); applied.push("Insurance Schedule · "+(sched.client||f.name)+" → "+sched.rows.length+" policy row(s) + Foundations"); registerUpload(f.name,"Insurance Schedule"); continue; }
      // try each wired parser; the guards inside each return null for non-matching formats
      let done=false;
      const h=parseHub24Text(text);
      if(h && (h.holdings.length||h.total)){ applyHub24(h); applied.push(`HUB24 · ${h.name} · ${money(h.total)}`); registerUpload(f.name,"Platform report"); done=true; }
      if(!done){ const b=parseBtText(text); if(b){ applyBt(b); applied.push(`BT Panorama · ${b.name} · ${money(b.total)}`); registerUpload(f.name,"Platform report"); done=true; } }
      if(!done){ const mq=parseMacqText(text); if(mq){ applyMacq(mq); applied.push(`Macquarie · ${mq.name||"CMA"} · ${money(mq.balance)}`); registerUpload(f.name,"Platform report"); done=true; } }
      // not a wired platform → generic best-effort (grab headline balance + keep full text) rather than failing
      if(!done) applied.push(f.name+" · "+genericPlatformImport(text,f.name));
    }catch(e){ failed.push(f.name+" — "+e.message); }
  }
  renderContent();
  let msg = applied.length ? ("✓ Imported "+applied.length+" report(s): "+applied.join("   ·   ")) : "No platform reports recognised in those files.";
  if(failed.length) msg += "   |   Skipped "+failed.length+": "+failed.join("; ");
  toast(msg);
}
/* ============================================================
   REVIEW DATA SNAPSHOT (Jotform) — parse + layer over the base
   The last Wealth Review (.docx) creates the BASE; the snapshot is an
   OVERRIDE LAYER the RSO confirms, updating income / assets / liabilities /
   estate and pushing the client's raised points into the discussion items.
   ============================================================ */
function parseReviewSnapshot(raw){
  if(!raw || !/Review Data Snapshot|Wealth Review Personal Update/i.test(raw)) return null;
  const F = raw.replace(/\s+/g,' ').replace(/ /g,' ').trim();
  const clean=(s)=>String(s||"").replace(/\s+/g,' ').trim();
  const BOUND = [
    /Is your financial plan for/i, /Your Full Name/i, /Your Partner'?s Full Name/i, /Your Preferred E-?mail/i,
    /Confirm Your Home/i, /Client Two/i, /Please provide an update/i,
    /Are there any other changes to your personal/i, /Additional details about the assets/i,
    /Cash On Hand/i, /Cash Savings/i, /Personal Shares/i, /Other Assets/i,
    /Who is it with/i, /Are there any other changes to the details/i, /Any further notes or details/i,
    /Do you have a\b/i, /Do you believe your current Will/i, /When was your\b/i,
    /Are there any specific/i, /Are there any upcoming/i,
    /You can edit this submission/i, /My Wealth Solutions Mail/i, /https:\/\/mail\.google/i
  ];
  const boundIdx=(from)=>{ let best=F.length; for(const re of BOUND){ const m=F.slice(from).match(re); if(m && m.index>=0){ const at=from+m.index; if(at>from && at<best) best=at; } } return best; };
  const stripLabel=(block,label)=>{ const bw=clean(block).split(' '); const lw=clean(label).split(' '); const o=[]; let j=0; for(const w of bw){ if(j<lw.length && w.toLowerCase()===lw[j].toLowerCase()) j++; else o.push(w); } return o.join(' ').trim(); };
  const grab=(head,label)=>{ const m=F.match(head); if(!m) return ""; const s=m.index; const e=boundIdx(s+m[0].length); return stripLabel(F.slice(s,e),label); };
  const out={ hasPartner:false, clientName:"", partnerName:"", email:"", address:"",
    occupation:{c1:"",c2:""}, employer:{c1:"",c2:""}, income:{c1:"",c2:""}, superText:{c1:"",c2:""},
    assets:[], assetNotes:"", liabilities:[], liabilityNotes:"",
    will:{has:"",reflects:"",updated:""}, personalChanges:"", focus:"", events:"", furtherNotes:"" };
  let m;
  if((m=F.match(/Your Full Name\s+(.+?)\s+Your Partner'?s Full Name\s+(.+?)\s+(?:Your Preferred|Confirm Your Home|Client 1:|Please provide)/i))){
    out.clientName=clean(m[1]); out.partnerName=clean(m[2]); out.hasPartner=!!out.partnerName;
  } else if((m=F.match(/Your Full Name\s+(.+?)\s+(?:Your Preferred|Confirm Your Home|Please provide)/i))){ out.clientName=clean(m[1]); }
  if(!out.clientName && (m=F.match(/Review Data Snapshot\s+Client One\s+(.+?)\s+(?:Client Two\s+(.+?)\s+)?(?:Please provide|Address|Are there|Do you have|Confirm)/i))){
    out.clientName=clean(m[1]); if(m[2]){ out.partnerName=clean(m[2]); out.hasPartner=true; } }
  if(out.partnerName) out.hasPartner=true;
  if((m=F.match(/Your Preferred E-?mail\s+([^\s]+@[^\s]+)/i))) out.email=clean(m[1]);
  if((m=F.match(/(?:Confirm Your Home(?:\s*Address)?|\bAddress)\s+Street Address:\s*(.*?)\s+(?:Address\s+)?City:\s*(.*?)\s+State ?\/ ?Province:\s*(.*?)\s+Postal ?\/ ?Zip Code:\s*([0-9A-Za-z]+)/i))){
    out.address=[clean(m[1]),clean(m[2]),clean(m[3])+" "+clean(m[4])].filter(Boolean).join(', '); }
  { const ds=F.search(/following details/i); const de=F.search(/Please provide an update on the val/i);
    const DET=(ds>=0)?F.slice(ds,(de>ds?de:F.length)):"";
    const detLbl=/(Occupation(?:\/Position)?|Employer|Total Annual Income[^)]*\)|Annual Income[^)]*\)|Super Contribution Percentage|Super ?\/ ?Bonus Package|Address|Client One|Client Two)/gi;
    const cellAfter=(re)=>{ const mm=DET.match(re); if(!mm) return ""; const s=mm.index+mm[0].length; detLbl.lastIndex=s; const nx=detLbl.exec(DET); return clean(DET.slice(s, nx?nx.index:DET.length)); };
    const nums=(re)=>{ const c=cellAfter(re); const ns=c.match(/[\d,]{3,}/g)||[]; return ns.map(x=>x.replace(/[^\d]/g,'')); };
    const oc=cellAfter(/Occupation(?:\/Position)?/i); if(oc) out.occupation.c1=oc;
    const em=cellAfter(/Employer\b/i); if(em) out.employer.c1=em;
    const inc=nums(/(?:Total Annual Income|Annual Income)[^)]*\)/i); if(inc.length){ out.income.c1=inc[0]||""; out.income.c2=inc[1]||""; }
    const sup=nums(/Super ?\/ ?Bonus Package/i); if(sup.length){ out.superText.c1=sup[0]||""; out.superText.c2=sup[1]||""; } }
  const ASSET_ROWS=[["Cash On Hand",/Cash On Hand/i],["Cash Savings",/Cash Savings/i],
    ["Personal Shares/Funds",/Personal Shares(?: or Funds|\/Funds)?/i],["Other Assets",/Other Assets/i]];
  ASSET_ROWS.forEach(([lbl,re])=>{ const mm=F.match(re); if(!mm) return; const s=mm.index+mm[0].length; const e=boundIdx(s);
    let cell=clean(F.slice(s,e)); if(!cell) return; let c1=cell,c2="";
    const nn=cell.match(/^\$?([\d,]+)\s+\$?([\d,]+)$/);
    if(nn){ c1="$"+Number(nn[1].replace(/,/g,'')).toLocaleString(); c2="$"+Number(nn[2].replace(/,/g,'')).toLocaleString(); }
    out.assets.push({label:lbl,c1,c2}); });
  out.assetNotes=grab(/Additional details about the assets/i,"Additional details about the assets not currently managed by us.");
  { const mm=F.match(/Who is it with/i);
    if(mm){ const s=mm.index; const e=boundIdx(s+120); const blk=F.slice(s,e);
      const re=/([A-Za-z][A-Za-z '\-\/]*?)\s+\$?([\d,]{2,})\s+\$?([\d,]+)\s+([\d.]+)\b/g; let r;
      while((r=re.exec(blk))){ let desc=clean(r[1]).replace(/Who is it with.*?\(%\)/i,'').trim();
        const tm=desc.match(/(Mortgage|Car Loan|Personal Loans?|Total Credit Card Debt|Credit Card|Other Loans?|Other)\b[\s\S]*$/i);
        if(tm) desc=clean(tm[0]);
        if(/^(Amount Owing|Monthly Payments|Interest Rate)/i.test(desc) || !r[2]) continue;
        out.liabilities.push({desc, owing:r[2].replace(/,/g,''), monthly:r[3].replace(/,/g,''), rate:r[4]}); } } }
  out.liabilityNotes=grab(/Are there any other changes to the details/i,"Are there any other changes to the details or valuation of your liabilities that aren't in the table above? If so, please provide below.");
  const willBlock=(head)=>{ const mm=F.match(head); if(!mm) return ""; return F.slice(mm.index, boundIdx(mm.index+mm[0].length)); };
  const stripWords=(block,words)=>{ const set=new Set(words.map(w=>w.toLowerCase())); return clean(block).split(' ').filter(w=>!set.has(w.toLowerCase())).join(' ').trim(); };
  { const b=willBlock(/Do you have a\b/i); const yn=b.match(/\b(Yes|No)\b/i); out.will.has=yn?yn[1]:""; }
  out.will.reflects=grab(/Do you believe your current Will/i,"Do you believe your current Will/EPA reflect your wishes?");
  out.will.updated=stripWords(willBlock(/When was your\b/i),["When","was","your","Will/EPA","Will","or","Enduring","Power","of","Attorney","last","updated?"]);
  out.personalChanges=grab(/Are there any other changes to your personal/i,"Are there any other changes to your personal details or circumstance that aren't in the table above? If so, please provide below.");
  out.focus=grab(/Are there any specific/i,"Are there any specific areas you wish to focus on in this review, or anything you feel we need to know?");
  out.events=grab(/Are there any upcoming/i,"Are there any upcoming major life events or expenses that you need to plan for?");
  out.furtherNotes=grab(/Any further notes or details/i,"Any further notes or details on assets or liabilities?");
  return out;
}
function snapshotIsNo(s){ const t=String(s||"").replace(/\s+/g,' ').trim().toLowerCase().replace(/[.\s]+$/,''); return t===""||t==="no"||t==="n/a"||t==="none"||t==="nil"; }
function snapTitleCase(s){ return String(s||"").replace(/\S+/g,w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()); }
async function importSnapshot(ev){
  const files=[...ev.target.files]; let staged=0;
  for(const f of files){
    if(!/\.pdf$/i.test(f.name)){ toast(f.name+" — the Review Data Snapshot should be a PDF"); continue; }
    let text=""; try{ text=await readPdfText(f); }catch(e){}
    if(!text || text.replace(/\s/g,"").length<40){ try{ toast(f.name+" looks scanned — running OCR…"); text=await ocrPdfFile(f); }catch(e){} }
    const snap=parseReviewSnapshot(text);
    if(!snap){ toast(f.name+" — doesn't look like a Review Data Snapshot / Wealth Review Personal Update."); continue; }
    stageSnapshotLayer(snap,f.name); registerUpload(f.name,"Review Data Snapshot"); staged++;
  }
  renderContent();
  if(staged) toast("Snapshot staged as an override layer — review & apply below.");
}
function stageSnapshotLayer(snap,fname){

    assets:snap.assets.map(a=>!snapshotIsNo(a.c1)||!snapshotIsNo(a.c2)),
    liabilities:snap.liabilities.map(()=>true),
    disc:{ personalChanges:!snapshotIsNo(snap.personalChanges), assetNotes:!snapshotIsNo(snap.assetNotes),
      liabilityNotes:!snapshotIsNo(snap.liabilityNotes), focus:!snapshotIsNo(snap.focus),
      events:!snapshotIsNo(snap.events), furtherNotes:!snapshotIsNo(snap.furtherNotes) } };

}
function discardSnapshotLayer(){ S._snapReview=null; renderContent(); toast("Snapshot layer discarded."); }
function applySnapshotLayer(){
  const s=S._snapReview; if(!s){ return; } const inc=s._inc; const log=[];
  const cap=(x)=>{ x=String(x||"").trim(); return x?x.charAt(0).toUpperCase()+x.slice(1).toLowerCase():""; };

    if(s.address){ S.address=s.address; }
    if(!S.meta.preparedFor && S.client.name){ S.meta.preparedFor=S.client.name+(s.hasPartner&&S.partner.name?(" & "+S.partner.name):""); }

  }

    let row=S.income.find(r=>String(r.owner||"").toLowerCase().includes(fn.toLowerCase()) && /salary|income|wage/i.test(r.label));
    if(!row){ row={label:"Salary",amount:0,owner:fn,freq:"Annual"}; S.income.push(row); } row.amount=n; };

      target.push({name: val?a.label:(a.label+" — "+cell), value:val, debt:0, type, owner:firstName(who)||(who==="partner"?"Partner":"Client"), ref:"Client-reported (snapshot)"}); aC++; };
    add(a.c1,"client"); if(s.hasPartner && a.c2 && a.c2!==a.c1) add(a.c2,"partner"); });

    const ref=[l.monthly?("$"+Number(l.monthly).toLocaleString()+"/mth"):"", l.rate?(l.rate+"%"):""].filter(Boolean).join(" · ");
    S.lifestyle.push({name:l.desc||"Loan", value:0, debt, type:/mortgage/i.test(l.desc)?"Mortgage":"Loan", owner:"", ref:ref||"Client-reported (snapshot)"}); lC++; });
  if(lC) log.push(lC+" liability(ies)");

    const en=[]; if(s.will.updated) en.push("Will/EPA last updated: "+s.will.updated); if(s.will.reflects) en.push("Reflects wishes: "+s.will.reflects);
    if(en.length) S.estate.notes=[S.estate.notes,...en].filter(Boolean).join("; "); log.push("estate"); }
  const disc=[["Client update",s.personalChanges,inc.disc.personalChanges],["Assets not managed — note",s.assetNotes,inc.disc.assetNotes],
    ["Liabilities — note",s.liabilityNotes,inc.disc.liabilityNotes],["Client focus area",s.focus,inc.disc.focus],
    ["Upcoming event / expense",s.events,inc.disc.events],["Further notes",s.furtherNotes,inc.disc.furtherNotes]];
  let dC=0;

function whoFromName(name){
  const fn=(s)=>String(s||"").trim().split(/\s+/)[0].toLowerCase();
  const cn=fn(S.client.name), pn=fn(S.partner.name), rn=String(name||"").toLowerCase();
  if(S.meta.hasPartner && pn && rn.includes(pn)) return "partner";
  if(cn && rn.includes(cn)) return "client";
  // fall back: trust/company accounts → client side
  return "client";
}
function firstName(who){ return String((who==="partner"?S.partner.name:S.client.name)||"").trim().split(/\s+/)[0]; }
function applyHub24(r){
  const isSuper=/super/i.test(r.type);
  const who=whoFromName(r.name);
  let acct=S.portfolios[who].find(a=>a.acct.includes(r.id));
  if(!acct){ acct={acct:`${r.id} (HUB24) - ${r.name}`, holdings:[]}; (S.portfolios[who]=S.portfolios[who]||[]).push(acct); }
  acct.acct=`${r.id} (HUB24) - ${r.name}`;
  acct.holdings=r.holdings.slice();
  // Match an existing row so a re-import UPDATES it instead of adding a duplicate.
  // Tolerate name variants ("Hub 24 Super", "HUB24 Super", "Hub24") and match on the
  // account id first (most reliable), then platform + super/investment type.
  const norm=(s)=>String(s||"").toLowerCase().replace(/[\s\-]/g,"");
  const isHub=(a)=>norm(a.name).includes("hub24");
  const typeMatch=(a)=> isSuper ? (/super/i.test(a.type)||/super/i.test(a.name)) : (!/super/i.test(a.type)&&!/super/i.test(a.name));
  let asset = (r.id && S.nestegg.find(a=>a.ref&&String(a.ref).replace(/\D/g,"")===String(r.id).replace(/\D/g,"")&&String(r.id).replace(/\D/g,"")!==""))
           || S.nestegg.find(a=>isHub(a)&&typeMatch(a));
  if(!asset){ asset={name:isSuper?"HUB24 Super":"HUB24 Investment", value:0, debt:0, type:isSuper?"Super":"Investment", owner:firstName(who)||r.name, ref:r.id}; S.nestegg.push(asset); }
  asset.value=r.total; if(r.id) asset.ref=r.id;
  // clean up any leftover empty HUB24 placeholder rows of the same type from earlier mis-matches
  S.nestegg=S.nestegg.filter(a=> a===asset || !(isHub(a)&&typeMatch(a)&&num(a.value)===0&&(!a.holdings||!a.holdings.length)));
  const fn=firstName(who);
  let gt=S.goalTracking.find(g=> isSuper ? (fn&&new RegExp(fn+".*super","i").test(g.strategy)) : /investment\b/i.test(g.strategy) );
  if(!gt){ gt={strategy:(isSuper?((fn||"Client")+" Super"):"Investment"), were:"",shouldBe:"",are:"",wantToBe:"",rating:"On Track",actions:""}; S.goalTracking.push(gt); }
  gt.are=money(r.total);
}

/* ---------- Insurance Schedule (SOI / existing insurances) parser ---------- */
function parseInsuranceSchedule(raw){
  if(!raw || !/INSURANCE SCHEDULE/i.test(raw)) return null;
  const F=raw.replace(/\s+/g,' ').trim();
  const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
  const mon=x=>x?("$"+Number(String(x).replace(/[^\d.]/g,'')).toLocaleString(undefined,{maximumFractionDigits:2})):"";
  const out={ client:"", rows:[], foundations:{life:"",tpd:"",trauma:"",ip:"",ipNotes:"",ref:""} };
  let m;
  if((m=F.match(/Client:\s*(.+?)\s+Date of Birth/i))) out.client=clean(m[1]);
  const insurer=(F.match(/\b(NEOS|AIA Australia|AIA|TAL|Zurich|MLC|OnePath|MetLife|ClearView|Integrity|NobleOak)\b/i)||[])[1]||"NEOS";
  out.foundations.ref=insurer;
  const sumRow=kw=>{ const mm=F.match(new RegExp(kw+"[\\s\\S]*?\\$([\\d,]+)\\s+\\$([\\d,.]+)\\s+\\$([\\d,.]+)","i")); return mm?{sum:mm[1],viaSuper:parseFloat(mm[2].replace(/,/g,''))||0,personal:parseFloat(mm[3].replace(/,/g,''))||0}:null; };
  const SUM={ life:sumRow("LIFE INSURANCE"), tpd:sumRow("PERMANENT DISABLEMENT"), trauma:sumRow("TRAUMA INSURANCE"), ip:sumRow("INCOME PROTECTION INSURANCE") };
  if(SUM.life) out.foundations.life=mon(SUM.life.sum);
  if(SUM.tpd) out.foundations.tpd=mon(SUM.tpd.sum);
  if(SUM.trauma) out.foundations.trauma=mon(SUM.trauma.sum);
  if(SUM.ip){ out.foundations.ip=mon(SUM.ip.sum);
    out.foundations.ipNotes=[/indemnity/i.test(F)?"Indemnity":(/agreed/i.test(F)?"Agreed value":""),(F.match(/(\d+ Days? Waiting)/i)||[])[1],(F.match(/To Age \d+/i)||[])[0]].filter(Boolean).join(", "); }
  const sumFor=k=>SUM[k];
  const premFor=k=>{ const s=SUM[k]; return s?mon(s.viaSuper+s.personal):""; };
  const COVER="Life|Total & Permanent Disability|TPD|Trauma|Critical Illness|Income Protection|Death";
  const re=new RegExp("(\\d{6,})\\s+([A-Z][a-z]+(?: [A-Z][a-z]+)+)\\s+\\d{2}\\/\\d{2}\\/\\d{4}\\s+(.+?)\\s+("+COVER+")\\b","g");
  const hits=[]; let r;
  while((r=re.exec(F))){ hits.push({idx:r.index,end:re.lastIndex,policy:r[1],insured:clean(r[2]),owner:clean(r[3]),coverType:clean(r[4])}); }
  const keyOf=t=>/life/i.test(t)?'life':/tpd|permanent/i.test(t)?'tpd':/trauma|critical/i.test(t)?'trauma':/income prot/i.test(t)?'ip':'';
  const used={};
  hits.forEach((h,i)=>{
    const block=F.slice(h.end, i+1<hits.length?hits[i+1].idx:h.end+240);
    const key=keyOf(h.coverType), s=sumFor(key);
    const bigM=block.match(/\$\s?([\d,]{4,})(?!\.\d)/), decM=block.match(/\$\s?([\d,]*\.\d{2})/);
    let amount=(key&&s&&!used[key])?mon(s.sum):(bigM?mon(bigM[1]):"");
    let premium=(key&&s&&!used[key])?premFor(key):(decM?("$"+decM[1]):"");
    if(key) used[key]=1;
    const freq=(block.match(/\b(Annual|Monthly|Fortnightly|Weekly)\b/i)||[])[1]||"";
    const struct=(block.match(/\b(Stepped|Level|Cover Reducing)\b/i)||[])[1]||"Stepped";
    out.rows.push({ insurer, policy:h.policy, owner:h.owner, life:h.insured,
      coverType:h.coverType.replace(/Total & Permanent Disability/i,"TPD"),
      amount, structure:struct+(freq?(" · "+freq):""), premium });
  });
  return out;
}
function applyInsuranceSchedule(sched){
  const who=whoFromName(sched.client||"");
  S.insurance[who]=sched.rows.map(r=>({insurer:r.insurer,policy:r.policy,owner:r.owner,life:r.life||sched.client,coverType:r.coverType,amount:r.amount,structure:r.structure,premium:r.premium}));
  const f=S.foundations[who]||(S.foundations[who]={life:"",tpd:"",trauma:"",ip:"",ipNotes:"",ref:""});
  const F=sched.foundations;
  if(F.life)f.life=F.life; if(F.tpd)f.tpd=F.tpd; if(F.trauma)f.trauma=F.trauma;
  if(F.ip)f.ip=F.ip; if(F.ipNotes)f.ipNotes=F.ipNotes; if(F.ref&&!f.ref)f.ref=F.ref;
}

/* ---------- BT Panorama parser ---------- */
function parseBtText(text){
  const idm=text.match(/Account ID\s*([0-9]+)/i);
  const nm=text.match(/([A-Z][a-zA-Z' ]+?)\s*-\s*Super/);
  const id=idm?idm[1]:""; const name=nm?nm[1].trim():"";
  const lines=text.split("\n");
  const holdings=[];
  const cash=text.match(/Transaction Account\s+\$[\d,]+\.\d{2}\s+\$[\d,]+\.\d{2}\s+-?\$[\d,]+\.\d{2}\s+-?\$[\d.,]+\s+\$([\d,]+\.\d{2})/);
  if(cash) holdings.push({product:"Transaction Account", units:"", value:parseFloat(cash[1].replace(/,/g,""))});
  // managed-fund labels: lines containing "· CODE" (name may be wrapped onto the previous line)
  const funds=[];
  lines.forEach((ln,i)=>{
    const m=ln.match(/(.*?)·\s*([A-Z0-9]{4,})\b/);
    if(!m) return;
    let pre="";
    for(let k=i-1;k>=0 && k>=i-6;k--){ const c=lines[k].trim(); if(!c) continue; if(/\$|Total|Account|Opening|Closing|Investment|Period|Date|Portfolio|page \d/i.test(c)) break; pre=c; break; }
    const label=(pre+" "+m[1].trim()+" · "+m[2]).replace(/\s+/g," ").trim();
    funds.push({label});
  });
  const mf=text.match(/Total managed funds\s+\$[\d,]+\.\d{2}\s+-?\$[\d,]+\.\d{2}\s+\$([\d,]+\.\d{2})/);
  const mfTotal=mf?parseFloat(mf[1].replace(/,/g,"")):0;
  if(funds.length===1 && mfTotal){ holdings.push({product:funds[0].label, units:"", value:mfTotal}); }
  else if(funds.length>1){ funds.forEach(f=>holdings.push({product:f.label,units:"",value:0})); if(mfTotal) holdings.push({product:"Total managed funds",units:"",value:mfTotal}); }
  else if(mfTotal){ holdings.push({product:"Managed funds", units:"", value:mfTotal}); }
  const tp=text.match(/Total portfolio\s+\$[\d,]+\.\d{2}\s+-?\$[\d.,]+\s+\$([\d,]+\.\d{2})/);
  const total=tp?parseFloat(tp[1].replace(/,/g,"")):holdings.reduce((a,h)=>a+h.value,0);
  if(!holdings.length && !total) return null;
  return {platform:"bt", id, name, type:"Super", holdings, total};
}
function applyBt(r){
  const who=whoFromName(r.name);
  let acct=(S.portfolios[who]||[]).find(a=>a.acct.includes(r.id)||/panorama/i.test(a.acct));
  if(!acct){ acct={acct:`${r.id} (BT Panorama)`, holdings:[]}; (S.portfolios[who]=S.portfolios[who]||[]).push(acct); }
  acct.acct=`${r.id} (BT Panorama)`; acct.holdings=r.holdings.slice();
  const fn=firstName(who);
  let asset=(fn&&S.nestegg.find(a=>/panorama\s*super/i.test(a.name)&&new RegExp(fn,"i").test(a.owner||""))) || S.nestegg.find(a=>/panorama\s*super/i.test(a.name));
  if(!asset){ asset={name:"BT Panorama Super", value:0, debt:0, type:"Super", owner:fn||r.name, ref:r.id}; S.nestegg.push(asset); }
  asset.value=r.total;
  let gt=fn?S.goalTracking.find(g=>new RegExp(fn+".*super","i").test(g.strategy)):null;
  if(!gt){ gt={strategy:(fn||"Client")+" Super", were:"",shouldBe:"",are:"",wantToBe:"",rating:"On Track",actions:""}; S.goalTracking.push(gt); }
  gt.are=money(r.total);
}

/* ---------- Macquarie CMA parser ---------- */
function parseMacqText(text){
  const idm=text.match(/Account number\s*([0-9]+)/i);
  const nmm=text.match(/Account name[^\n]*\n([^\n]+)/i);
  let name=nmm?nmm[1].trim():"";
  if(/^\$?[\d,]+\.\d{2}$/.test(name)||/^Active$/i.test(name)) name="";
  // balance sits on its own line near the top (e.g. "$442.31"); fall back to a labelled match
  const balm=text.match(/^\s*\$([\d,]+\.\d{2})\s*$/m) || text.match(/Balance\s*\$?([\d,]+\.\d{2})/i);
  if(!balm) return null;
  return {platform:"macq", id:idm?idm[1]:"", name, balance:parseFloat(balm[1].replace(/,/g,""))};
}
function applyMacq(r){
  // update the MCMA / Macquarie CMA holding + nest-egg "MCMA" value
  let acct=S.portfolios.client.find(a=>a.acct.includes(r.id)) || S.portfolios.client.find(a=>/macq/i.test(a.acct));
  if(acct){ const h=acct.holdings.find(x=>/macquarie cma|cma/i.test(x.product))||acct.holdings[0]; if(h) h.value=r.balance; else acct.holdings.push({product:"Macquarie CMA",units:"",value:r.balance}); }
  let asset=S.nestegg.find(a=>/mcma|macquarie/i.test(a.name));
  if(!asset){ asset={name:"Macquarie CMA", value:0, debt:0, type:"Cash", owner:r.name||"Joint", ref:r.id}; S.nestegg.push(asset); }
  asset.value=r.balance;
}

async function importPlatform(ev, kind){
  const files=[...ev.target.files]; if(!files.length)return; let done=[];
  for(const f of files){
    if(!/pdf$/i.test(f.name)) continue;
    try{
      const text=await readPdfText(f);
      if(kind==="bt"){ const r=parseBtText(text); if(r&&!done.find(d=>d.id===r.id)){ applyBt(r); done.push({...r,label:`${(r.name||"BT").split(" ")[0]} BT ${money(r.total)}`}); } }
      else if(kind==="macq"){ const r=parseMacqText(text); if(r&&!done.find(d=>d.id===r.id)){ applyMacq(r); done.push({...r,label:`Macquarie CMA ${money(r.balance)}`}); } }
    }catch(e){ console.warn(kind+" parse fail",f.name,e); }
  }
  if(done.length){ toast((kind==="bt"?"BT Panorama":"Macquarie")+" imported: "+done.map(d=>d.label).join(" · ")); renderContent(); }
  else { toast("Couldn't read a "+(kind==="bt"?"BT Panorama":"Macquarie")+" balance from those files."); }
}

function drawAllocPreview(id,rows,key,title){
  const cv=$(id); if(!cv)return; const ctx=cv.getContext("2d");
  ctx.clearRect(0,0,cv.width,cv.height);
  const data=rows.map(r=>({label:r.cls,value:num(r[key]),color:allocColor(r.cls)})).filter(d=>d.value>0.0001);
  const cx=cv.width/2, cy=88, rO=70, rI=40; const total=data.reduce((a,d)=>a+d.value,0)||1; let ang=-Math.PI/2;
  data.forEach(d=>{const s=d.value/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rO,ang,ang+s);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();ang+=s;});
  ctx.beginPath();ctx.arc(cx,cy,rI,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--surface")||"#fff";ctx.fill();
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--heading")||"#103143";
  ctx.font="700 13px Nunito, sans-serif";ctx.textAlign="center";ctx.fillText(title,cx,14);
}

/* ---------- generic editable table builder ---------- */
function tableEditor(arrName, cols, opts={}){
  const arr=getArr(arrName);
  const rows=arr.map((r,i)=>{
    const cells=cols.map(c=>{
      const v=r[c.key]==null?"":r[c.key];
      if(c.type==="select"){
        const o=(typeof c.options==="function"?c.options():c.options);
        return `<td><select onchange="getArr('${arrName}')[${i}]['${c.key}']=this.value;refreshTotals()">${o.map(op=>`<option ${op===v?'selected':''}>${esc(op)}</option>`).join("")}</select></td>`;
      }
      if(c.type==="num"){
        return `<td class="num"><input value="${esc(v)}" oninput="getArr('${arrName}')[${i}]['${c.key}']=this.value" onchange="refreshTotals()"></td>`;
      }
      if(c.type==="area"){
        return `<td><textarea rows="2" oninput="getArr('${arrName}')[${i}]['${c.key}']=this.value">${esc(v)}</textarea></td>`;
      }
      return `<td><input value="${esc(v)}" oninput="getArr('${arrName}')[${i}]['${c.key}']=this.value"></td>`;
    }).join("");
    return `<tr>${cells}<td><div class="row-tools">
      <button class="icon-btn" title="Up" onclick="moveRow('${arrName}',${i},-1)">↑</button>
      <button class="icon-btn" title="Delete" onclick="delRow('${arrName}',${i})">✕</button></div></td></tr>`;
  }).join("");
  const head=cols.map(c=>`<th>${esc(c.label)}</th>`).join("")+"<th></th>";
  return `<table class="tbl"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>
    <button class="btn btn-add btn-sm" style="margin-top:10px" onclick="addRow('${arrName}',${JSON.stringify(opts.blank||{}).replace(/"/g,'&quot;')})">+ Add row</button>`;
}
function getArr(name){
  const map={lifestyle:S.lifestyle,nestegg:S.nestegg,income:S.income,expenses:S.expenses,
    goals:S.goals,goalTracking:S.goalTracking,actionItems:S.actionItems,services:S.services,
    insClient:S.insurance.client,insPartner:S.insurance.partner,
    allocClient:S.assetAlloc.client,allocPartner:S.assetAlloc.partner};
  return map[name];
}
function addRow(name,blank){getArr(name).push(JSON.parse(JSON.stringify(blank)));renderContent();}
function delRow(name,i){getArr(name).splice(i,1);renderContent();}
function moveRow(name,i,d){const a=getArr(name),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderContent();}

function pvSum(arr,key){ return (arr||[]).reduce((a,x)=>a+num(x[key]),0); }
function pvTable(headers,rows,opts={}){
  if(!rows.length) return `<div class="pv-empty">${opts.empty||"Nothing entered yet."}</div>`;
  const align=opts.align||[];
  const acl=(i)=>align[i]==='r'?'r':(align[i]==='c'?'c':'');
  const navy=opts.head==='navy'?' navy':'';
  const lbl=!!opts.lbl;
  const th=headers.map((h,i)=>`<th class="${acl(i)}">${esc(h)}</th>`).join("");
  const body=rows.map(r=>{
    const cls=r.__tot?' class="pv-tot"':'';
    const tds=r.cells.map((c,i)=>{
      const cl=[acl(i), (lbl&&i===0&&!r.__tot)?'pv-lbl':'', (r.__tot&&i>0)?'pv-val':''].filter(Boolean).join(' ');
      return `<td class="${cl}">${c.html||esc(c.v==null?'':c.v)}</td>`;
    }).join("");
    return `<tr${cls}>${tds}</tr>`;
  }).join("");
  return `<table class="pv-tbl${navy}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}

function classifyXlsx(f){
  return new Promise(res=>{
    const n=(f.name||"").toLowerCase();
    const byName=()=> /rebalance|care/.test(n)?"rebalance":(/checklist|prereview/.test(n)?"xls":"ptw");
    if(typeof XLSX==="undefined") return res(byName());
    const r=new FileReader();
    r.onload=()=>{ try{
      const wb=XLSX.read(r.result,{type:"array",bookSheets:true});
      const s=(wb.SheetNames||[]).map(x=>String(x).toLowerCase());
      if(s.some(x=>/projector/.test(x))) return res("ptw");
      if(s.some(x=>/rebalance/.test(x))) return res("rebalance");
      if(s.some(x=>/prereview|checklist/.test(x))) return res("xls");
      res(byName());
    }catch(e){ res(byName()); } };
    r.onerror=()=>res(byName());
    r.readAsArrayBuffer(f);
  });
}
function loadJSONPromise(f){
  return new Promise((res,rej)=>{ const r=new FileReader();
    r.onload=()=>{ try{ Object.assign(S,JSON.parse(r.result)); if(!S.checklist.answers)S.checklist.answers={}; if(!S.checklist.notes)S.checklist.notes={}; if(!S.uploads)S.uploads=[]; delete S._snapshot; delete S._fileNote; delete S._roa; delete S._snapReview; res(); }catch(e){ rej(e); } };
    r.onerror=rej; r.readAsText(f); });
}
/* ---------- OCR (images & scanned PDFs) — Tesseract.js, lazy-loaded from CDN, runs in-browser ---------- */
let _ocrPromise=null;
function ensureOCR(){
  if(typeof Tesseract!=="undefined") return Promise.resolve(Tesseract);
  if(_ocrPromise) return _ocrPromise;
  _ocrPromise=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=()=>res(typeof Tesseract!=="undefined"?Tesseract:null);
    s.onerror=()=>{ _ocrPromise=null; rej(new Error("OCR engine could not load — this needs internet the first time")); };
    document.head.appendChild(s);
  });
  return _ocrPromise;
}
async function ocrImageFile(file){
  const T=await ensureOCR(); if(!T) throw new Error("OCR unavailable");
  const url=URL.createObjectURL(file);
  try{ const {data}=await T.recognize(url,"eng"); return (data&&data.text)||""; }
  finally{ URL.revokeObjectURL(url); }
}
async function ocrPdfFile(file){
  // render each page to a canvas, then OCR it (for scanned / image-only PDFs with no text layer)
  const T=await ensureOCR(); if(!T) throw new Error("OCR unavailable");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let txt="";
  for(let p=1;p<=Math.min(pdf.numPages,10);p++){
    const page=await pdf.getPage(p);
    const vp=page.getViewport({scale:2});
    const canvas=document.createElement("canvas"); canvas.width=vp.width; canvas.height=vp.height;
    const ctx=canvas.getContext("2d");
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    const {data}=await T.recognize(canvas,"eng");
    txt+=((data&&data.text)||"")+"\n";
  }
  return txt;
}
// route OCR'd/plain text: auto-fill if it's a recognised platform report, else keep the text so nothing is lost
function routeScannedText(text,name,kindLabel){
  const clean=(text||"").replace(/\s/g,"");
  if(clean.length>=40){
    try{ const h=parseHub24Text(text); if(h&&(h.holdings.length||h.total)){ applyHub24(h); registerUpload(name,"Scanned report (OCR)",text); return `HUB24 · ${money(h.total)}`; } }catch(e){}
    try{ const b=parseBtText(text); if(b){ applyBt(b); registerUpload(name,"Scanned report (OCR)",text); return `BT Panorama · ${money(b.total)}`; } }catch(e){}
    try{ const mq=parseMacqText(text); if(mq){ applyMacq(mq); registerUpload(name,"Scanned report (OCR)",text); return `Macquarie · ${money(mq.balance)}`; } }catch(e){}
  }
  if(clean.length<3){ registerUpload(name,(kindLabel||"Image")+" — no text found",""); return "no readable text found"; }
  // generic best-effort: recognise which platform it looks like, grab a headline balance, keep the full text
  return genericPlatformImport(text,name,kindLabel);
}
// which listed platform does this text look like? (labelling only)
function detectPlatformName(text){
  const p=PLATFORMS.find(p=>p.re.test(text||""));
  return p?p.name:"Unknown platform";
}
// heuristic headline balance: the largest $ figure sitting on a "total / balance / value" line
function guessHeadlineBalance(text){
  const lines=String(text||"").split("\n");
  const KEY=/(total\s*portfolio|portfolio\s*(value|total)|total\s*account\s*value|total\s*value|closing\s*balance|account\s*balance|total\s*balance|net\s*(worth|value)|market\s*value|total)\b/i;
  const amtRe=/\$?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{2})?|\d+\.\d{2})/g;
  let best=0, ctx="";
  lines.forEach(ln=>{ if(!KEY.test(ln)) return; let m; amtRe.lastIndex=0; while((m=amtRe.exec(ln))){ const v=parseFloat(m[1].replace(/,/g,"")); if(v>best){ best=v; ctx=ln.trim(); } } });
  if(!best){ let m; amtRe.lastIndex=0; while((m=amtRe.exec(text))){ const v=parseFloat(m[1].replace(/,/g,"")); if(v>best) best=v; } }   // fall back to largest figure anywhere
  return {value:best, ctx};
}
// generic best-effort import for an unrecognised (not-yet-wired) platform PDF or screenshot
function genericPlatformImport(text,name,kindLabel){
  const plat=detectPlatformName(text);
  const chipKind=(kindLabel?kindLabel+" — ":"")+plat+" (text captured)";
  registerUpload(name, chipKind, String(text||"").trim());
  const {value}=guessHeadlineBalance(text);
  if(value>0){
    const who="client";
    const isSuper=/super|pension|smsf/i.test(text);
    const label=plat+" (unconfirmed — check figure)";
    let asset=S.nestegg.find(a=>a.name===label);
    if(!asset){ asset={name:label, value:0, debt:0, type:isSuper?"Super":"Investment", owner:firstName(who)||"", ref:""}; S.nestegg.push(asset); }
    asset.value=value;
    let acct=(S.portfolios[who]||[]).find(a=>a.acct===label);
    if(!acct){ acct={acct:label, holdings:[]}; (S.portfolios[who]=S.portfolios[who]||[]).push(acct); }
    acct.holdings=[{product:"Account balance (from "+plat+" report — confirm)", units:"", value:value}];
    return `${plat} · best-guess balance ${money(value)} — UNCONFIRMED, check figure (full text on the 🔍 chip)`;
  }
  return `${plat} · text captured (no balance detected) — open the 🔍 chip to read it`;
}

function isImageFile(f){ const n=(f.name||"").toLowerCase(); return /\.(png|jpe?g|webp|gif|bmp|tiff?)$/.test(n) || /^image\//.test(f.type||""); }

async function smartDropFiles(files){
  files=(files||[]).filter(Boolean); if(!files.length) return;
  const cat={json:[],docx:[],pdf:[],ptw:[],rebalance:[],xls:[],image:[],unknown:[]};
  for(const f of files){
    const n=(f.name||"").toLowerCase();
    if(n.endsWith(".json")) cat.json.push(f);
    else if(n.endsWith(".docx")||n.endsWith(".doc")) cat.docx.push(f);
    else if(n.endsWith(".pdf")) cat.pdf.push(f);
    else if(n.endsWith(".xlsm")||n.endsWith(".xlsx")||n.endsWith(".xls")||n.endsWith(".csv")){ const k=await classifyXlsx(f); (cat[k]||cat.xls).push(f); }
    else if(isImageFile(f)) cat.image.push(f);
    else cat.unknown.push(f);
  }
  const done=[];
  // ORDER: base first (saved draft → last review), then this year's overrides (platform → PTW → rebalance → checklist → images)
  for(const f of cat.json){ try{ await loadJSONPromise(f); registerUpload(f.name,"Saved draft"); done.push(`${f.name} → saved draft`);}catch(e){ done.push(`${f.name} → JSON error`);} }
  for(const f of cat.docx){ try{ await importReviewDoc({target:{files:[f]}}); done.push(`${f.name} → last review`);}catch(e){ done.push(`${f.name} → review error`);} }
  if(cat.pdf.length){ try{ await importAnyPlatform({target:{files:cat.pdf}}); done.push(`${cat.pdf.length} PDF → platform report(s)`);}catch(e){ done.push(`platform PDFs → error`);} }
  for(const f of cat.ptw){ try{ await importPTW({target:{files:[f]}}); done.push(`${f.name} → PTW`);}catch(e){ done.push(`${f.name} → PTW error`);} }
  if(cat.rebalance.length){ try{ await importRebalance({target:{files:cat.rebalance}}); done.push(`${cat.rebalance.length} → rebalance`);}catch(e){ done.push(`rebalance → error`);} }
  for(const f of cat.xls){ try{ await importChecklist({target:{files:[f]}}); done.push(`${f.name} → checklist`);}catch(e){ done.push(`${f.name} → checklist error`);} }
  if(cat.image.length){ try{ done.push(...await importImages(cat.image)); }catch(e){ done.push(`images → error`);} }
  cat.unknown.forEach(f=>done.push(`${f.name} → not recognised`));
  renderContent();
  toast("Smart drop — "+done.join("; "));
}

/* ============================================================
   TAB 1 — PRE-REVIEW CHECKLIST (editable, fresh per client)
   ============================================================ */
function ensureChecklistRows(){
  if(!S.checklist.rows || !S.checklist.rows.length){
    S.checklist.rows=CHECKLIST_ITEMS.map(it=>({item:it, action:"", comment:""}));
  }
}
/* ---------- checklist answer store ---------- */
function getAns(id){ return S.checklist.answers[id]; }
function clSet(id,v,rerender){ S.checklist.answers[id]=v; if(typeof CL_ONCHANGE[id]==="function") CL_ONCHANGE[id](v); if(rerender) renderContent(); }
function getAnsC(id,slot){ const a=S.checklist.answers[id]; return (a&&typeof a==="object")?(a[slot]||""):(slot==="c1"?(a||""):""); }
function clSetC(id,slot,v,rerender){ let a=S.checklist.answers[id]; if(!a||typeof a!=="object"){ a={c1:"",c2:""}; S.checklist.answers[id]=a; } a[slot]=v; if(rerender) renderContent(); }
// per-item notes — any note is added to the WR discussion points on Apply
const clNoteOpen=new Set();
function clGetNote(id){ return (S.checklist.notes&&S.checklist.notes[id])||""; }
function clSetNote(id,v){ if(!S.checklist.notes) S.checklist.notes={}; S.checklist.notes[id]=v; }
// auto-grow a note textarea with its content up to the CSS max-height, then let it scroll
function clGrowNote(el){ if(!el) return; el.style.height="auto"; el.style.height=Math.min(el.scrollHeight+2,150)+"px"; }
function clGrowAllNotes(){ try{ document.querySelectorAll(".cl-note-ta").forEach(clGrowNote); }catch(e){} }
function clToggleNote(id){ if(clNoteOpen.has(id)&&!clGetNote(id)) clNoteOpen.delete(id); else clNoteOpen.add(id); renderContent(); }
const CL_ONCHANGE={
  scope_clients:(v)=>{ S.meta.hasPartner=(v==="2"); },
  scope_c1name:(v)=>{ if(v) S.client.name=v; syncPreparedFor(); },
  scope_c2name:(v)=>{ if(v) S.partner.name=v; syncPreparedFor(); },
  scope_adviser:(v)=>{ if(v && !/add advisers/i.test(v)) S.meta.adviserName=v; }
};
function syncPreparedFor(){ const ns=clientNames().filter(Boolean); if(ns.length) S.meta.preparedFor=ns.join(" & "); }
function clientNames(){ const a=S.client.name||getAns("scope_c1name")||"Client 1"; const b=S.partner.name||getAns("scope_c2name")||"Client 2"; return (S.meta.hasPartner||getAns("scope_clients")==="2")?[a,b]:[a]; }
function twoClients(){ return clientNames().length>1; }

/* ---------- section applicability & progress ---------- */
function clSectionApplies(sec){ return sec.always || (typeof sec.appliesWhen==="function" ? sec.appliesWhen() : true); }
function clVisibleSections(){ return CHECKLIST_SCHEMA.filter(clSectionApplies); }
function clItemVisible(it){ return typeof it.showWhen!=="function" || it.showWhen(); }
function clItemAnswered(it){
  if(it.type==="computed") return true;
  if(it.perClient && twoClients()) return !!(getAnsC(it.id,"c1")||getAnsC(it.id,"c2"));
  const v=it.perClient?getAnsC(it.id,"c1"):getAns(it.id);
  return v!=null && String(v).trim()!=="";
}
function clFlatItems(sec){ // includes active follow-ups, excludes computed & hidden
  const out=[];
  (sec.items||[]).forEach(it=>{
    if(!clItemVisible(it)) return;
    if(it.type!=="computed") out.push(it);
    (it.followUps||[]).forEach(fu=>{ if(clFollowActive(it,fu)) (fu.items||[]).forEach(f=>{ if(f.type!=="computed") out.push(f); }); });
  });
  return out;
}
function clFollowActive(it,fu){
  const vals=it.perClient?[getAnsC(it.id,"c1"),getAnsC(it.id,"c2")]:[getAns(it.id)];
  return vals.some(v=>v!=null && fu.when(v));
}
function clSecProgress(sec){ const items=clFlatItems(sec); const done=items.filter(clItemAnswered).length; return {done,total:items.length}; }
// split a section into sub-groups at each CL.sub() marker → drives the in-section mini-wizard
function clSubGroups(sec){
  const items=sec.items||[]; if(!items.some(it=>it.isSub)) return null;
  const groups=[]; let cur=null;
  items.forEach(it=>{
    if(it.isSub){ cur={id:it.id,label:it.subLabel,items:[]}; groups.push(cur); }
    else { if(!cur){ cur={id:sec.id+"__intro",label:"Overview",items:[]}; groups.push(cur); } cur.items.push(it); }
  });
  const nonEmpty=groups.filter(g=>g.items.length);
  return nonEmpty.length>1?nonEmpty:null;
}
function clGroupProgress(group){ let d=0,t=0; (group.items||[]).forEach(it=>{ if(it.type==="computed"||!clItemVisible(it)) return; t++; if(clItemAnswered(it)) d++; }); return {done:d,total:t}; }
function clGoSub(secId,subId){ if(!S.checklist.subStep) S.checklist.subStep={}; S.checklist.subStep[secId]=subId; renderContent(); window.scrollTo(0,0); }

/* ---------- render ---------- */
function renderChecklistForm(){
  const secs=clVisibleSections();
  if(!S.checklist.activeSection || !secs.find(s=>s.id===S.checklist.activeSection)) S.checklist.activeSection=secs[0].id;
  const active=secs.find(s=>s.id===S.checklist.activeSection)||secs[0];
  const idx=secs.findIndex(s=>s.id===active.id);

  const side=secs.map(s=>{
    const p=clSecProgress(s), done=p.total>0&&p.done>=p.total;
    return `<button class="cl-sec-btn ${s.id===active.id?'active':''} ${done?'done':''}" onclick="clGo('${s.id}')">
      <span class="cl-ico">${s.icon||'•'}</span>${esc(s.title)}<span class="cl-prog">${p.done}/${p.total}</span></button>`;
  }).join("");

  const totals=secs.reduce((a,s)=>{const p=clSecProgress(s);a.d+=p.done;a.t+=p.total;return a;},{d:0,t:0});
  const pct=totals.t?Math.round(totals.d/totals.t*100):0;

  // in-section mini-wizard: if the section has CL.sub groups, step through them one at a time
  const groups=clSubGroups(active);
  let subBar="", body, backBtn, nextBtn;
  const backSection=idx>0
    ? `<button class="btn btn-ghost btn-sm" onclick="clGo('${secs[idx-1].id}')">← ${esc(secs[idx-1].title)}</button>`
    : `<button class="btn btn-ghost btn-sm" disabled style="opacity:.4">← Back</button>`;
  const nextSection=idx<secs.length-1
    ? `<button class="btn btn-primary btn-sm" onclick="clGo('${secs[idx+1].id}')">Next: ${esc(secs[idx+1].title)} →</button>`
    : `<button class="btn btn-primary btn-sm" onclick="applyChecklistData();switchTab('generate')">✓ Apply & generate wealth doc →</button>`;
  if(groups){
    if(!S.checklist.subStep) S.checklist.subStep={};
    let curSub=S.checklist.subStep[active.id];
    if(!curSub||!groups.find(g=>g.id===curSub)) curSub=groups[0].id;
    const gi=groups.findIndex(g=>g.id===curSub), grp=groups[gi];
    subBar=`<div class="cl-substeps">`+groups.map((g,i)=>{ const gp=clGroupProgress(g); const done=gp.total>0&&gp.done>=gp.total;
      return `<button class="cl-substep ${g.id===curSub?'active':''} ${done?'done':''}" onclick="clGoSub('${active.id}','${g.id}')"><span class="cl-substep-n">${done&&g.id!==curSub?'✓':(i+1)}</span>${esc(g.label)}<span class="cl-substep-p">${gp.done}/${gp.total}</span></button>`;
    }).join("")+`</div>`;
    body=(grp.items||[]).map(it=>renderCLItem(it)).join("");
    backBtn = gi>0 ? `<button class="btn btn-ghost btn-sm" onclick="clGoSub('${active.id}','${groups[gi-1].id}')">← ${esc(groups[gi-1].label)}</button>` : backSection;
    nextBtn = gi<groups.length-1 ? `<button class="btn btn-primary btn-sm" onclick="clGoSub('${active.id}','${groups[gi+1].id}')">Next: ${esc(groups[gi+1].label)} →</button>` : nextSection;
  } else {
    body=(active.items||[]).map(it=>renderCLItem(it)).join("");
    backBtn=backSection; nextBtn=nextSection;
  }

  return `
  <div class="section-head"><h2>Pre-Review Checklist</h2><p>A guided, account-aware questionnaire. Only sections relevant to this client's holdings appear. Answers route into the wealth doc — action-type answers become <b>to-do items</b>, data answers feed the matching section (beneficiaries → estate, contributions → super notes, etc.). Step through with <b>Next</b> or jump to any section on the left.</p></div>

function renderCLItem(it){
  if(it.type==="computed"){ try{ return `<div class="cl-item">${it.compute()}</div>`; }catch(e){ return ""; } }
  if(!clItemVisible(it)) return "";
  const help=it.help?`<div class="cl-help">${esc(it.help)}</div>`:"";
  let control;
  if(it.perClient && twoClients()){
    const names=clientNames();
    control=`<div class="cl-perclient">
      <div><div class="cl-clabel">${esc(names[0])}</div>${clControl(it,"c1")}</div>
      <div><div class="cl-clabel">${esc(names[1])}</div>${clControl(it,"c2")}</div></div>`;
  } else {
    control=clControl(it, it.perClient?"c1":null);
  }
  const follow=(it.followUps||[]).map(fu=>clFollowActive(it,fu)
    ? `<div class="cl-followup">${(fu.items||[]).map(renderCLItem).join("")}</div>` : "").join("");
  const noteVal=clGetNote(it.id);
  const noteShown=!!noteVal || clNoteOpen.has(it.id);
  const noteUI=`<div class="cl-note">${noteShown
    ? `<textarea class="cl-note-ta" rows="1" placeholder="Note — added to the WR discussion points on Apply…" oninput="clSetNote('${it.id}',this.value);clGrowNote(this)" onfocus="clGrowNote(this)" ref="clGrowNote">${esc(noteVal)}</textarea>`
    : `<button type="button" class="cl-note-add" onclick="clToggleNote('${it.id}')">＋ Add note</button>`}</div>`;
  return `<div class="cl-item"><div class="cl-q">${esc(it.prompt||"")}</div>${help}${control}${follow}${noteUI}</div>`;
}
function clControl(it, slot){
  const get=()=> slot? getAnsC(it.id,slot) : getAns(it.id);
  const setR=(rer)=> slot? `clSetC('${it.id}','${slot}',this.value,${rer})` : `clSet('${it.id}',this.value,${rer})`;
  const v=get()==null?"":get();
  if(it.type==="yesno"){
    const cur=String(v);
    const btn=(lab,cls)=>`<button class="${cur===lab?'on '+cls:''}" onclick="${slot?`clSetC('${it.id}','${slot}','${lab}',true)`:`clSet('${it.id}','${lab}',true)`}">${lab}</button>`;
    return `<div class="cl-seg">${btn("Yes","")}${btn("No","no")}${btn("N/A","na")}</div>`;
  }
  if(it.type==="select"){
    const opts=typeof it.options==="function"?it.options():it.options;
    return `<select onchange="${setR(true)}">${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join("")}</select>`;
  }
  if(it.type==="combo"){   // dropdown of suggestions but free-typeable
    const opts=typeof it.options==="function"?it.options():it.options;
    const lid="dl_"+it.id+(slot||"");
    return `<input list="${lid}" placeholder="Select or type…" value="${esc(v)}" oninput="${setR(false)}" onchange="renderContent()"><datalist id="${lid}">${opts.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`;
  }
  if(it.type==="area"){ return `<textarea rows="2" placeholder="Notes / data…" oninput="${setR(false)}">${esc(v)}</textarea>`; }
  if(it.type==="date"){ return `<input type="date" value="${esc(v)}" oninput="${setR(false)}">`; }
  if(it.type==="currency"){ return `<input inputmode="decimal" placeholder="$" value="${esc(v)}" oninput="${setR(false)}" onchange="renderContent()">`; }
  return `<input placeholder="…" value="${esc(v)}" oninput="${setR(false)}">`; // text
}

/* ---------- computed panels ---------- */
function clNum(v){ const m=String(v==null?"":v).replace(/,/g,"").match(/-?\d+(?:\.\d+)?/); return m?parseFloat(m[0]):0; }
function fyMonthsElapsed(){ // months from 1 July (FY start) to the review date (or today via review month)
  const d=S.meta.reviewDate?new Date(S.meta.reviewDate):null; if(!d||isNaN(d)) return 12;
  const m=d.getMonth(); // 0=Jan; FY starts Jul (6)
  const el=(m>=6)?(m-6):(m+6); return Math.min(12,Math.max(1,el+1));
}

function contribCellInput(id,slot){

  return `<input class="cl-cg-in" inputmode="decimal" placeholder="$" value="${esc(v==null?'':v)}" oninput="${set}">`;
}
function contribGrid(prefix){

  const cols=two?[["c1",names[0]],["c2",names[1]]]:[["c1",names[0]||"Client"]];
  return `<div class="cl-cg-wrap">`+cols.map(([slot,name])=>`

    <tbody>
      <tr><th>Concessional</th><td>${contribCellInput(prefix+"_concPrior",slot)}</td><td>${contribCellInput(prefix+"_concFYTD",slot)}</td></tr>
      <tr><th>Non-concessional</th><td>${contribCellInput(prefix+"_ncPrior",slot)}</td><td>${contribCellInput(prefix+"_ncFYTD",slot)}</td></tr>
    </tbody></table>`).join("")+`</div>`;
}
function sgPanel(prefix){
  const clients=clientNames();
  const rows=clients.map((name,i)=>{
    const slot=i===0?"c1":"c2";
    const income=clNum(getAnsC(prefix+"_income",slot));
    const rate=clNum(getAnsC(prefix+"_sgRate",slot))||11.5;
    const ytd=clNum(getAnsC(prefix+"_concFYTD",slot));
    if(!income && !ytd) return "";
    const months=fyMonthsElapsed();
    const expectedFull=income*rate/100;
    const annualisedActual=months?(ytd/months*12):ytd;
    const diff=annualisedActual-expectedFull;
    const off=Math.abs(diff)>Math.max(500,expectedFull*0.05);
    const cls=off?"warn":"ok";
    const msg=off
      ? `SG shortfall/variance: expected ~${money(expectedFull)} p.a. (${rate}% of ${money(income)}), annualised actual ~${money(annualisedActual)} (${money(ytd)} over ${months} mo). Discrepancy ${money(Math.abs(diff))} — flagged for the WR discussion items.`
      : `SG on track: expected ~${money(expectedFull)} p.a., annualised actual ~${money(annualisedActual)}.`;
    return `<div class="cl-flag ${cls}">${twoClients()?`<b>${esc(name)}:</b> `:""}${msg}</div>`;
  }).filter(Boolean).join("");
  return rows || `<div class="cl-help">Enter income, SG % and FY-to-date concessional above to auto-estimate expected SG and flag any discrepancy.</div>`;
}
function rolloverPanel(){
  const clients=clientNames();
  const rows=clients.map((name,i)=>{
    const bal=clNum(getAnsC("held_balance",i===0?"c1":"c2")); if(!bal) return "";
    const min=bal>=10000?10000:6000;
    const need=bal>min;
    return `<div class="cl-flag ${need?'info':'ok'}">${twoClients()?`<b>${esc(name)}:</b> `:""}Held balance ${money(bal)} — ${need?`exceeds the ${money(min)} minimum, a partial rollover may be required (ROA). Confirm splitting / claimable NC first.`:`at or below the ${money(min)} minimum; no rollover indicated.`}</div>`;
  }).filter(Boolean).join("");
  return rows || `<div class="cl-help">Enter the held account balance to check the partial-rollover threshold ($6k / $10k).</div>`;
}
