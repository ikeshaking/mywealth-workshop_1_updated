/* ---------- apply: rules, to-dos, routing ---------- */
function pushTodo(desc,who,when){ desc=String(desc||"").trim(); if(!desc) return 0; if(!S.actionItems.find(a=>a.desc===desc)){ S.actionItems.push({desc,who:who||"MWS",when:when||"Review"}); return 1; } return 0; }
function routeCLNote(route,text){
  text=String(text||"").trim(); if(!text) return 0;
  const pre=route.prefix?route.prefix+" — ":"";
  switch(route.target){
    case "estate": S.estate.notes=(S.estate.notes?S.estate.notes+"\n":"")+pre+text; return 1;
    case "adviser": S.adviserComments=(S.adviserComments?S.adviserComments+"\n":"")+pre+text; return 1;
    case "foundations": S.foundations.client.ipNotes=(S.foundations.client.ipNotes?S.foundations.client.ipNotes+" ":"")+pre+text; return 1;
    case "goaltrack": { const gt=S.goalTracking.find(g=>/investment/i.test(g.strategy)); if(gt) gt.actions=(gt.actions?gt.actions+" ":"")+pre+text; else S.adviserComments=(S.adviserComments?S.adviserComments+"\n":"")+pre+text; return 1; }
    case "portfolio": S.adviserComments=(S.adviserComments?S.adviserComments+"\n":"")+pre+text; return 1;
    case "anniv": if(!S.meta.anniversaryDate) S.meta.anniversaryDate=text; return 1;
    case "actions": return pushTodo(pre+text,"MWS","ROA");   // → Action items / ROA
    default: return 0;
  }
}
function applyChecklistData(){
  let todos=0, routed=0;
  // CRP → meta + adviser comments summary (profile + status per owner)
  const c1=getAns("gen_crp_c1"), c2=getAns("gen_crp_c2"), cj=getAns("gen_crp_joint");
  const c1s=getAns("gen_crp_c1_status"), c2s=getAns("gen_crp_c2_status"), cjs=getAns("gen_crp_joint_status");
  if(c1){ S.meta.crp.c1=c1; } if(c2){ S.meta.crp.c2=c2; } if(cj){ S.meta.crp.joint=cj; }
  if(!S.client.riskProfile && c1) S.client.riskProfile=c1;
  if(!S.partner.riskProfile && c2) S.partner.riskProfile=c2;
  const crpFmt=(p,s)=>p?(p+(s&&!/up to date/i.test(s)?` (${s})`:"")):"";
  if(c1||c2||cj){ const parts=[c1?`Client 1: ${crpFmt(c1,c1s)}`:"",c2?`Client 2: ${crpFmt(c2,c2s)}`:"",cj?`Joint: ${crpFmt(cj,cjs)}`:""].filter(Boolean).join("; ");
    S.adviserComments=(S.adviserComments?S.adviserComments+"\n":"")+"CRP — "+parts; }
  // sync names / adviser from scope
  syncPreparedFor();
  if(getAns("scope_adviser") && !/add advisers/i.test(getAns("scope_adviser"))) S.meta.adviserName=getAns("scope_adviser");
  // walk every visible item across applicable sections (incl. active follow-ups)
  clVisibleSections().forEach(sec=>{
    clFlatItems(sec).forEach(it=>{
      const perC=it.perClient && twoClients();
      const vals=perC?[["c1",getAnsC(it.id,"c1")],["c2",getAnsC(it.id,"c2")]]:[[null,it.perClient?getAnsC(it.id,"c1"):getAns(it.id)]];
      vals.forEach(([slot,val])=>{
        if(val==null||String(val).trim()==="") return;
        // to-do
        if(it.todo){
          const trig=it.todoWhen||((x)=>String(x).trim().toLowerCase()==="yes");
          if(trig(val)){ const who=perC?(slot==="c1"?clientNames()[0]:clientNames()[1]):"MWS"; const desc=(typeof it.todo==="function")?it.todo(val,slot):it.todo; todos+=pushTodo(desc, it.perClient?who:"MWS", "Review"); }
        }
        // note routing (skip pure yes/no/na)
        if(it.routeNote && !/^(yes|no|n\/?a)$/i.test(String(val).trim())){
          const label=perC?`${slot==="c1"?clientNames()[0]:clientNames()[1]}: ${val}`:val;
          routed+=routeCLNote(it.routeNote, label);
        }
      });
    });
  });
  // cross-item rules: SG discrepancy → discussion to-do
  ["retail","held","smsf"].forEach(pfx=>{
    clientNames().forEach((name,i)=>{
      const slot=i===0?"c1":"c2";
      const income=clNum(getAnsC(pfx+"_income",slot)), rate=clNum(getAnsC(pfx+"_sgRate",slot))||11.5, ytd=clNum(getAnsC(pfx+"_concFYTD",slot));
      if(!income||!ytd) return;
      const months=fyMonthsElapsed(), expected=income*rate/100, actual=months?(ytd/months*12):ytd;
      if(Math.abs(actual-expected)>Math.max(500,expected*0.05)){
        todos+=pushTodo(`Discuss employer SG discrepancy${twoClients()?` (${name})`:""} — expected ~${money(expected)} p.a. vs annualised ~${money(actual)}`, "MWS", "Review");
      }
    });
  });
  // per-item notes → WR discussion points (one line = one discussion item)
  if(S.checklist.notes){
    Object.values(S.checklist.notes).forEach(note=>{
      String(note||"").split("\n").map(s=>s.trim()).filter(Boolean).forEach(line=>{ todos+=pushTodo(line,"MWS","Review"); });
    });
  }
  toast(`Checklist applied — ${todos} to-do(s) added, ${routed} note(s) routed.`);
}

/* ---------- copy review summary handoff (C4 / Donna) ---------- */
function copyReviewSummary(){
  const m=S.meta, changes=(typeof diffSnapshot==="function")?diffSnapshot():[];
  const lines=[];
  lines.push(`Wealth Review summary — ${m.preparedFor||"client"}`);
  if(m.reviewDate) lines.push(`Date: ${formatDate(m.reviewDate)}`);
  if(m.adviserName) lines.push(`Adviser: ${m.adviserName}`);
  lines.push("");
  if(changes.length){ lines.push("Updates made:"); changes.forEach(c=>lines.push("• "+c)); lines.push(""); }
  lines.push("Action items / to-dos:");
  (S.actionItems||[]).forEach(a=>lines.push(`• ${a.desc} (${a.who} · ${a.when})`));
  const text=lines.join("\n");
  const done=()=>toast("Review summary copied — paste into Donna / your email, bcc Xeppo to file-note.");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done)); }
  else fallbackCopy(text,done);
}
function fallbackCopy(text,cb){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); cb&&cb(); }

async function importRebalance(ev){
  const files=[...ev.target.files]; if(!files.length)return;
  let added=0;
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:"array"});
      const sn=wb.SheetNames.find(n=>/care rebalance|rebalance/i.test(n))||wb.SheetNames[0];
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,defval:""});
      const hi=rows.findIndex(r=>/asset\s*\/\s*fund name/i.test(String(r[0]||""))&&/current/i.test(String(r[1]||"")));
      if(hi<0){ continue; }
      // account label: nearest non-empty single-label row above the header
      let acct=f.name.replace(/\.xlsx?$/i,"");
      for(let k=hi-1;k>=0&&k>=hi-3;k--){ const c=String(rows[k][0]||"").trim(); if(c && !/^step|^copy|^care rebalance/i.test(c)){ acct=c; break; } }
      const num=v=>{ const m=String(v).match(/-?[\d,]+(?:\.\d+)?/); return m?parseFloat(m[0].replace(/,/g,"")):0; };
      const out=[]; let tot=null;
      for(let r=hi+1;r<rows.length;r++){
        const name=String(rows[r][0]||"").trim(); if(!name) continue;
        if(/^total/i.test(name)){ tot={current:num(rows[r][1]),proposed:num(rows[r][2]),change:num(rows[r][3])}; break; }
        out.push({fund:name, current:num(rows[r][1]), proposed:num(rows[r][2]), change:num(rows[r][3]), dir:String(rows[r][5]||"").trim()});
      }
      if(out.length){ const ex=S.rebalance.find(x=>x.account===acct); const rec={account:acct,rows:out,total:tot}; if(ex) Object.assign(ex,rec); else S.rebalance.push(rec); added++; registerUpload(f.name,"Rebalance"); }
    }catch(e){ console.warn("rebalance fail",f.name,e); }
  }
  toast(added?`Rebalance imported for ${added} account(s).`:"Couldn't read a CARE rebalance table from those files.");
  renderContent();
}

function diffSnapshot(){
  const out=[]; const snap=S._snapshot; if(!snap) return out;
  const m2=n=>"$"+Math.round(num(n)).toLocaleString("en-AU");
  ["lifestyle","nestegg"].forEach(grp=>{
    (S[grp]||[]).forEach(a=>{
      const b=(snap[grp]||[]).find(x=>x.name===a.name);
      if(b && num(b.value)!==num(a.value)) out.push(`${a.name}: ${m2(b.value)} → ${m2(a.value)}`);
      else if(!b && num(a.value)) out.push(`Added ${a.name} (${m2(a.value)})`);
    });
  });
  (S.goalTracking||[]).forEach(g=>{
    const b=(snap.goalTracking||[]).find(x=>x.strategy===g.strategy);
    if(b){ ["were","shouldBe","are","wantToBe","rating"].forEach(k=>{ if((b[k]||"")!==(g[k]||"")) out.push(`${g.strategy} — ${k}: "${b[k]||""}" → "${g[k]||""}"`); }); }
    else out.push(`New strategy tracked: ${g.strategy}`);
  });
  const snapActs=(snap.actionItems||[]).map(a=>a.desc);
  (S.actionItems||[]).forEach(a=>{ if(!snapActs.includes(a.desc)) out.push(`New action: ${a.desc}`); });
  if((snap.adviserComments||"")!==(S.adviserComments||"")) out.push("Adviser comments updated");
  return out;
}

/* ---------- Wealth Review document (.docx) — prior review ---------- */
async function importReviewDoc(ev){
  const f=ev.target.files[0]; if(!f)return;
  if(typeof mammoth==="undefined"){ toast("Doc reader still loading — try again in a moment."); return; }
  if(!/\.docx$/i.test(f.name)){ toast("Please upload the review as a .docx (a PDF or old .doc can't be read here)."); return; }
  try{
    const buf=await f.arrayBuffer();
    const html=(await mammoth.convertToHtml({arrayBuffer:buf})).value;
    const raw=(await mammoth.extractRawText({arrayBuffer:buf})).value;
    const doc=new DOMParser().parseFromString(html,"text/html");
    const tables=[...doc.querySelectorAll("table")].map(t=>[...t.querySelectorAll("tr")].map(tr=>[...tr.querySelectorAll("td,th")].map(td=>td.textContent.replace(/\s+/g," ").trim())));
    const got=[];
    // Prepared for
    const pf=raw.match(/Prepared for:?\s*([^\n]+)/i); if(pf){ S.meta.preparedFor=pf[1].trim(); got.push("client name"); }
    // Details (table containing "Date of Birth")
    const dt=tables.find(t=>t.some(r=>r.some(c=>/date of birth/i.test(c))));
    if(dt){
      const labels={name:/^name$/i,dob:/date of birth/i,mobile:/^mobile$/i,marital:/marital/i,email:/email/i,estate:/estate/i,employer:/employer/i,riskProfile:/risk profile/i,jobTitle:/occupation|position|job title/i};
      for(let i=0;i<dt.length-1;i++){
        const lab=dt[i], val=dt[i+1];
        [[0,"client"],[1,"client"],[4,"partner"],[5,"partner"]].forEach(([ci,side])=>{
          const L=(lab[ci]||"").trim(), V=(val[ci]||"").trim();
          if(!L||!V) return;
          for(const [field,re] of Object.entries(labels)){ if(re.test(L) && !S[side][field]){ S[side][field]=V; } }
        });
      }
      if(S.partner.name) S.meta.hasPartner=true;
      got.push("details");
    }
    // Goal tracking (table with WHERE YOU WERE)
    const gt=tables.find(t=>t.some(r=>/where you were/i.test(r.join(" "))));
    if(gt){
      const hi=gt.findIndex(r=>/where you were/i.test(r.join(" ")));
      const rows=gt.slice(hi+1), groups={}, order=[];
      rows.forEach(r=>{ const s=(r[0]||"").trim(); if(!s||/^total/i.test(s)) return; if(!groups[s]){groups[s]=[];order.push(s);} groups[s].push(r); });
      const cur=v=>{ const m=String(v||"").match(/\$[\d,]+(?:\.\d+)?/); return m?m[0]:(String(v||"").trim()==="-"?"-":""); };
      const out=order.map(s=>{ const g=groups[s], f=g[0], tick=g.some(r=>r.join(" ").includes("✔"));
        return {strategy:s, were:cur(f[1]), shouldBe:cur(f[2]), are:cur(f[3]), wantToBe:cur(f[4]), rating:tick?"On Track":"N/A", actions:(f[f.length-1]||"").trim()}; });
      if(out.length){ S.goalTracking=out; got.push(out.length+" goal-tracking rows"); }
    }
    // Action items (DESCRIPTION / WHO / WHEN)
    const at=tables.find(t=>{ const h=(t[0]||[]).join(" ").toLowerCase(); return h.includes("description")&&h.includes("who")&&h.includes("when"); });
    if(at){ const items=at.slice(1).filter(r=>(r[0]||"").trim()).map(r=>({desc:r[0].trim(),who:(r[1]||"MWS").trim(),when:(r[2]||"Review").trim()}));
      if(items.length){ S.actionItems=items; got.push(items.length+" action items"); } }
    // Assets & liabilities (one or more tables with VALUE / DEBT / TYPE / OWNER)
    const astTables=tables.filter(t=>t.some(r=>/value/i.test(r[1]||"")&&/debt/i.test(r[2]||"")&&/type/i.test(r[3]||"")));
    if(astTables.length){
      const numv=v=>{ const m=String(v||"").match(/[\d,]+(?:\.\d+)?/); return m?parseFloat(m[0].replace(/,/g,"")):0; };
      const life=[], nest=[];
      astTables.forEach(t=>{
        const hi=t.findIndex(r=>/value/i.test(r[1]||"")&&/debt/i.test(r[2]||""));
        t.slice(hi+1).forEach(r=>{
          const name=(r[0]||"").trim(); if(!name || /total/i.test(name)) return;
          const type=(r[3]||"").trim();
          const row={name, value:numv(r[1]), debt:numv(r[2]), type, owner:(r[4]||"").trim(), ref:(r[5]||"").trim()};
          if(/residence|home|vehicle|motor|contents|lifestyle|boat|caravan|personal/i.test(type+" "+name)) life.push(row); else nest.push(row);
        });
      });
      if(life.length) S.lifestyle=life;
      if(nest.length) S.nestegg=nest;
      if(life.length+nest.length) got.push((life.length+nest.length)+" assets/liabilities");
    }
    // Income
    const inc=tables.find(t=>/income/i.test((t[0]||[])[0]||"") && /annual/i.test((t[0]||[]).join(" ")));
    if(inc){
      const items=inc.slice(1).filter(r=>(r[0]||"").trim()).map(r=>({
        label:(r[0]||"").trim(),
        amount:((String(r[1]||"").match(/[\d,]+(?:\.\d+)?/)||[""])[0]||"").replace(/,/g,""),
        owner:(r[2]||"").trim(), freq:(r[3]||"Yearly").trim()
      }));
      if(items.length){ S.income=items; got.push(items.length+" income lines"); }
    }
    // Goals (table with Owner / Timeframe / Notes)
    const gtbl=tables.find(t=>{ const h=(t[0]||[]).join(" ").toLowerCase(); return /timeframe/.test(h)&&/owner/.test(h); });
    if(gtbl){
      const items=gtbl.slice(1).map(r=>({owner:(r[0]||"").trim(), timeframe:(r[1]||"").replace(/\s+/g," ").trim(), desc:(r[2]||"").trim(), notes:""})).filter(g=>g.desc);
      if(items.length){ S.goals=items; got.push(items.length+" goals"); }
    }
    if(got.length){ registerUpload(f.name,"Last review"); toast("Imported from review: "+got.join(", ")+"."); renderContent(); }
    else { toast("Read the file but couldn't find the expected review tables."); }
  }catch(e){ toast("Couldn't read the review doc: "+e.message); }
}
function rollForward(){
  if(!confirm("Roll the current data forward into a NEW review?\n\n• 'Where you are' becomes next year's 'Where you were'\n• 'Where you want to be' is kept\n• current values & adviser comments cleared, ready for fresh uploads\n\nTip: save a draft first if you want to keep this version.")) return;

  S.adviserComments=""; S.overallRating="On Track"; S.actionItems=[];
  toast("Rolled forward — upload this year's platform reports to fill 'Where you are'.");
  renderContent();
}

function findSchemaItem(id){
  for(const sec of CHECKLIST_SCHEMA){ for(const it of (sec.items||[])){ if(it.id===id) return it;
    for(const fu of (it.followUps||[])) for(const f of (fu.items||[])) if(f.id===id) return f; } }
  return null;
}
function deriveChecklistAnswer(item,comment){
  const c=String(comment||"").trim(); const t=item?item.type:"text";
  if(!c) return null;
  if(t==="yesno"){
    if(/^n\/?a\b/i.test(c)) return "N/A";
    if(/^(no\b|nil|none|expired|required|missing|not |suspended)/i.test(c)) return "No";
    return "Yes";
  }
  if(t==="select"){ const opts=(typeof item.options==="function"?item.options():item.options)||[]; const hit=opts.find(o=>o&&o.toLowerCase().includes(c.toLowerCase().slice(0,5))); return hit||null; }
  if(t==="currency"){ const m=c.match(/\$?\s*([\d,]+(?:\.\d+)?)/); return m?m[1].replace(/,/g,""):null; }
  return /^n\/?a\b/i.test(c)?null:c; // text / area
}
async function importChecklist(ev){
  const f=ev.target.files[0]; if(!f)return;
  if(typeof XLSX==="undefined"){ toast("Spreadsheet reader still loading — open the file in a normal browser tab and try again."); return; }
  try{
    const buf=await f.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    const ws=wb.Sheets[wb.SheetNames.find(n=>/prereview|pre review|checklist/i.test(n))||wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,defval:""});
    const labelVal=(label)=>{ const r=rows.find(r=>String(r[0]||"").trim().toLowerCase().startsWith(label)); return r?r[1]:""; };
    // meta (Review Date may be an Excel serial number)
    const rd=labelVal("review date");
    if(rd!==""&&rd!=null){ let d = (rd instanceof Date)?rd : (typeof rd==="number"?new Date(Math.round((rd-25569)*86400000)) : new Date(rd)); if(!isNaN(d)) S.meta.reviewDate=d.toISOString().slice(0,10); }
    const rt=labelVal("review type"); if(rt) S.meta.reviewType=String(rt).trim();
    const cl=labelVal("client"); if(cl){ S.meta.preparedFor=String(cl).trim(); if(!S.client.name){ S.client.name=String(cl).trim(); } clSet("scope_c1name",S.client.name,false); }
    const ad=labelVal("adviser"); if(ad){ S.meta.adviserName=String(ad).trim(); clSet("scope_adviser",S.meta.adviserName,false); }
    const headIdx=rows.findIndex(r=>/^item$/i.test(String(r[0]||"").trim()) && /action/i.test(String(r[1]||"")));
    const dataRows=headIdx>=0?rows.slice(headIdx+1):rows;
    // keep the raw rows (legacy) too
    S.checklist.rows=dataRows.filter(r=>String(r[0]||"").trim()).map(r=>({item:String(r[0]||"").trim(), action:String(r[1]||"").trim(), comment:String(r[2]||"").trim()}));
    // account toggles from the whole item+comment text so the right sections appear
    const allText=dataRows.map(r=>String(r[0]||"")+" "+String(r[2]||"")).join("\n").toLowerCase();
    const setTog=(id,re)=>{ if(re.test(allText)) clSet(id,"Yes",false); };
    setTog("has_retailSuper",/hub\s*24 super|panorama super|retail super|hub super/);
    setTog("has_investment",/hub\s*24 invest|hub invest|investment account|\bdr\b/);
    setTog("has_mcma",/macquarie|mcma|cash management/);
    setTog("has_smsf",/smsf|self[- ]managed/);
    setTog("has_property",/property val|investment property|ppor|downloaded.*valuation/);
    setTog("has_heldSuper",/held super|industry super/);
    setTog("has_insurance",/income protection|insurance/);
    let prefilled=0, added=0, routed=0;
    dataRows.forEach(r=>{
      const item=String(r[0]||"").trim(), action=String(r[1]||"").trim(), comment=String(r[2]||"").trim();
      if(!item) return;
      const map=CHECKLIST_IMPORT_MAP.find(mm=>mm.re.test(item));
      if(map){
        if(map.account && comment && !/^n\/?a/i.test(comment) && getAns(map.account)!=="Yes") clSet(map.account,"Yes",false);
        const si=findSchemaItem(map.id);
        const val=deriveChecklistAnswer(si,comment);
        if(val!=null){ if(si&&si.perClient) clSetC(map.id, map.slot||"c1", val, false); else clSet(map.id, val, false); prefilled++; }
      }
      // ACTION column → to-do
      if(action && action.replace(/[^a-z]/gi,"").length>=8){
        let desc=action; const m=action.match(/create (?:an )?action item (?:to |for the adviser to |for )?(.+)/i); if(m) desc=m[1];
        desc=desc.replace(/\s+/g," ").replace(/[.;:,]+$/,"").trim();
        if(desc){ desc=desc.charAt(0).toUpperCase()+desc.slice(1); if(!S.actionItems.find(a=>a.desc===desc)){ S.actionItems.push({desc,who:"MWS",when:"Review"}); added++; } }
      }
      // rich COMMENT → route to the matching WR section
      if(comment && !/^(yes|no|n\/?a|done|completed?|uploaded|downloaded|updated|expired|required|valid)\b/i.test(comment)){
        const it=item.toLowerCase();
        if(/beneficiar|nomination|nominee/.test(it)){ S.estate.notes=(S.estate.notes?S.estate.notes+"\n":"")+"Beneficiaries — "+comment; routed++; }
        else if(/fee/.test(it)){ S.adviserComments=(S.adviserComments?S.adviserComments+"\n":"")+"Fees — "+comment; routed++; }
        else if(/income protection|\bip\b/.test(it)){ S.foundations.client.ipNotes=(S.foundations.client.ipNotes?S.foundations.client.ipNotes+" ":"")+comment; routed++; }
      }
    });
    if(!S.partner.name){ S.meta.hasPartner=false; clSet("scope_clients","1",false); }
    syncPreparedFor();
    renderContent();
    switchTab("checklist");
    toast(`Checklist imported — ${prefilled} answers prefilled, +${added} to-do(s)${routed?`, ${routed} note(s) routed`:""}.`);
  }catch(e){ toast("Couldn't read checklist: "+e.message); }
}
async function importPTW(ev){
  const file=ev.target.files[0]; if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    const sheetName=wb.SheetNames.find(n=>/^projector$/i.test(n.trim()))||wb.SheetNames.find(n=>/projector/i.test(n));
    const ws=sheetName?wb.Sheets[sheetName]:null;
    if(!ws){ toast("PTW: couldn't find the 'Projector' sheet."); return; }
    const g=(c)=>{ const cell=ws[c]; return cell?cell.v:undefined; };
    const money0=(v)=> (v==null||v==="")?"":"$"+Math.round(Number(v)).toLocaleString("en-AU");
    // FI goals block (Projector): E10 target today, E11 future, G11 years, E13 income-life, E14 nice, E15 toys, E16 family
    const map=[["E10","targetToday"],["E11","targetFuture"],["E13","incomeLife"],["E14","incomeNice"],["E15","lumpToys"],["E16","lumpFamily"]];
    let n=0;
    map.forEach(([c,k])=>{ const v=g(c); if(v!=null&&v!==""){ S.fiGoals[k]=money0(v); n++; } });
    const yr=g("G11"); if(yr!=null&&yr!==""){ S.fiGoals.years=String(Math.round(Number(yr))); n++; }
    // review date (E8) if not already set
    const d=g("E8");
    if(!S.meta.reviewDate && d){ try{ const dt=(d instanceof Date)?d:new Date(d); if(!isNaN(dt)) S.meta.reviewDate=dt.toISOString().slice(0,10); }catch(e){} }
    if(n){ registerUpload(file.name,"PTW"); toast(`PTW read: ${n} Financial Independence figures populated.`); renderContent(); }
    else { toast("PTW read, but the Projector FI cells were empty."); }
  }catch(e){ toast("Couldn't read PTW: "+e.message); }
}

function saveJSON(){
  const out={}; for(const k in S){ if(!k.startsWith("_")) out[k]=S[k]; }  // drop transient baseline & draft text
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const slug=(S.meta.preparedFor||"review").replace(/[^a-z0-9]+/gi,"_");
  saveAs(blob,`WealthReview_${slug}.json`);
  toast("Draft saved.");
}
function loadJSON(ev){
  const file=ev.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{ try{ Object.assign(S,JSON.parse(r.result)); if(!S.checklist.answers) S.checklist.answers={}; if(!S.checklist.notes) S.checklist.notes={}; if(!S.uploads) S.uploads=[]; delete S._snapshot; delete S._fileNote; delete S._roa; delete S._snapReview; renderContent(); toast("Draft loaded."); }catch(e){ toast("Invalid JSON file."); } };
  r.readAsText(file);
}

}

/* ============================================================
   FILE NOTE & ROA — Word (.docx) generation (portrait A4)
   Built from the editable draft text + firm boilerplate in S.
   No client details are hard-coded — everything comes from S.
   ============================================================ */
function docxBodyFromText(text, D, cfg){
  // Turn a plain-text draft into formatted Word paragraphs.
  const {Paragraph,TextRun,BorderStyle}=D;
  const FONT=cfg.font||"Calibri", TEXT=cfg.text||"000000", ACC=cfg.accent||"0C6AE1", SZ=cfg.size||22;
  const heads=cfg.headings||/^$/;
  const subHeads=/^(updates:?|action items:?)$/i;
  const para=(children,o={})=>new Paragraph(Object.assign({spacing:{after:o.after!=null?o.after:100}},o.bullet?{bullet:o.bullet}:{},{children}));
  const out=[];
  String(text||"").split("\n").forEach(raw=>{
    const t=raw.trim();
    if(t===""){ out.push(para([],{after:120})); return; }
    if(/^[_\u2014\-]{8,}$/.test(t)){ out.push(new Paragraph({spacing:{after:120},border:{bottom:{style:BorderStyle.SINGLE,size:6,color:"888888",space:1}},children:[]})); return; }
    if(heads.test(t)){ out.push(para([new TextRun({text:t,font:FONT,size:cfg.headSize||26,bold:true,color:ACC})],{after:80})); return; }
    if(subHeads.test(t)){ out.push(para([new TextRun({text:t.replace(/:?$/,":"),font:FONT,size:SZ,bold:true,color:TEXT})],{after:60})); return; }
    const top=/^(confidential|my wealth solutions - use only|after review summary)$/i.test(t);
    if(top){ out.push(para([new TextRun({text:t,font:FONT,size:SZ,bold:true,color:TEXT})],{after:40})); return; }
    const bm=t.match(/^[\u25CF\u2022\*]\s+(.*)$/) || t.match(/^-\s+(.*)$/);
    if(bm){ out.push(para([new TextRun({text:bm[1],font:FONT,size:SZ,color:TEXT})],{bullet:{level:0},after:60})); return; }
    const sub=t.match(/^o\s+(.*)$/i);
    if(sub){ out.push(para([new TextRun({text:sub[1],font:FONT,size:SZ,color:TEXT})],{bullet:{level:1},after:60})); return; }
    const lab=t.match(/^([A-Za-z][A-Za-z \/]*?:)\s*(.*)$/);
    if(lab && /^(client name|date of file note|time of file note|client|adviser):$/i.test(lab[1])){
      out.push(para([new TextRun({text:lab[1]+" ",font:FONT,size:SZ,bold:true,color:TEXT}),new TextRun({text:lab[2],font:FONT,size:SZ,color:TEXT})],{after:40})); return;
    }
    out.push(para([new TextRun({text:t,font:FONT,size:SZ,color:TEXT})],{after:100}));
  });
  return out;
}

async function generateFileNoteDocx(){
  if(typeof docx==="undefined"){ toast("Document engine still loading — try again in a moment."); return; }
  const D=docx; const {Document,Packer}=D;
  const text=S._fileNote||buildFileNote();
  const body=docxBodyFromText(text,D,{font:"Calibri",size:22,headings:/^$/});
  const doc=new Document({creator:"My Wealth Solutions",title:"Review File Note",
    styles:{default:{document:{run:{font:"Calibri",size:22,color:"000000"}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:body}]});
  try{
    toast("Building file note…");
    const blob=await Packer.toBlob(doc);
    const slug=(S.meta.preparedFor||"client").replace(/[^a-z0-9]+/gi,"_");
    saveAs(blob,`Review_File_Note_${slug}.docx`);
    toast("File note Word doc generated ✓");
  }catch(e){ console.error(e); toast("File note error: "+e.message); }
}

async function generateRoaDocx(){
  if(typeof docx==="undefined"){ toast("Document engine still loading — try again in a moment."); return; }
  const D=docx;
  const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,BorderStyle,VerticalAlign}=D;
  const m=S.meta,l=S.licensee,pr=S.practice;
  const FONT="Calibri", TEXT="000000", BLUE="0C6AE1";
  const headings=/^(What this Record of Advice covers|Basis of this Advice|Risk Profile|Advice Fee|Advice Fees|Portfolio Rebalance|Disclosures)$/i;

  const text=S._roa||buildROA(S.rebalance.length?'rebalance':'nochange');
  const idx=text.search(/What this Record of Advice covers/i);
  const bodyText=idx>=0?text.slice(idx):text;       // header table is added below
  const body=docxBodyFromText(bodyText,D,{font:FONT,size:22,accent:BLUE,headSize:26,headings});

  // ---- branded two-column header (firm boilerplate only) ----
  const b={style:BorderStyle.SINGLE,size:4,color:"BBBBBB"};
  const tr=(t,o={})=>new TextRun(Object.assign({text:String(t==null?"":t),font:FONT,size:18,color:TEXT},o));
  const p=(arr,after)=>new Paragraph({spacing:{after:after!=null?after:50},children:Array.isArray(arr)?arr:[tr(arr)]});
  const C=(children,w)=>new TableCell({width:{size:w,type:WidthType.DXA},verticalAlign:VerticalAlign.TOP,
    borders:{top:b,bottom:b,left:b,right:b},margins:{top:90,bottom:90,left:130,right:130},children});
  const left=C([
    p([tr("Prepared for ",{bold:true}),tr(m.preparedFor||"[client]",{bold:true}),tr("  By ",{bold:true}),tr(m.adviserName||"[adviser]",{bold:true})]),
    p(`${m.adviserName||"[adviser]"} is an Authorised Representative of ${l.name}, ABN ${l.abn}, Australian Financial Services Licence number: ${l.afsl}`),
    p(l.address),
    p(`T: ${l.phone}   E: ${l.email}`),
    p([tr("Dated: ",{bold:true}),tr(formatDate(m.reviewDate)||"[date]")],0)
  ],5400);
  const right=C([
    p([tr("What this Document is About",{bold:true})]),
    p("This Record of Advice (RoA) explains my advice. Please make sure you read each section of the RoA. If you feel any information is incorrect, please contact me directly, as it may affect the recommendations contained in this document."),
    p([tr("My Contact Details",{bold:true})]),
    p("Phone: "+pr.phone),
    p("Email: "+pr.email),
    p("Street address: "+pr.street),
    p(`You can also visit the ${l.name} website at ${l.website}`,0)
  ],5400);
  const headerTable=new Table({layout:TableLayoutType.FIXED,width:{size:10800,type:WidthType.DXA},columnWidths:[5400,5400],
    rows:[new TableRow({children:[left,right]})]});

  const children=[
    new Paragraph({spacing:{after:140},children:[new TextRun({text:"Record of Advice",font:FONT,size:44,bold:true,color:BLUE})]}),
    headerTable,
    new Paragraph({spacing:{after:160},children:[]}),
    ...body
  ];
  const doc=new Document({creator:"My Wealth Solutions",title:"Record of Advice",
    styles:{default:{document:{run:{font:FONT,size:22,color:TEXT}}}},
    sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:1134,bottom:1134,left:1134,right:1134}}},children}]});
  try{
    toast("Building ROA…");
    const blob=await Packer.toBlob(doc);
    const slug=(m.preparedFor||"client").replace(/[^a-z0-9]+/gi,"_");
    saveAs(blob,`Review_ROA_${slug}.docx`);
    toast("ROA Word doc generated ✓");
  }catch(e){ console.error(e); toast("ROA error: "+e.message); }
}

/* ---------- whole-window drag & drop: drop files anywhere to smart-import ---------- */
function hideDropOverlay(){ const ov=$("dropOverlay"); if(ov) ov.classList.remove("show"); window.__dndDepth=0; }
(function initGlobalDnD(){
  const ov=document.createElement("div"); ov.id="dropOverlay";
  ov.innerHTML='<div class="do-inner"><div class="do-ic">⬇</div><div class="do-t">Drop files to import</div><div class="do-s">Word · PDF · Excel · JSON · PNG/JPG screenshots (OCR)</div></div>';
  document.body.appendChild(ov);
  window.__dndDepth=0;
  const hasFiles=(e)=>{ try{ return e.dataTransfer && [...e.dataTransfer.types].includes("Files"); }catch(_){ return false; } };
  window.addEventListener("dragenter",e=>{ if(!hasFiles(e))return; e.preventDefault(); window.__dndDepth++; ov.classList.add("show"); });
  window.addEventListener("dragover",e=>{ if(hasFiles(e)) e.preventDefault(); });
  window.addEventListener("dragleave",e=>{ if(!hasFiles(e))return; window.__dndDepth--; if(window.__dndDepth<=0){ hideDropOverlay(); } });
  // a drop onto a specific zone (smart-drop / checklist) calls stopPropagation, so it never reaches here — that's fine
  window.addEventListener("drop",e=>{
    hideDropOverlay();
    if(!(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length)) return;
    e.preventDefault();
    if(activeTab!=="generate") switchTab("generate");
    smartDropFiles([...e.dataTransfer.files]);
  });
})();
